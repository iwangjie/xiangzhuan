<script>
function prewarmRenderTarget(renderer, target) {
  const previousTarget = renderer.getRenderTarget();
  const previousCubeFace = renderer.getActiveCubeFace();
  const previousMipLevel = renderer.getActiveMipmapLevel();

  try {
    renderer.setRenderTarget(target);
    const gl = renderer.getContext();
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (status !== gl.FRAMEBUFFER_COMPLETE) {
      throw new Error(`Framebuffer incomplete: 0x${status.toString(16)}`);
    }
  } finally {
    renderer.setRenderTarget(previousTarget, previousCubeFace, previousMipLevel);
  }
}

function warmFullscreenComposite(THREE, renderer, camera, composite, canvasFormat) {
  const origRenderTarget = renderer.getRenderTarget();
  const origActiveCubeFace = renderer.getActiveCubeFace();
  const origActiveMipmapLevel = renderer.getActiveMipmapLevel();
  const origShadowMapNeedsUpdate = renderer.shadowMap.needsUpdate;

  const tempScene = new THREE.Scene();
  const colorTarget = new THREE.WebGLRenderTarget(8, 8, {
    colorSpace: renderer.outputColorSpace,
    internalFormat: 'RGBA8',
    depthTexture: new THREE.DepthTexture(8, 8, THREE.UnsignedIntType)
  });
  const outputTarget = new THREE.WebGLRenderTarget(8, 8, {
    colorSpace: renderer.outputColorSpace,
    internalFormat: 'RGBA8',
    ...canvasFormat
  });
  colorTarget.isXRRenderTarget = outputTarget.isXRRenderTarget = true;

  const material = composite.material;
  const {roomColor, roomDepth} = material.uniforms;
  const previousColor = roomColor.value;
  const previousDepth = roomDepth.value;
  const meshClone = composite.clone(false);
  meshClone.visible = true;

  try {
    renderer.shadowMap.needsUpdate = false;

    // Initialize tiny textures for the shader warmup. Clearing and resolving
    // the real multisampled room target would redraw an empty 4K frame.
    renderer.setRenderTarget(colorTarget);
    renderer.clear();
    roomColor.value = colorTarget.texture;
    roomDepth.value = colorTarget.depthTexture;
    tempScene.add(meshClone);
    renderer.setRenderTarget(outputTarget);
    renderer.render(tempScene, camera);
  } finally {
    roomColor.value = previousColor;
    roomDepth.value = previousDepth;
    renderer.shadowMap.needsUpdate = origShadowMapNeedsUpdate;
    renderer.setRenderTarget(origRenderTarget, origActiveCubeFace, origActiveMipmapLevel);
    colorTarget.dispose();
    outputTarget.dispose();
  }
}

const roomDepthTileMinPixels = 3840 * 2160;

function createRoomDepthCoverage(THREE, collect) {
  const viewProjection = new THREE.Matrix4();
  const geometry = [new THREE.BufferGeometry(), new THREE.BufferGeometry()];
  const tile = 64;
  let width = 0, height = 0, near, columns, rows, covered, submitted, vertices, hasLayout=false;
  let unsafe = false;
  let ratio = 1;

  function mark(x0, y0, z0, x1, y1, z1, pointSize = 0) {
    if (unsafe) return;
    const m = viewProjection.elements;
    let left = Infinity, right = -Infinity, bottom = Infinity, top = -Infinity, nearest = Infinity;
    const corners = x0 === x1 && y0 === y1 && z0 === z1 ? 1 : 8;
    const edgeGuard = 1 + 4 / Math.min(width,height);
    let outside = 31, crossesEye = false;
    for (let corner = 0; corner < corners; corner++) {
      const x = corner & 1 ? x1 : x0;
      const y = corner & 2 ? y1 : y0;
      const z = corner & 4 ? z1 : z0;
      const w = m[3]*x + m[7]*y + m[11]*z + m[15];
      const sx = m[0]*x + m[4]*y + m[8]*z + m[12];
      const sy = m[1]*x + m[5]*y + m[9]*z + m[13];
      const guard = w*edgeGuard;
      outside &= (w<near*0.975 ? 1 : 0) | (sx < -guard ? 2 : 0) |
        (sx > guard ? 4 : 0) | (sy < -guard ? 8 : 0) | (sy > guard ? 16 : 0);
      if (w <= near) {
        crossesEye = true;
        continue;
      }
      nearest = Math.min(nearest, w);
      left = Math.min(left, sx/w);
      right = Math.max(right, sx/w);
      bottom = Math.min(bottom, sy/w);
      top = Math.max(top, sy/w);
    }
    // A convex bound entirely outside a clip plane cannot cover the canvas.
    // For sprites near the side planes, keep the point-size padding instead.
    if ((outside & 1) || (outside && pointSize === 0)) return;
    if (crossesEye) {
      unsafe = true;
      return;
    }
    // Include point-sprite radii and multisample edge coverage.
    const pad = 2 + pointSize / (2 * nearest);
    const first = Math.max(0, Math.floor(((left + 1) * width/2 - pad) / tile));
    const last = Math.min(columns - 1, Math.floor(((right + 1) * width/2 + pad) / tile));
    const base = Math.max(0, Math.floor(((bottom + 1) * height/2 - pad) / tile));
    const end = Math.min(rows - 1, Math.floor(((top + 1) * height/2 + pad) / tile));
    if (first > last || base > end) return;
    for (let row = base; row <= end; row++) covered.fill(1, row*columns + first, row*columns + last + 1);
  }

  function prepare(camera, size) {
    near = camera.near;
    viewProjection.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    if (width !== size.x || height !== size.y) {
      width = size.x;
      height = size.y;
      columns = Math.ceil(width / tile);
      rows = Math.ceil(height / tile);
      covered = new Uint8Array(columns * rows);
      submitted = new Uint8Array(covered.length);
      hasLayout=false;
      vertices=geometry.map(part => {
        part.dispose();
        const attribute = new THREE.BufferAttribute(new Float32Array(covered.length*18),3);
        attribute.setUsage(THREE.DynamicDrawUsage);
        part.setAttribute('position',attribute);
        part.setDrawRange(0,0);
        return attribute;
      });
    }
  }

  function update(camera, size) {
    ratio = 1;
    if (size.x * size.y < roomDepthTileMinPixels) return false;
    prepare(camera, size);
    unsafe = false;
    covered.fill(0);
    if (!collect(mark) || unsafe) return false;
    let count = 0, changed = false;
    for (let i = 0; i < covered.length; i++) {
      count += covered[i];
      changed ||= covered[i] !== submitted[i];
    }
    ratio = count / covered.length;
    if (ratio > 0.66) return false;
    if (!changed && hasLayout) return true;
    hasLayout=true;
    submitted.set(covered);
    const first = vertices[0].array, second = vertices[1].array;
    let emptyIndex=0, depthIndex=0;
    function rectangle(xyz,i,x0,y0,x1,y1) {
      xyz[i++] = x0; xyz[i++] = y0; xyz[i++] = 0;
      xyz[i++] = x1; xyz[i++] = y0; xyz[i++] = 0;
      xyz[i++] = x0; xyz[i++] = y1; xyz[i++] = 0;
      xyz[i++] = x1; xyz[i++] = y0; xyz[i++] = 0;
      xyz[i++] = x1; xyz[i++] = y1; xyz[i++] = 0;
      xyz[i++] = x0; xyz[i++] = y1; xyz[i++] = 0;
      return i;
    }
    for (let row = 0; row < rows; row++) {
      const y0 = row*tile*2/height-1;
      const y1 = Math.min(1,(row+1)*tile*2/height-1);
      for (let col = 0; col < columns;) {
        const needsDepth=covered[row*columns+col];
        const x0=col++*tile*2/width-1;
        while (col<columns && covered[row*columns+col]===needsDepth) col++;
        const x1=Math.min(1,col*tile*2/width-1);
        if (needsDepth) depthIndex=rectangle(second,depthIndex,x0,y0,x1,y1);
        else emptyIndex=rectangle(first,emptyIndex,x0,y0,x1,y1);
      }
    }
    for (const [i,length] of [[0,emptyIndex],[1,depthIndex]]) {
      geometry[i].setDrawRange(0,length/3);
      vertices[i].clearUpdateRanges();
      if (length>0) {
        vertices[i].addUpdateRange(0,length);
        vertices[i].needsUpdate=true;
      }
    }
    return true;
  }
  return { geometry, update };
}

function createTeaRoomCache(THREE, renderer, scene, staticObjects, dynamicObjects, samples, coverage) {
  const size = new THREE.Vector2();
  const cameraWorld = new THREE.Matrix4();
  const cameraProjection = new THREE.Matrix4();
  const staticVisibility = new Uint8Array(staticObjects.length);
  const dynamicVisibility = new Uint8Array(dynamicObjects.length);
  const stats = { directFrames: 0, cachedFrames: 0, captures: 0, partitionedFrames: 0 };
  let target;
  let bands = 1, capturedBands = 0;
  const gl = renderer.getContext();
  let explicitResolve = !renderer.extensions.has('WEBGL_multisampled_render_to_texture');
  const discardAttachments = [gl.COLOR_ATTACHMENT0,gl.DEPTH_ATTACHMENT];
  let valid = false;
  let stableFrames = 0;
  let lastWidth = 0, lastHeight = 0;
  let resizedAt = -Infinity, shadowDrawnAt = -Infinity, shadowBurstAt = -Infinity;
  const resizeSettleMs = 115, shadowSettleMs = 48;
  let exposure;
  let toneMapping;
  let usable = renderer.capabilities.isWebGL2;
  let targetChecked = false;

  const material = new THREE.ShaderMaterial({
    uniforms: { roomColor: { value: null }, roomDepth: { value: null } },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D roomColor;
      uniform sampler2D roomDepth;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(roomColor, vUv);
        gl_FragDepth = texture2D(roomDepth, vUv).r;
      }
    `,
    depthFunc: THREE.AlwaysDepth,
    toneMapped: false
  });
  const triangle = new THREE.BufferGeometry();
  triangle.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  triangle.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
  const composite = new THREE.Mesh(triangle, material);
  composite.renderOrder = -1000;
  composite.frustumCulled = false;
  composite.visible = false;
  scene.add(composite);

  const parts = coverage?.geometry.map((geometry, i) => {
    const shader = new THREE.ShaderMaterial({
      uniforms: material.uniforms,
      vertexShader: 'void main() { gl_Position = vec4(position.xy,0.0,1.0); }',
      fragmentShader: `
        uniform sampler2D roomColor;
        uniform sampler2D roomDepth;
        void main() {
          ivec2 pixel=ivec2(gl_FragCoord.xy);
          gl_FragColor=texelFetch(roomColor,pixel,0);
          ${i ? 'gl_FragDepth=texelFetch(roomDepth,pixel,0).r;' : ''}
        }
      `,
      depthTest: Boolean(i),
      depthWrite: Boolean(i),
      depthFunc: THREE.AlwaysDepth,
      toneMapped: false
    });
    const part = new THREE.Mesh(geometry,shader);
    part.renderOrder=-1000+i;
    part.frustumCulled=false;
    part.visible=false;
    scene.add(part);
    return part;
  });

  function resize(width, height) {
    if (target?.width === width && target.height === height) return;
    target?.dispose();
    target = new THREE.WebGLRenderTarget(width, height, {
      // Reuse r160's output-color path for the cached pass. RGBA8 holds the
      // same encoded values as the canvas, including fog and blending.
      colorSpace: renderer.outputColorSpace,
      internalFormat: 'RGBA8',
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
      depthTexture: new THREE.DepthTexture(width, height, THREE.UnsignedIntType),
      samples: Math.min(samples, renderer.capabilities.maxSamples)
    });
    target.isXRRenderTarget = true;
    targetChecked = false;
    material.uniforms.roomColor.value = target.texture;
    material.uniforms.roomDepth.value = target.depthTexture;
    clearCapture();
  }

  function hide(objects, visibility) {
    objects.forEach((object, i) => {
      visibility[i] = object.visible;
      object.visible = false;
    });
  }

  function restore(objects, visibility) {
    objects.forEach((object, i) => { object.visible = Boolean(visibility[i]); });
  }

  function drawDirect(camera) {
    stats.directFrames++;
    renderer.render(scene, camera);
  }

  function capture(camera) {
    const previous = renderer.getRenderTarget();
    if (bands>1) {
      const first=Math.floor(target.height*capturedBands/bands);
      const last=Math.floor(target.height*(capturedBands+1)/bands);
      target.scissor.set(0,first,target.width,last-first);
      target.scissorTest=true;
    }
    hide(dynamicObjects, dynamicVisibility);
    try {
      renderer.setRenderTarget(target);
      if (!targetChecked) {
        const gl = renderer.getContext();
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
          throw new Error('WebGL framebuffer incomplete');
        }
        targetChecked = true;
      }
      renderer.render(scene, camera);
      if (bands>1 && explicitResolve && target.samples>0) {
        // The scissored resolve has already stored color and depth. The
        // multisampled attachment can be discarded before the next strip.
        gl.invalidateFramebuffer(gl.DRAW_FRAMEBUFFER,discardAttachments);
      }
      capturedBands++;
      if (capturedBands===bands) {
        valid=true;
        stats.captures++;
      }
    } finally {
      target.scissorTest=false;
      renderer.setRenderTarget(previous);
      restore(dynamicObjects, dynamicVisibility);
    }
  }

  function drawCached(camera) {
    const background = scene.background;
    // Each pixel gets color once. Only pixels under a live object also
    // receive the room depth used by the multisampled depth test.
    const partition = coverage?.update(camera,size);
    hide(staticObjects, staticVisibility);
    scene.background = null;
    composite.visible = !partition;
    if (partition) for (const part of parts) part.visible=true;
    try {
      renderer.render(scene, camera);
      stats.cachedFrames++;
      if (partition) stats.partitionedFrames++;
    } finally {
      scene.background = background;
      composite.visible = false;
      if (partition) for (const part of parts) part.visible=false;
      restore(staticObjects, staticVisibility);
    }
  }

  const savedScissor=new THREE.Vector4();
  function drawPartial(camera) {
    const cut=Math.floor(target.height*capturedBands/bands);
    if (cut>=target.height) {
      drawCached(camera);
      return;
    }
    const ratio=renderer.getPixelRatio();
    const oldScissorTest=renderer.getScissorTest();
    const oldAutoReset=renderer.info.autoReset;
    renderer.getScissor(savedScissor);
    renderer.info.reset();
    renderer.info.autoReset=false;
    // setScissor accepts CSS pixels. Round the desired physical extent
    // toward the interior of its integer cell before r160 floors it.
    const width=(target.width+.25)/ratio;
    try {
      renderer.setScissorTest(true);
      renderer.setScissor(0,0,width,(cut+.25)/ratio);
      drawCached(camera);
      renderer.setScissor(0,(cut+.25)/ratio,width,(target.height-cut+.25)/ratio);
      drawDirect(camera);
    } finally {
      renderer.setScissor(savedScissor);
      renderer.setScissorTest(oldScissorTest);
      renderer.info.autoReset=oldAutoReset;
    }
  }

  function prepare(camera, canvasFormat) {
    if (!usable || renderer.getContext().isContextLost()) return;
    renderer.getDrawingBufferSize(size);
    if (size.x < 1 || size.y < 1) return;
    try {
      resize(size.x, size.y);
      if (!targetChecked) {
        prewarmRenderTarget(renderer, target);
        warmFullscreenComposite(THREE, renderer, camera, composite, canvasFormat);
        if (parts) for (const part of parts) {
          warmFullscreenComposite(THREE,renderer,camera,new THREE.Mesh(triangle,part.material),canvasFormat);
        }
        targetChecked = true;
      }
    } catch (error) {
      disable(error);
    }
  }

  function disable(error) {
    if (renderer.getContext().isContextLost()) {
      targetChecked = false;
      invalidate();
      return;
    }
    usable = false;
    target?.dispose();
    invalidate();
    console.warn('茶室背景缓存已关闭', error);
  }

  function clearCapture() {
    valid=false;
    capturedBands=0;
  }

  function invalidate() {
    clearCapture();
    stableFrames=0;
  }

  function render(camera, canCache, frameTimestamp) {
    const shadowDirty = renderer.shadowMap.needsUpdate;
    if (shadowDirty) {
      if (frameTimestamp - shadowDrawnAt < shadowSettleMs) shadowBurstAt = frameTimestamp;
      shadowDrawnAt = frameTimestamp;
    }
    if (!usable || !canCache) {
      invalidate();
      drawDirect(camera);
      return;
    }
    camera.updateMatrixWorld();
    renderer.getDrawingBufferSize(size);
    const viewChanged = !camera.matrixWorld.equals(cameraWorld) ||
      !camera.projectionMatrix.equals(cameraProjection);
    const sizeChanged = size.x !== lastWidth || size.y !== lastHeight;
    if (sizeChanged) {
      lastWidth = size.x;
      lastHeight = size.y;
      resizedAt = frameTimestamp;
    }
    if (viewChanged || sizeChanged) {
      cameraWorld.copy(camera.matrixWorld);
      cameraProjection.copy(camera.projectionMatrix);
      invalidate();
    } else {
      stableFrames++;
    }
    if (shadowDirty || exposure !== renderer.toneMappingExposure ||
        toneMapping !== renderer.toneMapping) clearCapture();
    // Keep drawing directly through viewport changes and bursts of shadow updates.
    if (shadowDirty || (!valid && (stableFrames < 3 || frameTimestamp - resizedAt < resizeSettleMs ||
        frameTimestamp - shadowBurstAt < shadowSettleMs))) {
      drawDirect(camera);
      return;
    }
    try {
      if (!valid) {
        resize(size.x,size.y);
        if (!capturedBands) bands=explicitResolve && samples>0 && size.x*size.y>=roomDepthTileMinPixels ? 4 : 1;
        capture(camera);
        exposure=renderer.toneMappingExposure;
        toneMapping=renderer.toneMapping;
        if (bands>1) {
          drawPartial(camera);
          return;
        }
      }
      drawCached(camera);
    } catch (error) {
      disable(error);
      drawDirect(camera);
    }
  }

  function info() {
    return { ...stats, supported: usable, valid, stableFrames, bands, capturedBands, explicitResolve };
  }

  renderer.domElement.addEventListener('webglcontextrestored', () => {
    usable=renderer.capabilities.isWebGL2;
    explicitResolve=!renderer.extensions.has('WEBGL_multisampled_render_to_texture');
    targetChecked=false;
    invalidate();
    renderer.shadowMap.needsUpdate = true;
  });
  return { render, info, invalidate, prepare };
}

function batchTeaRoomMeshes(THREE, layers, keepSources) {
  const batches = keepSources ? [] : undefined;
  const position = new THREE.Vector3();
  const normal = new THREE.Vector3();
  const normalMatrix = new THREE.Matrix3();

  for (const [parent, materials] of layers) {
    const groups = new Map();
    for (const mesh of parent.children) {
      if (!mesh.isMesh || !materials.includes(mesh.material)) continue;
      const key = [mesh.material.id, mesh.castShadow, mesh.receiveShadow].join('/');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(mesh);
    }

    for (const sources of groups.values()) {
      if (sources.length < 2) continue;
      const first = sources[0];
      const vertexCount = sources.reduce((sum, mesh) => sum + mesh.geometry.attributes.position.count, 0);
      const indexCount = sources.reduce((sum, mesh) => sum + mesh.geometry.index.count, 0);
      const positions = new Float32Array(vertexCount * 3);
      const normals = new Float32Array(vertexCount * 3);
      const uvs = new Float32Array(vertexCount * 2);
      const indices = vertexCount <= 65536 ? new Uint16Array(indexCount) : new Uint32Array(indexCount);
      let vertexOffset = 0;
      let indexOffset = 0;

      for (const mesh of sources) {
        const {geometry} = mesh;
        const attrs = geometry.attributes;
        mesh.updateMatrix();
        normalMatrix.getNormalMatrix(mesh.matrix);
        for (let i = 0; i < attrs.position.count; i++) {
          const vertex = vertexOffset + i;
          position.fromBufferAttribute(attrs.position, i).applyMatrix4(mesh.matrix).toArray(positions, vertex * 3);
          normal.fromBufferAttribute(attrs.normal, i).applyNormalMatrix(normalMatrix).toArray(normals, vertex * 3);
          uvs[vertex * 2] = attrs.uv.getX(i);
          uvs[vertex * 2 + 1] = attrs.uv.getY(i);
        }
        for (const index of geometry.index.array) {
          indices[indexOffset++] = vertexOffset + index;
        }
        vertexOffset += attrs.position.count;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));

      const batch = new THREE.Mesh(geometry, first.material);
      batch.castShadow = first.castShadow;
      batch.receiveShadow = first.receiveShadow;
      parent.add(batch);
      if (keepSources) {
        for (const mesh of sources) mesh.visible = false;
        batches.push({batch, sources});
      } else {
        parent.remove(...sources);
      }
    }
  }

  return batches;
}

<script>
const fishFootwearSource = `
float fishFootwearEdge(float distanceToEdge, float footprint) {
  return smoothstep(-footprint, footprint, distanceToEdge);
}

vec3 fishShadeFootwear(vec3 color, vec3 p, vec3 bindN, vec3 viewN, vec3 viewP) {
  // Centres and radius are from sections of each shoe in the rest mesh.
  float right = step(-0.047, p.x);
  float x = p.x - mix(-0.119, 0.023, right);
  float z = p.z - mix(0.101, 0.122, right);
  float edgeY = clamp(0.67 * fwidth(p.y), 0.0007, 0.012);
  float edgeZ = clamp(0.67 * fwidth(p.z), 0.0007, 0.018);
  float edgeX = clamp(0.67 * fwidth(p.x), 0.0007, 0.018);
  // The centre of the skirt joins the sock sculpt. Fade out above the cuff
  // and around the hem so the shade cannot reach the fabric or the tail.
  float localWidth = mix(0.062, 0.065, right);
  float ankle = (1.0 - smoothstep(0.048, 0.066, abs(x))) * (1.0 - smoothstep(0.049, 0.070, z));
  float collarLimit = mix(-0.367, -0.357, ankle);
  float coverage = (1.0 - smoothstep(localWidth - 0.009, localWidth + 0.010, abs(x)))
    * smoothstep(-0.067, -0.045, z)
    * (1.0 - smoothstep(collarLimit - 0.019, collarLimit, p.y));
  if (coverage < 0.001) return color;

  vec3 key = fishLightDirection(uFishKeyWorld, viewP, viewN);
  vec3 fill = fishLightDirection(uFishFillWorld, viewP, viewN);
  vec3 eye = fishSafeNormalize(-viewP, viewN);
  float diffuse = fishRoomDiffuse(viewN, key, 0.64);
  float bounce = fishRoomDiffuse(viewN, fill, 0.70);
  float facing = max(0.0, dot(viewN, eye));

  // A shallow opening across the instep reveals the same ivory material
  // as the sock. The closed heel meets the lower end of the sock cleanly.
  float frontTop = mix(-0.444, -0.440, right);
  float heelRise = 0.008 * (1.0 - smoothstep(-0.041, 0.019, z));
  float shoeHeight = p.y - frontTop - heelRise;
  float heelAndSide = 1.0 - fishFootwearEdge(shoeHeight, edgeY);

  float instepX = x - 0.035 * z;
  float openingZ = mix(0.052, 0.049, right);
  float openingY = mix(-0.460, -0.458, right);
  float throatSlope = 0.42;
  vec3 opening = vec3(instepX / 0.026, (z - openingZ) / 0.027,
    (p.y - openingY - throatSlope * (z - openingZ)) / 0.013);
  float openingDistance = 1.0 - length(opening);
  float openingFootprint = clamp(length(vec3(edgeX / 0.026, edgeZ / 0.027,
    (edgeY + throatSlope * edgeZ) / 0.013)), 0.032, 0.76);
  float top = smoothstep(-0.14, 0.30, bindN.y);
  float throat = fishFootwearEdge(openingDistance, openingFootprint) * top;

  // The strap lies across the top of the shoe, so its visible thickness
  // depends on both instep height and depth. Blend it into both quarters.
  float strapHeight = p.y - 0.22 * (z - 0.033) - (frontTop + 0.0035);
  float strapWidth = length(vec2(edgeY, 0.22 * edgeZ));
  float across = fishFootwearEdge(0.0051 - abs(strapHeight), strapWidth)
    * smoothstep(0.010, 0.022, z);
  float leather = max(heelAndSide * (1.0 - throat), across);
  float throatPiping = (1.0 - smoothstep(0.03 + openingFootprint, 0.21 + openingFootprint, abs(openingDistance)))
    * top * heelAndSide * (1.0 - across);

  float phase = atan(x, z + 0.00001) * 7.0;
  float phaseWidth = min(3.14159, 7.0 * length(vec2(edgeX,edgeZ)) / max(length(vec2(x,z)),0.02));
  float scallop = 0.0017 * cos(phase) * (1.0 - smoothstep(0.55,1.8,phaseWidth));
  float cuffHeight = p.y - (mix(-0.389, -0.391, right) + scallop);
  float cuff = fishFootwearEdge(cuffHeight, edgeY);
  float cuffLip = fishFootwearEdge(0.0024 - abs(cuffHeight + 0.0024), edgeY);
  float knitPhase = p.y * 860.0 + x * 150.0;
  float knitWidth = edgeY * 860.0 + edgeX * 150.0;
  float rib = cos(knitPhase) * (1.0 - smoothstep(0.43, 1.45, knitWidth));
  float fabricFold = 0.045 * exp(-abs(shoeHeight-0.003)*89.0);
  vec3 ivory = vec3(0.76, 0.72, 0.69) * (0.70 + 0.23 * diffuse + 0.09 * bounce + 0.021 * rib - fabricFold);
  ivory += vec3(0.045, 0.042, 0.036) * cuffLip;
  vec3 skin = vec3(0.76, 0.53, 0.46) * (0.74 + 0.15 * diffuse + 0.10 * bounce);
  vec3 cloth = mix(ivory, skin, cuff * (1.0 - heelAndSide));

  // Soft blue-black leather, a narrow outsole and a broad window highlight.
  float sole = 1.0 - fishFootwearEdge(p.y + 0.490, edgeY);
  float welt = fishFootwearEdge(0.0015 - abs(p.y + 0.488), edgeY);
  vec3 navy = vec3(0.018, 0.025, 0.066) * (0.68 + 0.67 * diffuse + 0.31 * bounce);
  vec3 halfway = fishSafeNormalize(eye + key, viewN);
  float specular = pow(max(0.0, dot(halfway, viewN)), 12.0)
    * max(0.0, dot(viewN, key)) * smoothstep(0.05,0.48,facing);
  navy += fishWindowTint * (0.038 * specular + 0.012 * welt + 0.012 * throatPiping) * (1.0 - sole * 0.82);
  navy = mix(navy, vec3(0.014, 0.016, 0.027) * (0.80 + 0.20 * bounce), sole);
  vec3 finished = mix(cloth, navy, leather);
  return mix(color, finished, coverage * 0.95);
}
`;

            * (1.0-smoothstep(-0.166,-0.108,vLocalPos.y));
          vec2 skirt = vLocalPos.xz - vec2(-0.041,0.012);
          float frontSector = smoothstep(0.59,0.88,skirt.y/max(length(skirt),0.001));
          float sleeve = smoothstep(0.12,0.61,vCupSleeve);
          float frontView = smoothstep(0.61,0.88,vFrontFacing);
          fWeight *= mix(1.0,max(frontSector,sleeve),dress*(1.0-frontView));
        }

        finalCol = fishPolishLace(finalCol, vLocalPos, normalize(vLocalNormal),
          normalize(vStudioNormal), vStudioPos, fWeight);

        vec3 rearArt = vec3(0.0);
        float rearArtWeight = 0.0;
        // 4. 背面投影（同色发尾色调匹配、发束有机衰减、消除横贯切线、屏蔽背景漏白、保留耳鳍白斑）
        if (uHasBackTex == 1) {
          float bNorm = smoothstep(0.10, 0.40, -vLocalNormal.z);
          float rearHairFactor = 1.0 - smoothstep(-0.04, 0.02, vLocalPos.z);
          // Keep the back artwork off the blue locks beside the ears. Their
          // folds can face the projector even though they belong to the side.
          float blueLock = smoothstep(0.052,0.12,baseCol.b-baseCol.r)
            * smoothstep(0.026,0.061,baseCol.b-baseCol.g);
          float temple = smoothstep(0.015,0.072,vLocalPos.y)
            * (1.0-smoothstep(0.292,0.356,vLocalPos.y))
            * smoothstep(-0.216,-0.174,vLocalPos.z)
            * smoothstep(0.137,0.177,abs(vLocalPos.x));
          // The rear illustration contains the headband outline. The
          // upward-facing blue scalp is lit by its own material in this band.
          float topScalp = smoothstep(0.278,0.328,vLocalPos.y)
            * (1.0-smoothstep(0.428,0.455,vLocalPos.y))
            * smoothstep(-0.168,-0.119,vLocalPos.z)
            * smoothstep(0.29,0.55,vLocalNormal.y);
          float hairProtection = max(temple,topScalp)*blueLock;
          float bWeight = vBackWeight * bNorm * rearHairFactor * (1.0-0.99*hairProtection);

          vec2 backDx = dFdx(vBackUV);
          vec2 backDy = dFdy(vBackUV);
          if (bWeight > 0.001) {
            vec4 bTex = fishSamplePortrait(uBackTex, vBackUV, backDx, backDy);

            // 耳鳍区域豁免遮罩：保护耳鳍真实白色/高光 (y=.085–.16, abs(x)>.15, z>-.18)
            float earY = smoothstep(0.080, 0.095, vLocalPos.y) * (1.0 - smoothstep(0.150, 0.165, vLocalPos.y));
            float earX = smoothstep(0.145, 0.160, abs(vLocalPos.x));
            float earZ = smoothstep(-0.19, -0.16, vLocalPos.z);
            float earDomain = earY * earX * earZ;
            // The back portrait includes a bright fin, but the projection
            // crosses the adjoining indigo temple. Trust pale base pigment
            // when deciding which surface receives the painted fin.
            float paleFin = smoothstep(0.18,0.33,min(baseCol.r,baseCol.g));
            float earMask = earDomain * paleFin;

            // 屏蔽非头顶且非耳鳍区域的参考图背景漏白（保留 vLocalPos.y > 0.30 的头顶白色发箍与耳鳍白色）
            float bLum = dot(bTex.rgb, vec3(0.299, 0.587, 0.114));
            float bSat = max(bTex.r, max(bTex.g, bTex.b)) - min(bTex.r, min(bTex.g, bTex.b));
            float neutralPigment = smoothstep(0.42, 0.73, bLum) * (1.0-smoothstep(0.09, 0.24, bSat));
            float trueWhite = smoothstep(0.29, 0.60, min(min(baseCol.r,baseCol.g),baseCol.b));
            float whiteSupport = max(earMask * 0.74, trueWhite);
            float pigmentConfidence = mix(1.0, whiteSupport, neutralPigment * 0.93);

            if (bTex.a > 0.02) {
              // Only blue pigment from the interior of the rear illustration
              // can define a curl. White trim and transparent silhouettes
              // are handled by their own surfaces.
              float artIndigo = smoothstep(0.059,0.121,bTex.b-bTex.r)
                * smoothstep(0.028,0.076,bTex.b-bTex.g);
              float longHair = smoothstep(-0.42,-0.32,vLocalPos.y)
                * (1.0-smoothstep(0.16,0.28,vLocalPos.y))
                * smoothstep(0.080,0.186,-vLocalPos.z);
              float centralLocks = (1.0-smoothstep(0.125,0.232,abs(vLocalPos.x)))
                * smoothstep(0.51,0.83,-vLocalNormal.z);
              rearArtWeight = bWeight * smoothstep(0.77,0.98,bTex.a)
                * artIndigo * blueLock * longHair * centralLocks;
              rearArt = bTex.rgb;
              // 发束起伏波：随横向 UV 产生错落有致的发尖，彻底打破水平横切线
              float strandWave = sin(vBackUV.x * 32.0) * 0.055 + cos(vBackUV.x * 58.0) * 0.035;
              float junctionFade = smoothstep(0.04, 0.65, bWeight + strandWave);

              // 衔接带色调匹配：耳鳍白色高光保留原始投影，发身过渡到底色
              float detailRatio = clamp(bLum / 0.28, 0.45, 1.45);
              vec3 matchedBase = finalCol * detailRatio;
              vec3 hairToneMatched = mix(matchedBase, bTex.rgb, junctionFade);
              vec3 toneMatchedTex = mix(hairToneMatched, bTex.rgb, earMask);

              float applyWeight = clamp(bWeight * bTex.a * 0.96 * pigmentConfidence, 0.0, 1.0);
              finalCol = mix(finalCol, toneMatchedTex, applyWeight);
            }
          }
        }

        // 4. 正面原画投影（高置信正脸与正面绝对优先，完全保留 0°/25°/45° 质感与五官）
        finalCol = fishSurfaceDetail(finalCol, vLocalPos, vLocalNormal, vStudioNormal,
          vStudioPos, vStudioHair, fWeight);
        finalCol = blendRearHair(finalCol, vLocalPos, vLocalNormal);
        vec4 sidePigment = vec4(0.0), sideMask = vec4(0.0);
        vec3 profileNormal = normalize(vLocalNormal);
        vec2 sideDx = dFdx(vSideUV), sideDy = dFdy(vSideUV);
        // Skip the two profile atlas reads where every blend region is zero.
        // Explicit gradients keep filtering continuous at the profile boundary.
        if (uHasSideTex == 1 && vLocalPos.y > -0.33 && vLocalPos.y < 0.44 &&
            abs(vLocalPos.x) > 0.080 && abs(profileNormal.x) > 0.18 &&
            profileNormal.z < 0.82 && fWeight < 0.77) {
          sidePigment = textureGrad(uSideTex, vSideUV, sideDx, sideDy);
          sideMask = textureGrad(uSideMask, vSideUV, sideDx, sideDy);
        }
        finalCol = fishBlendProfile(finalCol, baseCol, vLocalPos, profileNormal,
          normalize(vStudioNormal), vStudioPos, sidePigment, sideMask, clamp(vSideWeight,0.0,1.0), fWeight);
        finalCol = fishCleanRibbonPigment(finalCol, vLocalPos);
        finalCol = fishRefineUnderHem(finalCol, vLocalPos, normalize(vLocalNormal),
          normalize(vStudioNormal), vStudioPos, vSidePolish.y, fWeight);
        FishPortraitFootprint faceFootprint = fishPortraitFootprint(vFrontUV);
        if (uHasFrontTex == 1 && fWeight > 0.001) {
          vec4 fTex = fishPaintFace(uFrontTex, vFrontUV, uGaze, uEyeFocus, uFaceState, faceFootprint);
          fTex.rgb = fishPaintApron(fTex.rgb,vFrontUV,faceFootprint,normalize(vStudioNormal),vStudioPos);
          // The front painting crosses the fold underneath the right bow.
          // Suppress its pale pigment only where the underlying lock is blue.
          vec3 p = vLocalPos;
          float outerLock = smoothstep(0.188,0.207,p.x)*(1.0-smoothstep(0.288,0.315,p.x))
            * smoothstep(0.073,0.088,p.y)*(1.0-smoothstep(0.120,0.139,p.y))
            * smoothstep(0.073,0.100,p.z)*(1.0-smoothstep(0.188,0.207,p.z));
          float blueSupport = smoothstep(0.035,0.100,baseCol.b-baseCol.r);
          float paleProjection = smoothstep(0.080,0.20,fTex.r-baseCol.r)
            * smoothstep(0.17,0.34,min(min(fTex.r,fTex.g),fTex.b));
          float spill = outerLock*blueSupport*paleProjection;
          // On the other side, the dark outline in the portrait crosses
          // the blue lock under the bow. Retain the local lighting through it.
          float underLeftBow = smoothstep(0.247,0.276,-p.x)
            * smoothstep(0.098,0.126,p.y)*(1.0-smoothstep(0.207,0.241,p.y))
            * smoothstep(0.019,0.043,p.z)*(1.0-smoothstep(0.099,0.150,p.z));
          float indigo = blueSupport * smoothstep(0.022,0.067,baseCol.b-baseCol.g);
          float darkSpill = smoothstep(0.053,0.132,dot(finalCol-fTex.rgb,vec3(0.2126,0.7152,0.0722)));
          float lowerLeftLock = smoothstep(0.220,0.242,-p.x)
            * smoothstep(-0.052,-0.022,p.y)*(1.0-smoothstep(0.064,0.094,p.y))
            * smoothstep(-0.042,-0.022,p.z)*(1.0-smoothstep(0.020,0.055,p.z));
          float shadowSpill = max(underLeftBow,lowerLeftLock)*indigo*darkSpill;
          float projection = fWeight*fTex.a*(1.0-max(0.98*spill,0.98*shadowSpill));
          finalCol = mix(finalCol, fTex.rgb, clamp(projection, 0.0, 1.0));
          // Restore the cool blue of the surrounding fold where the painting
          // had brightened the underlayer.
          vec3 foldTone = baseCol*vec3(0.56,0.65,0.83);
          finalCol = mix(finalCol,foldTone,spill*0.88);
        }

        finalCol = fishCleanHeadLacePigment(finalCol, vLocalPos, vLocalNormal);
        finalCol = fishShadeTresses(finalCol, vTressInfo, vLocalPos, normalize(vLocalNormal), normalize(vStudioNormal),
          vStudioPos, vStudioHair, vSidePolish, fWeight, vFrontFacing);
        finalCol = fishPolishSideLock(finalCol,baseCol,vLocalPos,
          normalize(vStudioNormal),vStudioPos,vFrontFacing);
        finalCol = fishShadeCrown(finalCol,baseCol,vLocalPos,normalize(vStudioNormal),vStudioPos);
        // Keep the reference hue while shading each overlapping lock.
        finalCol = mix(finalCol,rearArt,rearArtWeight*0.205*(1.0-0.96*fWeight));
        finalCol = fishShadeEarFin(finalCol,vLocalPos,normalize(vStudioNormal),vStudioPos);
        finalCol = fishShadeTailHem(finalCol, vLocalPos, vLocalNormal, vSidePolish.y, fWeight);

        finalCol = fishRestoreSideCloth(finalCol,baseCol,vLocalPos,normalize(vStudioNormal),
          vStudioPos,fWeight,vFrontFacing);
        finalCol = fishShadeSkirtRuffle(finalCol, vLocalPos, normalize(vLocalNormal), normalize(vStudioNormal),
          vStudioPos, max(vTressInfo.x,vSidePolish.x), fWeight);

        finalCol = fishShadeFootwear(finalCol, vLocalPos, normalize(vLocalNormal),
          normalize(vStudioNormal), vStudioPos);

        finalCol = fishShadeRearHem(finalCol, vLocalPos, normalize(vLocalNormal),
          normalize(vStudioNormal), vStudioPos, max(vTressInfo.x,vSidePolish.x), fWeight);

        // 5. 渲染模式：默认正色渲染，可选侧光
        if (uLightMode == 1) {
          vec3 N = normalize(vRigNormal);
          float diff = max(dot(N, normalize(uSunDir)), 0.0);
          float halfLambert = diff * 0.45 + 0.55;
          finalCol *= halfLambert;
        }

        if (uArmPresentation > 0.0) {
          float distal = smoothstep(0.16,0.46,vCupSleeve) * (1.0-smoothstep(-0.145,-0.102,vLocalPos.y));
          float lightPigment = smoothstep(0.11,0.37,min(min(finalCol.r,finalCol.g),finalCol.b));
          float sideShade = 0.86+0.22*clamp(normalize(vLocalNormal).z,0.0,1.0);
          vec3 navy = vec3(0.047,0.055,0.142)*sideShade;
          finalCol = mix(finalCol,navy,distal*uArmPresentation*(0.75+0.25*lightPigment));
        }
        gl_FragColor = vec4(finalCol, 1.0);
        #include <colorspace_fragment>
      }
    `
  };

  async function loadModelData(geometry, rearSculpt) {
    applyFishRuffleRelief(geometry);
    applyFishHairShape(geometry);
    applyFishCrownRelief(geometry);
    applyFishTuftRelief(geometry);
    applyFishRearPleats(geometry);
    applyFishHemEdge(geometry);
    applyFishSideLockRelief(geometry);
    const pigment = geometry.getAttribute('color');
    for (let i=0;i<fishLockPigment.length;i+=4) {
      pigment.setXYZ(fishLockPigment[i],fishLockPigment[i+1]/4095,
        fishLockPigment[i+2]/4095,fishLockPigment[i+3]/4095);
    }
    const sideNormals = geometry.getAttribute('normal');
    for (let i = 0; i < fishSideGroomNormals.length; i += 4) {
      sideNormals.setXYZ(fishSideGroomNormals[i], fishSideGroomNormals[i + 1] / 32767,
        fishSideGroomNormals[i + 2] / 32767, fishSideGroomNormals[i + 3] / 32767);
    }
    applyFishRearLockSculpt(geometry,rearSculpt);
    applyFishAnkleWeights(geometry);
    const { min, max, height } = window.FISH_BAKED_BOUNDS;
    const bMin = new THREE.Vector3().fromArray(min);
    const bMax = new THREE.Vector3().fromArray(max);
    baseModelHeight = height;
    const mat = new THREE.ShaderMaterial({
    extensions: {derivatives:true, shaderTextureLOD:true},
      vertexShader: ProjShader.vertexShader,
      fragmentShader: ProjShader.fragmentShader,
      uniforms: {
        uFrontTex: { value: frontCanvasTexture },
        uFishApronDetail: { value: apronDetail },
        uHasApronDetail: { value: apronDetail !== null },
        uGaze: gaze,
        uEyeFocus: eyeFocus,
        ...faceDetailUniforms,
        uFishHairGuides: {value: hairGuides.color},
        uFishHairSlope: {value: hairGuides.slope},
        ...roomLight,
        uFishHemProfile: {value: createFishHemProfileTexture(THREE)},
        uFishLaceAtlas: {value: laceAtlas.color},
        uFishLaceSlope: {value: laceAtlas.slope},
        uArmPresentation: { value: 0 },
        uFaceState: faceState,
        uHasFrontTex: { value: frontCanvasTexture ? 1 : 0 },
        uBackTex: { value: backCanvasTexture },
        uHasBackTex: { value: backCanvasTexture ? 1 : 0 },
        uSideTex: { value: profileCanvasTexture },
        uSideMask: { value: profileMaskTexture },
        uHasSideTex: { value: profileCanvasTexture ? 1 : 0 },
        uLightMode: { value: isSideLight ? 1 : 0 },
        uSunDir: { value: new THREE.Vector3(1.2, 1.6, 2.2).normalize() }
      },
      side: THREE.DoubleSide,
      wireframe: isWireframe
    });
    mat.toneMapped = false;
    const mesh = new THREE.Mesh(geometry, mat);
    const tailMesh = createFishTailMesh(THREE, { isSideLight, isWireframe, roomLight });
    tailMesh.material.toneMapped = false;
    rootGroup.add(mesh, tailMesh);
    modelMeshes = [mesh, tailMesh];
    const neutralBody = modelMeshes[0];
    if (modelMeshes.length !== 2 || !refImageData) throw new Error('角色绑定需要完整模型与正面原画');
    bodyRig = createFishBodyRig(THREE, neutralBody, modelMeshes[1], rootGroup);
    modelMeshes[0] = bodyRig.body;
    bodyRig.greetingSleeve = createFishGreetingSleeve(THREE,bodyRig,rootGroup);
    if (yieldPaint) await yieldPaint();
    const surface = createFishFaceSurface(THREE, neutralBody, {
      min: bMin, max: bMax, refX0: PROJ_CALIB.refX0, refX1: PROJ_CALIB.refX1,
      refY0: PROJ_CALIB.refY0, refY1: PROJ_CALIB.refY1
    }, refImageData, new THREE.Vector3(0, .095, .02));
    const eyelidMaterial = createFishLidMaterial(THREE, frontCanvasTexture, faceState, gaze, eyeFocus,
      bMin, bMax, PROJ_CALIB, surface.headRestPosition, faceDetailUniforms);
    faceRig = createFishFaceRig(THREE, bodyRig.head, surface, eyelidMaterial, lidGeometry);
    if (yieldPaint) await yieldPaint();
    mouthRig = createFishMouthRig(THREE, bodyRig.head, surface, mouthArtTexture, frontCanvasTexture);
    bodyRig.mouthSocket = mouthRig.socket;
    attachFishRibbons(THREE, bodyRig.head, surface.headRestPosition, mouthArtTexture, bMin, bMax, PROJ_CALIB, roomLight);
    bodyRig.head.add(createFishHeadLace(THREE,roomLight));
    const setLidWeights = faceRig.set;
    faceRig.set = (pose) => {
      setLidWeights(pose);
      mouthRig.set(pose);
      const soft=THREE.MathUtils.clamp(pose.eyeSmile ?? pose.smile ?? 0,0,1);
      const joy=THREE.MathUtils.clamp(pose.eyeJoy ?? pose.smile ?? 0,0,soft);
      faceState.value.set(pose.blinkLeft || 0, pose.blinkRight || 0, soft, joy);
    };
    const eyeHalfSpan = 0.5 * (fishEyeProfiles[1].iris[0] - fishEyeProfiles[0].iris[0])
      * (bMax.x - bMin.x) / (PROJ_CALIB.refX1 - PROJ_CALIB.refX0);
    gestureController = createFishDirector(THREE, bodyRig, faceRig, gaze, eyeFocus, eyeHalfSpan);

  }


  const [geometry, portrait, hairGuides, faceDetail, apronDetail, lidGeometry, laceAtlas, rearSculpt] = await Promise.all([
    loadFishGeometry(THREE, window.FISH_BAKED_GEOMETRY),
    restoreFishPortraitTextures(THREE, renderer, lowEnd),
    restoreFishReliefAtlas(THREE, renderer, lowEnd, fishHairGuideAtlas, false),
    restoreFishPortraitDetail(THREE, lowEnd, fishFaceDetail),
    restoreFishPortraitDetail(THREE, lowEnd, fishApronDetail, renderer.capabilities.isWebGL2),
    restoreFishLidGeometry(),
    restoreFishReliefAtlas(THREE, renderer, lowEnd, fishSkirtLaceAtlas, true),
    decodeTeaBakedBytes(fishRearLockSculpt)
  ]);
  faceDetailUniforms.uFishFaceDetail.value = faceDetail;
  faceDetailUniforms.uFishFaceDetailStrength.value = faceDetail ? 1 : 0;
  frontCanvasTexture = portrait.front;
  backCanvasTexture = portrait.back;
  profileCanvasTexture = portrait.side;
  profileMaskTexture = portrait.mask;
  mouthArtTexture = portrait.art;
  refImageData = portrait.refImageData;
  await loadModelData(geometry,rearSculpt);
  if (modelMeshes.length !== 2 || !gestureController) throw new Error('大肥鱼模型不完整');
  rootGroup.getSoleLift = () => bodyRig.getSoleLift();
  return {root: rootGroup, gesture: gestureController, height: baseModelHeight,
    soleY: -baseModelHeight / 2, feetRest: bodyRig.feetRest, bodyRig};
};

</script>

<script>
(async function() {
  'use strict';
  let sceneBooted = false;
  let pendingHostState;
  let pendingHostView;
  window.shrineView = name => { pendingHostView = name; };

  function startupPaint() {
    if (document.hidden) return Promise.resolve();
    return new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
  }


  // ============================================================================
  // 0. 宿主通信与全局状态契约（严格保留，display 为屏幕名称，倒计时由 remainingMs 计算）
  // ============================================================================
  function emitHost(msg) {
    if (window.nsh && typeof window.nsh.postMessage === 'function') {
      try {
        window.nsh.postMessage(msg);
      } catch (err) {
        console.log('[nsh]', msg);
      }
    } else {
      console.log('[nsh]', msg);
    }
  }
  const isHosted = !!(window.nsh && typeof window.nsh.postMessage === 'function');

  const appState = {
    remainingMs: 90000,
    totalMs: 90000,
    progress: 0.0,
    targetProgress: 0.0,
    canPostpone: true,
    postponeMinutes: 5,
    canSkip: true,
    forced: false,
    locked: false,
    label: '一炷香 · 静坐',
    display: '',
    hostControlled: false,
    visitSeed: null,
    active: false
  };

  const dom = {
    curtain: document.getElementById('curtain'),
    teaWash: document.getElementById('tea-wash'),
    teaWashDim: document.querySelector('#tea-wash .dim'),
    teaWashCore: document.querySelector('#tea-wash .core'),
    teaWashRings: document.querySelectorAll('#tea-wash .ring'),
    hud: document.getElementById('hud'),
    vignette: document.getElementById('vignette'),
    statusLabel: document.getElementById('status-label'),
    progressNum: document.getElementById('progress-num'),
    progressFill: document.getElementById('progress-fill'),
    progressEmber: document.getElementById('progress-ember'),
    countdown: document.getElementById('countdown'),
    displayName: document.getElementById('display-name'),
    timerCaption: document.getElementById('timer-caption'),
    actionsBar: document.getElementById('actions-bar'),
    btnPostpone: document.getElementById('btn-postpone'),
    btnSkip: document.getElementById('btn-skip'),
    escHint: document.getElementById('esc-hint'),
    dragHint: document.getElementById('drag-hint'),
    viewSwitcher: document.querySelector('.view-switcher'),
    replayButton: document.getElementById('fish-replay'),
    forcedNote: document.getElementById('forced-note'),
    viewBtns: Array.from(document.querySelectorAll('.view-btn[data-view]'))
  };

  function formatMMSS(ms) {
    const totalSec = Math.max(0, Math.ceil((Number(ms) || 0) / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderHUD() {
    const pct = Math.max(0, Math.min(1, appState.targetProgress));
    const pctInt = Math.round(pct * 100);

    dom.statusLabel.textContent = appState.label || '一炷香 · 静坐';

    dom.btnPostpone.textContent = '延后 ' + appState.postponeMinutes + ' 分钟';

  window.shrineState = function(s) {
    if (!s || typeof s !== 'object') return;
    if (!sceneBooted) {
      pendingHostState = s;
      return;
    }
    const wasActive = appState.active;
    appState.hostControlled = true;
    restoreReplayControl();

    if (typeof s.active === 'boolean') appState.active = s.active;

    if (typeof s.totalMs === 'number' && s.totalMs > 0) {
      appState.totalMs = s.totalMs;
    }
    if (typeof s.remainingMs === 'number') {
      appState.remainingMs = Math.max(0, s.remainingMs);
    }

    if (typeof s.progress === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, s.progress));
    } else if (appState.totalMs > 0 && typeof s.remainingMs === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, 1 - appState.remainingMs / appState.totalMs));
    }

    if (appState.totalMs > 0) {
      burnTarget = Math.max(0, Math.min(1, appState.remainingMs / appState.totalMs));
    }

    if (typeof s.canPostpone === 'boolean') appState.canPostpone = s.canPostpone;
    if (Number.isFinite(s.postponeMinutes) && s.postponeMinutes > 0) appState.postponeMinutes = s.postponeMinutes;
    if (typeof s.canSkip === 'boolean') appState.canSkip = s.canSkip;
    if (typeof s.forced === 'boolean') appState.forced = s.forced;
    if (typeof s.locked === 'boolean') appState.locked = s.locked;
    if (typeof s.label === 'string' && s.label.trim()) appState.label = s.label.trim();
    if (typeof s.display === 'string') appState.display = s.display.trim();

      restStarted = false;
      if (wasActive) fishVisitor?.stop();
    }
    if (appState.active && !wasActive) {
      appState.visitSeed = Number.isFinite(s.visitSeed) ? s.visitSeed : null;

    // state 或首帧迟到而根本不播收尾。
    if (s.outro === true && !outroStarted) {
      if (!restStarted) beginSession();
      startOutro();

    if (appState.active && restStarted && appState.remainingMs <= 0 && !outroStarted) startOutro();

    const img = ctx.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      // A regular alpha texture can sit above the live canvas without
      // sampling the canvas through a full-screen blend effect.
      const noise = 2 * Math.random() - 1;
      const shade = noise >= 0 ? 255 : 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = shade;
      img.data[i + 3] = Math.round(Math.abs(noise) * (noise >= 0 ? 3 : 6));

  function makeCanvasTexture(w, h, drawFn, opts) {
    const options = opts || {};
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    drawFn(ctx, w, h);
    const tex = new THREE.CanvasTexture(c);
    if (options.repeatX || options.repeatY) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(options.repeatX || 1, options.repeatY || 1);

    if (options.srgb) {

      } else if ('encoding' in tex && THREE.sRGBEncoding) {
        tex.encoding = THREE.sRGBEncoding;

  // 构建具有真实窗格亮带与暖色室内漫反射的 HDR 感全景环境贴图，赋予白瓷、茶汤、紫砂、古铜逼真高光眼神光
  let envRenderTarget = null;
  function buildStudioEnvironment() {
    const envTex = makeCanvasTexture(1024, 512, (ctx, w, h) => {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0.0, '#16120e');
      bg.addColorStop(0.45, '#2e251d');
      bg.addColorStop(0.55, '#221a14');
      bg.addColorStop(1.0, '#0d0907');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // 左侧障子窗大面积柔和晨光（带真实窗棂暗格，反射在白瓷杯和茶汤表面）
      const winX = w * 0.15;
      const winY = h * 0.18;
      const winW = w * 0.24;
      const winH = h * 0.48;

      const winGlow = ctx.createRadialGradient(
        winX + winW * 0.5, winY + winH * 0.5, 12,
        winX + winW * 0.5, winY + winH * 0.5, winW * 1.05
      );
      winGlow.addColorStop(0.0, 'rgba(242, 248, 255, 0.98)');
      winGlow.addColorStop(0.48, 'rgba(195, 216, 236, 0.62)');
      winGlow.addColorStop(1.0, 'rgba(55, 70, 88, 0.0)');
      ctx.fillStyle = winGlow;
      ctx.fillRect(0, 0, w * 0.55, h);

      ctx.fillStyle = '#edf4fc';
      ctx.fillRect(winX, winY, winW, winH);

      // 窗格木条在环境反射中的真实投影
      ctx.fillStyle = '#2d2118';
      for (let i = 0; i <= 5; i++) {
        ctx.fillRect(winX + (winW / 5) * i - 2, winY, 4, winH);
      }
      for (let j = 0; j <= 6; j++) {
        ctx.fillRect(winX, winY + (winH / 6) * j - 2, winW, 4);
      }

      // 顶部柔光漫反射带（让茶汤液面与紫砂壶肩有温润天光）
      const topSoft = ctx.createRadialGradient(w * 0.42, h * 0.12, 8, w * 0.42, h * 0.12, w * 0.30);
      topSoft.addColorStop(0.0, 'rgba(235, 226, 210, 0.48)');
      topSoft.addColorStop(1.0, 'rgba(30, 24, 18, 0.0)');
      ctx.fillStyle = topSoft;
      ctx.fillRect(0, 0, w, h * 0.45);

      // 右侧室内暖色漫反射柔光
      const warmBounce = ctx.createRadialGradient(w * 0.74, h * 0.46, 10, w * 0.74, h * 0.46, w * 0.28);
      warmBounce.addColorStop(0.0, 'rgba(255, 198, 138, 0.68)');
      warmBounce.addColorStop(0.5, 'rgba(196, 136, 82, 0.26)');
      warmBounce.addColorStop(1.0, 'rgba(40, 28, 18, 0.0)');
      ctx.fillStyle = warmBounce;
      ctx.fillRect(w * 0.4, 0, w * 0.6, h);
    }, { srgb: true });

    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envRT = pmrem.fromEquirectangular(envTex);
    envRenderTarget = envRT;
    scene.environment = envRT.texture;
    envTex.dispose();
    pmrem.dispose();
  }

    // 2.3 榻榻米蔺草席编织纹理
    const tatamiBumpCanvas = document.createElement('canvas');

      mGrad.addColorStop(1.0, 'rgba(216, 204, 184, 0.0)');

      ctx.beginPath();
      ctx.moveTo(padX, baseY + 120);
      for (let x = padX; x <= padX + innerW; x += 16) {

        const hCurve = Math.sin(nx * Math.PI) * peakH * (0.6 + 0.4 * Math.sin(nx * 5.5 + seedOffset))

    });

  // Alternate two identically configured canvas textures so a ready design can
  // be bound without repainting the texture used by the current frame.
  function createScrollStage() {
    let spare;
    let pending;

    function takeSpare() {
      spare ??= makeCanvasTexture(1024, 2048, () => {}, {srgb: true});
      return {texture: spare, design: chooseHangingScrollDesign(), painted: false};
    }

    function paint(entry) {
      if (entry.painted) return;
      const canvas = entry.texture.image;
      paintHangingScroll(canvas.getContext('2d'), canvas.width, canvas.height, entry.design);
      entry.texture.needsUpdate = true;
      entry.painted = true;
    }

    function upload(entry) {
      if (!renderer.getContext().isContextLost()) renderer.initTexture(entry.texture);
    }

    async function prepare() {
      if (pending) return;
      const entry = takeSpare();
      pending = entry;
      await startupPaint();
      if (pending !== entry) return;
      paint(entry);
      await startupPaint();
      if (pending === entry) upload(entry);
    }

    function apply(currentTexture) {
      const entry = pending ?? takeSpare();
      paint(entry);
      pending = undefined;
      spare = currentTexture;
      return entry;
    }

    return {prepare, apply};
  }

  function chooseHangingScrollDesign() {
    const pick = SCROLL_LINES[(Math.random() * SCROLL_LINES.length) | 0];
    return {
      chars: Array.from(pick[0]), inscription: pick[1], sealChars: Array.from(pick[2]),
      x: -0.32 + Math.random() * 0.72,
      y: 1.38 + Math.random() * 0.14,
      tilt: (Math.random() - 0.5) * 0.018,
      seed: (Math.random() * 2147483647) | 0,
    };
  }

  function stageNextScroll() {
    void scrollStage.prepare().catch(error => console.warn('挂轴预绘失败', error));
  }

  function rollScroll() {
    const {texture, design} = scrollStage.apply(textures.hangingScroll);
    textures.hangingScroll = scrollMesh.material.map = texture;
    fishVisitor.setScrollTexture(texture);
    scrollHangX = design.x;
    scrollHangY = design.y;

      for (let x = 0; x < streamSegsR; x++) {
        const a = y * cols + x;
        const b = a + 1;
        const c = a + cols;
        const d = c + 1;
        index.push(a, c, b, b, c, d);

    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    geo.setIndex(index);
    geo.computeVertexNormals();

  // 真实抛体：出流只有水平初速，之后只受重力。落点由飞行时间反推，
  // 横向匀速、竖直二次下落；截面按连续方程 A·v=常数 随下落变细。
  function updateTeaStreamGeometry(spoutPos, hitPos, elapsedT, flowStrength, head01, tail01) {
    const posAttr = streamGeo.attributes.position;
    const drop = Math.max(0.004, spoutPos.y - hitPos.y);
    const tEnd = Math.sqrt((2 * drop) / STREAM_G);
    const vx = (hitPos.x - spoutPos.x) / tEnd;
    const vz = (hitPos.z - spoutPos.z) / tEnd;
    const v0 = Math.max(0.02, Math.hypot(vx, vz));
    const head = Math.max(0, Math.min(1, head01));
    const tail = Math.max(0, Math.min(1, tail01));

    let idx = 0;
    for (let yIdx = 0; yIdx <= streamSegsY; yIdx++) {
      const u = yIdx / streamSegsY;
      const s = head + (tail - head) * u;
      const t = s * tEnd;
      const cx = spoutPos.x + vx * t;
      const cy = spoutPos.y - 0.5 * STREAM_G * t * t;
      const cz = spoutPos.z + vz * t;

      // 截面垂直于流向：切线 (vx, -g t, vz)
      streamTanTmp.set(vx, -STREAM_G * t, vz).normalize();
      streamUTmp.set(-streamTanTmp.z, 0, streamTanTmp.x);
      if (streamUTmp.lengthSq() < 1e-8) streamUTmp.set(1, 0, 0);
      streamUTmp.normalize();
      streamVTmp.crossVectors(streamTanTmp, streamUTmp);

      const speed = Math.hypot(v0, STREAM_G * t);
      const flutter = 1.0 + 0.05 * Math.sin(s * 22.0 - elapsedT * 34.0);
      const radius = 0.0023 * Math.sqrt(v0 / Math.max(v0 * 0.3, speed))
        * flutter * Math.max(0.3, flowStrength);

      for (let rIdx = 0; rIdx <= streamSegsR; rIdx++) {
        const ux = streamRingCos[rIdx];
        const uz = streamRingSin[rIdx];
        posAttr.setXYZ(
          idx++,
          cx + (streamUTmp.x * ux + streamVTmp.x * uz) * radius,
          cy + (streamUTmp.y * ux + streamVTmp.y * uz) * radius,
          cz + (streamUTmp.z * ux + streamVTmp.z * uz) * radius
        );
      }
    }
    posAttr.needsUpdate = true;
    streamGeo.computeVertexNormals();
  }
