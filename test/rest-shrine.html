const fishWaveTuckDirection = [-0.064,-0.010,-0.042];

function createFishGreetingSleeve(THREE, rig, root) {
  const arm=rig.cupArm;
  const fade={value:0};
  const sections=22,sides=16;
  const coordinates=new Float32Array((sections+1)*sides*3);
  const normals=new Float32Array(coordinates.length);
  const colors=[],indices=[],rings=[];
  const angles=Array.from({length:sides},(_,j)=>j/sides*Math.PI*2);
  const navy=new THREE.Color(0x363f76),shade=new THREE.Color(0x222b4b),gold=new THREE.Color(0x90816a),white=new THREE.Color(0xf4e9e1);
  const color=new THREE.Color();
  for(let i=0;i<=sections;i++) {
    const t=i/sections;
    const cuff=Math.max(0,Math.min(1,(t-0.83)/0.08));
    const radius=0.029-0.007*t+0.003*Math.sin(t*Math.PI);
    rings.push(angles.map(angle=>{
      const u=Math.cos(angle),v=Math.sin(angle);
      const ridge=0.0017*Math.sin(angle*6)*cuff;
      const seam=0.10+0.16*(0.5+0.5*Math.cos(angle*3+0.3));
      color.copy(navy).lerp(shade,seam);
      if(t>0.91)color.copy(white).lerp(shade,(1-v)*0.023);
      else if(t>0.855)color.lerp(gold,0.76);
      colors.push(color.r,color.g,color.b);
      return [u*(radius+ridge),v*radius*0.78,u/(radius+ridge),v/(radius*0.78)];
    }));
  }
  for(let i=0;i<sections;i++) for(let j=0;j<sides;j++) {
    const a=i*sides+j,b=i*sides+(j+1)%sides;
    indices.push(a,b,a+sides,b,b+sides,a+sides);
  }
  const sleeveGeometry=new THREE.BufferGeometry();
  const position=new THREE.BufferAttribute(coordinates,3).setUsage(THREE.DynamicDrawUsage);
  const normal=new THREE.BufferAttribute(normals,3).setUsage(THREE.DynamicDrawUsage);
  sleeveGeometry.setAttribute('position',position);
  sleeveGeometry.setAttribute('normal',normal);
  sleeveGeometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  sleeveGeometry.setIndex(indices);

  const shoulder=new THREE.Vector3(),elbow=new THREE.Vector3(),wrist=new THREE.Vector3();
  const first=new THREE.Vector3(),last=new THREE.Vector3(),plane=new THREE.Vector3();
  const center=new THREE.Vector3(),tangent=new THREE.Vector3(),side=new THREE.Vector3(),across=new THREE.Vector3();
  const p=new THREE.Vector3(),n=new THREE.Vector3();
  const bendRadius=0.047, shoulderInset=0.019;

  function updateGeometry() {
    root.worldToLocal(arm.bones[0].getWorldPosition(shoulder));
    root.worldToLocal(arm.bones[1].getWorldPosition(elbow));
    root.worldToLocal(arm.bones[2].getWorldPosition(wrist));
    first.subVectors(elbow,shoulder);
    last.subVectors(wrist,elbow);
    const upper=first.length(),lower=last.length();
    first.multiplyScalar(1/upper);
    last.multiplyScalar(1/lower);
    plane.crossVectors(first,last);
    const bendStrength=plane.length()/(2*bendRadius);
    plane.normalize();
    for(let i=0;i<=sections;i++) {
      const distance=(upper+lower+shoulderInset)*i/sections-shoulderInset;
      const offset=distance-upper;
      let fabricWidth=1;
      if(offset<=-bendRadius) {
        center.copy(shoulder).addScaledVector(first,distance);
        tangent.copy(first);
      } else if(offset>=bendRadius) {
        center.copy(elbow).addScaledVector(last,offset);
        tangent.copy(last);
      } else {
        const t=(offset+bendRadius)/(2*bendRadius),u=1-t;
        center.copy(elbow).addScaledVector(first,-bendRadius*u*u).addScaledVector(last,bendRadius*t*t);
        tangent.copy(first).multiplyScalar(u).addScaledVector(last,t);
        const tangentLength=tangent.length();

        fabricWidth=Math.min(1,0.82*tangentLength**3/Math.max(0.001,bendStrength*0.031));
        tangent.multiplyScalar(1/tangentLength);

      across.crossVectors(tangent,side).normalize();

        n.copy(side).multiplyScalar(nu/fabricWidth).addScaledVector(across,nv).normalize();
        position.setXYZ(index,p.x,p.y,p.z);
        normal.setXYZ(index,n.x,n.y,n.z);
      }

    normal.needsUpdate=true;
  }

  function material(skin) {
    return new THREE.ShaderMaterial({
      uniforms:{uFade:fade,uColor:{value:new THREE.Color(0xf9ded4)}},
      vertexColors:!skin,
      side:THREE.DoubleSide,
      transparent:true,depthWrite:true,toneMapped:false,forceSinglePass:true,
      vertexShader:`
        uniform vec3 uColor;
        varying vec3 vTeaSleeveColor;
        varying vec3 vTeaSleeveNormal;
        void main() {
          vTeaSleeveColor=${skin?'uColor':'color'};
          vTeaSleeveNormal=normalize(normalMatrix*normal);
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
        }
      `,
      fragmentShader:`
        uniform float uFade;
        varying vec3 vTeaSleeveColor;
        varying vec3 vTeaSleeveNormal;
        void main() {
          vec3 n=normalize(vTeaSleeveNormal);
          if(!gl_FrontFacing)n=-n;
          float light=0.77+0.23*max(0.0,dot(n,normalize(vec3(-0.42,0.64,0.70))));
          gl_FragColor=vec4(vTeaSleeveColor*light,uFade);
          #include <colorspace_fragment>
        }

  }
  const sleeve=new THREE.Mesh(sleeveGeometry,material(false));
  sleeve.name='greetingSleeve';
  sleeve.frustumCulled=false;
  root.add(sleeve);

  const sphere=new THREE.SphereGeometry(1,16,10);
  const parts=[];
  function finger(x,y,z,sx,sy,sz,rotation=0) {

    const travel = (axis.velocity + response * error) * dt;
    const decay = Math.exp(-response * dt);
    axis.angle = target + (error + travel) * decay;
    axis.velocity = (axis.velocity - response * travel) * decay;
    return axis.angle;
  }

    if (gait && previousYaw !== null && dt > 0.00001) {
      const delta = yaw - previousYaw;
      yawRate = Math.atan2(Math.sin(delta),Math.cos(delta)) / dt;
      acceleration = (speed - previousSpeed) / dt;

    previousSpeed = gait ? speed : 0;

    const gaitTail = gait?.tailAngle ?? 0;
    const gaitHair = gait?.hairLag ?? 0;

    const tailDrive = gaitTail - 0.052 * Math.tanh(0.44 * yawRate);
    const hairDrive = gaitHair + 0.035 * Math.tanh(0.27 * acceleration);

  const blinkClose = 0.067, blinkHold = 0.030, blinkOpen = 0.113;
  const blinkEnd = blinkClose + blinkHold + blinkOpen + 0.007;
  const secondBlinkOffset = 0.348;
  const eyeRecovery = 0.20;
  let blinkRunning = false, blinkSecond = false;
  let autoBlinkL = 0, autoBlinkR = 0;

  function blinkWeight(t, close, hold, open) {
    if (t < close) return hermite(t / close);
    return 1 - hermite((t - close - hold) / open);
  }

  function reserveEyes(lead) {
    const cue = activeActionName && !actionFrozen ? ACTIONS[activeActionName].eyeWindow : null;
    return interaction?.keepEyesOnFocus
      || Math.max(actionFace.blinkLeft,actionFace.blinkRight) > 0.025
      || (cue && actionElapsed <= cue[1] && actionElapsed + lead >= cue[0]);
  }

  // Smooth target eye gaze
  const currentGaze = new THREE.Vector2(0, 0);
  let glanceDirection = 1;
  const actionGazeOffset = new THREE.Vector2(0, 0);
  const actionInterpGaze = new THREE.Vector2(0, 0);

  // Scratch face object for action evaluation
  const actionFace = {
    blinkLeft: 0,
    blinkRight: 0,
    smile: 0,
    lipPurse: 0
  };

  const actionInterpFace = {...actionFace};
  function captureAction() {
    Object.assign(actionInterpFrom, actionTargetPose);
    Object.assign(actionInterpFace, actionFace);
    actionInterpGaze.copy(actionGazeOffset);
    isCrossfading=true;
    crossfadeProgress=0;
  }

  function clearActionTarget() {
    resetPoseObj(actionTargetPose);
    actionFace.blinkLeft=0;
    actionFace.blinkRight=0;
    actionFace.smile=0;
    actionFace.lipPurse=0;
    actionGazeOffset.set(0,0);
  }

  function followOffset(value, goal, dt) {
    const change=(goal-value)*-Math.expm1(-4.2*dt);
    return value+clamp(change,-.55*dt,.55*dt);
  }

  function resolveActionName(name) {
    if (ACTIONS[name]) return name;
    if (name === '歪头') return 'headTilt';
    if (name === '小跳') return 'tailJump';
    return null;
  }

  function startAction(name, freezeAtSec = null) {
    const key = resolveActionName(name);
    if (!key) return false;

    // Snapshot current action pose for seamless crossfade
    if ((activeActionName && !actionFrozen) || isCrossfading) {
      captureAction();
    } else {
      resetPoseObj(actionInterpFrom);
      isCrossfading = false;
      crossfadeProgress = 1.0;
    }

    // Pick the side with room to move once at the start of the gesture.
    if (key === 'glance') glanceDirection = freezeAtSec === null && currentGaze.x > .015 ? -1 : 1;
    activeActionName = key;
    if (freezeAtSec !== null) {
      actionElapsed = clamp(freezeAtSec, 0, ACTIONS[key].duration);
      actionFrozen = true;
      isCrossfading = false;
      crossfadeProgress = 1.0;
    } else {
      actionElapsed = 0;
      actionFrozen = false;
    }
    return true;
  }

  function reset() {
    locomotion = null;
    followThrough.reset();
    interaction = null;
    interactionLook = null;
    focus = null;
    focusWeight = 1;
    headAttention = followYaw = followPitch = 0;
    viewerAttention = viewerPitch = viewerYaw = 0;
    breatheGain = 1;
    lastTimeMs = -1;
    visitTimeMs = -1;
    blinkCycleIndex = blinkPhase = blinkTimer = autoBlinkL = autoBlinkR = 0;
    nextBlinkTime = 2.4;
    blinkRunning = blinkSecond = false;
    _vDirLocal.set(0,0,1);
    gazeSolver.reset();
    currentGaze.set(0,0);
    eyeFocus.value.set(0,0);
    activeActionName = null;
    actionElapsed = 0;
    actionFrozen = false;
    isCrossfading = false;
    crossfadeProgress = 1.0;
    inspectionFace = null;
    clearActionTarget();
    resetPoseObj(actionInterpFrom);
    greeting?.apply(0,0,0);
    if (rig && typeof rig.reset === 'function') {
      rig.reset();
    }
  }

  function play(name) {
    inspectionFace = null;
    return startAction(name, null);
  }

  function seek(name, sec) {
    return startAction(name, sec);
  }

  function setLocomotion(pose, yaw=0, speed=0) {
    locomotion = pose;
    travelYaw = yaw;
    travelSpeed = speed;
  }

  function setInteraction(pose, lookAt) {
    interaction = pose;
    interactionLook = lookAt;
  }

  function setAttention(point, weight=1, trackHead=0, viewer=0) {
    focus = point;
    focusWeight = weight;
    headAttention = trackHead;
    viewerAttention = viewer;
  }

  function setFace(blink, smile) {
    if (blink === null && smile === null) {
      inspectionFace = null;
    } else {
      inspectionFace = {
        blinkLeft: blink !== undefined && blink !== null ? clamp(blink, 0, 1) : 0,
        blinkRight: blink !== undefined && blink !== null ? clamp(blink, 0, 1) : 0,
        smile: smile !== undefined && smile !== null ? clamp(smile, 0, 1) : 0,
        lipSmile: smile !== undefined && smile !== null ? clamp(smile, 0, 1) : 0
      };
    }
  }

  const breathePose = {};
  const appliedFace = {blinkLeft: 0, blinkRight: 0, eyeSmile: 0, eyeJoy: 0, smile: 0, lipClose: 0, lipSmile: 0, lipPurse: 0, lipRest: 0};
  let lastTimeMs = -1, visitTimeMs = -1;

  function update(now, camera) {
    if (lastTimeMs < 0) lastTimeMs = visitTimeMs = now;
    const dt = clamp((now - lastTimeMs) * 0.001, 0, 0.1);
    lastTimeMs = now;
    const timeSec = (now - visitTimeMs) * 0.001;

    // -------------------------------------------------------------
    // 1. Natural idle breathing and subtle torso weight shifts
    // -------------------------------------------------------------
    // Smooth non-destructive cyclical offsets
    const breathPhase = timeSec*1.76 + .20*Math.sin(timeSec*.43) + .10*Math.sin(timeSec*.71);
    const breatheCycle = Math.sin(breathPhase);
    const breathe2 = Math.sin(breathPhase*.48+.4);
    breatheGain += ((locomotion ? .60 : 1)-breatheGain)*-Math.expm1(-5.3*dt);
    breathePose.breathe = (breatheCycle * 0.5 + 0.5) * 0.65;
    breathePose.hipY = Math.sin(breathPhase*.48) * 0.0035;
    breathePose.chestPitch = breatheCycle * 0.024;
    breathePose.chestRoll = breathe2 * 0.016;
    breathePose.headPitch = -breatheCycle * 0.015;
    breathePose.headYaw = Math.sin(timeSec * 0.45) * 0.02;
    breathePose.headRoll = breathe2 * 0.012;
    breathePose.tailAngle = Math.sin(timeSec * 1.35) * 0.045;
    breathePose.hairLag = Math.sin(breathPhase - 0.6) * 0.02;
    breathePose.lift = 0;

    // -------------------------------------------------------------
    // 2. Action evaluation & smooth crossfading
    // -------------------------------------------------------------
    clearActionTarget();

    if (activeActionName && ACTIONS[activeActionName]) {
      const act = ACTIONS[activeActionName];
      if (!actionFrozen) {
        actionElapsed += dt;
      }
      const evalT = clamp(actionElapsed, 0, act.duration);
      act.eval(evalT, actionTargetPose, actionFace, actionGazeOffset);

      if (!actionFrozen && actionElapsed >= act.duration) {
        activeActionName = null;
        actionElapsed = 0;
        captureAction();
        clearActionTarget();
      }
    }

    if (isCrossfading) {
      crossfadeProgress += dt / CROSSFADE_TIME;
      if (crossfadeProgress >= 1.0) {
        crossfadeProgress = 1.0;
        isCrossfading = false;
      }
      const alpha = hermite(crossfadeProgress);
      for (const k in actionTargetPose) {
        actionTargetPose[k] = actionInterpFrom[k] * (1 - alpha) + actionTargetPose[k] * alpha;
      }
      for (const k in actionFace) actionFace[k] = actionInterpFace[k]*(1-alpha)+actionFace[k]*alpha;
      actionGazeOffset.lerp(actionInterpGaze,1-alpha);
    }

    // Combine idle layer + action layer into final target pose
    for (const k in currentPose) {
      currentPose[k] = (inspectionFace || actionFrozen ? 0 : (breathePose[k] ?? 0) * breatheGain * (1 - (interaction?.idleSuppress ?? 0)))
        + actionTargetPose[k] + (locomotion?.[k] ?? 0) + (interaction?.[k] ?? 0);
    }

    const follow = followThrough.update(locomotion,travelYaw,travelSpeed,dt);
    currentPose.tailAngle += follow.tailAngle - (locomotion?.tailAngle ?? 0);
    currentPose.hairLag += follow.hairLag - (locomotion?.hairLag ?? 0);

    // The eyes use the current target after posing. The neck reads the
    // preceding eye direction, with a gentler response and smaller range.
    const tracked = inspectionFace || actionFrozen ? 0 : headAttention;
    const engagement = tracked*(focus ? focusWeight : 1)*smoothstep(.14,.62,_vDirLocal.z);
    const yawLead = smoothstep(.046,.21,Math.abs(currentGaze.x));
    const pitchLead = smoothstep(.038,.18,Math.abs(currentGaze.y));
    const yawError = Math.atan2(_vDirLocal.x,Math.max(.001,_vDirLocal.z)) + followYaw;
    const pitchError = -Math.atan2(_vDirLocal.y,Math.hypot(_vDirLocal.x,_vDirLocal.z)) + followPitch;
    const goalYaw = .124*Math.tanh(yawError*2.25)*engagement*yawLead;
    const goalPitch = .086*Math.tanh(pitchError*2.05)*engagement*pitchLead;
    followYaw = followOffset(followYaw,goalYaw,dt);
    followPitch = followOffset(followPitch,goalPitch,dt);
    if (!inspectionFace && !actionFrozen) {
      currentPose.headYaw += followYaw;
      currentPose.headPitch += followPitch;
    }

    // Push pose to mascot rig
    if (rig && typeof rig.setPose === 'function') {
      if (camera && rig.head && (viewerAttention>0 || Math.abs(viewerPitch)+Math.abs(viewerYaw)>.001)) {
        rig.head.parent.getWorldQuaternion(viewerRotation).invert();
        rig.head.localToWorld(viewerDirection.copy(eyeCenter));
        viewerDirection.negate().add(camera.position).applyQuaternion(viewerRotation);
        const bearing=Math.atan2(viewerDirection.x,viewerDirection.z);
        const elevation=Math.atan2(viewerDirection.y,Math.hypot(viewerDirection.x,viewerDirection.z));
        const weight=viewerAttention*(1-smoothstep(.64,1.22,Math.abs(bearing)));
        const yaw=clamp(bearing-currentPose.headYaw,-.40,.40)*weight;
        const pitch=clamp(-elevation-currentPose.headPitch,-.52,.27)*weight;
        const blend=-Math.expm1(-11*dt);
        viewerYaw+=(yaw-viewerYaw)*blend;
        viewerPitch+=(pitch-viewerPitch)*blend;
        currentPose.headYaw+=viewerYaw;
        currentPose.headPitch+=viewerPitch;
      }
      rig.setPose(currentPose, locomotion);
      greeting?.apply(currentPose.greetingRise, currentPose.greetingSway, currentPose.greetingCover,
        currentPose.kissReach,currentPose.kissRelease,activeActionName==='jumpWave'?currentPose.greetingRise:0);
    }

    // Compute focus from the midpoint between the eyes in the posed head.
    const object = focus ?? interactionLook;
    const influence = focus ? clamp(focusWeight, 0, 1) : 1;
    const blendCamera = object && camera && influence < 1;
    const gazeRelaxation = interaction?.gazeRelaxation ?? 0;
    let convergence = 0;
    if ((camera || object) && rig?.head) {
      if (object) _vCamWorld.copy(object);
      else camera.getWorldPosition(_vCamWorld);
      rig.head.updateWorldMatrix(true,false);
      _vHeadWorld.copy(eyeCenter).applyMatrix4(rig.head.matrixWorld);
      rig.head.matrixWorld.decompose(_vHeadOrigin,_qHeadWorld,_vHeadScale);
      _vDirWorld.subVectors(_vCamWorld, _vHeadWorld);
      const distance = _vDirWorld.length();
      _qHeadInv.copy(_qHeadWorld).invert();
      _vDirLocal.copy(_vDirWorld).normalize().applyQuaternion(_qHeadInv);
      if (blendCamera) {
        camera.getWorldPosition(_vCameraLocal);
        _vCameraLocal.sub(_vHeadWorld).normalize().applyQuaternion(_qHeadInv);
      }
      if (object && !inspectionFace) {
        const front = smoothstep(0.25,0.72,_vDirLocal.z);
        const near = 1 - smoothstep(0.35,1.18,distance);
        const aim = Math.atan2(eyeHalfSpan * _vHeadScale.x,distance);
        // Stylized eyes use under-convergence to preserve space at the inner corners.
        convergence = Math.min(0.18,aim * 0.70) * front * near * influence * (1 - gazeRelaxation);
      }
    } else {
      _vDirLocal.set(0,0,1);
    }
    gazeSolver.update(_vDirLocal, blendCamera && rig?.head ? _vCameraLocal : null,
      influence, actionGazeOffset, dt, currentGaze, gazeRelaxation);
    if (inspectionFace) eyeFocus.value.set(0,0);
    else {
      eyeFocus.value.x += (convergence - eyeFocus.value.x) * -Math.expm1(-12 * dt);
      eyeFocus.value.y = smoothstep(0.12,0.49,currentGaze.y);
    }
    if (gazeUniform) {
      if (inspectionFace) gazeUniform.value.set(0,0);
      else gazeUniform.value.copy(currentGaze);
    }

    // Reserve the keyed eyelid movement before starting an automatic blink.
    blinkTimer += dt;
    if (!blinkRunning) {
      const mayDouble = blinkCycleIndex % 5 === 2;
      if (reserveEyes(blinkEnd + (mayDouble ? secondBlinkOffset : 0) + eyeRecovery)) {
        nextBlinkTime = Math.max(nextBlinkTime,blinkTimer + eyeRecovery);
      }
      if (blinkTimer >= nextBlinkTime) {
        blinkRunning = true;
        blinkSecond = mayDouble;
      }
    }
    let blinkTime = blinkTimer - nextBlinkTime;
    // A newly selected gesture may arrive between the two pulses. Let the
    // first blink finish and cancel only a second pulse that has yet to draw.
    if (blinkSecond && blinkTime >= blinkEnd && blinkTime - dt < secondBlinkOffset &&
        reserveEyes(blinkEnd + eyeRecovery)) blinkSecond = false;
    const end = blinkEnd + (blinkSecond ? secondBlinkOffset : 0);
    if (blinkRunning && blinkTime >= end) {
      blinkTimer = blinkTime - end;
      nextBlinkTime = getBlinkInterval(++blinkCycleIndex);
      blinkTime = blinkTimer - nextBlinkTime;
      blinkRunning = blinkSecond = false;
    }
    if (blinkSecond && blinkTime >= secondBlinkOffset) blinkTime -= secondBlinkOffset;
    blinkPhase = blinkTime < 0 || blinkTime >= blinkEnd ? 0
      : blinkTime < blinkClose ? 1 : blinkTime < blinkClose + blinkHold ? 2 : 3;
    autoBlinkL = blinkWeight(blinkTime, blinkClose, blinkHold, blinkOpen);
    autoBlinkR = blinkWeight(blinkTime - 0.007, 0.064, 0.029, 0.116);

    if (face) {
      const expression = interaction?.eyeSoftness ?? 0;
      const smile = clamp(actionFace.smile, 0, 1);
      const purse = interaction?.lipPurse ?? clamp(actionFace.lipPurse,0,1);
      const swallow = interaction?.lipClose ?? 0;
      const blinkLeft = Math.max(actionFace.blinkLeft, interaction?.blinkLeft ?? 0);
      const blinkRight = Math.max(actionFace.blinkRight, interaction?.blinkRight ?? 0);
      applyEyeExpression(appliedFace, autoBlinkL, autoBlinkR, blinkLeft, blinkRight,
        smile, expression, interaction?.lipSmile ?? 0);
      appliedFace.smile = smile;
      appliedFace.lipClose = swallow;
      appliedFace.lipSmile = Math.max(smile, interaction?.lipSmile ?? 0);
      appliedFace.lipPurse = purse;
      const available = Math.max(0,1-swallow-appliedFace.lipSmile-purse);
      const openSmile = smoothstep(.05,.55,appliedFace.lipSmile);
      appliedFace.lipRest = available*(.97-.22*openSmile);
      face.set(inspectionFace ?? appliedFace);
    }
  }

  function getActive() {
    return activeActionName;
  }

  function getStatus() {
    return {
      activeAction: activeActionName,
      actionElapsed: Number(actionElapsed.toFixed(3)),
      actionFrozen: actionFrozen,
      isCrossfading: isCrossfading,
      crossfadeProgress: Number(crossfadeProgress.toFixed(3)),
      greeting: greeting?.status ?? null,
      blinks: {
        phase: blinkPhase,
        left: Number(autoBlinkL.toFixed(3)),
        right: Number(autoBlinkR.toFixed(3)),
        actionBlinkLeft: Number(actionFace.blinkLeft.toFixed(3)),
        actionBlinkRight: Number(actionFace.blinkRight.toFixed(3)),
        nextIntervalSec: Number(nextBlinkTime.toFixed(3))
      },
      gaze: {
        x: Number(currentGaze.x.toFixed(3)),
        y: Number(currentGaze.y.toFixed(3)),
        targetX: Number(gazeSolver.target.x.toFixed(3)),
        targetY: Number(gazeSolver.target.y.toFixed(3)),
        forward: Number(_vDirLocal.z.toFixed(3)),
        viewer: viewerAttention,
        frameTime: lastTimeMs,
        followYaw, followPitch
      },
      face: { ...(inspectionFace ?? appliedFace), mode: inspectionFace ? 'inspect' : 'dynamic' },
      pose: { ...currentPose }
    };
  }

  return {
    update,
    play,
    seek,
    reset,
    setFace,
    setLocomotion,
    setInteraction,
    setAttention,
    get expression() { return inspectionFace ?? appliedFace; },
    get active() {
      return getActive();
    },
    status: getStatus
  };
}

<script>
function createFishRoute(points) {
  const [a,b,c,d] = points;
  const lookup = new Float64Array(129);
  function point(t,out) {
    const u=1-t, aa=u*u*u, bb=3*u*u*t, cc=3*u*t*t, dd=t*t*t;
    out.x=aa*a[0]+bb*b[0]+cc*c[0]+dd*d[0];
    out.z=aa*a[1]+bb*b[1]+cc*c[1]+dd*d[1];
    const dx=u*u*(b[0]-a[0])+2*u*t*(c[0]-b[0])+t*t*(d[0]-c[0]);
    const dz=u*u*(b[1]-a[1])+2*u*t*(c[1]-b[1])+t*t*(d[1]-c[1]);
    out.yaw=Math.atan2(dx,dz);
    return out;
  }
  const tmp=point(0,{});
  let x=tmp.x,z=tmp.z;
  for(let i=1;i<lookup.length;i++) {
    point(i/(lookup.length-1),tmp);
    lookup[i]=lookup[i-1]+Math.hypot(tmp.x-x,tmp.z-z);
    x=tmp.x;z=tmp.z;
  }
  const end=lookup.length-1;
  const length=lookup[end];
  // Use monotone Hermite slopes for distance -> sample index. The heading
  // speed stays continuous when a step crosses an arc-length table cell.
  const inverseSlope=new Float64Array(lookup.length);
  inverseSlope[0]=lookup[1]>0 ? 1/lookup[1] : 0;
  inverseSlope[end]=length>lookup[end-1] ? 1/(length-lookup[end-1]) : 0;
  for(let i=1;i<end;i++) {
    const before=lookup[i]-lookup[i-1], after=lookup[i+1]-lookup[i];
    if(before<=0 || after<=0)continue;
    const leftWeight=2*after+before, rightWeight=after+2*before;
    inverseSlope[i]=(leftWeight+rightWeight)/(leftWeight*before+rightWeight*after);
  }
  return {length,sample(distance,out) {
    if (distance<=0) return point(0,out);
    if (distance>=length) return point(1,out);
    let left=0,right=lookup.length-1;
    while(right-left>1) {
      const i=(left+right)>>1;
      if(lookup[i]<distance)left=i;
      else right=i;
    }
    const width=lookup[right]-lookup[left];
    const f=(distance-lookup[left])/width;
    const blend=f*(1-f)*((1-f)*(width*inverseSlope[left]-1)+f*(1-width*inverseSlope[right]));
    return point((left+f+blend)/end,out);
  }};
}

function sliceFishRoute(route, start, end) {
  const length=end-start;
  return {length,sample(distance,out) {
    return route.sample(start+Math.min(length,Math.max(0,distance)),out);
  }};
}

function createFishPace(route, seconds, knots) {
  let accumulated=0;
  const segments=knots.slice(0,-1).map(([start,v0],i)=>{
    const [end,v1]=knots[i+1];
    const span=end-start, offset=accumulated;
    accumulated+=span*(v0+v1)*0.5;
    return {start,end,span,offset,v0,change:v1-v0};
  });
  const distanceScale=route.length/accumulated;
  return {seconds,sample(time,out) {
    if(time<=0){out.distance=0;out.speed=0;return out;}
    if(time>=seconds){out.distance=route.length;out.speed=0;return out;}
    const progress=time/seconds;
    const part=segments.find(segment=>progress<segment.end);
    const t=(progress-part.start)/part.span;
    out.distance=distanceScale*(part.offset+part.span*(part.v0*t+part.change*t*t*t*(1-t*0.5)));
    out.speed=distanceScale/seconds*(part.v0+part.change*t*t*(3-2*t));
    return out;
  }};
}

function createFishPivot(x,z,yaw,rotation,seconds,length=Math.max(0.025,Math.abs(rotation)*0.48/(2*Math.PI))) {
  const route={length,sample(d,out) {
    const progress=d/length;
    const ramp=Math.max(0,Math.min(1,(progress-0.74)/0.14));
    const turn=Math.min(progress,0.74)+0.14*(ramp-ramp*ramp*ramp*(1-0.5*ramp));
    out.x=x;out.z=z;out.yaw=yaw+turn/0.81*rotation;return out;
  }};
  return {route,pace:createFishPace(route,seconds,[[0,0],[0.20,1],[0.80,1],[1,0]]),stepDistance:0.027,pivot:true,turnDirection:Math.sign(rotation)};
}

function createFishVisitRoutes(stageX,stageZ,yaw) {
  // Both passes go around the back of the small screen and its feet.
  // Keep the final arrival tangent pointed toward the audience.
  const arrival=createFishRoute([[3.43,-0.24],[3.15,-0.266],
    [stageX-Math.sin(yaw)*2.65,stageZ-Math.cos(yaw)*2.65],[stageX,stageZ]]);
  const departure=createFishRoute([[stageX,stageZ],[1.16,-1.87],[3.02,-1.61],[3.43,-0.50]]);
  const staging=[3.23,4.25];
  // The short handles at the existing endpoints match the original tangent.
  const corridorIn=createFishRoute([staging,[3.21,2.15],[3.55,-0.229],[3.43,-0.24]]);
  const corridorOut=createFishRoute([[3.43,-0.50],[3.50,-0.31],[3.32,2.25],staging]);
  const exitYaw=departure.sample(0,{}).yaw;
  const turning=createFishPivot(stageX,stageZ,yaw,Math.PI*2,3.8);
  const exitTurn=createFishPivot(stageX,stageZ,yaw,Math.atan2(Math.sin(exitYaw-yaw),Math.cos(exitYaw-yaw)),1.34,0.22);
  const pace=[[0,0],[0.15,0.70],[0.33,0.70],[0.53,1.47],[0.70,1.47],[0.90,0.48],[1,0]];
  // Approach the wall-side corner slowly, then accelerate once facing the long aisle.
  const approachPace=[[0,0],[0.15,0.65],[0.30,0.99],[0.56,1.02],
    [0.75,0.66],[0.84,0.20],[0.92,0.04],[1,0]];
  const leavePace=[[0,0],[0.031,0.010],[0.073,0.038],[0.19,0.73],
    [0.35,1.01],[0.74,0.99],[0.90,0.60],[1,0]];
  return {
    arrival:{route:arrival,pace:createFishPace(arrival,5.35,pace)},
    turning,
    exitTurn:{...exitTurn,stepDistance:0.0275},
    departure:{route:departure,pace:createFishPace(departure,5.40,pace)},
    corridorIn:{route:corridorIn,pace:createFishPace(corridorIn,4.7,approachPace),stepDistance:0.112,corridor:true},
    corridorOut:{route:corridorOut,pace:createFishPace(corridorOut,4.95,leavePace),stepDistance:0.112,corridor:true},
  };
}

function planFishVisit(totalMs, seed, actionCount, reserve=39000) {
  if (!Number.isFinite(seed) || totalMs < reserve+2000) return null;
  let state = (seed ^ Math.floor(seed / 4294967296)) >>> 0;
  const random = () => {
    state = (state + 0x6D2B79F5) >>> 0;
    let x = state;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  if (random() >= 0.72) return null;
  const arrivalDraw = random();
  const order = Array.from({length:actionCount},(_,i)=>i);
  for(let i=order.length-1;i>0;i--) {
    const j=Math.floor(random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  const peek=random()<0.46;
  const waveIndex=random()<0.70 ? Math.floor(random()*(actionCount+1)) : null;
  const touchArt=random()<0.58;
  const shy=random()<0.42;
  const compact=totalMs>=82000 && random()<0.34;
  const stretch=random()<0.39;
  const greeting=Math.floor(random()*4);
  const tableVisit=totalMs>=90000 && random()<0.38;
  if (compact) {
    // Reserve both full entry and exit corridors, plus enough time for the
    // longest two actions, optional greeting and a final pause.
    const reserveMs=41500;
    const first=totalMs*.50;
    const last=Math.min(totalMs*.62,totalMs-reserveMs-500);
    const delay=first+(last-first)*arrivalDraw;
    const selected=order.slice(0,2);
    return {triggerMs:totalMs-delay,reserveMs,order:selected,peek,shy,stretch,compact,greeting,
      waveIndex:waveIndex===null ? null : Math.min(1,Math.floor(waveIndex*selected.length/actionCount)),touchArt:false};
  }
  const delay=(.06+.83*arrivalDraw)*(totalMs-reserve);
  const count=Math.min(actionCount,(totalMs<63000?3:4)+Math.floor(random()*3));
  return {triggerMs:totalMs-delay,reserveMs:reserve,order:order.slice(0,count),peek,tableVisit,
    waveIndex:waveIndex===null ? null : Math.min(count-1,Math.floor(waveIndex*count/actionCount)),
    greeting,touchArt,shy,stretch,compact};
}

<script>
function applyFishGaitSupport(out, feet, sway, pace, gate, pivot) {
  const stanceWidth = feet.right.x + out.rightX - feet.left.x - out.leftX;
  const lateral = .36 * (out.leftX + out.rightX) + sway * (pivot ? .12 : .31) * .5 * stanceWidth;
  const forward = .36 * (out.leftZ + out.rightZ);
  const limit = .028;
  const factor = gate * limit / Math.hypot(limit, lateral, forward);
  out.supportX = lateral * factor;
  out.supportZ = forward * factor;
  out.chestRoll = -sway * gate * (pivot ? .027 : .033 + .012 * pace);
  out.headRoll = -.46 * out.chestRoll;
}

function createFishGait(route, {scale, feet, stepDistance = 0.110, pivot = false, corridor = false}) {
  const length = route.length;
  const measure = new Float64Array(129);
  const onPath = {};
  let lastYaw = route.sample(0, onPath).yaw;
  const measureStep = length / (measure.length-1);
  for (let i=1;i<measure.length;i++) {
    const yaw = route.sample(i*measureStep,onPath).yaw;
    const turn = Math.abs(Math.atan2(Math.sin(yaw-lastYaw),Math.cos(yaw-lastYaw)));
    measure[i] = measure[i-1] + measureStep + (pivot ? 0 : 0.14*turn);
    lastYaw = yaw;
  }
  const total = measure.at(-1);
  const steps = Math.max(2, Math.ceil(total / (pivot || corridor ? stepDistance : Math.min(stepDistance,0.112))));
  const stride = total / steps;
  const anchors = {left:[], right:[]};
  const body = {};
  const curve = {};
  function distanceAt(fraction) {
    const at = Math.min(total,Math.max(0,fraction*stride));
    let low=0,high=measure.length-1;
    while (high-low>1) {
      const mid=(low+high)>>1;
      if (measure[mid]<at) low=mid;
      else high=mid;
    }
    return (low+(at-measure[low])/(measure[high]-measure[low]))*measureStep;
  }

  function worldFoot(distance, foot) {
    route.sample(distance, curve);
    const c = Math.cos(curve.yaw), s = Math.sin(curve.yaw);
    const spread = pivot ? 0.051 * Math.max(0,Math.min(1,Math.min(distance,length-distance)/(stride*1.3))) : 0;
    const across = foot.x + (foot === feet.left ? -spread : spread);
    return {
      x: curve.x + scale * (across*c + foot.z*s),
      z: curve.z + scale * (-across*s + foot.z*c),
      yaw: curve.yaw
    };
  }

  for (let i = 0; i < steps; i++) {
    const side = i % 2 === 0 ? 'left' : 'right';
    const last = i >= steps - 2;
    const lift = distanceAt(i+(pivot ? 0.08 : 0.035));
    const landAt = i+(last ? 0.93 : pivot ? 0.72 : corridor ? 0.90 : 0.82);
    const land = distanceAt(landAt);
    const placement = last ? length : distanceAt(pivot ? landAt+0.65 : (landAt+i+2.035)*0.5);
    anchors[side].push({lift, land, ...worldFoot(placement, feet[side])});
  }
  const rest = {left:worldFoot(0,feet.left), right:worldFoot(0,feet.right)};
  const clamped = x => Math.max(0,Math.min(1,x));
  const ease = x => x*x*x*(10 + x*(-15 + x*6));
  const shortTurn = (a,b) => Math.atan2(Math.sin(b-a),Math.cos(b-a));

  function corridorSwing(t) {
    // Integrate a cosine speed ramp, a short cruise, and a mirrored brake.
    // The planted endpoints have zero velocity and acceleration.
    const ramp = .29;
    const speed = 1 / (1-ramp);
    const firstHalf = Math.min(t,1-t);
    const travel = firstHalf < ramp
      ? .5*speed*(firstHalf-ramp/Math.PI*Math.sin(Math.PI*firstHalf/ramp))
      : speed*(firstHalf-.5*ramp);
    return t<=.5 ? travel : 1-travel;
  }

  function sampleFoot(distance, side, height, pace, c, s, out) {
    let support = rest[side];
    let x, z, yaw, raised = 0, pitch = 0;
    for (const next of anchors[side]) {
      if (distance < next.lift) break;
      if (distance < next.land) {
        const t = (distance-next.lift)/(next.land-next.lift);
        const u = corridor ? corridorSwing(t) : ease(t);
        x = support.x + (next.x-support.x)*u;
        z = support.z + (next.z-support.z)*u;
        const arc = 4*t*(1-t);
        const rotation = shortTurn(support.yaw,next.yaw)*u;
        yaw = support.yaw + rotation;
        if (pivot) {
          // A planted pivot steps around the hips. Taking the straight chord
          // through the circle brings the swing foot into the support foot.
          const c0 = Math.cos(support.yaw), s0 = Math.sin(support.yaw);
          const c1 = Math.cos(next.yaw), s1 = Math.sin(next.yaw);
          const ax = (support.x-body.x)*c0-(support.z-body.z)*s0;
          const bx = (next.x-body.x)*c1-(next.z-body.z)*s1;
          const forward = feet[side].z*scale;
          const across = ax+(bx-ax)*u+(side==='left'?-0.029:0.029)*arc*arc;
          const c = Math.cos(yaw), s = Math.sin(yaw);
          x = body.x + across*c + forward*s;
          z = body.z - across*s + forward*c;
        }
        raised = height*arc*arc;
        if (!pivot) {
          // Positive pitch dips the toe. Both ends are flat with zero slope,
          // and the pitch and lift share a clearance envelope.
          pitch=(0.088+0.092*pace)*arc*arc*Math.cos(Math.PI*t);
        }
        break;
      }
      support = next;
    }
    if (x === undefined) { x=support.x; z=support.z; yaw=support.yaw; }
    const dx=x-body.x, dz=z-body.z;
    out[side+'X'] = (dx*c-dz*s)/scale-feet[side].x;
    out[side+'Y'] = raised;
    out[side+'Z'] = (dx*s+dz*c)/scale-feet[side].z;
    out[side+'Yaw'] = shortTurn(body.yaw,yaw);
    out[side+'Pitch'] = pitch;
    out[side+'Planted'] = raised === 0;
  }

  return {sample(distance,speed,out) {
    const d = Math.max(0,Math.min(length,distance));
    route.sample(d,body);
    const c=Math.cos(body.yaw), s=Math.sin(body.yaw);
    const pace=ease(clamped((speed-0.45)/0.45));
    const height=0.040+0.017*pace;
    sampleFoot(d,'left',height,pace,c,s,out);
    sampleFoot(d,'right',height,pace,c,s,out);
    const index = Math.min(Math.floor(d/measureStep),measure.length-2);
    const progress = measure[index]+(measure[index+1]-measure[index])*(d/measureStep-index);
    const gate=ease(clamped(Math.min(progress,total-progress)/(stride*0.8)));
    const phase=progress*Math.PI/stride;
    const swing=Math.sin(phase);
    // The rig subtracts this pelvis motion from both foot positions.
    applyFishGaitSupport(out, feet, swing, pace, gate, pivot);
    out.chestPitch=(0.018+0.095*pace+0.022*Math.sin(phase*2))*gate;
    out.headPitch=-0.034*pace*gate;
    out.hipY=-swing*swing*(0.011+0.006*pace)*gate;
    const follow = pivot ? phase : d*Math.PI/.182;
    out.tailAngle=Math.sin(follow-0.65)*(0.099+0.032*pace)*gate;
    out.hairLag=-Math.sin(follow-1.12)*0.063*gate;
    return out;
  }};
}

<script>
function createFishSip(THREE, model, rig, restCupWorld) {
  const reachEnd=0.82, liftEnd=1.67, sipEnd=2.48, lowerEnd=3.40, releaseEnd=4.13;
  const scale=model.scale.x;
  const rightGrip=new THREE.Vector3(0.041,0.027,-0.012).divideScalar(scale);
  const nearRim=new THREE.Vector3(0.004,0.048,-0.035).divideScalar(scale);
  const mouthSocket=rig.mouthSocket ?? new THREE.Vector3(-0.0982,0.0507-0.095,0.2461-0.02);
  const handAxis=rig.cupArm.handOffset.clone().normalize();
  const cupBase=new THREE.Vector3(), rest=new THREE.Vector3(), lifted=new THREE.Vector3();
  const mouth=new THREE.Vector3(), target=new THREE.Vector3(), palm=new THREE.Vector3(), localRim=new THREE.Vector3();
  const pitch=new THREE.Vector3(1,0,0), grabDir=new THREE.Vector3(), direction=new THREE.Vector3();
  const cupQ=new THREE.Quaternion(), palmQ=new THREE.Quaternion(), rootQ=new THREE.Quaternion();
  const result={phase:'rest',held:false,gripError:0,rimError:0,tilt:0,fill:1,sleeveBlend:0,cupPosition:new THREE.Vector3(),cupQuaternion:new THREE.Quaternion()};
  let presenting=false;
  const gripPose={base:cupBase,rotation:cupQ,curl:0,scale};
  const clamp=t=>Math.min(1,Math.max(0,t));
  const ease=t=>{const u=clamp(t);return u*u*u*(10+u*(-15+u*6));};

  function tasteLids(time) {
    const closing=ease((time-liftEnd+0.04)/0.25);
    const resting=0.43+0.24*(1-ease((time-liftEnd-0.20)/0.26));
    const opening=1-ease((time-sipEnd+0.17)/0.30);
    return closing*resting*opening;
  }

  function poseAt(time,out) {
    const close=ease(time/reachEnd)*(1-ease((time-lowerEnd)/(releaseEnd-lowerEnd)));
    const drinking=ease((time-reachEnd)/(liftEnd-reachEnd))*(1-ease((time-sipEnd)/(lowerEnd-sipEnd)));
    out.chestPitch=close*0.17-drinking*0.015;
    out.headPitch=close*0.078+drinking*0.072;
    out.headYaw=close*0.065+drinking*0.20;
    out.chestRoll=close*0.025;
    out.headRoll=-drinking*0.035;
    out.hairLag=-close*0.033;
    out.lipPurse=ease((time-liftEnd+0.17)/0.19)*(1-ease((time-sipEnd+0.13)/0.17));
    out.lipClose=ease((time-sipEnd+0.07)/0.15)*(1-ease((time-sipEnd-0.21)/0.31));
    out.lipSmile=0.52*ease((time-sipEnd-0.40)/0.32)*(1-ease((time-releaseEnd+0.38)/0.38));
    // Focus on the rim during the lift. Let the eyes rest during contact and
    // follow the cup again as it lowers, while keeping the head posed for sipping.
    out.cupAttention=ease(time/0.30)*(1-ease((time-releaseEnd+0.42)/0.42));
    out.gazeRelaxation=0.72*ease((time-liftEnd+0.48)/0.45)*(1-ease((time-sipEnd-0.10)/0.42));
    out.eyeSoftness=0.33*ease((time-liftEnd+0.14)/0.34)*(1-ease((time-sipEnd-0.03)/0.30));
    out.blinkLeft=tasteLids(time);
    out.blinkRight=0.96*tasteLids(time-0.015);
    out.keepEyesOnFocus=time>=liftEnd-.30&&time<=sipEnd+.15;
    return out;
  }

  function sample(time) {
    const t=Math.max(0,Math.min(releaseEnd,time));
    model.worldToLocal(rest.copy(restCupWorld));
    const rise=ease((t-reachEnd)/(liftEnd-reachEnd));
    const setdown=ease((t-sipEnd)/(lowerEnd-sipEnd));
    const carry=rise*(1-setdown);
    const handBlend=ease(t/reachEnd)*(1-ease((t-lowerEnd)/(releaseEnd-lowerEnd)));
    const sip=ease((t-liftEnd)/0.21)*(1-ease((t-sipEnd+0.25)/0.25));
    const tilt=-0.11*carry-0.11*sip;
    cupQ.setFromAxisAngle(pitch,tilt);
    rig.head.localToWorld(mouth.copy(mouthSocket));
    model.worldToLocal(mouth);
    mouth.z+=0.004;
    lifted.copy(mouth).sub(localRim.copy(nearRim).applyQuaternion(cupQ));
    cupBase.lerpVectors(rest,lifted,carry);
    cupBase.z+=0.040*Math.sin(Math.PI*carry);
    cupBase.y+=0.039*Math.sin(Math.PI*carry);
    target.copy(rightGrip);
    target.x+=(0.0037-0.0004*carry)/scale;
    target.applyQuaternion(cupQ).add(cupBase);
    target.y+=0.094*Math.sin(Math.PI*handBlend);
    grabDir.set(-0.24,-0.10,0.96);
    direction.set(-0.78,0.20,0.58);
    grabDir.lerp(direction,carry).normalize();
    palmQ.setFromUnitVectors(handAxis,grabDir);
    rig.cupArm.setPalm(target,palmQ,handBlend);
    rig.cupArm.palmWorld(palm);
    result.held=t>=reachEnd && t<lowerEnd;
    result.phase=t<reachEnd?'reach':t<liftEnd?'lift':t<sipEnd?'sip':t<lowerEnd?'setdown':t<releaseEnd?'release':'rest';
    result.tilt=tilt;
    result.fill=1-0.35*ease((t-liftEnd)/(sipEnd-liftEnd));
    result.sleeveBlend=ease(t/0.31)*(1-ease((t-releaseEnd+0.32)/0.32));
    gripPose.curl=ease((t-reachEnd+0.13)/0.13)*(1-ease((t-lowerEnd)/0.24));
    result.fingerCurl=gripPose.curl;
    result.fingers=rig.greetingSleeve?.setBlend(result.sleeveBlend,gripPose) ?? null;
    presenting=result.sleeveBlend>0;
    result.rimError=localRim.copy(nearRim).applyQuaternion(cupQ).add(cupBase).distanceTo(mouth)*scale;
    result.gripError=model.localToWorld(target).distanceTo(palm);
    model.localToWorld(result.cupPosition.copy(cupBase));
    result.cupQuaternion.copy(model.getWorldQuaternion(rootQ)).multiply(cupQ);
    return result;
  }

  function clear(){
    if(presenting)rig.greetingSleeve?.setBlend(0);
    presenting=false;
  }
  return {poseAt,sample,clear,seconds:releaseEnd};
}

<script>
function createFishSmallScroll(THREE, scene, floorY, woodMaterial, texture) {
  const stand=new THREE.Group();
  stand.name='smallScrollStand';
  stand.position.set(2.02,floorY,-.52);
  stand.rotation.y=-1.10;
  scene.add(stand);
  const wood=woodMaterial.clone();
  wood.color.setHex(0x714b2e);
  const roller=woodMaterial.clone();
  roller.color.setHex(0x3e281b);

  function piece(geometry,material,x,y,z) {
    const mesh=new THREE.Mesh(geometry,material);
    mesh.position.set(x,y,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    stand.add(mesh);
    return mesh;
  }
  for(const x of [-.163,.163]){
    piece(new THREE.BoxGeometry(.026,.586,.027),wood,x,.293,-.006);
    piece(new THREE.BoxGeometry(.055,.023,.154),wood,x,.011,-.004);
  }
  piece(new THREE.BoxGeometry(.367,.028,.027),wood,0,.586,-.006);
  const hanger=piece(new THREE.CylinderGeometry(.007,.007,.269,16),roller,0,.559,.022);
  hanger.rotation.z=Math.PI/2;
  const lower=piece(new THREE.CylinderGeometry(.009,.009,.271,16),roller,0,.136,.022);
  lower.rotation.z=Math.PI/2;

  // The paper moves independently of the furniture during contact.
  const paper=new THREE.Group();
  paper.name='smallScrollPaper';
  paper.position.copy(stand.position);
  paper.rotation.copy(stand.rotation);
  paper.userData.fishDynamic = 'paper';
  scene.add(paper);
  const geometry=new THREE.PlaneGeometry(.242,.421,16,24);
  const positions=geometry.attributes.position;
  positions.setUsage(THREE.DynamicDrawUsage);
  const material=new THREE.MeshStandardMaterial({
    map:texture,roughness:.87,metalness:0,side:THREE.DoubleSide,color:0xf1e3c9,
  });
  const cloth=new THREE.Mesh(geometry,material);
  cloth.receiveShadow=true;
  paper.add(cloth);
  const center=.347;
  const tipX=-.242/16,tipY=center-.421/24;
  const normal=new THREE.Vector3(0,0,1).applyQuaternion(stand.quaternion);
  const midpoint=new THREE.Vector3(0,.445,.029);
  const reset=new THREE.Vector3(0,0,0);
  for(let i=0;i<positions.count;i++)positions.setY(i,positions.getY(i)+center);
  let deflection=-1;

  function surfaceZ(x,y,push) {
    const curvature=.0036*Math.cos((y-center)/.2105*Math.PI/2);
    const contact=Math.exp(-(((x-tipX)/.048)**2+((y-tipY)/.064)**2));
    return .022+curvature-.0038*push*contact;
  }
  const normals=geometry.attributes.normal;
  normals.setUsage(THREE.DynamicDrawUsage);
  const curvatureRate=Math.PI/(2*.2105);
  const coefficients=new Float64Array(positions.count*5);
  for(let i=0;i<positions.count;i++) {
    const dx=positions.getX(i)-tipX;
    const dy=positions.getY(i)-tipY;
    const height=positions.getY(i)-center;
    const influence=Math.exp(-((dx/.048)**2+(dy/.064)**2));
    const at=i*5;
    coefficients[at]=.022+.0036*Math.cos(height/.2105*Math.PI/2);
    coefficients[at+1]=influence;
    // For z=f(x,y), the front-facing normal is proportional to (-fx,-fy,1).
    coefficients[at+2]=-2*dx*influence/(.048*.048);
    coefficients[at+3]=.0036*curvatureRate*Math.sin(height*curvatureRate);
    coefficients[at+4]=-2*dy*influence/(.064*.064);
  }

  function setDeflection(value) {
    if(value===deflection)return;
    deflection=value;
    const displacement=.0038*value;
    for(let i=0;i<positions.count;i++){
      const at=i*5;
      positions.setZ(i,coefficients[at]-displacement*coefficients[at+1]);
      const nx=displacement*coefficients[at+2];
      const ny=coefficients[at+3]+displacement*coefficients[at+4];
      const invLength=1/Math.sqrt(nx*nx+ny*ny+1);
      normals.setXYZ(i,nx*invLength,ny*invLength,invLength);
    }
    positions.needsUpdate=true;
    normals.needsUpdate=true;
  }
  setDeflection(0);
  stand.updateMatrixWorld(true);
  paper.updateMatrixWorld(true);
  const boardView=stand.localToWorld(midpoint.clone());
  const view={
    pos:stand.localToWorld(new THREE.Vector3(-1.19,.59,.37)),
    target:stand.localToWorld(new THREE.Vector3(.024,.370,.168)),
    fov:43
  };
  const footPoint=stand.localToWorld(new THREE.Vector3(.085,0,.275));
  // Land the last step with the near shoulder open. The hand still
  // reaches along the paper normal and the head follows the contact point.
  const facing=Math.atan2(-normal.x,-normal.z)+.30;
  function tipWorld(out){
    return paper.localToWorld(out.set(tipX,tipY,surfaceZ(tipX,tipY,deflection)));
  }
  function signedClearance(world) {
    paper.worldToLocal(reset.copy(world));
    if(Math.abs(reset.x)>.121||reset.y<.1365||reset.y>.5575)return Infinity;
    return reset.z-surfaceZ(reset.x,reset.y,deflection);
  }
  return {stand,paper,normal,footPoint,facing,boardView,view,tipWorld,setDeflection,signedClearance,
    setTexture(texture) { material.map = texture; }};
}

const fishScrollTouchSeconds=1.96;

function fishScrollTouchEase(value) {
  const t=Math.max(0,Math.min(1,value));
  return t*t*t*(10+t*(-15+t*6));
}

function createFishScrollTouch(THREE, model, rig, prop) {
  const arm=rig.cupArm;
  const tip=rig.greetingSleeve.contactTip;
  const offset=tip.clone().sub(arm.handOffset);
  const axis=arm.handOffset.clone().normalize();
  const rest=new THREE.Vector3(),touch=new THREE.Vector3(),palm=new THREE.Vector3();
  const target=new THREE.Vector3(),actual=new THREE.Vector3(),direction=new THREE.Vector3(),tipVector=new THREE.Vector3();
  const rotation=new THREE.Quaternion(),goal=new THREE.Quaternion(),rootQ=new THREE.Quaternion();
  const status={reach:0,deflection:0,error:null,clearance:null};

  function poseAt(time,out) {
    const enter=fishScrollTouchEase((time-.16)/.70);
    const release=fishScrollTouchEase((time-1.13)/.62);
    const reach=enter*(1-release);
    const curiosity=fishScrollTouchEase((time-.03)/.58)*(1-fishScrollTouchEase((time-1.34)/.56));
    out.chestPitch=.066*reach;
    out.chestRoll=-.022*reach;
    out.headPitch=.060*curiosity;
    out.headYaw=.041*reach;
    out.headRoll=.079*curiosity;
    const ripple=Math.exp(-(((time-1.00)/.27)**2));
    out.tailAngle=.035*Math.sin((time-.82)*Math.PI*4.4)*ripple;
    out.hairLag=-.028*reach;
    out.lipSmile=.51*curiosity;
    out.eyeSoftness=.12*fishScrollTouchEase((time-.95)/.16)*(1-fishScrollTouchEase((time-1.11)/.22));
    return out;
  }
  function sample(time) {
    const reach=fishScrollTouchEase((time-.16)/.70)*(1-fishScrollTouchEase((time-1.13)/.62));
    const fold=fishScrollTouchEase((time-.04)/.16)*(1-fishScrollTouchEase((time-1.69)/.23));
    const push=fishScrollTouchEase((time-.90)/.11)*(1-fishScrollTouchEase((time-1.01)/.13));
    prop.setDeflection(push);
    prop.tipWorld(touch);
    model.getWorldQuaternion(rootQ).invert();
    direction.copy(prop.normal).negate().applyQuaternion(rootQ).normalize();
    goal.setFromUnitVectors(axis,direction);
    model.worldToLocal(target.copy(touch).addScaledVector(prop.normal,.0004));
    target.sub(tipVector.copy(offset).applyQuaternion(goal));
    arm.palmRestModel(rest);
    palm.copy(rest).lerp(target,reach);
    palm.y+=.016*Math.sin(Math.PI*reach);
    rotation.identity().slerp(goal,reach);
    if(reach>0.0001)arm.setPalm(palm,rotation);
    else arm.reset();
    rig.greetingSleeve.setBlend(fold);
    arm.bones[2].localToWorld(actual.copy(tip));
    status.reach=reach;
    status.deflection=push;
    status.error=actual.distanceTo(touch);
    status.clearance=prop.signedClearance(actual);
    return status;
  }
  function clear() {
    prop.setDeflection(0);
    rig.greetingSleeve.setBlend(0);
  }
  return {poseAt,sample,clear,status};
}

const fishSmallScrollVisitSeconds=9.23;

function createFishSmallScrollVisit(prop,stageX,stageZ,stageYaw) {
  const {x,z}=prop.footPoint;
  const dx=Math.sin(prop.facing),dz=Math.cos(prop.facing);
  const points=[[stageX,stageZ],[stageX+.28,stageZ-.005],[x-.24*dx,z-.24*dz],[x,z]];
  const out=createFishRoute(points);
  const retreatDistance=.146;
  const retreat={length:retreatDistance,sample(distance,out) {
    const d=Math.max(0,Math.min(retreatDistance,distance));
    out.x=x-dx*d;out.z=z-dz*d;out.yaw=prop.facing;
    return out;
  }};
  const edge=retreat.sample(retreatDistance,{});
  const back=createFishRoute([[edge.x,edge.z],[edge.x-.22*dx,edge.z-.22*dz],
    [stageX+.25,stageZ-.002],[stageX,stageZ]]);
  const outStart=out.sample(0,{}).yaw;
  const backStart=back.sample(0,{}).yaw;
  const backEnd=back.sample(back.length,{}).yaw;
  const turn=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const paced=(route,seconds)=>({route,pace:createFishPace(route,seconds,[[0,0],[.21,.90],[.76,1.08],[1,0]]),stepDistance:.101});
  return [
    {label:'turnToPaper',seconds:1.00,motion:createFishPivot(stageX,stageZ,stageYaw,turn(stageYaw,outStart),1.00)},
    {label:'walkToPaper',seconds:1.72,motion:paced(out,1.72)},
    {label:'touchPaper',seconds:fishScrollTouchSeconds},
    {label:'stepBack',seconds:.67,motion:{...paced(retreat,.67),stepDistance:.058}},
    {label:'turnFromPaper',seconds:1.30,motion:createFishPivot(edge.x,edge.z,prop.facing,turn(prop.facing,backStart),1.30)},
    {label:'walkBack',seconds:1.72,motion:paced(back,1.72)},
    {label:'returnToStage',seconds:.86,motion:createFishPivot(stageX,stageZ,backEnd,turn(backEnd,stageYaw),.86)}
  ];
}

function createFishTableSteps(THREE, scene, wood, floorY, tableY, tableEdgeZ) {
  const steps = new THREE.Group();
  const x=.65, width=.34, depth=.205, count=7;
  const rise=(tableY-floorY)/(count+1);
  const treads=[];
  for (let i=0;i<count;i++) {
    const front=tableEdgeZ+(count-i)*depth;
    const y=floorY+(i+1)*rise;
    const z=front-depth/2;
    const tread=new THREE.Mesh(new THREE.BoxGeometry(width,y-floorY,depth),wood);
    tread.position.set(x,(y+floorY)/2,z);
    tread.castShadow=tread.receiveShadow=true;
    steps.add(tread);
    treads.push({x,y,z,front,width,depth});
  }
  scene.add(steps);
  return treads;
}

function createFishTableVisit(stage, steps, table) {
  const first=steps[0];
  const base={x:first.x,y:stage.y,z:first.front+.22,yaw:Math.PI};
  const upperLanding={...table,z:steps.at(-1).front-.220};
  const stairs=[base,...steps.map(step=>({x:step.x,y:step.y,z:step.front+.025,yaw:base.yaw})),upperLanding];
  const pivot=(point,from,to,seconds)=>({
    motion:createFishPivot(point.x,point.z,from,Math.atan2(Math.sin(to-from),Math.cos(to-from)),seconds),
    y:point.y,seconds
  });
  // The floor path goes around the cup stand and meets the stairs from the front.
  const approach=createFishRoute([[stage.x,stage.z],[1.96,.005],[2.03,base.z+.14],[base.x,base.z]]);
  const firstYaw=approach.sample(0,{}).yaw;
  const lastYaw=approach.sample(approach.length,{}).yaw;
  const walk=(route,seconds,y=stage.y)=>({
    motion:{route,pace:createFishPace(route,seconds,[[0,0],[.25,1],[.72,1],[1,0]]),stepDistance:.089},
    y,seconds
  });
  const walkStraight=(from,to,seconds)=>walk({
    length:Math.abs(to.z-from.z),sample(distance,out){
      out.x=from.x;out.z=from.z+Math.sign(to.z-from.z)*distance;out.yaw=from.yaw;return out;
    }
  },seconds,from.y);
  const stepsUp=stairs.slice(1).map((to,i)=>({
    name:'climb',from:stairs[i],to,seconds:.86,lead:i%2===0?'right':'left'
  }));
  const look={...table,yaw:0};
  const upperExit={...look,z:steps.at(-1).front-steps.at(-1).depth-.080};
  const floorLanding={...base,yaw:look.yaw};
  const floorExit={...floorLanding,z:floorLanding.z+.27};
  const clearStairs=createFishRoute([[floorExit.x,floorExit.z],[1.10,floorExit.z+.07],[1.89,1.96],[1.92,1.35]]);
  const returnRoute=createFishRoute([[1.92,1.35],[1.945,.84],[1.93,-.085],[stage.x,stage.z]]);
  const returnYaw=clearStairs.sample(0,{}).yaw;
  const returnEndYaw=returnRoute.sample(returnRoute.length,{}).yaw;
  const descent=[upperExit,...steps.slice().reverse().map(step=>({
    x:step.x,y:step.y,z:step.front-.035,yaw:look.yaw
  })),floorLanding];
  const stepsDown=descent.slice(1).map((to,i)=>({
    name:'descend',from:descent[i],to,seconds:.92,lead:i%2===0?'left':'right'
  }));
  return [
    {name:'approach', ...pivot(stage,stage.yaw,firstYaw,.68)},
    {name:'approach', ...walk(approach,2.20)},
    {name:'approach', ...pivot(base,lastYaw,base.yaw,.70)},
    ...stepsUp,
    {name:'climb', ...walkStraight(upperLanding,table,.58)},
    {name:'tableTurn', ...pivot(table,table.yaw,look.yaw,1.08)},
    {name:'lookAround', point:look, seconds:1.72},
    {name:'descend', ...walkStraight(look,upperExit,.52)},
    ...stepsDown,
    {name:'return', ...walkStraight(floorLanding,floorExit,.66)},
    {name:'return', ...pivot(floorExit,floorExit.yaw,returnYaw,.65)},
    {name:'return', ...walk(clearStairs,1.48)},
    {name:'return', ...walk(returnRoute,1.86)},
    {name:'return', ...pivot(stage,returnEndYaw,stage.yaw,.70)}
  ];
}

function sampleFishStair(time, leg, scale, point, gait, pose) {
  const {from,to,lead}=leg;
  const descending=leg.name==='descend';
  const u=time/leg.seconds;
  const ease=(start,end)=>fishScrollTouchEase((u-start)/(end-start));
  const shift=descending ? ease(.43,.93) : ease(.15,.66);
  // Move the pelvis between the support and swing feet instead of making
  // the leading leg reach all the way across a tread from a fixed body.
  const travel=descending ? ease(.08,.76) : ease(.13,.48)*.5+ease(.51,.93)*.5;
  point.x=from.x;
  point.y=from.y+(to.y-from.y)*shift;
  point.z=from.z+(to.z-from.z)*travel;
  point.yaw=from.yaw;

  // One foot plants on the next tread before the other leaves its support.
  // Lift before crossing the lip uphill. Downhill, clear the front edge
  // before lowering the shoe and transferring weight to the lower tread.
  for (const side of ['left','right']) {
    const leading=side===lead;
    const start=leading ? .03 : .51;
    const end=leading ? .48 : .98;
    const travel=ease(start+.085,end-.085);
    const lift=ease(start,start+.085);
    const land=ease(end-.08,end);
    const rise=to.y-from.y;
    const y=from.y+rise*(descending ? land : lift)+(descending ? .029 : .038)*lift*(1-land);
    const z=from.z+(to.z-from.z)*travel;
    gait[side+'X']=0;
    gait[side+'Y']=(y-point.y)/scale;
    gait[side+'Z']=(descending ? z-point.z : point.z-z)/scale;
    gait[side+'Pitch']=(descending ? .09 : -.17)*lift*(1-land);
    gait[side+'Yaw']=0;
    gait[side+'Planted']=u<=start || u>=end;
  }
  gait.supportX=0;
  gait.supportZ=0;
  const effort=ease(0,.24)*(1-ease(.72,1));
  const transfer=ease(.23,.43)*(1-ease(.60,.96));
  pose.hipY=(descending ? -.032 : -.052)*transfer;
  pose.chestPitch=(descending ? .075 : .24)*effort;
  pose.headPitch=(descending ? .11 : -.14)*effort;
  pose.hairLag=-.046*effort;
  pose.tailAngle=.047*effort;
  pose.gazeRelaxation=.28*effort;
  pose.idleSuppress=.7*effort;
}

function createFishFloorDash(x,z,yaw) {
  const route=createFishRoute([[x,z],[x+.16,z+.032],[x+.42,z+.020],[x+.53,z+.013]]);
  const back={length:route.length,sample(distance,out){
    route.sample(route.length-distance,out);
    out.yaw+=Math.PI;
    return out;
  }};
  const startYaw=route.sample(0,{}).yaw;
  const end=route.sample(route.length,{});
  const faceStage=Math.atan2(Math.sin(yaw-startYaw-Math.PI),Math.cos(yaw-startYaw-Math.PI));
  return [
    createFishPivot(x,z,yaw,startYaw-yaw,.47),
    {route,pace:createFishPace(route,.75,[[0,0],[.34,1.42],[.63,1.38],[1,0]]),stepDistance:.11},
    createFishPivot(end.x,end.z,end.yaw,Math.PI,.64),
    {route:back,pace:createFishPace(back,1.13,[[0,0],[.24,1],[.75,1],[1,0]]),stepDistance:.083},
    createFishPivot(x,z,startYaw+Math.PI,faceStage,.64)
  ];
}

<script>
function createFishPeek() {
  const seconds = 1.9;
  const peakTime = 0.95; // Midpoint of constant plateau [0.80, 1.10]

  // Hermite smoothstep (zero derivatives at endpoints)
  function smoothstep(t) {
    const c = Math.max(0, Math.min(1, t));
    return c * c * (3 - 2 * c);
  }

  const recognitionEnd = 2.42;

  function sampleRecognition(time, pose) {
    pose.lipSmile = 0.60 * smoothstep((time - 0.72) / 0.27) *
      (1 - smoothstep((time - 1.65) / (recognitionEnd - 1.65)));
    pose.eyeSoftness = 0.15 * smoothstep((time - 0.78) / 0.29) *
      (1 - smoothstep((time - 1.60) / (recognitionEnd - 1.60)));
    const turn = smoothstep((time - 1.04) / 0.33) *
      (1 - smoothstep((time - 1.78) / (recognitionEnd - 1.78)));
    pose.headYaw = 0.18 * turn;
    pose.headRoll = -0.025 * turn;
    return pose;
  }

  return {
    seconds,
    peakTime,
    stepAt: 1.01,
    recognitionEnd,
    sampleRecognition,
    sample(time, pose) {
      const t = Math.max(0, Math.min(seconds, time));

      // Weight curve w(t): Smooth anticipation -> hold at 1.0 (0.80..1.10) -> smooth return
      let w = 0;
      let wLag = 0;

      if (t < 0.80) {
        w = smoothstep(t / 0.80);
        wLag = smoothstep(Math.max(0, t - 0.08) / 0.72);
      } else if (t <= 1.10) {
        w = 1.0;
        wLag = 1.0;
      } else {
        const u = (t - 1.10) / 0.80; // 0..1 over [1.10, 1.90]
        w = 1.0 - smoothstep(u);
        const uLag = Math.max(0, (t - 1.16)) / 0.74;
        wLag = 1.0 - smoothstep(uLag);
      }

      // Physics follow-through delta for hair and tail lag
      const lagDelta = w - wLag;

      sampleRecognition(t,pose);

      // Primary posture mutations
      // Body faces left (base yaw ~ -1.65), leaning forward into screen (+pitch),
      // rolling slightly toward camera/screen-left (+roll)
      pose.chestPitch = 0.51 * w;          // Lean forward +Z (screen-left)
      pose.chestRoll = 0.12 * w;           // Gentle tilt toward center

      // Head rotates back toward camera (+yaw), counter-pitches up (-pitch) to keep face upright
      pose.headPitch = -0.19 * w;          // Counter-pitch up keeping face readable
      pose.headYaw += 0.34 * w;            // Turn face toward camera (+X/front)
      pose.headRoll -= 0.08 * w;          // Counter-tilt for curious/chibi tilt

      // Lower center of mass onto planted feet
      pose.hipZ = 0.049 * w;
      pose.chestZ = 0.070 * w;
      pose.idleSuppress = w;
      pose.hipY = -0.028 * w;             // Slight sink into knees/feet

      // Secondary dynamic lag
      pose.hairLag = 0.22 * lagDelta;     // Responsive strand inertia
      pose.tailAngle = -0.13 * w + 0.12 * lagDelta; // Whale fluke tuck & follow-through

      // Look into the room as the head appears, then smile on meeting the viewer.
      pose.roomLook = smoothstep((t - 0.22) / 0.30) * (1 - smoothstep((t - 0.63) / 0.28));
      pose.focus = w;

      return pose;
    }
  };
}

function planFishPeek(THREE, route, camera, floorY) {
  const point = {}, projected = new THREE.Vector3();
  function leftEdge(points, distance) {
    route.sample(distance, point);
    const sin = Math.sin(point.yaw), cos = Math.cos(point.yaw);
    let minimum = Infinity;
    for (const [x,y,z] of points) {
      projected.set(point.x + x*cos + z*sin, floorY + y, point.z - x*sin + z*cos).project(camera);
      minimum = Math.min(minimum, projected.x);
    }
    return minimum;
  }
  const {neutral, head, lower, face} = fishPeekBounds;
  if (leftEdge(neutral,0)<1.012 || leftEdge(lower,0)<0.997) return null;
  let outside=0, inside=route.length*0.66;
  for(let step=0;step<16;step++) {
    const d=(outside+inside)*0.5;
    if(leftEdge(neutral,d)>1.009 && leftEdge(lower,d)>0.997) outside=d;
    else inside=d;
  }
  const distance=outside;
  const headEdge=leftEdge(head,distance);
  const faceEdge=leftEdge(face,distance);
  if(distance<0.045 || headEdge>0.969 || faceEdge>0.977)return null;
  return {distance,headEdge,faceEdge,neutralEdge:leftEdge(neutral,distance),lowerEdge:leftEdge(lower,distance)};
}

<script>
// Compile prepares programs, but Three still uploads the vertex and morph
// buffers on draw. Draw the parts on the same renderer before the visit.
async function warmFishDraw(THREE, renderer, asset, contactShadow, scene, camera, yieldPaint, canvasFormat) {
  const root = asset.root;
  // The same environment and lights make the warm draw reuse the programs
  // compiled for the real room. Layer 31 keeps the furniture out of the pass.
  const lights = [];
  scene.traverseVisible(object => {
    if (object.isLight && object.layers.test(camera.layers)) lights.push(object);
  });
  const warmCamera = new THREE.PerspectiveCamera(40, 1, .02, 4);
  warmCamera.position.set(0, 0, 1.55);
  warmCamera.lookAt(0, 0, 0);
  warmCamera.layers.set(31);
  const gl = renderer.getContext();
  if (gl.isContextLost()) return;
  // A single-sample draw warms shaders and buffers but can leave the
  // multisampled pipeline unprepared for the first frame on the canvas.
  const target = new THREE.WebGLRenderTarget(32, 32, {
    colorSpace: renderer.outputColorSpace,
    internalFormat: 'RGBA8',
    ...canvasFormat
  });
  target.isXRRenderTarget = true;
  const layers = [];
  function saveMesh(mesh) {
    layers.push({mesh, visible:mesh.visible, culled:mesh.frustumCulled, mask:mesh.layers.mask});
  }
  root.traverse(mesh => {
    if (mesh.isMesh) saveMesh(mesh);
  });
  saveMesh(contactShadow);
  const body = asset.bodyRig.body;
  const base = layers.filter(entry => entry.mesh === body);
  const accessories = layers.filter(entry => entry.mesh !== body && entry.visible);
  const hidden = layers.filter(entry => entry.mesh !== body && !entry.visible);
  try {
    for (const batch of [base, accessories, hidden]) {
      if (!batch.length) continue;
      await yieldPaint();
      if (renderer.getContext().isContextLost()) return;
      const previous = renderer.getRenderTarget();
      const shadowUpdate = renderer.shadowMap.needsUpdate;
      const lightMasks = lights.map(light => light.layers.mask);
      scene.add(root);
      try {
        for (const light of lights) light.layers.enable(31);
        for (const entry of batch) {
          entry.mesh.layers.set(31);
          entry.mesh.visible = true;
          entry.mesh.frustumCulled = false;
        }
        renderer.shadowMap.needsUpdate = false;
        renderer.setRenderTarget(target);
        renderer.render(scene, warmCamera);
      } finally {
        scene.remove(root);
        lights.forEach((light,index) => { light.layers.mask = lightMasks[index]; });
        renderer.setRenderTarget(previous);
        renderer.shadowMap.needsUpdate = shadowUpdate;
        for (const entry of batch) {
          entry.mesh.layers.mask = entry.mask;
          entry.mesh.visible = entry.visible;
          entry.mesh.frustumCulled = entry.culled;
        }
      }
    }
  } finally {
    target.dispose();
  }
}
