<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>香篆 · 茶席静坐</title>
<style>
  :root {
    --c-paper: #e6dfd3;
    --c-muted: rgba(230, 223, 211, 0.56);
    --c-faint: rgba(230, 223, 211, 0.16);
    --c-seal: #9b291e;
    --c-gold: #cba15c;
    --font-serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Kaiti SC", "STKaiti", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0d0b09;
    color: var(--c-paper);
    font-family: var(--font-serif);
  }

  #webgl-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: grab;
  }
  #webgl-container:active {
    cursor: grabbing;
  }

  /* 电影级光学暗角与上下柔化衬底，确保纸墨文字在任何亮窗背景下清晰可读 */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 52% 48%, rgba(12, 10, 8, 0) 48%, rgba(10, 8, 6, 0.36) 80%, rgba(6, 5, 4, 0.78) 100%),
      linear-gradient(to bottom, rgba(8, 7, 6, 0.62) 0%, rgba(8, 7, 6, 0.16) 14%, rgba(8, 7, 6, 0) 30%, rgba(8, 7, 6, 0) 74%, rgba(7, 6, 5, 0.78) 100%);
  }

  /* 微妙胶片颗粒质感层 */
  #film-grain {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.032;
    mix-blend-mode: overlay;
    background-size: 160px 160px;
  }

  /* 开场黑场淡入 */
  #curtain {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #090806;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #curtain.fade-out {
    opacity: 0;
  }

  /* 极简纸墨风 HUD */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    padding: 44px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 1.3s cubic-bezier(0.16, 1, 0.3, 1), transform 1.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #hud.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  /* 左上：朱红小印章「香」+ 竖排「茶烟」「修身养性」 */
  .brand-col {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 16px;
    padding: 10px 16px 14px 10px;
    border-radius: 2px;
    background: radial-gradient(ellipse at 20% 25%, rgba(12, 10, 8, 0.42) 0%, rgba(12, 10, 8, 0) 80%);
  }

  .seal {
    width: 24px;
    height: 24px;
    border: 1px solid rgba(186, 56, 42, 0.85);
    background: rgba(155, 41, 30, 0.24);
    color: #e66b5b;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 6px rgba(155, 41, 30, 0.35), 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .vertical-inscription {
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.34em;
    font-size: 12px;
    color: var(--c-muted);
    line-height: 2.05;
    height: 126px;
    border-left: 1px solid var(--c-faint);
    padding-left: 12px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }
  .vertical-inscription strong {
    color: var(--c-paper);
    font-weight: 400;
  }

  /* HUD 整体不拦截拖拽，但按钮必须可点 */
  .view-btn, .action-link {
    pointer-events: auto;
  }

  /* 右上：三机位切换「茶席」「香篆」「书画」 */
  .view-switcher {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 8px 18px;
    background: rgba(12, 10, 8, 0.38);
    border: 1px solid rgba(230, 223, 211, 0.08);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .view-label-prefix {
    color: rgba(230, 223, 211, 0.36);
    font-size: 11px;
    letter-spacing: 0.22em;
    margin-right: -6px;
  }

  .view-btn {
    background: none;
    border: none;
    color: var(--c-muted);
    font-family: var(--font-serif);
    font-size: 13px;
    letter-spacing: 0.26em;
    cursor: pointer;
    padding: 6px 0;
    position: relative;
    transition: color 0.35s ease;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
  }
  .view-btn:hover {
    color: var(--c-paper);
  }
  .view-btn.active {
    color: var(--c-paper);
  }
  .view-btn::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0.26em;
    bottom: 0;
    height: 1.5px;
    background: var(--c-gold);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .view-btn.active::after {
    transform: scaleX(1);
  }

  /* 底部区域 */
  .hud-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
  }

  /* 左下：状态与进度线 */
  .status-block {
    display: flex;
    flex-direction: column;
    gap: 11px;
    min-width: 268px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }

  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--c-muted);
  }

  #status-label {
    color: var(--c-paper);
  }

  #progress-num {
    font-family: var(--font-serif);
    font-size: 11px;
    letter-spacing: 0.16em;
    font-variant-numeric: tabular-nums;
    color: rgba(230, 223, 211, 0.52);
  }

  .incense-ruler {
    position: relative;
    width: 268px;
    height: 1px;
    background: rgba(230, 223, 211, 0.18);
  }
  .incense-ruler::before,
  .incense-ruler::after {
    content: "";
    position: absolute;
    top: -2px;
    width: 1px;
    height: 5px;
    background: rgba(230, 223, 211, 0.28);
  }
  .incense-ruler::before { left: 0; }
  .incense-ruler::after { right: 0; }

  #progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 1px;
    width: 0%;
    background: linear-gradient(90deg, rgba(230, 223, 211, 0.28) 0%, rgba(218, 132, 68, 0.92) 100%);
    transition: width 0.35s linear;
  }

  #progress-ember {
    position: absolute;
    top: -1.5px;
    left: 0%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff692e;
    box-shadow: 0 0 8px 2px rgba(255, 94, 32, 0.88);
    transform: translateX(-50%);
    transition: left 0.35s linear;
  }

  .drag-hint {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: rgba(230, 223, 211, 0.36);
    margin-top: 2px;
  }

  /* 右下：大号倒计时 + 屏幕名称 display + 延后/提前结束 */
  .timer-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
  }

  .timer-caption {
    font-size: 11px;
    letter-spacing: 0.26em;
    color: var(--c-muted);
    margin-right: -0.26em;
  }

  #countdown {
    font-family: "Optima", "Baskerville", "Didot", "Songti SC", serif;
    font-weight: 300;
    font-size: clamp(48px, 5.2vw, 74px);
    line-height: 0.95;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--c-paper);
    margin-right: -0.08em;
  }

  #display-name {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(230, 223, 211, 0.42);
    margin-top: -2px;
    min-height: 15px;
  }

  .actions-bar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 10px;
    border-top: 1px solid var(--c-faint);
    transition: opacity 0.4s ease;
  }
  .actions-bar.hidden {
    display: none;
  }

  .action-link {
    background: none;
    border: none;
    color: var(--c-muted);
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 2px 0 4px 0;
    border-bottom: 1px solid rgba(230, 223, 211, 0.24);
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .action-link:hover {
    color: var(--c-paper);
    border-bottom-color: rgba(230, 223, 211, 0.82);
  }
  .action-link.hidden {
    display: none;
  }

  .esc-hint {
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(230, 223, 211, 0.34);
  }
  .esc-hint.hidden {
    display: none;
  }

  #forced-note {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: rgba(230, 223, 211, 0.56);
    padding-top: 8px;
    border-top: 1px solid var(--c-faint);
    display: none;
  }
  #forced-note.visible {
    display: block;
  }

  @media (max-width: 820px) {
    #hud {
      padding: 26px 24px;
    }
    .vertical-inscription {
      height: 108px;
      font-size: 11px;
    }
    .incense-ruler {
      width: 190px;
    }
    .status-block {
      min-width: 190px;
    }
    .view-switcher {
      gap: 16px;
      padding: 6px 12px;
    }
  }
</style>
</head>
<body>

<div id="webgl-container"></div>
<div id="vignette"></div>
<div id="film-grain"></div>
<div id="curtain"></div>

<div id="hud">
  <header class="hud-top">
    <div class="brand-col">
      <div class="seal">香</div>
      <div class="vertical-inscription">
        <strong>茶烟</strong><br>
        修身养性
      </div>
    </div>

    <nav class="view-switcher" aria-label="视角切换">
      <span class="view-label-prefix">观境</span>
      <button class="view-btn active" data-view="front" type="button">茶席</button>
      <button class="view-btn" data-view="close" type="button">香篆</button>
      <button class="view-btn" data-view="scroll" type="button">书画</button>
    </nav>
  </header>

  <footer class="hud-bottom">
    <div class="status-block">
      <div class="status-row">
        <span id="status-label">一炷香 · 静坐</span>
        <span id="progress-num">已燃 0% · 茶烟未散</span>
      </div>
      <div class="incense-ruler">
        <div id="progress-fill"></div>
        <div id="progress-ember"></div>
      </div>
      <div class="drag-hint" id="drag-hint">拖动环视 · 1/2/3 切换视角 · ESC 结束</div>
    </div>

    <div class="timer-cluster">
      <div class="timer-caption" id="timer-caption">清坐余晷</div>
      <div id="countdown">05:00</div>
      <div id="display-name">Built-in Retina Display</div>
      <div class="actions-bar" id="actions-bar">
        <button class="action-link" id="btn-postpone" type="button">延后五分</button>
        <button class="action-link" id="btn-skip" type="button">提前结束</button>
        <span class="esc-hint" id="esc-hint">ESC 结束</span>
      </div>
      <div id="forced-note">这炷香，要燃尽。</div>
    </div>
  </footer>
</div>

<script>
(function() {
  'use strict';

  // ============================================================================
  // 0. 宿主通信与全局状态契约（严格保留，display 为屏幕名称，倒计时由 remainingMs 计算）
  // ============================================================================
  function emitHost(msg) {
    if (window.nsh && typeof window.nsh.postMessage === 'function') {
      try {
        window.nsh.postMessage(msg);
      } catch (err) {
        console.log('[nsh]', msg);
      }
    } else {
      console.log('[nsh]', msg);
    }
  }

  const appState = {
    remainingMs: 300000,
    totalMs: 300000,
    progress: 0.0,
    targetProgress: 0.0,
    canPostpone: true,
    canSkip: true,
    forced: false,
    label: '一炷香 · 静坐',
    display: '',
    hostControlled: false
  };

  const dom = {
    curtain: document.getElementById('curtain'),
    hud: document.getElementById('hud'),
    filmGrain: document.getElementById('film-grain'),
    statusLabel: document.getElementById('status-label'),
    progressNum: document.getElementById('progress-num'),
    progressFill: document.getElementById('progress-fill'),
    progressEmber: document.getElementById('progress-ember'),
    countdown: document.getElementById('countdown'),
    displayName: document.getElementById('display-name'),
    timerCaption: document.getElementById('timer-caption'),
    actionsBar: document.getElementById('actions-bar'),
    btnPostpone: document.getElementById('btn-postpone'),
    btnSkip: document.getElementById('btn-skip'),
    escHint: document.getElementById('esc-hint'),
    dragHint: document.getElementById('drag-hint'),
    forcedNote: document.getElementById('forced-note'),
    viewBtns: Array.from(document.querySelectorAll('.view-btn'))
  };

  function formatMMSS(ms) {
    const totalSec = Math.max(0, Math.ceil((Number(ms) || 0) / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderHUD() {
    const pct = Math.max(0, Math.min(1, appState.targetProgress));
    const pctInt = Math.round(pct * 100);

    dom.statusLabel.textContent = appState.label || '一炷香 · 静坐';
    dom.progressNum.textContent = '已燃 ' + pctInt + '% · ' + (pctInt >= 99 ? '香尽茶温' : '茶烟未散');
    dom.progressFill.style.width = (pct * 100).toFixed(2) + '%';
    dom.progressEmber.style.left = (pct * 100).toFixed(2) + '%';

    // 倒计时永远从 remainingMs 计算，绝不把 display 当时间
    dom.countdown.textContent = formatMMSS(appState.remainingMs);
    dom.displayName.textContent = appState.display ? appState.display : '';
    dom.displayName.style.display = appState.display ? 'block' : 'none';

    const showPostpone = !appState.forced && appState.canPostpone !== false;
    const showSkip = !appState.forced && appState.canSkip !== false;

    dom.btnPostpone.classList.toggle('hidden', !showPostpone);
    dom.btnSkip.classList.toggle('hidden', !showSkip);
    dom.escHint.classList.toggle('hidden', !showSkip);
    dom.actionsBar.classList.toggle('hidden', appState.forced || (!showPostpone && !showSkip));
    dom.forcedNote.classList.toggle('visible', !!appState.forced);
    dom.dragHint.textContent = showSkip
      ? '拖动环视 · 1/2/3 切换视角 · ESC 结束'
      : '拖动环视 · 1/2/3 切换视角';
  }

  window.shrineState = function(s) {
    if (!s || typeof s !== 'object') return;
    appState.hostControlled = true;

    if (typeof s.totalMs === 'number' && s.totalMs > 0) {
      appState.totalMs = s.totalMs;
    }
    if (typeof s.remainingMs === 'number') {
      appState.remainingMs = Math.max(0, s.remainingMs);
    }

    if (typeof s.progress === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, s.progress));
    } else if (appState.totalMs > 0 && typeof s.remainingMs === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, 1 - appState.remainingMs / appState.totalMs));
    }

    if (typeof s.canPostpone === 'boolean') appState.canPostpone = s.canPostpone;
    if (typeof s.canSkip === 'boolean') appState.canSkip = s.canSkip;
    if (typeof s.forced === 'boolean') appState.forced = s.forced;
    if (typeof s.label === 'string' && s.label.trim()) appState.label = s.label.trim();
    if (typeof s.display === 'string') appState.display = s.display.trim();

    renderHUD();
  };

  window.addEventListener('message', function(e) {
    try {
      const payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (!payload || typeof payload !== 'object') return;
      if (payload.type === 'state' && payload.state) {
        window.shrineState(payload.state);
      } else if (payload.type === 'view' && payload.view) {
        window.shrineView(payload.view, true);
      } else {
        if ('remainingMs' in payload || 'progress' in payload || 'forced' in payload || 'display' in payload) {
          window.shrineState(payload);
        }
        if (typeof payload.view === 'string') {
          window.shrineView(payload.view, true);
        }
      }
    } catch (_) {}
  });

  // 生成微妙胶片噪点背景
  (function initFilmGrain() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.floor(Math.random() * 255);
      img.data[i] = v;
      img.data[i + 1] = v;
      img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    dom.filmGrain.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

  // 墙上挂轴彩蛋：每次休息随机抽一条格言，随机挂位/倾斜/题款/朱印
  const SCROLL_LINES = [
    ['心安即归处', '焚香默坐', '清心'],
    ['得失随缘', '清心居静坐题', '自在'],
    ['事去则空', '一炷香里', '无事'],
    ['静水流深', '闲居偶得', '守拙'],
    ['一念放下', '茶烟未散', '放下'],
    ['万般自在', '清心居', '自在'],
    ['行到水穷处', '坐看云起', '云起'],
    ['坐看云起时', '山居偶题', '看云'],
    ['不乱于心', '静坐', '心安'],
    ['不困于情', '焚香', '忘情'],
    ['大道至简', '清心居', '至简'],
    ['顺其自然', '闲居', '自然'],
    ['随遇而安', '一炷香', '随缘'],
    ['人生如逆旅', '夜坐', '行人'],
    ['我亦是行人', '清心居', '过客'],
    ['世事一场大梦', '闲居偶记', '如梦'],
    ['人生几度秋凉', '秋夜焚香', '秋凉'],
    ['心远地自偏', '山居', '心远'],
    ['此中有真意', '静坐', '真意'],
    ['欲辨已忘言', '忘言', '忘言'],
    ['山高水长', '清心居', '山高'],
    ['清风徐来', '水波不兴', '清风'],
    ['知足者富', '闲居', '知足'],
    ['强行者有志', '自勉', '有志'],
    ['不念过往', '不畏将来', '当下'],
    ['一念心清净', '莲花处处开', '清净']
  ];
  const scrollPick = SCROLL_LINES[(Math.random() * SCROLL_LINES.length) | 0];
  const scrollChars = Array.from(scrollPick[0]);
  const scrollInscription = scrollPick[1];
  const scrollSealChars = Array.from(scrollPick[2]);
  const scrollHangX = -0.6 + Math.random() * 1.2;
  const scrollHangY = 1.36 + Math.random() * 0.16;
  const scrollHangTilt = (Math.random() - 0.5) * 0.022;

  // ============================================================================
  // 1. WebGLRenderer、Scene、Camera 与 PMREM 真实环境反射初始化
  // ============================================================================
  const container = document.getElementById('webgl-container');
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.34;
  if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) {
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  }
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14110e);
  scene.fog = new THREE.FogExp2(0x16130f, 0.042);

  // 50mm 标准电影定焦镜头感（垂直 FOV 约 31 度）
  const camera = new THREE.PerspectiveCamera(31, window.innerWidth / window.innerHeight, 0.05, 35);

  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  function createSeededRandom(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function() {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function makeCanvasTexture(w, h, drawFn, opts) {
    const options = opts || {};
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    drawFn(ctx, w, h);
    const tex = new THREE.CanvasTexture(c);
    if (options.repeatX || options.repeatY) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(options.repeatX || 1, options.repeatY || 1);
    }
    if (options.srgb && 'colorSpace' in tex && THREE.SRGBColorSpace) {
      tex.colorSpace = THREE.SRGBColorSpace;
    }
    tex.anisotropy = maxAniso;
    tex.needsUpdate = true;
    return tex;
  }

  // 构建程序化全景环境贴图（左侧清冷障子窗晨光 + 右侧温暖土墙漫反射），供青瓷、青铜、茶汤高光反射
  function buildStudioEnvironment() {
    const envTex = makeCanvasTexture(1024, 512, (ctx, w, h) => {
      // 室内京都土墙基底渐变
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0.0, '#17130f');
      bg.addColorStop(0.45, '#30271f');
      bg.addColorStop(0.55, '#241c15');
      bg.addColorStop(1.0, '#0f0b08');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // 左侧障子窗大面积清冷晨光高光带（给青瓷与铜炉提供逼真的窗格眼神光）
      const winX = w * 0.16;
      const winY = h * 0.22;
      const winW = w * 0.22;
      const winH = h * 0.44;

      const winGlow = ctx.createRadialGradient(
        winX + winW * 0.5, winY + winH * 0.5, 10,
        winX + winW * 0.5, winY + winH * 0.5, winW * 0.95
      );
      winGlow.addColorStop(0.0, 'rgba(235, 244, 255, 0.95)');
      winGlow.addColorStop(0.5, 'rgba(188, 210, 232, 0.55)');
      winGlow.addColorStop(1.0, 'rgba(60, 75, 92, 0.0)');
      ctx.fillStyle = winGlow;
      ctx.fillRect(0, 0, w * 0.5, h);

      ctx.fillStyle = '#e8f1fa';
      ctx.fillRect(winX, winY, winW, winH);

      // 反射中的障子木格暗线
      ctx.fillStyle = '#2d2219';
      for (let i = 0; i <= 4; i++) {
        ctx.fillRect(winX + (winW / 4) * i - 2, winY, 4, winH);
      }
      for (let j = 0; j <= 5; j++) {
        ctx.fillRect(winX, winY + (winH / 5) * j - 2, winW, 4);
      }

      // 右侧室内暖色漫反射柔光
      const warmBounce = ctx.createRadialGradient(w * 0.72, h * 0.46, 10, w * 0.72, h * 0.46, w * 0.28);
      warmBounce.addColorStop(0.0, 'rgba(255, 198, 138, 0.65)');
      warmBounce.addColorStop(0.5, 'rgba(196, 136, 82, 0.25)');
      warmBounce.addColorStop(1.0, 'rgba(40, 28, 18, 0.0)');
      ctx.fillStyle = warmBounce;
      ctx.fillRect(w * 0.4, 0, w * 0.6, h);
    }, { srgb: true });

    envTex.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envRT = pmrem.fromEquirectangular(envTex);
    scene.environment = envRT.texture;
    envTex.dispose();
    pmrem.dispose();
  }

  buildStudioEnvironment();

        mGrad.addColorStop(0.65, `rgba(52, 49, 44, ${alpha * 0.45})`);
        mGrad.addColorStop(1.0, 'rgba(216, 204, 184, 0.0)');
        ctx.fillStyle = mGrad;
        ctx.beginPath();
        ctx.moveTo(padX, baseY + 120);
        for (let x = padX; x <= padX + innerW; x += 16) {
          const nx = (x - padX) / innerW;
          const hCurve = Math.sin(nx * Math.PI) * peakH * (0.6 + 0.4 * Math.sin(nx * 5.5 + seedOffset))
            + Math.cos(nx * 13.0 + seedOffset) * 18;
          ctx.lineTo(x, baseY - Math.max(0, hCurve));
        }
        ctx.lineTo(padX + innerW, baseY + 120);
        ctx.closePath();
        ctx.fill();
      };

      drawMistyMountain(padTop + innerH * 0.72, 240, 0.22, 1.1);
      drawMistyMountain(padTop + innerH * 0.82, 190, 0.34, 3.4);

      // 水墨写意墨竹（画面左下部斜出，留白疏朗）
      const drawBambooStalk = (x0, y0, angle, segLen, segs, startW) => {
        let cx = x0;
        let cy = y0;
        for (let s = 0; s < segs; s++) {
          const nx = cx + Math.sin(angle) * segLen;
          const ny = cy - Math.cos(angle) * segLen;
          ctx.strokeStyle = `rgba(28, 26, 24, ${0.72 - s * 0.06})`;
          ctx.lineWidth = Math.max(2.5, startW - s * 1.1);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(nx, ny);
          ctx.stroke();

          // 竹节抱节墨线
          ctx.strokeStyle = 'rgba(18, 16, 15, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(nx - 7, ny);
          ctx.lineTo(nx + 7, ny);
          ctx.stroke();

          cx = nx + Math.sin(angle) * 4;
          cy = ny - Math.cos(angle) * 4;
          angle += 0.035;
        }
      };

      drawBambooStalk(padX + 140, padTop + innerH - 30, 0.22, 128, 6, 9.5);
      drawBambooStalk(padX + 95, padTop + innerH - 10, 0.34, 105, 5, 6.5);

      // 浓淡相间撇竹叶
      const drawInkLeaf = (lx, ly, ang, len, wid, opacity) => {
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(ang);
        ctx.fillStyle = `rgba(24, 22, 20, ${opacity})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
        ctx.quadraticCurveTo(len * 0.45, wid * 0.65, 0, 0);
        ctx.fill();
        ctx.restore();
      };

      const leafNodes = [
        [padX + 260, padTop + innerH - 420, 0.82],
        [padX + 310, padTop + innerH - 560, 0.68],
        [padX + 355, padTop + innerH - 680, 0.78],
        [padX + 220, padTop + innerH - 310, 0.55]
      ];
      leafNodes.forEach(([nx, ny, op]) => {
        drawInkLeaf(nx, ny, 0.35, 92, 13, op);
        drawInkLeaf(nx, ny, 0.68, 108, 14, op * 0.9);
        drawInkLeaf(nx, ny, 1.05, 78, 11, op * 0.75);
        drawInkLeaf(nx - 14, ny + 12, -2.35, 74, 10, op * 0.6);
      });

      // 右上主书法：本次随机格言竖排（楷行兼备笔意）
      ctx.fillStyle = '#1d1b18';
      ctx.font = '500 106px "Kaiti SC", "STKaiti", "Songti SC", "STSong", "Noto Serif CJK SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const chars = scrollChars;
      const charX = padX + innerW * 0.68;
      const charStartY = padTop + 210;
      const charGap = chars.length > 6 ? 132 : 152;

      chars.forEach((ch, idx) => {
        ctx.save();
        ctx.translate(charX + (idx % 2 === 0 ? -3 : 4), charStartY + idx * charGap);
        ctx.rotate((idx - 1.5) * 0.015);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });

      const textBottom = charStartY + (chars.length - 1) * charGap;

      // 题款小字（随机）
      ctx.fillStyle = 'rgba(36, 33, 29, 0.78)';
      ctx.font = '32px "Kaiti SC", "STKaiti", "Songti SC", serif';
      const insc = scrollInscription;
      for (let i = 0; i < insc.length; i++) {
        ctx.fillText(insc[i], padX + innerW * 0.50, textBottom + 80 + i * 44);
      }

      // 两枚朱红印章（白文 + 朱文，随机识文）
      const sealX = padX + innerW * 0.50 - 22;
      const sealY1 = textBottom + 120 + insc.length * 44;
      ctx.fillStyle = '#9e281d';
      ctx.fillRect(sealX, sealY1, 44, 44);
      ctx.fillStyle = '#dfd5c3';
      ctx.font = '22px "Songti SC", serif';
      ctx.fillText(scrollSealChars[0], sealX + 22, sealY1 + 14);
      ctx.fillText(scrollSealChars[1], sealX + 22, sealY1 + 33);

      const sealY2 = sealY1 + 58;
      ctx.strokeStyle = '#9e281d';
      ctx.lineWidth = 3;
      ctx.strokeRect(sealX + 2, sealY2, 40, 40);
      ctx.fillStyle = '#9e281d';
      ctx.font = '20px "Songti SC", serif';
      ctx.fillText(scrollSealChars[0], sealX + 22, sealY2 + 21);

      ctx.restore();
    }, { srgb: true });

    // 2.11 亚麻茶巾编织纹理
    textures.teaCloth = makeCanvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#4c463d';
      ctx.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 2) {
        ctx.fillStyle = y % 4 === 0 ? 'rgba(92, 85, 74, 0.35)' : 'rgba(42, 38, 32, 0.35)';
        ctx.fillRect(0, y, w, 1);
      }
      for (let x = 0; x < w; x += 2) {
        ctx.fillStyle = x % 4 === 0 ? 'rgba(88, 80, 70, 0.28)' : 'rgba(38, 34, 28, 0.28)';
        ctx.fillRect(x, 0, 1, h);
      }
    }, { repeatX: 3, repeatY: 3, srgb: true });

    // 2.12 柔和径向辉光与底部接触阴影贴图
    textures.radialGlow = makeCanvasTexture(128, 128, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, w * 0.5);
      g.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      g.addColorStop(0.22, 'rgba(255, 232, 200, 0.55)');
      g.addColorStop(0.55, 'rgba(255, 180, 120, 0.14)');
      g.addColorStop(1.0, 'rgba(255, 140, 80, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });

    textures.contactShadow = makeCanvasTexture(128, 128, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, w * 0.5);
      g.addColorStop(0.0, 'rgba(5, 3, 2, 0.85)');
      g.addColorStop(0.45, 'rgba(8, 5, 3, 0.52)');
      g.addColorStop(0.78, 'rgba(10, 7, 4, 0.14)');
      g.addColorStop(1.0, 'rgba(10, 7, 4, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
  }

    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({
        map: textures.contactShadow,
        transparent: true,
        opacity: opacity !== undefined ? opacity : 0.72,
        depthWrite: false
      })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y, z);
    m.scale.set(scaleX, scaleZ, 1);
    parent.add(m);
    return m;
  }

  // 炉内真实香灰床（高分段顶点起伏 + 中心插香微凹压痕）
  const ashRadius = 0.0695;

  // CircleGeometry 默认只有外圈顶点，我们改用 PlaneGeometry 极坐标映射或细分网格以获得细腻内部起伏
  const ashBedGeo = new THREE.RingGeometry(0.0001, ashRadius, 64, 18);
  ashBedGeo.rotateX(-Math.PI / 2);
  const ashPos = ashBedGeo.attributes.position;
  for (let i = 0; i < ashPos.count; i++) {
    const vx = ashPos.getX(i);
    const vz = ashPos.getZ(i);
    const dist = Math.sqrt(vx * vx + vz * vz);
    const normR = dist / ashRadius;
    // 整体微隆，插香根部有一圈极小的自然堆积与微凹
    const dome = Math.cos(normR * Math.PI * 0.5) * 0.0055;
    const ripples = Math.sin(dist * 210.0) * 0.00045 + Math.sin(vx * 95.0 + vz * 110.0) * 0.0006;
    const rootIndent = -Math.exp(-dist * dist * 18000.0) * 0.0018;
    ashPos.setY(i, dome + ripples + rootIndent);

  // --- 5.1 照片级真实线香（直径 2.4mm、米棕香粉颗粒质感、轻微自然弯曲、顶端炭化+火头+微卷白灰） ---

  const stickRadius = 0.00125; // 直径 2.5mm
  const stickGeo = new THREE.CylinderGeometry(stickRadius * 0.96, stickRadius, 1.0, 20, 32);
  stickGeo.translate(0, 0.5, 0);

    const organicBendX = Math.sin(py * Math.PI) * 0.0011;

  incenseAnchor.updateMatrixWorld(true);

  // 1) 炭化黑段与极细暗红过渡圈 + 几毫米橙红余烬火头（一体式高精度着色器，拒绝大光球）
  const emberTipUniforms = {
    uTime: { value: 0 },

  };

  const emberTipGeo = new THREE.CylinderGeometry(stickRadius * 0.88, stickRadius * 0.97, 0.0058, 24, 16);
  emberTipGeo.translate(0, 0.0029, 0);

    uniforms: emberTipUniforms,
    vertexShader: `
      varying vec3 vPos;
      varying vec3 vNormal;
      void main() {
        vPos = position;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uPulse;
      varying vec3 vPos;
      varying vec3 vNormal;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        // h: 0.0(下方与香体交界) -> 1.0(上方与白灰交界)
        float h = clamp(vPos.y / 0.0058, 0.0, 1.0);
        float angle = atan(vPos.z, vPos.x);
        float grain = hash(vec2(floor(angle * 18.0), floor(h * 32.0)));
        float wave = sin(angle * 5.0 + uTime * 1.8) * 0.03;

        // 下部 0.0~0.42 为焦黑炭化段，中部 0.42~0.56 为极细暗红环，上部 0.56~0.96 为炽热橙红火头
        vec3 rawWood = vec3(0.42, 0.32, 0.22);
        vec3 blackChar = vec3(0.06, 0.05, 0.045);
        vec3 darkCrimson = vec3(0.48, 0.05, 0.01);
        vec3 glowingEmber = vec3(1.85, 0.44, 0.06) * uPulse;
        vec3 hotCore = vec3(2.60, 1.05, 0.30) * uPulse;

        float charMask = smoothstep(0.0, 0.16, h);
        float redRingMask = smoothstep(0.36 + wave, 0.56 + wave, h);
        float hotZoneMask = smoothstep(0.54 + wave, 0.82 + wave, h) * (1.0 - smoothstep(0.90, 1.0, h));

        vec3 col = mix(rawWood, blackChar, charMask);
        col = mix(col, darkCrimson, redRingMask);
        col = mix(col, glowingEmber, hotZoneMask * (0.82 + 0.18 * grain));
        col = mix(col, hotCore, pow(hotZoneMask, 2.6) * (0.65 + 0.35 * grain));

        // 表面细微灰斑覆盖在火头表面（真实线香火头表面的薄灰壳感）
        float ashFleck = smoothstep(0.74, 0.92, grain) * smoothstep(0.60, 0.85, h);
        col = mix(col, vec3(0.35, 0.32, 0.30), ashFleck * 0.55);

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const emberTipMesh = new THREE.Mesh(emberTipGeo, emberTipMat);
  burningTipGroup.add(emberTipMesh);

  // 2) 火头最顶端极小、轻微卷曲的灰白余灰帽（约 2.6mm 高）
  const ashCapGeo = new THREE.CylinderGeometry(stickRadius * 0.68, stickRadius * 0.86, 0.0028, 20, 10);

  const acPos = ashCapGeo.attributes.position;

    const py = acPos.getY(i);
    const ratio = py / 0.0028;
    const curlX = ratio * ratio * 0.00055;
    const curlZ = ratio * ratio * -0.00025;
    acPos.setX(i, acPos.getX(i) + curlX);
    acPos.setZ(i, acPos.getZ(i) + curlZ);

  ashCapGeo.computeVertexNormals();

  const emberMicroGlow = new THREE.Sprite(

  );
  emberMicroGlow.position.set(0, 0.0044, 0);
  emberMicroGlow.scale.set(0.020, 0.020, 1);
  burningTipGroup.add(emberMicroGlow);

  // 余烬微弱近场点光源（仅轻微照亮青烟根部与炉口边缘）
  const emberPointLight = new THREE.PointLight(0xff5b1f, 0.65, 0.60, 2.0);
  emberPointLight.position.set(0, 0.005, 0);
  burningTipGroup.add(emberPointLight);

  // ============================================================================
  // 6. 照片级真实蓝灰色线香青烟（底部极细垂直层流 -> 向上渐宽卷曲 -> 被冷白窗光照亮消散）
  // ============================================================================
  const smokeUniforms = {
    uTime: { value: 0 },
    uOrigin: { value: stickTipWorld.clone().add(new THREE.Vector3(0, 0.004, 0)) },
    uEmberPulse: { value: 1.0 }
  };

  const smokeVertexShader = `
    uniform float uTime;
    uniform vec3 uOrigin;
    attribute float aLayer;

    varying vec2 vUv;
    varying float vHeight;
    varying float vLayer;

    float hash11(float p) {
      p = fract(p * 0.1031);
      p *= p + 33.33;
      p *= p + p;
      return fract(p);
    }

    float noise2D(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float n = i.x + i.y * 57.0;
      return mix(
        mix(hash11(n + 0.0), hash11(n + 1.0), f.x),
        mix(hash11(n + 57.0), hash11(n + 58.0), f.x),
        f.y
      );
    }

    void main() {
      vUv = uv;
      vLayer = aLayer;

      float h = uv.y; // 0(香头火头) -> 1(高处消散)
      vHeight = h;

      float plumeHeight = 1.28;
      float yOffset = h * plumeHeight;

      // 物理层流与湍流过渡：底部 0~0.20 几乎垂直上升，随后向右侧缓慢漂移并产生涡旋卷曲
      float curlStart = smoothstep(0.04, 0.26, h);
      float curlAmp = smoothstep(0.06, 0.90, h);
      float t = uTime * 0.38 + aLayer * 1.047;

      // 受左侧窗户微弱冷空气对流影响，整柱缓慢摆荡并向右后方漂移
      float swayX = sin(uTime * 0.52 + h * 3.1) * pow(h, 1.25) * 0.050;
      float swayZ = cos(uTime * 0.43 + h * 2.4) * pow(h, 1.30) * 0.032;
      float driftX = pow(h, 1.55) * 0.09 + sin(uTime * 0.19) * pow(h, 1.8) * 0.05 + swayX;
      float driftZ = pow(h, 1.60) * -0.045 + swayZ;

      float n1 = noise2D(vec2(h * 4.6 - uTime * 0.45, aLayer * 2.1 + uTime * 0.10)) * 2.0 - 1.0;
      float n2 = noise2D(vec2(h * 10.2 - uTime * 0.78, aLayer * 4.7 - uTime * 0.18)) * 2.0 - 1.0;

      float swirlX = (sin(h * 8.5 - t * 2.2) * 0.045 + sin(h * 17.0 - t * 3.5 + aLayer) * 0.020 + n1 * 0.050) * curlStart * curlAmp;
      float swirlZ = (cos(h * 7.8 - t * 2.0 + aLayer) * 0.040 + cos(h * 15.5 - t * 3.1) * 0.018 + n2 * 0.045) * curlStart * curlAmp;

      // 香头几厘米的极细抖动，避免从火点起就是一条直线
      float microX = sin(h * 46.0 - uTime * 1.9 + aLayer) * 0.0024 * smoothstep(0.0, 0.10, h);
      float microZ = cos(h * 41.0 - uTime * 1.6) * 0.0018 * smoothstep(0.0, 0.10, h);
      swirlX += microX;
      swirlZ += microZ;

      // 宽度包络：火头起始处极细（半宽约 1.4mm），向上自然扩散成轻柔云缕
      float halfWidth = mix(0.0042, 0.082, pow(h, 1.45)) * (1.0 + 0.16 * sin(h * 11.0 - uTime * 0.9 + aLayer));

      float angle = aLayer * 0.785398 + h * 2.4 + sin(uTime * 0.24 + h * 3.5) * 0.4;
      vec3 sideVec = vec3(cos(angle), 0.0, sin(angle));

      float centeredX = (uv.x - 0.5) * 2.0;
      vec3 spinePos = uOrigin + vec3(driftX + swirlX, yOffset, driftZ + swirlZ);
      vec3 worldPos = spinePos + sideVec * (centeredX * halfWidth);

      gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
    }
  `;

  const smokeFragmentShader = `
    uniform float uTime;
    uniform float uEmberPulse;

    varying vec2 vUv;
    varying float vHeight;
    varying float vLayer;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float amp = 0.5;
      mat2 rot = mat2(0.8, -0.6, 0.6, 0.8);
      for (int i = 0; i < 4; i++) {
        v += amp * vnoise(p);
        p = rot * p * 2.02;
        amp *= 0.5;
      }
      return v;
    }

    void main() {
      float h = vHeight;
      float x = vUv.x;

      vec2 flowUv = vec2(x * 3.4 + vLayer * 1.71, h * 6.5 - uTime * 0.40);
      float nA = fbm(flowUv);
      float nB = fbm(vec2(x * 7.2 - nA * 1.45 + vLayer * 3.1, h * 13.0 - uTime * 0.66));

      // 丝缕内部扭曲轴线：底部极其凝聚纤细，向上分裂为轻薄交织的丝绸卷曲状
      float warpCenter = 0.5 + (nA - 0.5) * 0.46 * smoothstep(0.04, 0.38, h);
      float dist = abs(x - warpCenter);
      float edgeMask = smoothstep(0.49, 0.02, dist);

      // 底部细丝核心 + 上部双股缠绕涡旋丝缕
      float laminarCore = exp(-pow((x - warpCenter) / mix(0.095, 0.30, smoothstep(0.0, 0.35, h)), 2.0));
      float secondaryStrand = exp(-pow((x - (0.5 - (nB - 0.5) * 0.42)) / 0.16, 2.0)) * smoothstep(0.10, 0.38, h);
      float wispyVeil = smoothstep(0.22, 0.80, nB * 0.6 + nA * 0.4) * edgeMask;

      float structure = mix(laminarCore, max(laminarCore * 0.65 + secondaryStrand * 0.55, wispyVeil), smoothstep(0.08, 0.32, h));

      float fadeIn = smoothstep(0.0, 0.005, h);
      float fadeOut = pow(1.0 - smoothstep(0.22, 0.98, h), 1.55);
      float baseDensity = mix(1.20, 0.42, smoothstep(0.0, 0.85, h));

      float alpha = structure * fadeIn * fadeOut * baseDensity;

      // 丝缕断裂：低频团块 + 高频细纹，避免整条烟像一根实心白线
      float breakup = smoothstep(0.16, 0.62, nA * 0.62 + nB * 0.52 + (1.0 - h) * 0.20);
      alpha *= mix(0.62, 1.0, breakup);

      if (alpha < 0.002) discard;

      // 真实瑞利散射蓝灰色烟雾：根部几毫米受火头暖光映照，主体受冷窗光散射
      vec3 emberColor = vec3(1.28, 0.46, 0.14) * uEmberPulse;
      vec3 warmAsh = vec3(0.62, 0.59, 0.53);
      vec3 coolAsh = vec3(0.48, 0.52, 0.59);
      float coolMix = smoothstep(0.06, 0.62, h);
      float emberFade = exp(-h * 21.0);
      vec3 smokeColor = mix(warmAsh, coolAsh, coolMix);
      smokeColor = mix(smokeColor, emberColor, emberFade * 0.75);
      smokeColor += vec3(0.030, 0.036, 0.045) * pow(nB, 2.0) + (nB - 0.5) * vec3(0.02, 0.025, 0.03);
      gl_FragColor = vec4(smokeColor, clamp(alpha, 0.0, 0.76));
    }
  `;

  // 合并 4 条交叉丝带，一次 draw call 绘制整柱烟
  function createRibbonGeometry(ribbonCount, segX, segY) {
    const base = new THREE.PlaneGeometry(1, 1, segX, segY);
    const vCount = base.attributes.position.count;
    const iCount = base.index.count;
    const positions = new Float32Array(vCount * 3 * ribbonCount);
    const uvs = new Float32Array(vCount * 2 * ribbonCount);
    const layers = new Float32Array(vCount * ribbonCount);
    const indices = new Uint32Array(iCount * ribbonCount);
    const srcPos = base.attributes.position.array;
    const srcUv = base.attributes.uv.array;
    const srcIdx = base.index.array;
    for (let r = 0; r < ribbonCount; r++) {
      positions.set(srcPos, r * vCount * 3);
      uvs.set(srcUv, r * vCount * 2);
      for (let v = 0; v < vCount; v++) layers[r * vCount + v] = r;
      const off = r * vCount;
      for (let k = 0; k < iCount; k++) indices[r * iCount + k] = srcIdx[k] + off;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setAttribute('aLayer', new THREE.BufferAttribute(layers, 1));
    geo.setIndex(new THREE.BufferAttribute(indices, 1));
    return geo;
  }

  const smokeMaterial = new THREE.ShaderMaterial({
    uniforms: smokeUniforms,
    vertexShader: smokeVertexShader,
    fragmentShader: smokeFragmentShader,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const smokeMesh = new THREE.Mesh(createRibbonGeometry(4, 18, 140), smokeMaterial);
  smokeMesh.frustumCulled = false;
  smokeMesh.renderOrder = 8;
  scene.add(smokeMesh);

  // 高处极淡的散佚烟气，补上消散段
  const wispCount = 42;
  const wispGeo = new THREE.BufferGeometry();
  const wispPos = new Float32Array(wispCount * 3);
  const wispSeed = new Float32Array(wispCount * 2);
  for (let i = 0; i < wispCount; i++) {
    wispPos[i * 3] = stickTipWorld.x;
    wispPos[i * 3 + 1] = stickTipWorld.y + 0.004;
    wispPos[i * 3 + 2] = stickTipWorld.z;
    wispSeed[i * 2] = i / wispCount;
    wispSeed[i * 2 + 1] = (i * 1.6180339) % 1;
  }
  wispGeo.setAttribute('position', new THREE.BufferAttribute(wispPos, 3));
  wispGeo.setAttribute('aSeed', new THREE.BufferAttribute(wispSeed, 2));
  const wispMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: smokeUniforms.uTime,
      uOrigin: smokeUniforms.uOrigin,
      uTex: { value: textures.radialGlow }
    },
    vertexShader: `
      uniform float uTime;
      uniform vec3 uOrigin;
      attribute vec2 aSeed;
      varying float vAlpha;
      void main() {
        float life = fract(aSeed.x + uTime * 0.045);
        float h = 0.35 + life * 0.8;
        float y = h * 1.28;
        float driftX = pow(h, 1.55) * 0.16 + sin(uTime * 0.2 + aSeed.y * 6.283) * (0.02 + life * 0.06);
        float driftZ = pow(h, 1.60) * -0.065 + cos(uTime * 0.18 + aSeed.y * 6.283) * (0.015 + life * 0.045);
        vec3 p = uOrigin + vec3(driftX, y, driftZ);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (30.0 + life * 95.0) * (1.0 / -mv.z);
        vAlpha = sin(life * 3.1415926) * 0.055;
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vAlpha;
      void main() {
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(0.57, 0.61, 0.67), t.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const wisps = new THREE.Points(wispGeo, wispMat);
  wisps.frustumCulled = false;
  wisps.renderOrder = 7;
  scene.add(wisps);

  // ============================================================================
  // 7. 灯光：左侧障子窗冷白晨光 + 室内暖色反弹 + 极轻环境光
  // ============================================================================
  const hemiLight = new THREE.HemisphereLight(0xdce8f4, 0x24170f, 0.55);
  scene.add(hemiLight);

  const windowLight = new THREE.SpotLight(0xd9e8f7, 78, 0, 1.08, 0.55, 1.1);
  windowLight.position.set(-2.05, 2.75, -0.30);
  windowLight.target.position.set(0.1, 0.55, 0.12);
  windowLight.castShadow = true;
  windowLight.shadow.mapSize.set(2048, 2048);
  windowLight.shadow.camera.near = 0.3;
  windowLight.shadow.camera.far = 9;
  windowLight.shadow.bias = -0.0006;
  windowLight.shadow.normalBias = 0.018;
  scene.add(windowLight);
  scene.add(windowLight.target);

  const windowFill = new THREE.PointLight(0xe7eef7, 3.2, 7.5, 2.0);
  windowFill.position.set(-2.0, 1.9, -0.25);
  scene.add(windowFill);

  const warmBounce = new THREE.PointLight(0xffd2a0, 2.7, 6.5, 2.0);
  warmBounce.position.set(1.2, 1.65, 1.15);
  scene.add(warmBounce);

  const warmRim = new THREE.PointLight(0xffb374, 1.1, 4.0, 2.0);
  warmRim.position.set(1.8, 2.1, -1.15);
  scene.add(warmRim);

  const ambientLight = new THREE.AmbientLight(0x6a5a4a, 0.30);
  scene.add(ambientLight);

  // 空气尘埃：只在窗光柱附近轻轻浮动
  const dustCount = 120;
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(dustCount * 3);
  const dustSeed = new Float32Array(dustCount);
  for (let i = 0; i < dustCount; i++) {
    dustPos[i * 3] = -2.1 + Math.random() * 2.6;
    dustPos[i * 3 + 1] = 0.3 + Math.random() * 2.4;
    dustPos[i * 3 + 2] = -1.9 + Math.random() * 2.5;
    dustSeed[i] = Math.random();
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed, 1));
  const dustMat = new THREE.ShaderMaterial({
    uniforms: { uTime: smokeUniforms.uTime, uTex: { value: textures.radialGlow } },
    vertexShader: `
      uniform float uTime;
      attribute float aSeed;
      varying float vAlpha;
      void main() {
        vec3 p = position;
        p.x += sin(uTime * 0.11 + aSeed * 9.0) * 0.10;
        p.y += sin(uTime * 0.07 + aSeed * 13.0) * 0.07;
        p.z += cos(uTime * 0.09 + aSeed * 7.0) * 0.08;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.5 + fract(aSeed * 7.0) * 2.6) * (1.0 / -mv.z) * 9.0;
        vAlpha = 0.06 + 0.08 * fract(aSeed * 5.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vAlpha;
      void main() {
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(0.86, 0.90, 0.96), t.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);

  // ============================================================================
  // 8. 摄影机三机位：茶席 / 香篆微距 / 书画
  // ============================================================================
  const VIEWS = {
    front: { pos: new THREE.Vector3(0.92, 1.46, 2.24), target: new THREE.Vector3(-0.10, 0.86, -0.46), fov: 42 },
    close: { pos: new THREE.Vector3(0.56, 1.12, 1.42), target: new THREE.Vector3(0.26, 0.70, 0.17), fov: 31 },
    scroll: { pos: new THREE.Vector3(scrollHangX, scrollHangY, 1.02), target: new THREE.Vector3(scrollHangX, scrollHangY, -2.20), fov: 33 }
  };
  const activeView = {
    name: 'front',
    pos: VIEWS.front.pos.clone(),
    target: VIEWS.front.target.clone(),
    fov: VIEWS.front.fov
  };
  const goal = {
    pos: VIEWS.front.pos.clone(),
    target: VIEWS.front.target.clone(),
    fov: VIEWS.front.fov
  };
  const lookAtPoint = new THREE.Vector3().copy(activeView.target);
  let yaw = 0;
  let pitch = 0;

  // 开场运镜：先展示整间茶室，再缓慢推进到香的特写；任何交互都会取消。
  let introActive = true;
  let introElapsed = 0;
  let transitionBias = 1;
  let transitionLeft = 0;
  const INTRO_HOLD = 4.3;

  function cancelIntro() {
    introActive = false;
    transitionBias = 1;
    transitionLeft = 0;
  }

  function setView(name, silent) {
    const v = VIEWS[name];
    if (!v) return;
    goal.pos.copy(v.pos);
    goal.target.copy(v.target);
    goal.fov = v.fov;
    activeView.name = name;
    yaw = 0;
    pitch = 0;
    dom.viewBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.view === name));
    if (!silent) emitHost('view:' + name);
  }

  window.shrineView = function(name, silent) {
    cancelIntro();
    setView(name, !!silent);
  };

  dom.viewBtns.forEach(btn => {
    btn.addEventListener('click', () => window.shrineView(btn.dataset.view, false));
  });

  // 拖动环视（只在机位附近轻微偏移，不破坏构图）
  let dragging = false;
  let lastPointerX = 0;
  let lastPointerY = 0;
  const canvasEl = renderer.domElement;
  canvasEl.style.touchAction = 'none';
  canvasEl.addEventListener('pointerdown', e => {
    cancelIntro();
    dragging = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvasEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw = Math.max(-0.24, Math.min(0.24, yaw + (e.clientX - lastPointerX) * 0.0016));
    pitch = Math.max(-0.12, Math.min(0.12, pitch + (e.clientY - lastPointerY) * 0.0011));
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  });
  const endDrag = () => { dragging = false; };
  canvasEl.addEventListener('pointerup', endDrag);
  canvasEl.addEventListener('pointercancel', endDrag);
  canvasEl.addEventListener('pointerleave', endDrag);

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!appState.forced && appState.canSkip) emitHost('skip');
      return;
    }
    if (e.key === '1') window.shrineView('front', false);
    if (e.key === '2') window.shrineView('close', false);
    if (e.key === '3') window.shrineView('scroll', false);
    if (e.key === 'ArrowRight') {
      const order = ['front', 'close', 'scroll'];
      window.shrineView(order[(order.indexOf(activeView.name) + 1) % order.length], false);
    }
    if (e.key === 'ArrowLeft') {
      const order = ['front', 'close', 'scroll'];
      window.shrineView(order[(order.indexOf(activeView.name) + 2) % order.length], false);
    }
  });

  dom.btnSkip.addEventListener('click', () => {
    if (!appState.forced && appState.canSkip) emitHost('skip');
  });
  dom.btnPostpone.addEventListener('click', () => {
    if (!appState.forced && appState.canPostpone) emitHost('postpone');
  });

  let lastW = 0;
  let lastH = 0;
  function resizeRenderer() {
    const w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    if (w === lastW && h === lastH) return;
    lastW = w;
    lastH = h;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeRenderer);
  if (window.ResizeObserver) {
    new ResizeObserver(() => resizeRenderer()).observe(document.documentElement);
  }

  // ============================================================================
  // 9. 渲染循环与首帧揭示
  // ============================================================================
  const clock = new THREE.Clock();
  let elapsed = 0;
  let firstFrame = true;

  function updateCamera(dt) {
    const k = 1 - Math.exp(-dt * 3.2 * transitionBias);
    activeView.pos.lerp(goal.pos, k);
    activeView.target.lerp(goal.target, k);
    activeView.fov += (goal.fov - activeView.fov) * k;

    const offset = activeView.pos.clone().sub(activeView.target);
    const radius = Math.max(0.35, offset.length());
    const theta = Math.atan2(offset.x, offset.z) + yaw;
    const phi = Math.max(0.20, Math.min(Math.PI * 0.49, Math.acos(offset.y / radius) + pitch));
    const base = new THREE.Vector3(
      activeView.target.x + radius * Math.sin(phi) * Math.sin(theta),
      activeView.target.y + radius * Math.cos(phi),
      activeView.target.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    base.x += Math.sin(elapsed * 0.21) * 0.006;
    base.y += Math.sin(elapsed * 0.16 + 1.1) * 0.004;

    camera.position.lerp(base, 1 - Math.exp(-dt * 4.5));
    lookAtPoint.lerp(activeView.target, 1 - Math.exp(-dt * 4.5));
    camera.lookAt(lookAtPoint);

    if (Math.abs(camera.fov - activeView.fov) > 0.01) {
      camera.fov = activeView.fov;
      camera.updateProjectionMatrix();
    }
  }

  function animate() {
    const dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    if (introActive) {
      introElapsed += dt;
      if (introElapsed >= INTRO_HOLD) {
        introActive = false;
        transitionBias = 0.42;
        transitionLeft = 3.0;
        setView('close', false);
      }
    }
    if (transitionLeft > 0) {
      transitionLeft -= dt;
      if (transitionLeft <= 0) transitionBias = 1;
    }

    smokeUniforms.uTime.value = elapsed;
    const pulse = 0.82 + 0.13 * Math.sin(elapsed * 6.2) + 0.06 * Math.sin(elapsed * 15.7);
    smokeUniforms.uEmberPulse.value = pulse;
    emberTipUniforms.uTime.value = elapsed;
    emberTipUniforms.uPulse.value = pulse;
    emberPointLight.intensity = 0.16 + 0.16 * pulse;
    emberMicroGlow.material.opacity = 0.24 + 0.16 * pulse;
    windowFill.intensity = 3.15 + 0.10 * Math.sin(elapsed * 0.5);

    updateCamera(dt);
    resizeRenderer();
    renderer.render(scene, camera);

    if (firstFrame) {
      firstFrame = false;
      dom.curtain.classList.add('fade-out');
      setTimeout(() => dom.hud.classList.add('visible'), 1150);
      emitHost('ready');
    }
    requestAnimationFrame(animate);
  }

  camera.position.copy(VIEWS.front.pos);
  camera.lookAt(VIEWS.front.target);
  renderHUD();
  resizeRenderer();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
