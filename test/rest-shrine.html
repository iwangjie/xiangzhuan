<style>

    --c-faint: rgba(232, 225, 213, 0.15);
    --c-seal: #9b291e;
    --c-gold: #c9a05b;

    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0b0907;
    color: var(--c-paper);
    font-family: var(--font-serif);
  }

  #webgl-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: grab;
  }
  #webgl-container > canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #webgl-container:active {
    cursor: grabbing;
  }

  #fish-kiss-heart {
    position: fixed;
    z-index: 3;
    top: 0;
    left: 0;
    pointer-events: none;
    color: #efa1ad;
    font: 24px/1 system-ui, sans-serif;
    text-shadow: 0 2px 8px #61273588;
    will-change: transform, opacity;
  }

  /* 电影级光学暗角与上下柔化衬底，确保宣纸墨色文字在亮窗背景下清晰可读 */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    /* Paint the static grain with the vignette. */
    background:
      var(--film-grain-image, none) left top / 160px 160px repeat,
      radial-gradient(ellipse at 52% 48%, rgba(10, 8, 6, 0) 46%, rgba(9, 7, 5, 0.38) 78%, rgba(5, 4, 3, 0.82) 100%),
      linear-gradient(to bottom, rgba(7, 6, 5, 0.65) 0%, rgba(7, 6, 5, 0.16) 15%, rgba(7, 6, 5, 0) 32%, rgba(7, 6, 5, 0) 72%, rgba(6, 5, 4, 0.82) 100%);
  }

  /* 开场与收尾黑场过渡 */
  #curtain {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #080705;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #curtain.fade-out {
    opacity: 0;
  }
  #curtain.context-recovery,
  #curtain.session-reset {
    opacity: 1;
    transition: none;
  }

  /* 收尾：镜头没入茶汤，暗场像瞳孔一样自四周合拢（不是一团橙色光球） */

    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 52%,
      rgba(9, 6, 3, 0) 0%,
      rgba(9, 6, 3, 0) 30%,
      rgba(26, 13, 6, 0.42) 48%,
      rgba(17, 9, 4, 0.86) 66%,
      rgba(8, 5, 3, 0.98) 84%,
      #050402 100%);
    transform: scale(1.75);
    will-change: transform, opacity;
  }
  #tea-wash .ring {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 52vmin;
    height: 52vmin;
    margin: -26vmin 0 0 -26vmin;
    border-radius: 50%;
    border: 1px solid rgba(226, 189, 142, 0.30);
    opacity: 0;
    transform: scale(0.12);
    will-change: transform, opacity;
  }
  #tea-wash .core {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 74vmin;
    height: 1px;
    margin: -0.5px 0 0 -37vmin;
    opacity: 0;
    background: linear-gradient(90deg,
      rgba(255, 236, 208, 0) 0%,
      rgba(255, 236, 208, 0.20) 34%,
      rgba(255, 246, 232, 0.34) 50%,
      rgba(255, 236, 208, 0.20) 66%,
      rgba(255, 236, 208, 0) 100%);
    filter: blur(0.6px);
    will-change: transform, opacity;
  }
  #tea-wash .dim {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: #050403;
  }

    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    padding: 44px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 1.25s cubic-bezier(0.16, 1, 0.3, 1), transform 1.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #hud.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #hud.outro {
    opacity: 0;
    transform: translateY(10px);

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

    align-items: flex-start;

<script>
async function warmTeaRoomPrograms(THREE, renderer, scene, camera, shadowCamera, compilePrograms) {
  const shadowStage=new THREE.Scene();
  const depthMaterials=new Map();
  // Match the room's PCF depth variants before the first shadow map draw.
  const inverted=[THREE.BackSide,THREE.FrontSide,THREE.DoubleSide];
  scene.traverseVisible(mesh=>{
    if (!mesh.castShadow || !mesh.isMesh || Array.isArray(mesh.material) || !mesh.material.visible) return;
    const material=mesh.material;
    if (depthMaterials.has(material)) return;
    const depth=new THREE.MeshDepthMaterial({
        depthPacking:THREE.RGBADepthPacking,
        side:material.shadowSide ?? inverted[material.side],
        map:material.map,
        alphaMap:material.alphaMap,
        alphaTest:material.alphaTest,
        displacementMap:material.displacementMap,
        displacementScale:material.displacementScale,
        displacementBias:material.displacementBias,
    });
    depthMaterials.set(material,depth);
    const proxy=mesh.clone(false);
    proxy.material=depth;
    shadowStage.add(proxy);
  });

  // Depth programs use a linear render target. Compilation can continue in
  // parallel with the forward programs once both requests have been submitted.
  const previous=renderer.getRenderTarget();
  const depthTarget=new THREE.WebGLRenderTarget(1,1);
  const release = () => {
    for (const material of depthMaterials.values()) material.dispose();
  };
  try {
    let depthJob;
    try {
      renderer.setRenderTarget(depthTarget);
      depthJob=compilePrograms(shadowStage,shadowCamera);
    } finally {
      renderer.setRenderTarget(previous);
    }
    await Promise.all([depthJob,compilePrograms(scene,camera)]);
    // The real shadow pass acquires the same programs on its first draw.
    return release;
  } catch (error) {
    release();
    throw error;
  } finally {
    depthTarget.dispose();
  }
}

async function warmPreviewTextures(renderer, textures, yieldPaint, budgetMs=11) {
  let lastYield=performance.now();
  for (const texture of new Set(textures)) {
    if (renderer.getContext().isContextLost()) return;
    if (!texture?.isTexture) continue;
    renderer.initTexture(texture);
    if (performance.now()-lastYield>=budgetMs) {
      await yieldPaint();
      lastYield=performance.now();
    }
  }
}

</script>

<script>
async function decodeTeaBakedBytes(encoded) {
  let compressed;
  if (typeof Uint8Array.fromBase64 === 'function') {
    compressed = Uint8Array.fromBase64(encoded);
  } else {
    const binary = atob(encoded);
    compressed = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) compressed[i]=binary.charCodeAt(i);
  }
  const stream = new Response(compressed).body.pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function restoreTeaEnvironment(THREE, renderer) {
  if (!renderer.capabilities.isWebGL2 || typeof DecompressionStream !== 'function') return null;
  const {width,height,encoded}=teaBakedEnvironment;
  const bytes=await decodeTeaBakedBytes(encoded);
  const plane=width*height;
  const sampleCount=plane*4;
  if (bytes.length!==sampleCount*2) throw Error('环境贴图长度不符');
  const rgba=new Uint16Array(sampleCount);
  for (let channel=0;channel<4;channel++) {
    const base=channel*plane;
    const high=sampleCount+base;
    for (let i=0;i<plane;i++) rgba[4*i+channel]=bytes[base+i] | (bytes[high+i]<<8);
  }
  const texture=new THREE.DataTexture(rgba,width,height,THREE.RGBAFormat,THREE.HalfFloatType);
  texture.mapping=THREE.CubeUVReflectionMapping;
  texture.colorSpace=THREE.LinearSRGBColorSpace;
  texture.minFilter=THREE.LinearFilter;
  texture.magFilter=THREE.LinearFilter;
  texture.generateMipmaps=false;
  texture.flipY=false;
  texture.needsUpdate=true;
  return texture;
}

async function restoreFishPortraitTextures(THREE, renderer, lowEnd) {
  const maxAniso=renderer.capabilities.getMaxAnisotropy();
  async function load(name, linear, anisotropy) {
    const {width,height,encoded}=teaBakedActor[name];
    const data=await decodeTeaBakedBytes(encoded);
    if (data.length!==width*height*4) throw Error('角色贴图长度不符 '+name);
    const texture=new THREE.DataTexture(data,width,height,THREE.RGBAFormat);
    texture.colorSpace=linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    texture.flipY=false;
    texture.generateMipmaps=renderer.capabilities.isWebGL2;
    texture.minFilter=texture.generateMipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
    texture.magFilter=THREE.LinearFilter;
    texture.anisotropy=Math.min(anisotropy,maxAniso);
    texture.needsUpdate=true;
    return texture;
  }
  const [front,back,side,mask,art]=await Promise.all([
    load('front',false,lowEnd?2:8),load('back',false,lowEnd?2:8),
    load('side',false,4),load('mask',true,4),load('art',false,1)
  ]);
  const {width,height,data}=art.image;
  return {front,back,side,mask,art,refImageData:{width,height,data}};
}

</script>
<script>
// A small magnification-only patch of the original portrait. Keep the source
// alpha and minified texture path intact for the character's silhouette.
async function restoreFishPortraitDetail(THREE, lowEnd, detail, mipmaps=false) {
  if (lowEnd) return null;
  const { width, height, encoded } = detail;
  const pixels = await decodeTeaBakedBytes(encoded);
  if (pixels.length !== width * height * 4) throw new Error('角色细节贴图长度不符');
  const texture = new THREE.DataTexture(pixels, width, height, THREE.RGBAFormat);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.generateMipmaps = mipmaps;
  texture.minFilter = mipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.needsUpdate = true;
  return texture;
}

const fishFaceDetailSource = `
uniform sampler2D uFishFaceDetail;
uniform float uFishFaceDetailStrength;
const vec2 fishDetailOrigin = vec2(${fishFaceDetail.box[0]}.0,${fishFaceDetail.box[1]}.0);
const vec2 fishDetailSize = vec2(${fishFaceDetail.box[2]-fishFaceDetail.box[0]}.0,${fishFaceDetail.box[3]-fishFaceDetail.box[1]}.0);

float fishFaceDetailWeight(vec2 p, vec2 dx, vec2 dy) {
  if (uFishFaceDetailStrength == 0.0) return 0.0;
  float footprint = max(length(dx),length(dy));
  vec2 local = p-fishDetailOrigin;
  vec2 margin = min(local,fishDetailSize-local);
  float window = smoothstep(1.0,4.0,min(margin.x,margin.y));
  return uFishFaceDetailStrength * window * (1.0-smoothstep(0.54,1.04,footprint));
}

struct FishPortraitFootprint {
    vec2 dx;
    vec2 dy;
    float detailWeight;
};

FishPortraitFootprint fishPortraitFootprint(vec2 uv) {
    vec2 dx = dFdx(uv);
    vec2 dy = dFdy(uv);
    vec2 p = uv * fishPortraitSize;
    vec2 pxDx = dx * fishPortraitSize;
    vec2 pxDy = dy * fishPortraitSize;
    float w = fishFaceDetailWeight(p, pxDx, pxDy);
    return FishPortraitFootprint(dx, dy, w);
}

#if (__VERSION__ >= 300) || defined(GL_EXT_shader_texture_lod)
#define FISH_TEXTURE_GRADIENTS 1
#else
#define FISH_TEXTURE_GRADIENTS 0
#endif

vec4 fishSamplePortrait(sampler2D art, vec2 uv, vec2 dx, vec2 dy) {
#if FISH_TEXTURE_GRADIENTS
    return texture2DGradEXT(art, uv, dx, dy);
#else
    return texture2D(art, uv);
#endif
}

vec4 fishSampleFaceArt(sampler2D art, vec2 uv, FishPortraitFootprint footprint) {
  vec4 pigment = fishSamplePortrait(art,uv,footprint.dx,footprint.dy);
  if (footprint.detailWeight > 0.0001) {
    vec2 patchUV = (uv*fishPortraitSize-fishDetailOrigin)/fishDetailSize;
    vec2 uvScale = fishPortraitSize/fishDetailSize;
    vec3 detail = fishSamplePortrait(uFishFaceDetail,patchUV,footprint.dx*uvScale,footprint.dy*uvScale).rgb;
    pigment.rgb = mix(pigment.rgb,detail,footprint.detailWeight);
  }
  return pigment;
}
`;

<script>
/**
 * Asynchronously decodes and builds a Three.js BufferGeometry from inline Base64 gzip FSH1 binary data.
 *
 * Binary Format:
 * - 4 bytes ASCII: "FSH1" (0x31485346 little-endian)
 * - u32: blockCount (expected 16)
 * - Each block starts at a 4-byte-aligned offset:
 *     u32 elementCount
 *     raw contiguous payload according to schema
 *
 * Implicit Schema Order:
 *  0: position     - float32 x 3
 *  1: normal       - float32 x 3
 *  2: color        - float32 x 3
 *  3: aFrontUV     - float32 x 2
 *  4: aFrontWeight - float32 x 1
 *  5: aBackUV      - float32 x 2
 *  6: aBackWeight  - float32 x 1
 *  7: aSideUV      - float32 x 2
 *  8: aSideWeight  - float32 x 1
 *  9: aSidePolish  - float32 x 2
 * 10: skinIndex    - uint8   x 4
 * 11: skinWeight   - float32 x 4
 * 12: aCupSleeve   - float32 x 1
 * 13: index        - uint16  x 1
 * 14: aTressInfo   - uint8 normalized x 3
 * 15: aWaveTuck    - float32 x 1, baked sleeve fold weights
 *
 * @param {object} THREE - The Three.js r160 namespace.
 * @param {string} encoded - Base64-encoded gzipped FSH1 binary payload.
 * @returns {Promise<THREE.BufferGeometry>}
 */
async function loadFishGeometry(THREE, encoded) {
  const {buffer:decompressedBuffer} = await decodeTeaBakedBytes(encoded);

  // 3. Validate Header and Block Count
  const dv = new DataView(decompressedBuffer);
  if (decompressedBuffer.byteLength < 8) {
    throw new Error('FSH1: Buffer too small for header.');
  }

  const magic = dv.getUint32(0, true);
  // 'F' = 0x46, 'S' = 0x53, 'H' = 0x48, '1' = 0x31 -> little-endian 0x31485346
  if (magic !== 0x31485346) {
    throw new Error('FSH1: Invalid magic header (expected FSH1).');
  }

  const blockCount = dv.getUint32(4, true);
  const SCHEMA = [
    { name: 'position',     type: 'float32', itemSize: 3, bytesPerElem: 4, isIndex: false },
    { name: 'normal',       type: 'float32', itemSize: 3, bytesPerElem: 4, isIndex: false },
    { name: 'color',        type: 'float32', itemSize: 3, bytesPerElem: 4, isIndex: false },
    { name: 'aFrontUV',     type: 'float32', itemSize: 2, bytesPerElem: 4, isIndex: false },
    { name: 'aFrontWeight', type: 'float32', itemSize: 1, bytesPerElem: 4, isIndex: false },
    { name: 'aBackUV',      type: 'float32', itemSize: 2, bytesPerElem: 4, isIndex: false },
    { name: 'aBackWeight',  type: 'float32', itemSize: 1, bytesPerElem: 4, isIndex: false },
    { name: 'aSideUV',      type: 'float32', itemSize: 2, bytesPerElem: 4, isIndex: false },
    { name: 'aSideWeight',  type: 'float32', itemSize: 1, bytesPerElem: 4, isIndex: false },
    { name: 'aSidePolish',  type: 'float32', itemSize: 2, bytesPerElem: 4, isIndex: false },
    { name: 'skinIndex',    type: 'uint8',   itemSize: 4, bytesPerElem: 1, isIndex: false },
    { name: 'skinWeight',   type: 'float32', itemSize: 4, bytesPerElem: 4, isIndex: false },
    { name: 'aCupSleeve',   type: 'float32', itemSize: 1, bytesPerElem: 4, isIndex: false },
    { name: 'index',        type: 'uint16',  itemSize: 1, bytesPerElem: 2, isIndex: true },
    { name: 'aTressInfo',   type: 'uint8',   itemSize: 3, bytesPerElem: 1, isIndex: false, normalized: true },
    { name: 'aWaveTuck',     type: 'float32', itemSize: 1, bytesPerElem: 4, isIndex: false }
  ];

  if (blockCount !== SCHEMA.length) {
    throw new Error(`FSH1: Block count mismatch. Expected ${SCHEMA.length}, got ${blockCount}.`);
  }

  let offset = 8;
  const geometry = new THREE.BufferGeometry();
  let expectedVertexCount = null;

  // 4. Parse blocks sequentially with 4-byte alignment verification
  for (let b = 0; b < SCHEMA.length; b++) {
    // Each block begins at a 4-byte-aligned offset
    if ((offset & 3) !== 0) {
      offset = (offset + 3) & ~3;
    }

    if (offset + 4 > decompressedBuffer.byteLength) {
      throw new Error(`FSH1: Unexpected EOF before block ${b} (${SCHEMA[b].name}) count header.`);
    }

    const elementCount = dv.getUint32(offset, true);
    offset += 4;

    const def = SCHEMA[b];
    const totalComponents = elementCount * def.itemSize;
    const payloadBytes = totalComponents * def.bytesPerElem;

    if (offset + payloadBytes > decompressedBuffer.byteLength) {
      throw new Error(`FSH1: Unexpected EOF reading block ${b} (${def.name}) data.`);
    }

    if (!def.isIndex) {
      if (expectedVertexCount === null) {
        expectedVertexCount = elementCount;
        if (expectedVertexCount === 0 || expectedVertexCount > 65535) {
          throw new Error(`FSH1: Vertex count (${expectedVertexCount}) exceeds uint16 limit of 65535.`);
        }
      } else if (elementCount !== expectedVertexCount) {
        throw new Error(`FSH1: Vertex count mismatch in block ${def.name}. Expected ${expectedVertexCount}, got ${elementCount}.`);
      }
    }

    // Shared typed views preserving exact Float32 and integer byte representations
    let attribute;
    if (def.type === 'float32') {
      const view = new Float32Array(decompressedBuffer, offset, totalComponents);
      attribute = new THREE.BufferAttribute(view, def.itemSize);
    } else if (def.type === 'uint8') {
      const view = new Uint8Array(decompressedBuffer, offset, totalComponents);
      attribute = new THREE.BufferAttribute(view, def.itemSize, def.normalized === true);
    } else if (def.type === 'uint16') {
      const view = new Uint16Array(decompressedBuffer, offset, totalComponents);
      attribute = new THREE.BufferAttribute(view, def.itemSize);
    }

    if (def.isIndex) {
      if (!elementCount || elementCount % 3 || attribute.array.some(vertex => vertex >= expectedVertexCount)) {
        throw new Error('FSH1: Invalid triangle index.');
      }
      geometry.setIndex(attribute);
    } else {
      geometry.setAttribute(def.name, attribute);
    }

    offset += payloadBytes;
  }

  // 5. Final 4-byte alignment padding check to exact EOF
  if ((offset & 3) !== 0) {
    offset = (offset + 3) & ~3;
  }

  if (offset !== decompressedBuffer.byteLength) {
    throw new Error(`FSH1: Exact EOF check failed. Trailing data detected (read ${offset} of ${decompressedBuffer.byteLength} bytes).`);
  }

  return geometry;
}

const fishRoomLightSource = `
uniform vec3 uFishKeyWorld;
uniform vec3 uFishFillWorld;

const vec3 fishWindowTint = vec3(0.93, 0.98, 1.05);
const vec3 fishBounceTint = vec3(1.05, 0.94, 0.84);

vec3 fishSafeNormalize(vec3 v, vec3 fallback) {
  float lengthSquared = dot(v, v);
  return lengthSquared > 1e-6 ? v * inversesqrt(lengthSquared) : fallback;
}

vec3 fishLightDirection(vec3 pointWorld, vec3 surfaceView, vec3 normalView) {
  vec3 pointView = (viewMatrix * vec4(pointWorld, 1.0)).xyz;
  return fishSafeNormalize(pointView - surfaceView, normalView);
}

float fishRoomDiffuse(vec3 normal, vec3 light, float wrapAmount) {
  float wrapped = clamp((dot(normal, light) + wrapAmount) / (1.0 + wrapAmount), 0.0, 1.0);
  return smoothstep(0.10, 0.86, wrapped);
}

float fishHairStrandLobe(vec3 tangent, vec3 normal, vec3 halfway, float tilt, float sharpness) {
  vec3 shifted = fishSafeNormalize(tangent + tilt * normal, tangent);
  float alignment = clamp(dot(shifted, halfway), -1.0, 1.0);
  return pow(max(0.0, 1.0 - alignment * alignment), 0.5 * sharpness);
}

vec3 fishHairLobe(vec3 normal, vec3 flow, vec3 eye, vec3 key, vec3 fill) {
  float visible = smoothstep(0.06, 0.50, dot(normal, eye));
  if (visible <= 0.0) return vec3(0.0);
  vec3 tangent = flow - normal * dot(flow, normal);
  float tangentWeight = smoothstep(0.015, 0.20, dot(tangent, tangent));
  tangent = fishSafeNormalize(tangent, vec3(0.0));
  vec3 keyHalf = fishSafeNormalize(key + eye, normal);
  vec3 fillHalf = fishSafeNormalize(fill + eye, normal);
  float keySheen = 0.65 * fishHairStrandLobe(tangent, normal, keyHalf, 0.08, 24.0)
    + 0.35 * fishHairStrandLobe(tangent, normal, keyHalf, -0.12, 14.0);
  float fillSheen = fishHairStrandLobe(tangent, normal, fillHalf, 0.0, 14.0);
  return visible * tangentWeight * (
    fishWindowTint * keySheen * max(0.0, dot(normal, key)) * 0.062
    + fishBounceTint * fillSheen * max(0.0, dot(normal, fill)) * 0.023);
}

vec3 fishTailLobe(vec3 normal, vec3 eye, vec3 key, vec3 fill, float exposure) {
  vec3 keyHalf = fishSafeNormalize(key + eye, normal);
  vec3 fillHalf = fishSafeNormalize(fill + eye, normal);
  float keyDot = max(0.0, dot(normal, keyHalf));
  float fillDot = max(0.0, dot(normal, fillHalf));
  float keySatin = (0.70 * pow(keyDot, 8.0) + 0.30 * pow(keyDot, 26.0)) * max(0.0, dot(normal, key));
  float fillSatin = pow(fillDot, 7.0) * max(0.0, dot(normal, fill));
  float facing = smoothstep(0.02, 0.40, dot(normal, eye));
  return (fishWindowTint * keySatin * 0.085 + fishBounceTint * fillSatin * 0.043)
    * facing * smoothstep(0.06, 0.92, exposure);
}
`;

<script>
function createFishHemProfileTexture(THREE) {
  const pixels = new Uint8Array(fishHemProfile.length * 4);
  for (const [i,[height,radius]] of fishHemProfile.entries()) {
    pixels[4*i] = Math.round(255 * (height + .38) / .08);
    pixels[4*i+1] = Math.round(255 * (radius - .18) / .12);
    pixels[4*i+3] = 255;
  }
  const texture = new THREE.DataTexture(pixels, fishHemProfile.length, 1, THREE.RGBAFormat);
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;
  texture.needsUpdate = true;
  return texture;
}

async function restoreFishReliefAtlas(THREE, renderer, lowEnd, source, repeat) {
  const pixels=await decodeTeaBakedBytes(source);
  const colorBytes=256*128*4;
  if(pixels.length!==colorBytes+256*128*2) throw new Error('角色材质图集长度不符');
  const anisotropy=Math.min(lowEnd ? 2 : 4, renderer.capabilities.getMaxAnisotropy());
  function makeTexture(data,format) {
    const texture=new THREE.DataTexture(data,256,128,format);
    if(repeat)texture.wrapS=THREE.RepeatWrapping;
    texture.magFilter=THREE.LinearFilter;
    texture.minFilter=THREE.LinearMipmapLinearFilter;
    texture.generateMipmaps=true;
    texture.anisotropy=anisotropy;
    texture.needsUpdate=true;
    return texture;
  }
  return {
    color:makeTexture(pixels.subarray(0,colorBytes),THREE.RGBAFormat),
    slope:renderer.capabilities.isWebGL2 ? makeTexture(pixels.subarray(colorBytes),THREE.RGFormat) : null
  };
}

function applyFishRuffleRelief(geometry) {
  const {position, normal} = geometry.attributes;
  const {offsets, adjustments} = fishRuffleRelief;
  for (let k=0;k<offsets.length;k+=4) {
    const i=offsets[k];
    position.setXYZ(i, position.getX(i)+offsets[k+1]*1e-6,
      position.getY(i)+offsets[k+2]*1e-6, position.getZ(i)+offsets[k+3]*1e-6);
  }
  for (let k=0;k<adjustments.length;k+=4) {
    normal.setXYZ(adjustments[k], adjustments[k+1]/32767, adjustments[k+2]/32767, adjustments[k+3]/32767);
  }
}

const fishSkirtRuffleSource = `
uniform sampler2D uFishHemProfile;
uniform sampler2D uFishLaceAtlas;
uniform sampler2D uFishLaceSlope;

float fishRuffleBand(float value, float lower, float upper, float aa) {
  return smoothstep(lower-aa, lower+aa, value) * (1.0-smoothstep(upper-aa, upper+aa, value));
}

vec3 fishShadeSkirtRuffle(vec3 color, vec3 p, vec3 bindN, vec3 viewN, vec3 viewP, float hair, float frontCoverage) {
  vec2 radial = p.xz - vec2(-0.041, 0.012);
  float radius = length(radial);
  float theta = atan(radial.x, radial.y + 1e-6);
  float angle = abs(theta);
  float front = 1.0 - smoothstep(0.18, 0.78, frontCoverage);
  float side = smoothstep(0.57, 0.90, angle) * (1.0 - smoothstep(1.67, 1.87, angle));
  float mask = front * side * (1.0 - smoothstep(0.23, 0.68, hair));

  // Evaluate the footprint on the continuous, unwrapped atlas coordinate
  // before the side-mask branch so the mip level stays stable on a seam.
  float column = clamp((degrees(theta)+110.0)/5.0, 0.0, 44.0);
  vec2 profile = texture2D(uFishHemProfile, vec2((column+0.5)/45.0, 0.5)).rg;
  float h = p.y - (profile.x*0.08 - 0.38);
  vec2 laceUv=vec2(theta*3.05+0.12,(h+0.004)/0.060);
  #if FISH_TEXTURE_GRADIENTS
  vec2 laceDx=dFdx(laceUv), laceDy=dFdy(laceUv);
  #else
  vec4 lace=texture2D(uFishLaceAtlas,laceUv);
  vec2 relief=vec2(dFdx(lace.a),dFdy(lace.a));
  #endif
  float aa = clamp(0.58 * fwidth(h), 0.0006, 0.0095);
  // Convert the filtered cloth relief into a small normal perturbation in
  // view space. Limit the slope at grazing views and triangle edges.
  vec3 surfaceX = dFdx(viewP);
  vec3 surfaceY = dFdy(viewP);
  float skirtRadius = profile.y*0.12 + 0.18;
  float shell = smoothstep(skirtRadius-0.030, skirtRadius+0.010, radius);
  float outward = dot(bindN.xz, radial / max(radius,0.001));
  float strength = mask * shell * smoothstep(-0.45, 0.25, outward);
  if (h < -0.008 || h > 0.069 || strength < 0.002) return color;

  vec3 laceNormal=viewN;
  #if FISH_TEXTURE_GRADIENTS
  vec4 lace=fishSamplePortrait(uFishLaceAtlas,laceUv,laceDx,laceDy);
  float threadRelief=fishReliefFootprint(laceDx,laceDy)*smoothstep(0.1,0.75,lace.r);
  if(threadRelief>0.005) {
    vec2 relief=fishReliefGradient(uFishLaceSlope,laceUv,laceDx,laceDy,0.06079);
    laceNormal=fishHeightNormal(viewN,surfaceX,surfaceY,relief,0.00052*threadRelief,0.22);
  }
  #else
  laceNormal=fishHeightNormal(viewN,surfaceX,surfaceY,relief,0.00052*smoothstep(0.1,0.75,lace.r),0.22);
  #endif
  vec3 key = fishLightDirection(uFishKeyWorld, viewP, viewN);
  vec3 fill = fishLightDirection(uFishFillWorld, viewP, viewN);
  float daylight = fishRoomDiffuse(viewN, key, 0.46);
  float laceDaylight = fishRoomDiffuse(laceNormal, key, 0.38);
  float bounce = fishRoomDiffuse(viewN, fill, 0.61);
  float light = 0.71 + 0.21 * laceDaylight + 0.08 * bounce;
  float overhang = 0.82 + 0.18 * smoothstep(0.0, 0.007, 0.023-h);
  vec3 ivory = vec3(0.91, 0.86, 0.80) * light * overhang * (0.72 + 0.31*lace.a);
  vec3 navy = mix(vec3(0.025, 0.036, 0.084)*light, color, 0.30);
  ivory = mix(ivory, navy, lace.g * 0.63);

  // Recover a continuous dark fabric under the baked side decoration.
  // A whole band replaces the old pigment, including its dark edge.
  float hemPanel = fishRuffleBand(h, 0.006, 0.064, max(aa,0.008));
  float panelMix = strength * smoothstep(0.11, 0.62, strength);
  float fold = 0.92 + 0.08 * lace.a;
  vec3 cloth = vec3(0.058,0.082,0.175) * (0.80 + 0.20*daylight + 0.17*bounce) * fold;
  vec3 result = mix(color, cloth, hemPanel * panelMix);
  float ruffleBase = fishRuffleBand(h,-0.002,0.024,aa);
  result = mix(result, navy, ruffleBase * strength * 0.38);
  result = mix(result, ivory, lace.r * strength);
  vec3 thread = vec3(0.65, 0.457, 0.201) * (0.72 + 0.24*daylight + 0.10*bounce);
  vec3 trim = mix(result, thread, lace.b * panelMix * 0.89);
  // The tail-side fold turns under the outer trim and exposes the skirt lining.
  vec3 foldOffset = (p - vec3(0.161,-0.323,-0.005)) * vec3(1.0,1.55,1.32);
  float tailFold = (1.0-smoothstep(0.022,0.046,length(foldOffset))) *
    smoothstep(0.68,0.92,-bindN.y);
  vec3 lining = cloth * (0.87 + 0.07*bounce);
  return mix(trim, lining, tailFold);
}

// The lifted hair reveals the rear surface already present in the sculpt.
// Continue the same cream ruffle and stitching across that surface.
vec3 fishShadeRearHem(vec3 color, vec3 p, vec3 bindN, vec3 viewN, vec3 viewP,
    float hair, float frontCoverage) {
  float depth=0.012-p.z;
  float fromBack=atan(p.x+0.041,depth+1e-6);
  float sides=smoothstep(0.050,0.196,abs(p.x+0.040));
  float rimY=-0.374+0.014*sides;
  float h=p.y-rimY;
  vec2 laceUv=vec2(fromBack*2.9+0.29,(h+0.004)/0.077);
  #if FISH_TEXTURE_GRADIENTS
  vec2 laceDx=dFdx(laceUv), laceDy=dFdy(laceUv);
  vec3 surfaceDx=dFdx(viewP), surfaceDy=dFdy(viewP);
  #else
  vec4 lace=texture2D(uFishLaceAtlas,laceUv);
  #endif
  float edge=clamp(0.65*fwidth(h),0.0006,0.010);
  float region=(1.0-smoothstep(1.01,1.50,abs(fromBack)))
    *smoothstep(0.083,0.115,depth)*(1.0-smoothstep(0.177,0.231,depth))
    *(1.0-smoothstep(0.10,0.34,hair))*(1.0-smoothstep(0.07,0.41,frontCoverage));
  // Rear locks flare farther outward than the actual skirt shell.
  float lateral = abs(p.x+0.041);
  float lockTips = smoothstep(0.132,0.185,lateral) * smoothstep(0.114,0.167,depth);
  float outerLocks = smoothstep(0.170,0.224,lateral) * smoothstep(0.086,0.129,depth);
  float facing=smoothstep(-0.12,0.39,-bindN.z);
  float panel=fishRuffleBand(h,-0.021,0.079,max(0.008,edge));
  float weight=region*(1.0-max(lockTips,outerLocks))*facing*panel;
  if(weight<0.003)return color;

  vec3 laceNormal=viewN;
  #if FISH_TEXTURE_GRADIENTS
  vec4 lace=fishSamplePortrait(uFishLaceAtlas,laceUv,laceDx,laceDy);
  float nearDetail=fishReliefFootprint(laceDx,laceDy);
  float reliefMask=smoothstep(0.12,0.76,lace.r)+0.30*lace.b;
  if(nearDetail*reliefMask>0.015) {
    vec2 heightDiff=fishReliefGradient(uFishLaceSlope,laceUv,laceDx,laceDy,0.06079);
    laceNormal=fishHeightNormal(viewN,surfaceDx,surfaceDy,heightDiff,
      0.00076*nearDetail*reliefMask,0.21);
  }
  #endif

  vec3 key=fishLightDirection(uFishKeyWorld,viewP,viewN);
  vec3 fill=fishLightDirection(uFishFillWorld,viewP,viewN);
  float keyAmount=fishRoomDiffuse(viewN,key,0.48);
  float bounce=fishRoomDiffuse(viewN,fill,0.60);
  float light=0.70+0.18*keyAmount+0.10*bounce;
  float laceLight=0.70+0.18*fishRoomDiffuse(laceNormal,key,0.48)+0.10*bounce;
  float upperLayer=smoothstep(0.024,0.042,h);
  vec3 indigo=mix(vec3(0.039,0.052,0.113),vec3(0.050,0.068,0.143),upperLayer)
    *light*mix(0.68,1.0,smoothstep(-0.008,0.017,h));
  float sewnEdge=mix(0.77,1.0,(1.0-smoothstep(0.018,0.031,h)));
  vec3 ivory=vec3(0.86,0.81,0.75)*laceLight*(0.73+0.27*lace.a)*sewnEdge;
  ivory=mix(ivory,indigo,lace.g*0.60);
  vec3 trim=mix(indigo,ivory,lace.r);
  vec3 thread=vec3(0.55,0.36,0.14)*laceLight;
  trim=mix(trim,thread,lace.b*0.68);
  return mix(color,trim,clamp(weight*1.13,0.0,1.0));
}
`;

// Offline ankle weights; each triple stores vertex, left, right.
function applyFishAnkleWeights(geometry) {
  geometry.userData.hasShinWeights = true;
  const {skinIndex,skinWeight}=geometry.attributes;
  for (let i=0;i<fishAnkleWeights.length;i+=3) {
    const vertex=fishAnkleWeights[i];
    const left=fishAnkleWeights[i+1]/65535;
    const right=fishAnkleWeights[i+2]/65535;
    skinIndex.setXYZW(vertex,0,4,5,0);
    skinWeight.setXYZW(vertex,Math.max(0,1-left-right),left,right,0);
  }
}

function attachFishShins(geometry, firstShin) {
  const {position,skinIndex,skinWeight} = geometry.attributes;
  for (let i=0;i<fishAnkleWeights.length;i+=3) {
    const v=fishAnkleWeights[i];
    const left=skinWeight.getY(v), right=skinWeight.getZ(v), root=skinWeight.getX(v);
    const isLeft=left>=right;
    const foot=isLeft?left:right;
    const opposite=isLeft?right:left;
    const y=position.getY(v);
    const vertical=(1-THREE.MathUtils.smoothstep(y,-.367,-.326))*THREE.MathUtils.smoothstep(y,-.456,-.418);
    const isolation=1-THREE.MathUtils.smoothstep(opposite,.01,.18);
    const half=.85*vertical*isolation*Math.min(root,foot);
    skinIndex.setW(v,firstShin+(isLeft?0:1));
    skinWeight.setXYZW(v,root-half,left-(isLeft?half:0),right-(isLeft?0:half),2*half);
  }
}

// The rear locks fade into the scalp and skirt across a wider band than the collar.
function fishHairSkinInfluence(x, y, z) {
  function falloff(start, end, value) {
    const t = Math.min(1, Math.max(0, (value - start) / (end - start)));
    return t * t * (3 - 2 * t);
  }
  const depth = falloff(-0.075, -0.22, z);
  const side = 1 - falloff(0.10, 0.24, Math.abs(x));
  const crown = 1 - falloff(0.13, 0.29, y);
  const ends = falloff(-0.35, -0.09, y);
  return depth * side * crown * ends;
}

function createFishBodyRig(THREE, sourceBody, tailMesh, rootGroup) {

  // 0: Root (Pelvis / World Base), 1: Chest, 2: Head, 3: HairLag, 4: LeftFoot, 5: RightFoot
  const BONE_ROOT = 0;

  boneHead.name = "rig_head";
  boneHead.position.copy(REST_HEAD_POS).sub(REST_CHEST_POS);

  boneHair.name = "rig_hair";
  boneHair.position.copy(REST_HAIR_POS).sub(REST_HEAD_POS);

  const boneLeftFoot = new THREE.Bone();
  boneLeftFoot.name = "rig_leftFoot";
  boneLeftFoot.position.copy(REST_LFOOT_POS).sub(REST_ROOT_POS);

  const boneRightFoot = new THREE.Bone();
  boneRightFoot.name = "rig_rightFoot";
  boneRightFoot.position.copy(REST_RFOOT_POS).sub(REST_ROOT_POS);

  boneChest.add(boneHead);
  boneHead.add(boneHair);
  boneRoot.add(boneLeftFoot);

        for (let k = 0; k < 4; k++) {
          skinIndices[idx4 + k] = candidates[k].id;
          skinWeights[idx4 + k] = candidates[k].w * invSum;
        }
      } else {
        skinIndices[idx4] = BONE_ROOT;
        skinWeights[idx4] = 1.0;
        skinIndices[idx4 + 1] = 0;
        skinWeights[idx4 + 1] = 0;
        skinIndices[idx4 + 2] = 0;
        skinWeights[idx4 + 2] = 0;
        skinIndices[idx4 + 3] = 0;
        skinWeights[idx4 + 3] = 0;
      }
    }

    geometry.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
    geometry.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));
    geometry.setAttribute('aCupSleeve', new THREE.Float32BufferAttribute(sleeveMask, 1));
  }

  if (geometry.userData.hasShinWeights) attachFishShins(geometry, firstShin);

  // --- SkinnedMesh & Skeleton Setup ---
  const material = sourceBody.material;
  const skinnedBody = new THREE.SkinnedMesh(geometry, material);
  skinnedBody.name = "rigged_fishBody";
  skinnedBody.castShadow = sourceBody.castShadow;
  skinnedBody.receiveShadow = sourceBody.receiveShadow;
  skinnedBody.frustumCulled = false;

  // Conservative bounding box/sphere to prevent culling during high dynamic actions / jumps
  skinnedBody.geometry.computeBoundingBox();
  const currentBox = skinnedBody.geometry.boundingBox;
  skinnedBody.geometry.boundingBox = new THREE.Box3(
    new THREE.Vector3(currentBox.min.x - 0.4, currentBox.min.y - 0.6, currentBox.min.z - 0.4),
    new THREE.Vector3(currentBox.max.x + 0.4, currentBox.max.y + 0.8, currentBox.max.z + 0.4)
  );
  skinnedBody.geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 1.25);

  skinnedBody.add(boneRoot);
  const skeleton = new THREE.Skeleton(bones);
  skinnedBody.bind(skeleton);

  // Replace original mesh in rootGroup
  rootGroup.remove(sourceBody);
  rootGroup.add(skinnedBody);

  // --- Tail Pivot Architecture ---
  // Tail rigid pivot at (0.04, -0.31, -0.06)
  const tailPivotPos = new THREE.Vector3(0.04, -0.31, -0.06);
  const tailPivot = new THREE.Group();
  tailPivot.name = "rig_tailPivot";
  tailPivot.position.copy(tailPivotPos);

  if (tailMesh.parent) {
    tailMesh.parent.remove(tailMesh);
  }
  tailMesh.position.sub(tailPivotPos);
  tailPivot.add(tailMesh);
  rootGroup.add(tailPivot);

  // --- Pose Cache ---
  let currentLift = 0;
  const REST_BONE_CHEST_POS = boneChest.position.clone();
  const REST_BONE_ROOT_POS = boneRoot.position.clone();
  const leftFootRest = boneLeftFoot.position.clone(), rightFootRest = boneRightFoot.position.clone();

  function reset() {
    currentLift = 0;

    boneRoot.position.copy(REST_BONE_ROOT_POS);
    boneRoot.rotation.set(0, 0, 0);

    boneChest.position.copy(REST_BONE_CHEST_POS);
    boneChest.rotation.set(0, 0, 0);

    boneHead.rotation.set(0, 0, 0);
    boneHair.rotation.set(0, 0, 0);

    boneLeftFoot.position.copy(leftFootRest);
    boneRightFoot.position.copy(rightFootRest);
    boneLeftFoot.rotation.set(0, 0, 0);
    boneRightFoot.rotation.set(0, 0, 0);

    updateShins();

    tailPivot.position.copy(tailPivotPos);
    tailPivot.rotation.set(0, 0, 0);
    tailMesh.material.uniforms.uTailBend.value = 0;
    cupArm.reset();

    skinnedBody.updateMatrixWorld(true);
  }

  function setPose(pose, gait) {
    const p = pose || {};
    const headPitch = p.headPitch || 0;
    const headYaw = p.headYaw || 0;
    const headRoll = p.headRoll || 0;
    const chestPitch = p.chestPitch || 0;
    const chestRoll = p.chestRoll || 0;
    const breathe = p.breathe || 0;
    const hipY = p.hipY || 0;
    const hipX = gait?.supportX ?? 0;
    const hipZ = (p.hipZ || 0) + (gait?.supportZ ?? 0);
    const chestZ = p.chestZ || 0;
    const lift = Math.max(0, p.lift || 0);
    const tailAngle = p.tailAngle || 0;
    const hairLag = p.hairLag || 0;

    currentLift = lift;

    // Reset baselines (no accumulated transforms across frames)
    boneHead.scale.set(1, 1, 1);
    boneChest.scale.set(1, 1, 1);
    boneRoot.scale.set(1, 1, 1);

    // Root / Lift handling:
    // If lift === 0 (grounded / crouch), feet stay rooted on ground while hips displace by hipY.
    // If lift > 0 (in-air), entire character lifts cleanly off ground together.
    boneRoot.position.set(
      REST_BONE_ROOT_POS.x + hipX,
      REST_BONE_ROOT_POS.y + lift + hipY,
      REST_BONE_ROOT_POS.z + hipZ
    );

    // Feet follow lift, while hip motion is absorbed by the knees and torso.
    boneLeftFoot.position.set(leftFootRest.x-hipX+(gait?.leftX ?? 0), leftFootRest.y-hipY+(gait?.leftY ?? 0), leftFootRest.z-hipZ+(gait?.leftZ ?? 0));
    boneRightFoot.position.set(rightFootRest.x-hipX+(gait?.rightX ?? 0), rightFootRest.y-hipY+(gait?.rightY ?? 0), rightFootRest.z-hipZ+(gait?.rightZ ?? 0));
    boneLeftFoot.rotation.set(gait?.leftPitch ?? 0, gait?.leftYaw ?? 0, 0, 'YXZ');
    boneRightFoot.rotation.set(gait?.rightPitch ?? 0, gait?.rightYaw ?? 0, 0, 'YXZ');

    updateShins();

    // Torso subtle breathing expansion & small displacement without scaling bones
    boneChest.position.set(
      REST_BONE_CHEST_POS.x,
      REST_BONE_CHEST_POS.y + breathe * 0.008,
      REST_BONE_CHEST_POS.z + breathe * 0.004 + chestZ
    );
    boneChest.rotation.set(chestPitch, 0, chestRoll);

    // Head orientation (independent socket)
    boneHead.rotation.set(headPitch, headYaw, headRoll);

    // Secondary hair lag on back strands
    boneHair.rotation.set(hairLag, 0, 0);

    // The skirt and stem use the same pelvis translation through crouch
    // and landing. Rotation and the distributed stem bend are secondary.
    tailPivot.position.copy(tailPivotPos).add(boneRoot.position).sub(REST_BONE_ROOT_POS);
    tailPivot.rotation.set(-chestPitch * 0.3, 0, chestRoll * 0.2);
    tailMesh.material.uniforms.uTailBend.value = tailAngle;
    cupArm.reset();

    skinnedBody.updateMatrixWorld(true);
  }

  function getSoleLift() {
    return currentLift;
  }

  return {
    body: skinnedBody,
    head: boneHead,
    tail: tailPivot,
    skeleton: skeleton,
    setPose: setPose,
    reset: reset,
    getSoleLift: getSoleLift,
    feetRest: {left:REST_LFOOT_POS, right:REST_RFOOT_POS},
    cupArm,
    diagnostics: Object.freeze({
      vertexCount: vertCount,
      boneCount: bones.length,
      headRestWorld: REST_HEAD_POS.clone(),
      tailPivotRest: tailPivotPos.clone(),
      isGPUSkinned: true
    })
  };
}

function createFishFaceSurface(THREE, body, calibration, imageData, headRestPosition) {
  const ray = new THREE.Raycaster();
  const start = new THREE.Vector3();
  const forward = new THREE.Vector3(0, 0, -1);
  const intersections = [];
  const {min, max, refX0, refX1, refY0, refY1} = calibration;
  // The eyelids use the same orthographic image-to-mesh calibration as the eyes.
  // The body is detached at bind time so each ray is in rig coordinates.
  body.updateMatrixWorld(true);

  const pixelX = px => THREE.MathUtils.lerp(min.x, max.x, (px - refX0) / (refX1 - refX0));
  const pixelY = py => THREE.MathUtils.lerp(max.y, min.y, (py - refY0) / (refY1 - refY0));
  const faceDepth = prepareDepthPatch(33, 103, 79, 118);

  function point(px, py, offset = 0.002, depthAt = faceDepth) {
    const x = pixelX(px), y = pixelY(py);
    const depth = depthAt(x, y);
    if (Number.isFinite(depth) && depth > 0.04) return new THREE.Vector3(x, y, depth + offset);
    start.set(x, y, max.z + 0.8);
    ray.set(start, forward);
    intersections.length = 0;
    ray.intersectObject(body, false, intersections);
    const hit = intersections[0];
    if (!hit || hit.point.z < 0.04) throw new Error('眼睑超出正面区域：' + px + ', ' + py);
    return new THREE.Vector3(x, y, hit.point.z + offset);
  }

  function skinColor(px, py) {
    const cx = Math.round(px);
    let count = 0, red = 0, green = 0, blue = 0;
    for (let y = 103; y <= 106; y++) {
      for (let x = cx - 2; x <= cx + 2; x++) {
        const i = (y * imageData.width + x) * 4;
        const r = imageData.data[i], g = imageData.data[i + 1], b = imageData.data[i + 2];
        if (r < 231 || g < 188 || b > r + 4) continue;
        red += r; green += g; blue += b; count++;
      }
    }
    if (!count) return new THREE.Color(0xf9e3d7);
    const shade = THREE.MathUtils.clamp((py - 84) / 19, 0, 1);
    return new THREE.Color().setRGB(red / (count * 255), (green / count - 1 + shade) / 255,
      (blue / count - 2 + 2 * shade) / 255, THREE.SRGBColorSpace);
  }
  function prepareDepthPatch(left, right, top, bottom) {
    const minX = pixelX(left) - 0.004, maxX = pixelX(right) + 0.004;
    const minY = pixelY(bottom) - 0.004, maxY = pixelY(top) + 0.004;
    const columns = 28, rows = 18;
    const cells = Array.from({length: columns * rows}, () => []);
    const col = x => Math.max(0, Math.min(columns - 1, Math.floor(columns * (x - minX) / (maxX - minX))));
    const row = y => Math.max(0, Math.min(rows - 1, Math.floor(rows * (y - minY) / (maxY - minY))));
    const indices = body.geometry.index.array;
    const vertices = body.geometry.attributes.position;
    const faces = atob(fishFacePatchTriangles);
    for (let offset = 0; offset < faces.length; offset += 2) {
      const i = (faces.charCodeAt(offset) | (faces.charCodeAt(offset + 1) << 8)) * 3;
      const a = indices[i], b = indices[i + 1], c = indices[i + 2];
      const ax = vertices.getX(a), ay = vertices.getY(a), az = vertices.getZ(a);
      const bx = vertices.getX(b), by = vertices.getY(b), bz = vertices.getZ(b);
      const cx = vertices.getX(c), cy = vertices.getY(c), cz = vertices.getZ(c);
      if (Math.max(az, bz, cz) < 0.04) continue;
      const x0 = Math.min(ax, bx, cx), x1 = Math.max(ax, bx, cx);
      const y0 = Math.min(ay, by, cy), y1 = Math.max(ay, by, cy);
      if (x1 < minX || x0 > maxX || y1 < minY || y0 > maxY) continue;
      const abx = ax - cx, aby = ay - cy, bbx = bx - cx, bby = by - cy;
      const area = abx * bby - aby * bbx;
      if (Math.abs(area) < 1e-10 || (body.material.side === THREE.FrontSide && area < 0)) continue;
      const triangle = {cx, cy, cz, au: bby / area, av: -bbx / area, bu: -aby / area, bv: abx / area, dzA: az - cz, dzB: bz - cz};
      for (let y = row(y0); y <= row(y1); y++) {
        for (let x = col(x0); x <= col(x1); x++) cells[y * columns + x].push(triangle);
      }
    }
    return function depthAt(x, y) {
      if (x < minX || x > maxX || y < minY || y > maxY) return -Infinity;
      let z = -Infinity;
      for (const tri of cells[row(y) * columns + col(x)]) {
        const dx = x - tri.cx, dy = y - tri.cy;
        const u = dx * tri.au + dy * tri.av;
        const v = dx * tri.bu + dy * tri.bv;
        if (u < -1e-6 || v < -1e-6 || u + v > 1.000001) continue;
        z = Math.max(z, tri.cz + u * tri.dzA + v * tri.dzB);
      }
      return z;
    };
  }

  return {point, skinColor, prepareDepthPatch: () => faceDepth, headRestPosition,
    pixelHeight: (max.y-min.y)/(refY1-refY0),
    pixelYAtZero: refY0+max.y*(refY1-refY0)/(max.y-min.y)};
}

function fishEyeSpline(values, u) {
  const n=values.length-1;
  const progress=Math.max(0,Math.min(1,u))*n;
  const index=Math.min(Math.floor(progress),n-1);
  const t=progress-index;
  const a=values[Math.max(0,index-1)], b=values[index], c=values[index+1], d=values[Math.min(n,index+2)];
  return b+0.5*t*(c-a+t*(2*a-5*b+4*c-d+t*(3*b-3*c+d-a)));
}

// Preserve some upper-lid curvature through the middle of the blink.
const fishMidBlinkArc = 3.15;
const fishJoySeamLift = 9.0;

function fishEyeFrame(profile, u, blink, smile, joy, base) {
  const top=base?.top ?? fishEyeSpline(profile.top,u);
  const bottom=base?.bottom ?? fishEyeSpline(profile.bottom,u);
  const arch=4*u*(1-u);
  const neutralSeam=profile.seam[0]+(profile.seam[1]-profile.seam[0])*u+4*arch;
  const seam=neutralSeam-Math.min(fishJoySeamLift*joy*arch,Math.max(0,neutralSeam-top));
  const lowerPhase=Math.pow(blink,1.33);
  const lowerRest=bottom-1.75*arch*smile;
  const midway = 4 * blink * (1 - blink);
  const travel = seam - top;
  const closing = Math.max(0, travel - 1.33 * Math.max(0, seam - lowerRest));
  const arc = Math.min(fishMidBlinkArc * arch, 0.28 * closing);
  const upper = top + travel * blink - arc * midway * midway;
  return {top,bottom,seam,arch,upper,lower:lowerRest+(seam-lowerRest)*lowerPhase};
}

function fishEyeCurveGLSL(values) {
  const last=values.length-1;
  const rows=[];
  const f=n=>Number(n).toFixed(5);
  for(let i=0;i<last;i++){
    const a=values[Math.max(0,i-1)],b=values[i],c=values[i+1],d=values[Math.min(last,i+2)];
    rows.push(`  ${i<last-1?'if (t < '+f(i+1)+') ':''}return fishEyeCubic(${[a,b,c,d].map(f).join(',')}, t-${f(i)});`);
  }
  return `float FUNCTION(float u) { float t=clamp(u,0.0,1.0)*${f(last)};\n${rows.join('\n')}\n}`;
}

const fishEyeCurvesSource = `
float fishEyeCubic(float a, float b, float c, float d, float t) {
  return b + 0.5*t*(c-a+t*(2.0*a-5.0*b+4.0*c-d+t*(3.0*b-3.0*c+d-a)));

function polishFishNormals(geometry) {
  const pos = geometry.attributes.position;
  const norm = geometry.attributes.normal;
  const idx = geometry.index;
  if (!pos || !norm || !idx) return geometry;

  const pArray = pos.array;
  const nArray = norm.array;
  const iArray = idx.array;
  const count = pos.count;

  const isCandidate = new Uint8Array(count);
  for (let i = 0; i < count; i++) {
    const x = pArray[i * 3];
    const y = pArray[i * 3 + 1];
    const z = pArray[i * 3 + 2];

    if (y >= 0.015 && y <= 0.32 && z > 0.055) continue;
    if (y >= 0.30 && y <= 0.44 && z > 0.01 && Math.abs(x) < 0.16) continue;
    if (y >= 0.04 && y <= 0.15 && z > 0.08 && Math.abs(x) < 0.11) continue;

    const isHair = (y < 0.31 && y > -0.30 && z <= 0.06);
    const isSkirtJoin = (y >= -0.36 && y <= -0.20 && z >= -0.12 && z <= 0.08 && x > 0.14);

    if (isHair || isSkirtJoin) {
      isCandidate[i] = 1;
    }
  }

  const edgeMap = new Map();
  const addEdge = (u, v) => {
    const key = u < v ? (u + ":" + v) : (v + ":" + u);
    edgeMap.set(key, (edgeMap.get(key) || 0) + 1);
  };

  const adj = Array.from({ length: count }, () => []);
  for (let i = 0; i < iArray.length; i += 3) {
    const a = iArray[i], b = iArray[i + 1], c = iArray[i + 2];
    adj[a].push(b, c);
    adj[b].push(a, c);
    adj[c].push(a, b);
    addEdge(a, b);
    addEdge(b, c);
    addEdge(c, a);
  };

  const isSilhouette = new Uint8Array(count);
  for (const [key, edgeCount] of edgeMap.entries()) {
    if (edgeCount === 1) {
      const parts = key.split(":");
      isSilhouette[+parts[0]] = 1;
      isSilhouette[+parts[1]] = 1;
    }
  }

  const curNormals = new Float32Array(nArray);
  const nextNormals = new Float32Array(nArray);

  for (let iter = 0; iter < 2; iter++) {
    for (let i = 0; i < count; i++) {
      if (!isCandidate[i] || isSilhouette[i]) continue;

      const i3 = i * 3;
      const nx = curNormals[i3];
      const ny = curNormals[i3 + 1];
      const nz = curNormals[i3 + 2];

      let accX = nx * 2.0;
      let accY = ny * 2.0;
      let accZ = nz * 2.0;
      let wSum = 2.0;

      const nbrs = adj[i];
      for (let j = 0; j < nbrs.length; j++) {
        const nb = nbrs[j];
        const nb3 = nb * 3;
        const nbx = curNormals[nb3];
        const nby = curNormals[nb3 + 1];
        const nbz = curNormals[nb3 + 2];
        const cosSim = nx * nbx + ny * nby + nz * nbz;

        if (cosSim >= 0.68) {
          const w = cosSim * cosSim;
          accX += nbx * w;
          accY += nby * w;
          accZ += nbz * w;
          wSum += w;
        }
      }

      const length = Math.hypot(accX / wSum, accY / wSum, accZ / wSum);
      if (length < 1e-6) continue;
      const invLen = 1.0 / length;
      nextNormals[i3] = (accX / wSum) * invLen;
      nextNormals[i3 + 1] = (accY / wSum) * invLen;
      nextNormals[i3 + 2] = (accZ / wSum) * invLen;
    }
    curNormals.set(nextNormals);
  }

  norm.array.set(curNormals);
  norm.needsUpdate = true;
  return geometry;
}

  float laceZone = isSkirt * smoothstep(-0.46, -0.41, bindPos.y) * (1.0 - smoothstep(-0.35, -0.30, bindPos.y));
  float laceCoord = (bindPos.x + bindPos.z * 0.5) * 110.0;
  float laceWave = 0.5 + 0.5 * cos(laceCoord);

  vec3 totalOffset = hairLight + satinColor + laceColor;
  float maxComponent = max(totalOffset.r, max(totalOffset.g, totalOffset.b));

function sculptFishSurface(geometry) {
  const posAttr = geometry.attributes.position;
  if (!posAttr) return { hairVertices: 0, hemVertices: 0, maxMove: 0 };

  const positions = posAttr.array;
  const count = posAttr.count;

  let hairVertices = 0;
  let hemVertices = 0;
  let maxMove = 0;

  // 5 hand-shaped asymmetric wavy locks for long rear hair
  // xCenter(y) = x0 + kX1 * y + kX2 * y^2 + waveAmp * sin(waveFreq * y + wavePhase)
  const locks = [
    { yTop: 0.32, yBot: -0.32, w: 0.046, amp: 0.0125, x0: -0.008, kX1: -0.020, kX2: -0.040, wA: 0.012, wF: 8.5, wP: 0.2 },
    { yTop: 0.28, yBot: -0.28, w: 0.038, amp: 0.0110, x0: -0.055, kX1: -0.045, kX2:  0.030, wA: 0.010, wF: 9.2, wP: 1.1 },
    { yTop: 0.29, yBot: -0.30, w: 0.040, amp: 0.0115, x0:  0.048, kX1:  0.040, kX2: -0.035, wA: 0.011, wF: 8.8, wP: 2.3 },
    { yTop: 0.24, yBot: -0.23, w: 0.031, amp: 0.0085, x0: -0.108, kX1: -0.030, kX2:  0.060, wA: 0.008, wF: 10.4, wP: 3.5 },
    { yTop: 0.25, yBot: -0.24, w: 0.033, amp: 0.0090, x0:  0.102, kX1:  0.032, kX2: -0.050, wA: 0.008, wF: 9.8, wP: 4.6 }
  ];

  for (let i = 0; i < count; i++) {
    const idx = i * 3;
    const px = positions[idx];
    const py = positions[idx + 1];
    const pz = positions[idx + 2];

    let isHair = false;
    let isHem = false;

    // --- 1. REAR HAIR SCULPTING (z < -0.12, negative z direction) ---
    if (pz < -0.12 && py > -0.35 && py < 0.33) {
      // Smooth protection mask: preserve front face/hat (pz >= -0.12) & side outer bounds (|px| >= 0.17)
      const zDepth = (-pz - 0.12) / 0.12; // 0 at z=-0.12, 1 at z=-0.24
      const zMask = zDepth <= 0 ? 0 : (zDepth >= 1 ? 1 : zDepth * zDepth * (3 - 2 * zDepth));

      const absX = Math.abs(px);
      const xFactor = (0.17 - absX) / 0.05; // 1 at |px|<=0.12, 0 at |px|>=0.17
      const xMask = xFactor <= 0 ? 0 : (xFactor >= 1 ? 1 : xFactor * xFactor * (3 - 2 * xFactor));

      const hairMask = zMask * xMask;

      if (hairMask > 1e-4) {
        let netPattern = 0;

        for (let l = 0; l < 5; l++) {
          const lock = locks[l];
          if (py < lock.yBot || py > lock.yTop) continue;

          // Vertical root & tip smooth taper falloff
          const yRange = lock.yTop - lock.yBot;
          const yRel = (py - lock.yBot) / yRange;
          const yFade = 16 * yRel * (1 - yRel) * yRel * (1 - yRel); // smooth 4th-order bell taper

          // Curving trajectory of the hair lock spine
          const spineX = lock.x0 + lock.kX1 * py + lock.kX2 * py * py + lock.wA * Math.sin(lock.wF * py + lock.wP);
          const dX = (px - spineX) / lock.w;
          const dX2 = dX * dX;

          if (dX2 < 4.0) {
            // Main ridge: bell shaped positive displacement
            const ridge = (Math.exp(-1.8 * dX2) - Math.exp(-7.2)) * lock.amp;
            // Subtle lateral channel / groove on lock flank: ~.002 - .004
            const groove = -0.0032 * Math.exp(-2.5 * (dX2 - 1.35) ** 2)
              * (1 - dX2 / 4) ** 2;
            netPattern += (ridge + groove) * Math.min(1.0, yFade * 2.5);
          }
        }

        if (netPattern !== 0) {
          const d = netPattern * hairMask * 0.65;
          positions[idx + 2] -= d;

          const move = Math.abs(d);
          if (move > maxMove) maxMove = move;
          isHair = true;
        }
      }
    }

    // --- 2. SELECTIVE RIGHT REAR HEM & TAIL ANCHOR MICRO ROUNDING ---
    // Target zone: x: 0.13..0.21, y: -0.40..-0.34, z: -0.11..-0.04
    if (px > 0.12 && px < 0.22 && py > -0.41 && py < -0.33 && pz > -0.12 && pz < -0.03) {
      const cx = 0.17, rx = 0.04;
      const cy = -0.37, ry = 0.035;
      const cz = -0.075, rz = 0.04;

      const qx = (px - cx) / rx;
      const qy = (py - cy) / ry;
      const qz = (pz - cz) / rz;
      const q2 = qx * qx + qy * qy + qz * qz;

      if (q2 < 1.0) {
        // Falloff width > 0.025 with max displacement < 0.005 to prevent fold-over
        const tuckMask = (1 - q2) * (1 - q2);
        const tuckAmt = 0.0032 * tuckMask; // micro smooth tuck, strictly < 0.005

        positions[idx]     -= 0.6 * tuckAmt;
        positions[idx + 1] += 0.8 * tuckAmt;

        if (tuckAmt > maxMove) maxMove = tuckAmt;
        isHem = true;
      }
    }

    if (isHair) hairVertices++;
    if (isHem) hemVertices++;
  }

  posAttr.needsUpdate = true;
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  return { hairVertices, hemVertices, maxMove };
}

<script>
function relaxFishRearHair(geometry) {
  const position = geometry.getAttribute('position');
  const indices = geometry.index.array;
  const neighbors = Array.from({length:position.count}, () => []);
  for (let i = 0; i < indices.length; i += 3) {
    const a = indices[i], b = indices[i + 1], c = indices[i + 2];
    neighbors[a].push(b, c);
    neighbors[b].push(a, c);
    neighbors[c].push(a, b);
  }
  const depth = new Float32Array(position.count);
  const relax = new Float32Array(position.count);
  const ease = (low, high, n) => {
    const t = Math.min(1, Math.max(0, (n - low) / (high - low)));
    return t * t * (3 - 2 * t);
  };
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i), y = position.getY(i), z = position.getZ(i);
    depth[i] = z;
    relax[i] = ease(-0.38, -0.28, y) * (1 - ease(-0.10, 0.06, y))
      * ease(-0.11, -0.20, z) * (1 - ease(0.15, 0.22, Math.abs(x)));
  }
  let current = depth.slice();
  let next = depth.slice();
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < current.length; i++) {
      const local = neighbors[i];
      if (!relax[i] || !local.length) continue;
      let sum = 0, count = 0;
      for (const neighbor of local) {
        if (Math.abs(depth[neighbor] - depth[i]) > 0.027) continue;
        sum += current[neighbor];
        count++;
      }
      if (count) {
        const shift = current[i] - depth[i] + (sum / count - current[i]) * relax[i] * 0.42;
        next[i] = depth[i] + Math.max(-0.008, Math.min(0.008, shift));
      }
    }
    [current, next] = [next, current];
  }
  for (let i = 0; i < current.length; i++) position.setZ(i, current[i]);
  position.needsUpdate = true;
}

const fishRearColorSource = `
  vec3 blendRearHair(vec3 color, vec3 p, vec3 originalNormal) {
    float belowCrown = (1.0 - smoothstep(0.03, 0.24, p.y)) * smoothstep(-0.35, -0.28, p.y);
    float rear = smoothstep(0.115, 0.205, -p.z);
    float center = 1.0 - smoothstep(0.16, 0.24, abs(p.x));
    float layer = belowCrown * rear * center;
    float flow = p.x + 0.018 * sin(p.y * 13.0 + p.x * 5.0);
    float footprint = fwidth(flow);
    float band = 1.0-smoothstep(0.8,2.8,footprint*45.0);
    float fiber = 1.0-smoothstep(0.55,2.5,footprint*88.0);
    float bands = cos(flow*45.0)*0.005*band + sin(flow*88.0)*0.003*fiber;
    float surface = clamp(-originalNormal.z, 0.0, 1.0);
    vec3 indigo = vec3(0.066, 0.095, 0.278);
    vec3 tips = vec3(0.086, 0.136, 0.318);

    tint *= 0.91 + 0.09 * surface;
    tint += bands * vec3(0.45, 0.65, 1.0);
    return mix(color, tint, layer * 0.56);

const fishTressMaterialSource = `
vec3 fishHeightNormal(vec3 normalView, vec3 surfaceDx, vec3 surfaceDy, vec2 heightDiff, float amplitude, float maxSlope) {
    vec3 covectorX = cross(surfaceDy, normalView);
    vec3 covectorY = cross(normalView, surfaceDx);
    float det = dot(surfaceDx, covectorX);

    if (abs(det) < 1e-10) {
        return normalView;
    }

    vec3 bump = (heightDiff.x * covectorX + heightDiff.y * covectorY) * (amplitude / det);
    float bumpLen = length(bump);

    if (bumpLen > maxSlope && bumpLen > 1e-6) {
        bump *= (maxSlope / bumpLen);
    }

    return normalize(normalView - bump);
}

uniform sampler2D uFishHairGuides;

vec3 fishShadeTressesBase(vec3 color, vec3 detail, vec3 position, vec3 normal, float frontCoverage) {
  float mask = detail.x * (1.0 - smoothstep(0.10, 0.61, frontCoverage));
  float along = detail.z;
  float crest = smoothstep(0.18, 0.94, detail.y);
  float side = smoothstep(0.18, 0.60, detail.y) * (1.0 - smoothstep(0.66, 0.98, detail.y));
  float outer = 1.0 - smoothstep(0.10, 0.54, detail.y);
  float reflected = smoothstep(0.20, 0.65, along) * (1.0 - smoothstep(0.74, 0.99, along));
  float thread = atan(position.x, max(0.001, 0.027-position.z)) * 56.0 + sin(along*10.0)*0.72;
  float fine = cos(thread) / (1.0 + 2.7 * fwidth(thread));
  if (mask < 0.006) return color;
  float upper = clamp(0.5 + normal.y * 0.5, 0.0, 1.0);
  vec3 palette = mix(vec3(0.072, 0.099, 0.264), vec3(0.092, 0.151, 0.352),
    smoothstep(0.23, 0.98, along));

  vec3 shade = softBase * (0.91 + 0.17 * crest + 0.045 * upper - 0.14 * outer + 0.018 * fine);
  shade += vec3(0.012, 0.020, 0.037) * (crest * 0.32 + side * reflected);

}


float fishRearRootMask(vec3 p) {
  float taper=smoothstep(0.196,0.238,p.y)*(1.0-smoothstep(0.355,0.397,p.y));
  float back=smoothstep(0.077,0.130,-p.z);
  return taper*back*(1.0-smoothstep(0.105,0.205,abs(p.x)));

// Keep the high-detail portrait on the face and light the crown in the room.
vec3 fishShadeCrown(vec3 color, vec3 base, vec3 p, vec3 viewN, vec3 viewP) {
  // Fill the pale scan mark on the blue temple lock with adjacent pigment.
  vec3 offset = abs(p-vec3(0.121,0.121,0.214))/vec3(0.006,0.027,0.018);
  if (max(max(offset.x,offset.y),offset.z)<1.0 && base.b-base.r>0.20) {
    vec3 mask = 1.0-smoothstep(vec3(0.66),vec3(1.0),offset);
    color=mix(color,vec3(0.076,0.117,0.413),mask.x*mask.y*mask.z);
  }
  float upperRear = smoothstep(0.018,0.075,-p.z)*(1.0-smoothstep(0.116,0.178,-p.z));
  float crownEnd = 0.351+0.074*upperRear;
  float crown = smoothstep(0.127,0.192,p.y)*(1.0-smoothstep(crownEnd-0.039,crownEnd,p.y));
  float temple = smoothstep(0.147,0.219,abs(p.x))
    * smoothstep(0.074,0.112,p.y) * (1.0-smoothstep(0.165,0.207,p.y));
  float baseBlue = smoothstep(0.030,0.105,base.b-base.r) * smoothstep(0.025,0.085,base.b-base.g);
  float paintedBlue = smoothstep(0.024,0.090,color.b-color.r)
    * smoothstep(0.013,0.059,color.b-color.g);
  float curlMask = smoothstep(0.373,0.421,p.y)*smoothstep(0.105,0.135,p.z)
    * (1.0-smoothstep(-0.086,-0.030,p.x));
  float zone = max(max(crown,temple*0.83),curlMask*0.70)*baseBlue*paintedBlue
    *(1.0-0.79*fishRearRootMask(p));
  vec3 localDx=dFdx(p), localDy=dFdy(p);
  vec3 dx=dFdx(viewP), dy=dFdy(viewP);
  if(zone<0.004) return color;

  // The broad ridges curve from the part toward the temples. A second
  // filtered frequency gives the broad locks texture at portrait distance.
  vec3 scalp = p-vec3(-0.024,0.213,0.028);
  float bearing = atan(scalp.x,scalp.z+1e-6);
  float fall = (0.31-p.y)/0.26;
  float arc = 2.7*fall+2.0*bearing;
  float wave = 3.0*bearing+0.75;
  float course = bearing+0.19*sin(arc)+0.13*fall;
  float section = 8.0*course+0.62*sin(wave);
  float thread = 28.0*course+0.36*sin(section);
  // Differentiate the hair flow from the position gradients, so pixels
  // outside the hair can skip the trigonometry without undefined derivatives.
  vec2 dBearing=vec2(scalp.z*localDx.x-scalp.x*localDx.z,scalp.z*localDy.x-scalp.x*localDy.z)
    / max(1e-5,dot(scalp.xz,scalp.xz));
  vec2 dFall=-vec2(localDx.y,localDy.y)/0.26;
  vec2 dCourse=dBearing+0.19*cos(arc)*(2.7*dFall+2.0*dBearing)+0.13*dFall;
  vec2 dSection=8.0*dCourse+1.86*cos(wave)*dBearing;
  vec2 dThread=28.0*dCourse+0.36*cos(section)*dSection;
  float sectionWidth=dot(abs(dSection),vec2(1.0));
  float threadWidth=dot(abs(dThread),vec2(1.0));
  float lock=cos(section)/(1.0+0.70*sectionWidth);
  float upperSoftness = upperRear*smoothstep(0.282,0.379,p.y);
  float strand=cos(thread)*(1.0-0.72*upperSoftness)/(1.0+1.30*threadWidth);
  vec2 slope=-0.74*sin(section)*dSection-0.26*(1.0-0.72*upperSoftness)*sin(thread)*dThread;

  vec3 alongX = cross(dy,viewN), alongY = cross(viewN,dx);
  float determinant = dot(dx,alongX);
  float detail = 1.0/(1.0+0.65*sectionWidth+0.24*threadWidth);
  vec3 bump = (alongX*slope.x+alongY*slope.y)
    * (0.00082*detail*sign(determinant)/max(1e-9,abs(determinant)));
  vec3 normal = normalize(viewN-bump*min(1.0,0.16/max(0.0001,length(bump))));
  vec3 key = fishLightDirection(uFishKeyWorld,viewP,normal);
  vec3 fill = fishLightDirection(uFishFillWorld,viewP,normal);
  vec3 eye = fishSafeNormalize(-viewP,normal);
  float softLight = fishRoomDiffuse(normal,key,0.49);
  float bounce = fishRoomDiffuse(normal,fill,0.61);
  float valley = smoothstep(0.25,0.84,-lock);
  float front = smoothstep(0.060,0.183,p.z);
  float excess = dot(color-base,vec3(0.2126,0.7152,0.0722));
  float rear = smoothstep(0.028,0.153,-p.z);
  float paintLight = dot(color,vec3(0.2126,0.7152,0.0722));
  float paintedGlare = max(smoothstep(0.016,0.085,excess),
    rear*smoothstep(0.105,0.205,paintLight)*0.85);
  float ends = smoothstep(0.07,0.82,fall);
  vec3 rootTone = mix(base*vec3(0.79,0.83,0.99),vec3(0.056,0.083,0.224),rear*0.60);
  vec3 endTone = mix(base*vec3(0.99,1.12,1.16),vec3(0.085,0.148,0.333),rear*0.51);
  vec3 baseTone = mix(rootTone,endTone,ends);
  vec3 tint = mix(color,baseTone,paintedGlare*mix(0.82,0.79,front));
  tint *= 0.88+0.25*softLight+0.105*bounce+mix(0.092,0.147,rear)*lock

  tint = mix(tint,vec3(0.043,0.071,0.196),rear*valley*shadowSide*0.39);

  tint += vec3(0.010,0.018,0.034)*temple*(1.0-front)*crest*bounce;

    * max(0.0,dot(normal,key)) * (0.49+0.31*lock);

  // light. The arc is continuous across the bangs and modulated by each lock.
  float glossHeight=0.258+0.017*cos(3.0*bearing+0.63)
    -0.018*smoothstep(0.09,0.21,abs(p.x+0.028));
  float across=(p.y-glossHeight)/0.024;
  float lockSheen=exp2(-1.8*across*across)*(0.36+0.64*crest);
  float brightPaint=front*smoothstep(0.105,0.184,paintLight);
  vec3 frontIndigo=vec3(0.073,0.112,0.360)*(0.88+0.23*softLight+0.085*lock);

  float rearReflection = exp2(-1.55*rearBand*rearBand)*separated*rear;
  tint += vec3(0.070,0.114,0.240)*rearReflection*(0.48+0.52*softLight);

}

vec3 fishPolishSideLock(vec3 color, vec3 pigment, vec3 p, vec3 viewN,
    vec3 viewP, float frontFacing) {
  if (p.x > -0.171 || p.y > 0.092 || p.y < -0.191 ||
      p.z < -0.044 || p.z > 0.116 || frontFacing >= 0.77) return color;

  // its shape in bind space so the color follows the same strands in motion.

  float across=(p.z-center)/(0.057+0.012*run);

    smoothstep(0.014,0.053,pigment.b-pigment.g);
  float side=1.0-smoothstep(0.37,0.77,frontFacing);
  float weight=max(area,shoulder)*blue*side*smoothstep(0.171,0.209,-p.x);
  if (weight <= 0.0) return color;
  vec3 key=fishLightDirection(uFishKeyWorld,viewP,viewN);
  vec3 fill=fishLightDirection(uFishFillWorld,viewP,viewN);
  float light=fishRoomDiffuse(viewN,key,0.48);
  float bounce=fishRoomDiffuse(viewN,fill,0.61);
  float crest=max(exp2(-1.75*across*across),0.72*exp2(-1.65*upper.x*upper.x)*shoulder);
  float longitudinal=along-0.16-0.21*across;
  float ribbon=exp2(-3.6*longitudinal*longitudinal)*crest;
  vec3 shade=mix(vec3(0.052,0.077,0.205),vec3(0.071,0.104,0.282),crest);
  shade*=0.86+0.20*light+0.085*bounce;
  shade+=vec3(0.006,0.012,0.033)*ribbon;
  return mix(color,shade,weight*0.83);
}

vec3 fishShadeTresses(vec3 color, vec3 detail, vec3 p, vec3 bindN, vec3 viewN,
    vec3 viewP, vec3 flow, vec2 sidePolish, float frontCoverage, float frontFacing) {
  color=fishShadeTressesBase(color,detail,p,bindN,frontCoverage);
  float depth=0.027-p.z;
  float theta=atan(p.x,depth+1e-6);
  float along=(0.30-p.y)/0.61;
  float crownRoot=fishRearRootMask(p);
  float rootHeight=mix(0.218,0.294,smoothstep(0.218,0.374,p.y));
  float guideHeight=mix(p.y,rootHeight,crownRoot);
  vec2 uv=vec2((theta+1.67)/3.34,(0.30-guideHeight)/(0.61*1.24));
  #if FISH_TEXTURE_GRADIENTS
  vec2 guideDx=dFdx(uv), guideDy=dFdy(uv);
  #else
  vec4 guide=texture2D(uFishHairGuides,uv);
  float height=guide.r-0.63*guide.b;
  vec2 slope=vec2(dFdx(height),dFdy(height));
  #endif
  vec3 dx=dFdx(viewP), dy=dFdy(viewP);
  float pigment=smoothstep(0.034,0.112,color.b-color.r)
    * smoothstep(0.014,0.068,color.b-color.g);
  float rear=smoothstep(0.072,0.163,depth)*(1.0-smoothstep(1.28,1.62,abs(theta)));
  float tips=smoothstep(-0.431,-0.405,p.y)*(1.0-smoothstep(-0.302,-0.259,p.y))
    * smoothstep(0.127,0.218,depth) * smoothstep(0.14,0.215,color.b);
  float side=sidePolish.x*smoothstep(0.062,0.17,depth);
  float outward=dot(bindN.xz,normalize(vec2(p.x,-depth)+vec2(1e-6,0.0)));
  float rearSurface=smoothstep(-0.35,0.32,outward);
  // Blend the rear material into the crown in bind space.
  float crownProtection=1.0-smoothstep(0.160,0.320,p.y);
  float broadRear=smoothstep(0.151,0.204,depth)*(1.0-smoothstep(0.90,1.30,abs(theta)))
    *smoothstep(-0.408,-0.378,p.y)*(1.0-smoothstep(0.217,0.270,p.y))*rearSurface;
  float outerHair=max(max(max(detail.x,side*0.57)*rearSurface,broadRear*0.94),
    tips*0.91*max(rearSurface,0.58));

    * smoothstep(-0.247,-0.173,p.y)*(1.0-smoothstep(0.219,0.266,p.y))
    * smoothstep(0.96,1.14,abs(theta))*(1.0-smoothstep(1.54,1.68,abs(theta)));

  float behindFin = 1.0-smoothstep(0.016,0.060,p.z)

    * (1.0-smoothstep(0.20,0.71,sidePolish.y));

  vec3 N=viewN;

  vec4 guide=fishSamplePortrait(uFishHairGuides,uv,guideDx,guideDy);
  float detailScale=fishReliefFootprint(guideDx,guideDy);
  if(detailScale>0.005) {
    // Sample the baked tangent slopes with the same footprint as the color.
    vec2 slope=fishReliefGradient(uFishHairSlope,uv,guideDx,guideDy,0.31206);
    N=fishHeightNormal(viewN,dx,dy,slope,0.00265*detailScale,0.24);
  }
  #else
  N=fishHeightNormal(viewN,dx,dy,slope,0.00265,0.24);
  #endif
  vec3 V=fishSafeNormalize(-viewP,N);
  vec3 key=fishLightDirection(uFishKeyWorld,viewP,N);
  vec3 fill=fishLightDirection(uFishFillWorld,viewP,N);
  float light=fishRoomDiffuse(N,key,0.47);
  float bounced=fishRoomDiffuse(N,fill,0.58);
  float root=smoothstep(0.08,0.48,along);
  float ends=smoothstep(0.54,0.99,along);
  float crest=smoothstep(0.28,0.90,0.76*guide.r+0.24*detail.y);
  float groove=guide.b;
  float shoulder=guide.a*(0.30+0.70*light);
  // Deep indigo between overlapping locks, cooler blue on the curled tips.
  // Match the bangs' indigo roots and blue curls, with a distinct
  // occlusion tone under each overlapping lock.
  vec3 shadow=mix(vec3(0.018,0.025,0.084),vec3(0.039,0.090,0.248),ends);
  vec3 lift=mix(vec3(0.064,0.101,0.304),vec3(0.176,0.356,0.680),ends);
  float tone=0.25+0.51*crest+0.18*light+0.06*bounced;
  vec3 palette=mix(shadow,lift,tone);
  vec3 shade=mix(color,palette,0.49+0.43*root);
  // Emphasize the painted joins through the body of the rear locks.
  float inkRegion=smoothstep(0.27,0.33,uv.x)*(1.0-smoothstep(0.69,0.745,uv.x))
    * smoothstep(0.13,0.24,uv.y)*(1.0-smoothstep(0.68,0.88,uv.y));
  float rearGroom=max(broadRear*rear,crownRoot)*(1.0-smoothstep(0.09,0.50,frontCoverage));
  shade=mix(shade,mix(shadow,lift,0.17+0.62*crest+0.13*light+0.06*bounced),rearGroom*0.81);
  shade*=0.92+0.16*crest+0.12*light+0.06*bounced
    -(0.46+max(0.24*inkRegion,0.39*rearGroom))*groove;
  float seamInk=rearGroom*smoothstep(0.50,0.83,groove);
  shade=mix(shade,mix(vec3(0.017,0.025,0.084),vec3(0.032,0.058,0.157),ends),seamInk*0.67);

  float reflection=smoothstep(0.08,0.83,guide.g)*(0.40+0.60*light)*(1.0-0.85*groove);
  shade+=vec3(0.115,0.171,0.306)*reflection;
  shade+=vec3(0.018,0.039,0.076)*shoulder*(1.0-0.73*groove);
  vec3 sheen=fishHairLobe(N,flow,V,key,fill)*(0.18+0.47*shoulder)*(1.0-0.75*groove);
  float facing=max(0.0,dot(N,V));
  float rim=(1.0-smoothstep(0.03,0.48,facing))*smoothstep(0.15,0.74,bounced);
  shade+=vec3(0.009,0.018,0.037)*rim*ends;
  float weight=1.0-pow(1.0-clamp(coverage,0.0,1.0),1.65);
  return mix(color,shade+sheen,weight);
}
`;

vec3 fishPolishLace(vec3 color, vec3 p, vec3 normal, vec3 viewNormal, vec3 viewPosition, float frontCoverage) {

<script>
/**
 * Polishes the TripoSR-derived chibi whale maid 3D mesh:
 * - Geometric smoothing: Edge-weighted tangential Taubin / Laplacian smoothing with bounded
 *   displacement and topological preservation (inversion / normal guard) targeting:
 *     1) Cloth flap remnants under positive-X hem
 *     2) Wobbly side hair tips
 * - Preserves authored front, face, legs/feet, tail clearance, hat, and ribbons.
 * - Injects `aSidePolish` (vec2: x=hair weight, y=cloth flap weight) for shader refinement.
 * - Includes GLSL snippet `fishSideSurfaceSource` providing `vec3 fishRefineUnderHem(...)`.
 */

function polishFishSideSurface(THREE, geometry) {
  const posAttr = geometry.attributes.position;
  const normalAttr = geometry.attributes.normal;
  const indexAttr = geometry.index;
  const count = posAttr.count;

  if (!indexAttr) {
    console.warn("polishFishSideSurface: indexed geometry required.");
    geometry.setAttribute('aSidePolish', new THREE.BufferAttribute(new Float32Array(count * 2), 2));
    return { maxDisplacement: 0, moved: 0, inversionGuards: 0 };
  }

  const pos = posAttr.array;
  const indices = indexAttr.array;
  const aFrontWeight = geometry.attributes.aFrontWeight ? geometry.attributes.aFrontWeight.array : null;
  const beforeTuck = new Float32Array(pos);
  const smooth = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  // 1. Build adjacency graph (with edge count and incident faces for inversion test)
  const adj = new Array(count);
  for (let i = 0; i < count; i++) adj[i] = [];

  const triCount = indices.length / 3;
  const incidentTris = new Array(count);
  for (let i = 0; i < count; i++) incidentTris[i] = [];

  for (let f = 0; f < triCount; f++) {
    const a = indices[f * 3];
    const b = indices[f * 3 + 1];
    const c = indices[f * 3 + 2];

    incidentTris[a].push(f);
    incidentTris[b].push(f);
    incidentTris[c].push(f);

    if (!adj[a].includes(b)) adj[a].push(b);
    if (!adj[a].includes(c)) adj[a].push(c);
    if (!adj[b].includes(a)) adj[b].push(a);
    if (!adj[b].includes(c)) adj[b].push(c);
    if (!adj[c].includes(a)) adj[c].push(a);
    if (!adj[c].includes(b)) adj[c].push(b);
  }

  // Pre-calculate face normals for inversion guard
  const faceNormals = new Float32Array(triCount * 3);
  const faceAreas = new Float32Array(triCount);
  function computeFaceNormal(f, out) {
    const i0 = indices[f * 3] * 3;
    const i1 = indices[f * 3 + 1] * 3;
    const i2 = indices[f * 3 + 2] * 3;
    const ax = pos[i1] - pos[i0], ay = pos[i1 + 1] - pos[i0 + 1], az = pos[i1 + 2] - pos[i0 + 2];
    const bx = pos[i2] - pos[i0], by = pos[i2 + 1] - pos[i0 + 1], bz = pos[i2 + 2] - pos[i0 + 2];
    let nx = ay * bz - az * by;
    let ny = az * bx - ax * bz;
    let nz = ax * by - ay * bx;
    const len = Math.hypot(nx, ny, nz);
    faceAreas[f] = len;
    if (len === 0) { out[0] = out[1] = out[2] = 0; return; }
    out[0] = nx / len;
    out[1] = ny / len;
    out[2] = nz / len;
  }

  const tmpFN = [0, 0, 0];
  for (let f = 0; f < triCount; f++) {
    computeFaceNormal(f, tmpFN);
    faceNormals[f * 3] = tmpFN[0];
    faceNormals[f * 3 + 1] = tmpFN[1];
    faceNormals[f * 3 + 2] = tmpFN[2];
  }

  function moveVertex(positions, i, candX, candY, candZ) {
    const i3 = i * 3;
    const tris = incidentTris[i];
    for (let t = 0; t < tris.length; t++) {
      const triIdx = tris[t];
      const v0 = indices[triIdx * 3] * 3;
      const v1 = indices[triIdx * 3 + 1] * 3;
      const v2 = indices[triIdx * 3 + 2] * 3;

      const p0x = (v0 === i3) ? candX : positions[v0];
      const p0y = (v0 === i3) ? candY : positions[v0 + 1];
      const p0z = (v0 === i3) ? candZ : positions[v0 + 2];

      const p1x = (v1 === i3) ? candX : positions[v1];
      const p1y = (v1 === i3) ? candY : positions[v1 + 1];
      const p1z = (v1 === i3) ? candZ : positions[v1 + 2];

      const p2x = (v2 === i3) ? candX : positions[v2];
      const p2y = (v2 === i3) ? candY : positions[v2 + 1];
      const p2z = (v2 === i3) ? candZ : positions[v2 + 2];

      const e1x = p1x - p0x, e1y = p1y - p0y, e1z = p1z - p0z;
      const e2x = p2x - p0x, e2y = p2y - p0y, e2z = p2z - p0z;

      const nnx = e1y * e2z - e1z * e2y;
      const nny = e1z * e2x - e1x * e2z;
      const nnz = e1x * e2y - e1y * e2x;

      const initNx = faceNormals[triIdx * 3];
      const initNy = faceNormals[triIdx * 3 + 1];
      const initNz = faceNormals[triIdx * 3 + 2];

      // Dot product with initial normal
      if (faceAreas[triIdx] > 1e-12 && nnx * initNx + nny * initNy + nnz * initNz <= faceAreas[triIdx] * 0.12) {
        return false;
      }
    }

    positions[i3] = candX;
    positions[i3 + 1] = candY;
    positions[i3 + 2] = candZ;
    return true;
  }

  const underHem = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const j = i * 3;
    const x = pos[j], y = pos[j + 1], z = pos[j + 2];
    const side = smooth(0.052, 0.076, x) * (1 - smooth(0.108, 0.158, x));
    const back = smooth(-0.162, -0.116, z) * (1 - smooth(-0.033, 0.008, z));
    const height = smooth(-0.478, -0.430, y) * (1 - smooth(-0.425, -0.335, y));
    const support = side * back * height;
    underHem[i] = support;
  }
  let tuckGuards = 0;
  for (let step = 1; step <= 6; step++) {
    for (let i = 0; i < count; i++) {
      if (underHem[i] <= 1e-5) continue;
      const j = i * 3;
      const targetY = beforeTuck[j + 1] + underHem[i] * 0.051 * step / 6;
      if (!moveVertex(pos, i, pos[j], targetY, pos[j + 2])) tuckGuards++;
    }
  }
  if (aFrontWeight) {
    for (let i = 0; i < count; i++) aFrontWeight[i] *= 1 - underHem[i] * 0.96;
  }
  if (geometry.attributes.aFrontWeight) geometry.attributes.aFrontWeight.needsUpdate = true;
  geometry.computeVertexNormals();


  // 2. Vertex masks and weights.
  const clothWeights = new Float32Array(count);
  const hairWeights = new Float32Array(count);
  const aSidePolish = new Float32Array(count * 2);
  const flapWeights = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const x = pos[i3];
    const y = pos[i3 + 1];
    const z = pos[i3 + 2];

    const fCover = aFrontWeight ? aFrontWeight[i] : 0.0;

    // Protect face, footwear and reference-colored front faces.
    if (y > 0.07 || z > 0.115 || fCover > 0.44 || y < -0.465) continue;
    const leg = smooth(-0.185, -0.162, x) * (1 - smooth(0.079, 0.112, x))
      * smooth(0.027, 0.057, z);
    const foot = (1 - smooth(-0.455, -0.425, y)) * smooth(-0.067, -0.014, z);
    const guard = (1 - Math.max(leg, foot)) * (1 - smooth(0.16, 0.44, fCover));
    const sideHem = smooth(0.10, 0.157, Math.abs(x)) * (1 - smooth(0.23, 0.285, Math.abs(x)))
      * smooth(-0.417, -0.365, y) * (1 - smooth(-0.270, -0.218, y))
      * smooth(-0.174, -0.113, z) * (1 - smooth(0.054, 0.112, z));
    const flap = smooth(0.083, 0.138, x) * (1 - smooth(0.193, 0.258, x))
      * smooth(-0.468, -0.428, y) * (1 - smooth(-0.371, -0.333, y))
      * smooth(-0.168, -0.116, z) * (1 - smooth(0.016, 0.070, z));
    const cWeight = Math.max(sideHem * 0.72, flap, underHem[i] * 0.90);
    flapWeights[i] = flap * guard;

    // Side hair tresses: abs(x) > .16, y in [-.31, -.05], z < .09
    let hWeight = 0.0;
    const absX = Math.abs(x);
    if (absX > 0.15 && y >= -0.33 && y <= -0.04 && z < 0.09) {
      const xFactor = Math.min(1.0, (absX - 0.15) / 0.06);
      const yFactor = (y >= -0.30 && y <= -0.08) ? 1.0 : (y < -0.30 ? (y - -0.33) / 0.03 : (-0.04 - y) / 0.04);
      const zFactor = z < 0.05 ? 1.0 : Math.max(0.0, (0.09 - z) / 0.04);
      hWeight = xFactor * yFactor * zFactor;
    }

    const frontDamp = 1 - smooth(0.059, 0.115, z);
    clothWeights[i] = cWeight * frontDamp * guard;
    hairWeights[i] = hWeight * frontDamp * guard * (1 - cWeight * 0.70);

    aSidePolish[i * 2] = hairWeights[i];
    aSidePolish[i * 2 + 1] = clothWeights[i];
  }

  // 3. Taubin Smoothing on targets (lambda > 0, mu < 0, lambda + mu < 0 to prevent shrinkage)
  const steps = 5;
  const lambda = 0.33;
  const mu = -0.24;
  const maxDisplacementCloth = 0.032; // strict bound in model units
  const maxDisplacementHair = 0.010;

  const origPos = new Float32Array(pos);
  const curPos = new Float32Array(pos);


  let diagnostics = {
    maxDisplacement: 0.0,
    moved: 0,
    inversionGuards: tuckGuards
  };

  for (let it = 0; it < steps * 2; it++) {
    const factor = (it % 2 === 0) ? lambda : mu;

    for (let i = 0; i < count; i++) {
      const cW = clothWeights[i];
      const hW = hairWeights[i];
      const totalW = Math.max(cW, hW);
      if (totalW <= 0.001) continue;

      const neighbors = adj[i];
      if (neighbors.length === 0) continue;

      const i3 = i * 3;
      let avgX = 0, avgY = 0, avgZ = 0;
      let wSum = 0;

      for (let n = 0; n < neighbors.length; n++) {
        const ni3 = neighbors[n] * 3;
        const edx = curPos[ni3] - curPos[i3];
        const edy = curPos[ni3 + 1] - curPos[i3 + 1];
        const edz = curPos[ni3 + 2] - curPos[i3 + 2];
        const eDist = Math.hypot(edx, edy, edz) + 1e-4;
        const weight = 1.0 / eDist; // cotan/edge weight proxy

        avgX += curPos[ni3] * weight;
        avgY += curPos[ni3 + 1] * weight;
        avgZ += curPos[ni3 + 2] * weight;
        wSum += weight;
      }

      avgX /= wSum;
      avgY /= wSum;
      avgZ /= wSum;

      // Displacement vector L(v)
      let dx = (avgX - curPos[i3]);
      let dy = (avgY - curPos[i3 + 1]);
      let dz = (avgZ - curPos[i3 + 2]);

      // Tangential projection (preserve cross-profile / prevent collapsing silhouette)
      let nx = normalAttr ? normalAttr.array[i3] : 0;
      let ny = normalAttr ? normalAttr.array[i3 + 1] : 0;
      let nz = normalAttr ? normalAttr.array[i3 + 2] : 1;
      const normalProj = dx * nx + dy * ny + dz * nz;
      // Allow slight normal smoothing for the ugly folded flap, purely tangential for hair
      const normalRetain = (cW > hW) ? 0.35 : 0.08;
      dx = dx - (1.0 - normalRetain) * normalProj * nx;
      dy = dy - (1.0 - normalRetain) * normalProj * ny;
      dz = dz - (1.0 - normalRetain) * normalProj * nz;

      // Draw the old flap in towards the skirt's underside before relaxing its edges.
      const tuck = it % 2 === 0 ? flapWeights[i] * 0.23 : 0;
      let candX = curPos[i3] + dx * factor * totalW - tuck * Math.max(0, curPos[i3] - 0.122);
      let candY = curPos[i3 + 1] + dy * factor * totalW + tuck * Math.max(0, -0.366 - curPos[i3 + 1]);
      let candZ = curPos[i3 + 2] + dz * factor * totalW + tuck * (-0.047 - curPos[i3 + 2]) * 0.32;

      // Bound displacement relative to original authored position
      const limit = Math.max(cW * maxDisplacementCloth, hW * maxDisplacementHair);
      let totalDx = candX - origPos[i3];
      let totalDy = candY - origPos[i3 + 1];
      let totalDz = candZ - origPos[i3 + 2];
      const dTotal = Math.hypot(totalDx, totalDy, totalDz);

      if (dTotal > limit && dTotal > 1e-5) {
        const s = limit / dTotal;
        candX = origPos[i3] + totalDx * s;
        candY = origPos[i3 + 1] + totalDy * s;
        candZ = origPos[i3 + 2] + totalDz * s;
      }

      if (!moveVertex(curPos, i, candX, candY, candZ)) diagnostics.inversionGuards++;
    }
  }

  // Commit updated positions back and update diagnostics
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const d = Math.hypot(curPos[i3] - beforeTuck[i3], curPos[i3 + 1] - beforeTuck[i3 + 1], curPos[i3 + 2] - beforeTuck[i3 + 2]);
    if (d > 1e-5) {
      diagnostics.moved++;
