vec3 fishUnderHemFinish(
    vec3 color,
    vec3 p,
    vec3 N,
    vec3 viewN,
    vec3 viewP,
    float clothMask,
    float frontCoverage
) {
    // Spatial gating for underskirt tuck (x in [0.07, 0.16], y in [-0.42, -0.325], z in [-0.16, 0.00])
    float xTuck = smoothstep(0.065, 0.09, abs(p.x)) * (1.0 - smoothstep(0.145, 0.175, abs(p.x)));
    float yTuck = smoothstep(-0.425, -0.395, p.y)  * (1.0 - smoothstep(-0.335, -0.315, p.y));
    float zTuck = smoothstep(-0.170, -0.130, p.z)  * (1.0 - smoothstep(-0.015, 0.020, p.z));

    // Monotonic tuck fold ramp along y depth
    float tuckDepth = clamp((-0.335 - p.y) / (0.41 - 0.335), 0.0, 1.0);
    float underHemWeight = xTuck * yTuck * zTuck * clothMask;

    // High frontCoverage protects cream lace and gold trim borders
    underHemWeight *= (1.0 - smoothstep(0.08, 0.42, frontCoverage));

    float seamHoriz = (1.0 - smoothstep(0.008, 0.029, abs(p.y + 0.362)));
    float seamDetail = 1.0 - seamHoriz * (0.28 + 0.18 * seamRib);

    vec3 key = fishLightDirection(uFishKeyWorld, viewP, viewN);
    float clothDiff = fishRoomDiffuse(viewN, key, 0.48);
    float groundBounce = clamp(-N.y * 0.5 + 0.5, 0.0, 1.0) * 0.22;

    vec3 viewP, float cloth, float frontCoverage) {

function createFishTailMesh(THREE, {isSideLight = false, isWireframe = false, roomLight} = {}) {
  function unpack(encoded, TypedArray) {
    const raw = atob(encoded);

  geometry.setAttribute('color', new THREE.BufferAttribute(unpack(fishTailMeshData.color, Uint8Array), 3, true));
  geometry.setIndex(new THREE.BufferAttribute(unpack(fishTailMeshData.index, Uint16Array), 1));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      ...roomLight,

    wireframe: isWireframe,

    vertexShader: `
      uniform float uTailBend;
      varying vec3 vTailColor;
      varying vec3 vTailNormal;
      varying vec3 vTailViewPoint;
      varying vec3 vTailBind;
      varying float vTailUp;

      void main() {
        float t = clamp((position.x - 0.118) / 0.135, 0.0, 1.0);
        float angle = uTailBend * t*t*(3.0-2.0*t);
        float slope = uTailBend * 6.0*t*(1.0-t) / 0.135;
        float c = cos(angle), s = sin(angle);
        vec2 fromHinge = position.xz - vec2(0.118, -0.080);
        vec3 bent = vec3(0.118 + c*fromHinge.x + s*fromHinge.y,
          position.y, -0.080 - s*fromHinge.x + c*fromHinge.y);

        // The gradient of the bend varies along X, so rotate the tangent basis
        // with its derivative before transforming the corresponding normal.
        vec3 jx = vec3(c + slope*(-s*fromHinge.x + c*fromHinge.y), 0.0,
          -s + slope*(-c*fromHinge.x - s*fromHinge.y));
        vec3 jy = vec3(0.0, 1.0, 0.0);
        vec3 jz = vec3(s, 0.0, c);
        vec3 n = cross(jy, jz)*normal.x + cross(jz, jx)*normal.y + cross(jx, jy)*normal.z;
        vec4 view = modelViewMatrix * vec4(bent, 1.0);
        vTailBind = position;
        vTailUp = normal.y;
        vTailColor = color;
        vTailNormal = normalize(normalMatrix * n);
        vTailViewPoint = view.xyz;
        gl_Position = projectionMatrix * view;
      }
    `,
    fragmentShader: `
      ${fishRoomLightSource}
      uniform int uLightMode;
      varying vec3 vTailColor;
      varying vec3 vTailNormal;
      varying vec3 vTailViewPoint;
      varying vec3 vTailBind;
      varying float vTailUp;

      void main() {
        vec3 N = normalize(vTailNormal);
        vec3 V = normalize(-vTailViewPoint);
        vec3 key = fishLightDirection(uFishKeyWorld, vTailViewPoint, N);
        vec3 fill = fishLightDirection(uFishFillWorld, vTailViewPoint, N);
        float diffuse = 0.67 * fishRoomDiffuse(N, key, 0.48) + 0.33 * fishRoomDiffuse(N, fill, 0.58);
        float tintAmount = uLightMode == 1 ? 0.48 : 0.29;
        // The stem is shaded by the underside of the dress as it leaves the hem.
        // All falloff coordinates are in the bind pose, so the shadow follows the tail.
        float contactDistance = length((vTailBind - vec3(0.132,-0.350,-0.087)) * vec3(1.0,1.22,1.15));
        float contact = (1.0 - smoothstep(0.015, 0.092, contactDistance))
          * (1.0 - smoothstep(0.154, 0.228, vTailBind.x));
        float shelter = contact * (0.85 + 0.15 * clamp(vTailUp, 0.0, 1.0));
        vec3 hue = mix(vTailColor, vec3(0.029,0.045,0.104), shelter * 0.46);

        tint += fishTailLobe(N, V, key, fill, 1.0 - shelter);
        gl_FragColor = vec4(tint, 1.0);
        #include <colorspace_fragment>

function prepareFishProfile(THREE, renderer, image) {
  const width = image.naturalWidth;
  const height = image.naturalHeight;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  context.drawImage(image, 0, 0);
  const imageData = context.getImageData(0, 0, width, height);
  const pixels = imageData.data;
  const background = new Uint8Array(width * height);
  const queue = new Uint32Array(background.length);
  let end = 0;
  const visit = i => {
    if (background[i] || Math.min(pixels[i*4], pixels[i*4+1], pixels[i*4+2]) < 224) return;
    background[i] = 1;
    queue[end++] = i;
  };
  for (let x = 0; x < width; x++) { visit(x); visit(x + (height-1)*width); }
  for (let y = 0; y < height; y++) { visit(y*width); visit(y*width + width - 1); }
  for (let i = 0; i < end; i++) {
    const p = queue[i], x = p % width;
    if (x > 0) visit(p-1);
    if (x+1 < width) visit(p+1);
    if (p >= width) visit(p-width);
    if (p < width*(height-1)) visit(p+width);
  }
  const smooth = (low, high, x) => {
    const t = Math.max(0, Math.min(1, (x-low)/(high-low)));
    return t*t*(3-2*t);
  };
  const band = (a,b,c,d,t) => smooth(a,b,t)*(1-smooth(c,d,t));
  const channels = new Uint8Array(pixels.length);
  let minX = width, maxX = 0, minY = height, maxY = 0;
  for (let i = 0; i < background.length; i++) {
    const k = i*4;
    if (background[i]) { pixels[k+3] = 0; continue; }
    const x = i % width, y = Math.floor(i/width);
    minX = Math.min(minX,x); maxX = Math.max(maxX,x);
    minY = Math.min(minY,y); maxY = Math.max(maxY,y);
    const r=pixels[k], g=pixels[k+1], b=pixels[k+2];
    const u=x*278/width, v=y*371/height;
    const bowRegion = band(105,114,144,153,u)*band(105,115,139,146,v);
    const blue = smooth(23,52,b-r)*smooth(6,19,b-g);
    const cyan = smooth(22,49,g-r)*smooth(32,65,b-r);
    const crown = band(73,83,143,149,u)*band(23,33,115,122,v);
    const fin = band(114,128,173,184,u)*band(140,149,163,174,v);
    const cream = smooth(151,210,Math.min(r,g,b))*(1-smooth(22,63,Math.max(r,g,b)-Math.min(r,g,b)));
    const hairRegion = band(68,88,240,251,u)*band(17,28,298,314,v);
    const cheek = band(29,37,111,123,u)*band(155,168,189,203,v)*smooth(11,42,r-b)*smooth(145,210,r);
    channels[k] = Math.round(255*blue*hairRegion*(1-bowRegion*cyan));
    channels[k+1] = Math.round(255*bowRegion*cyan);
    channels[k+2] = Math.round(255*cream*Math.max(crown,fin));
    channels[k+3] = Math.round(255*cheek);
  }
  context.putImageData(imageData,0,0);
  const pigment = new THREE.CanvasTexture(canvas);
  const mask = new THREE.DataTexture(channels,width,height,THREE.RGBAFormat);
  pigment.colorSpace = THREE.SRGBColorSpace;
  for (const texture of [pigment,mask]) {
    texture.flipY = false;
    texture.generateMipmaps = renderer.capabilities.isWebGL2;
    texture.minFilter = texture.generateMipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.anisotropy = Math.min(4,renderer.capabilities.getMaxAnisotropy());
    texture.needsUpdate = true;
  }
  return {pigment, mask, imageData, bounds:{minX,maxX,minY,maxY}};
}

function calibrateFishProfile(px, py, side, width, height) {
  const x = px*278/width, y = py*371/height;
  const head = Math.exp(-(((y-107)/94)**2));
  const sideLandmark = side > 0 ? 1 : 0.44;
  const displacement = 41 * Math.exp(-(((x-94)/54)**2)) * head * sideLandmark;
  const crownShift = 11 * Math.exp(-(((y-117)/54)**2));
  return [px+displacement*width/278,py+crownShift*height/371];
}

    if (y< -0.187 && dc<0.030**2 && x>0.123 && warm) mask=Math.max(mask,0.93*region);
    if(mask<0.0001) return null;
    const handShare=smooth(-0.174,-0.203,y)*(1-smooth(0.024,0.057,Math.sqrt(dc)));
    const upperShare=1-smooth(-0.102,-0.150,y);
    return [mask,(1-handShare)*upperShare,(1-handShare)*(1-upperShare),handShare];
  }

  function reset() {
    upper.quaternion.identity(); forearm.quaternion.identity(); hand.quaternion.identity();
  }

  function setPalm(modelPoint, modelRotation, blend=1) {
    if(blend<=0) {reset();return;}
    rootGroup.localToWorld(target.copy(modelPoint));
    chest.worldToLocal(target);
    rootGroup.getWorldQuaternion(modelQ);
    chest.getWorldQuaternion(chestQ).invert();
    goalQ.copy(chestQ).multiply(modelQ).multiply(modelRotation);
    target.lerpVectors(neutralPalm,target,blend);
    handQ.identity().slerp(goalQ,blend);
    desiredWrist.copy(target).sub(temp.copy(handOffset).applyQuaternion(handQ));
    aim.copy(desiredWrist).sub(upper.position);
    const reach=aim.length();
    if(reach<1e-6)aim.copy(restDirection);
    else aim.multiplyScalar(1/reach);
    const d=clamp(reach,Math.abs(lengthA-lengthB)+0.0001,lengthA+lengthB-0.0002);
    desiredWrist.copy(upper.position).addScaledVector(aim,d);
    const reachProgress=smooth(0.015,0.085,target.distanceTo(neutralPalm));
    bend.lerpVectors(restPole,reachPole,reachProgress);
    bend.addScaledVector(aim,-bend.dot(aim));
    if(bend.lengthSq()<0.0001) bend.crossVectors(aim,temp.set(0,0,1));
    bend.normalize();
    const along=(lengthA*lengthA+d*d-lengthB*lengthB)/(2*d);
    joint.copy(upper.position).addScaledVector(aim,along).addScaledVector(bend,Math.sqrt(Math.max(0,lengthA*lengthA-along*along)));
    upper.quaternion.setFromUnitVectors(upperAxis,temp.subVectors(joint,upper.position).normalize());
    inverse.copy(upper.quaternion).invert();
    forearm.quaternion.setFromUnitVectors(foreAxis,temp.subVectors(desiredWrist,joint).normalize().applyQuaternion(inverse));
    hand.quaternion.copy(upper.quaternion).multiply(forearm.quaternion).invert().multiply(handQ);
  }

  return {
    bones:[upper,forearm,hand], landmarks:[shoulder,elbow,wrist], palmRest, handOffset, skin, setPalm, reset,
    palmWorld(out){return hand.localToWorld(out.copy(handOffset));},
    palmModel(out){return rootGroup.worldToLocal(hand.localToWorld(out.copy(handOffset)));},
    palmRestModel(out){return rootGroup.worldToLocal(chest.localToWorld(out.copy(neutralPalm)));},
  };
}

function createFishTeaSleeve(THREE, rig, root) {
  const arm=rig.cupArm;
  const fade={value:0};
  const sections=22,sides=16;
  const coordinates=new Float32Array((sections+1)*sides*3);
  const normals=new Float32Array(coordinates.length);
  const colors=[],indices=[],rings=[];
  const angles=Array.from({length:sides},(_,j)=>j/sides*Math.PI*2);
  const navy=new THREE.Color(0x303e71),shade=new THREE.Color(0x222b4b),gold=new THREE.Color(0xb1a078),white=new THREE.Color(0xf4e9e1);
  const color=new THREE.Color();
  for(let i=0;i<=sections;i++) {
    const t=i/sections;
    const cuff=Math.max(0,Math.min(1,(t-0.83)/0.08));
    const radius=0.029-0.007*t+0.003*Math.sin(t*Math.PI);
    rings.push(angles.map(angle=>{
      const u=Math.cos(angle),v=Math.sin(angle);
      const ridge=0.0017*Math.sin(angle*6)*cuff;
      const seam=0.10+0.16*(0.5+0.5*Math.cos(angle*3+0.3));
      color.copy(navy).lerp(shade,seam);
      if(t>0.91)color.copy(white).lerp(shade,(1-v)*0.045);
      else if(t>0.855)color.lerp(gold,0.76);
      colors.push(color.r,color.g,color.b);
      return [u*(radius+ridge),v*radius*0.78,u/(radius+ridge),v/(radius*0.78)];
    }));
  }
  for(let i=0;i<sections;i++) for(let j=0;j<sides;j++) {
    const a=i*sides+j,b=i*sides+(j+1)%sides;
    indices.push(a,b,a+sides,b,b+sides,a+sides);
  }
  const sleeveGeometry=new THREE.BufferGeometry();
  const position=new THREE.BufferAttribute(coordinates,3).setUsage(THREE.DynamicDrawUsage);
  const normal=new THREE.BufferAttribute(normals,3).setUsage(THREE.DynamicDrawUsage);
  sleeveGeometry.setAttribute('position',position);
  sleeveGeometry.setAttribute('normal',normal);
  sleeveGeometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  sleeveGeometry.setIndex(indices);

  const shoulder=new THREE.Vector3(),elbow=new THREE.Vector3(),wrist=new THREE.Vector3();
  const first=new THREE.Vector3(),last=new THREE.Vector3(),plane=new THREE.Vector3();
  const center=new THREE.Vector3(),tangent=new THREE.Vector3(),side=new THREE.Vector3(),across=new THREE.Vector3();
  const p=new THREE.Vector3(),n=new THREE.Vector3();
  const bendRadius=0.047, shoulderInset=0.019;

  function updateGeometry() {
    root.worldToLocal(arm.bones[0].getWorldPosition(shoulder));
    root.worldToLocal(arm.bones[1].getWorldPosition(elbow));
    root.worldToLocal(arm.bones[2].getWorldPosition(wrist));
    first.subVectors(elbow,shoulder);
    last.subVectors(wrist,elbow);
    const upper=first.length(),lower=last.length();
    first.multiplyScalar(1/upper);
    last.multiplyScalar(1/lower);
    plane.crossVectors(first,last);
    const bendStrength=plane.length()/(2*bendRadius);
    plane.normalize();
    for(let i=0;i<=sections;i++) {
      const distance=(upper+lower+shoulderInset)*i/sections-shoulderInset;
      const offset=distance-upper;
      let fabricWidth=1;
      if(offset<=-bendRadius) {
        center.copy(shoulder).addScaledVector(first,distance);
        tangent.copy(first);
      } else if(offset>=bendRadius) {
        center.copy(elbow).addScaledVector(last,offset);
        tangent.copy(last);
      } else {
        const t=(offset+bendRadius)/(2*bendRadius),u=1-t;
        center.copy(elbow).addScaledVector(first,-bendRadius*u*u).addScaledVector(last,bendRadius*t*t);
        tangent.copy(first).multiplyScalar(u).addScaledVector(last,t);
        const tangentLength=tangent.length();
        // Keep the inner edge clear of the elbow curve's center of curvature.
        fabricWidth=Math.min(1,0.82*tangentLength**3/Math.max(0.001,bendStrength*0.031));
        tangent.multiplyScalar(1/tangentLength);
      }
      side.crossVectors(plane,tangent).normalize();
      across.crossVectors(tangent,side).normalize();
      for(let j=0;j<sides;j++) {
        const [u,v,nu,nv]=rings[i][j],index=i*sides+j;
        p.copy(center).addScaledVector(side,u*fabricWidth).addScaledVector(across,v);
        n.copy(side).multiplyScalar(nu/fabricWidth).addScaledVector(across,nv).normalize();
        position.setXYZ(index,p.x,p.y,p.z);
        normal.setXYZ(index,n.x,n.y,n.z);
      }
    }
    position.needsUpdate=true;
    normal.needsUpdate=true;
  }

  function material(skin) {
    return new THREE.ShaderMaterial({
      uniforms:{uFade:fade,uColor:{value:new THREE.Color(0xf9ded4)}},
      vertexColors:!skin,
      side:THREE.DoubleSide,
      transparent:true,depthWrite:true,toneMapped:false,forceSinglePass:true,
      vertexShader:`
        uniform vec3 uColor;
        varying vec3 vTeaSleeveColor;
        varying vec3 vTeaSleeveNormal;
        void main() {
          vTeaSleeveColor=${skin?'uColor':'color'};
          vTeaSleeveNormal=normalize(normalMatrix*normal);
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
        }
      `,
      fragmentShader:`
        uniform float uFade;
        varying vec3 vTeaSleeveColor;
        varying vec3 vTeaSleeveNormal;
        void main() {
          vec3 n=normalize(vTeaSleeveNormal);
          if(!gl_FrontFacing)n=-n;
          float light=0.77+0.23*max(0.0,dot(n,normalize(vec3(-0.42,0.64,0.70))));
          gl_FragColor=vec4(vTeaSleeveColor*light,uFade);
          #include <colorspace_fragment>
        }
      `,
    });
  }
  const sleeve=new THREE.Mesh(sleeveGeometry,material(false));
  sleeve.name='teaSleeve';
  sleeve.frustumCulled=false;
  root.add(sleeve);

  const mitt=new THREE.Group();
  mitt.name='teaGrip';
  const handMaterial=material(true);
  const sphere=new THREE.SphereGeometry(1,16,10);
  function finger(x,y,z,sx,sy,sz,rotation=0) {
    const mesh=new THREE.Mesh(sphere,handMaterial);
    mesh.position.copy(arm.handOffset).add(new THREE.Vector3(x,y,z));
    mesh.scale.set(sx,sy,sz);
    mesh.rotation.z=rotation;
    mitt.add(mesh);
  }
  finger(0,0,0,0.014,0.020,0.013,0.06);
  finger(-0.013,0.002,0.005,0.007,0.012,0.007,-0.42);
  finger(0.003,-0.009,0.003,0.012,0.009,0.005,0.07);
  arm.bones[2].add(mitt);

  function setBlend(value) {
    fade.value=value;
    sleeve.visible=mitt.visible=value>0.006;
    if (sleeve.visible) updateGeometry();
    rig.body.material.uniforms.uTeaSleeve.value=value;
  }
  updateGeometry();
  setBlend(0);
  return {setBlend,sleeve,mitt};
}

function createFishLidMaterial(THREE, texture, faceState, gaze, eyeFocus, min, max, calib, headRest, detail) {
  const xScale = (calib.refX1 - calib.refX0) / (max.x - min.x);
  const yScale = -(calib.refY1 - calib.refY0) / (max.y - min.y);
  return new THREE.ShaderMaterial({
    extensions: {derivatives:true, shaderTextureLOD:true},
    uniforms: {
      uArt: {value: texture},
      uFaceState: faceState,
      uGaze: gaze,
      uEyeFocus: eyeFocus,
      ...detail,
      uPixel: {value: new THREE.Vector4(xScale, yScale,
        calib.refX0 + (headRest.x - min.x) * xScale,
        calib.refY0 + (headRest.y - max.y) * yScale)},
    },
    vertexShader: `
      #include <morphtarget_pars_vertex>
      uniform vec4 uPixel;
      varying vec2 vArt;
      varying vec3 vLidViewPosition;
      varying float vLidFarSide;
      void main() {
        #include <begin_vertex>
        #include <morphtarget_vertex>
        vArt = (transformed.xy * uPixel.xy + uPixel.zw) / vec2(174.0, 244.0);
        vec4 viewPosition = modelViewMatrix * vec4(transformed, 1.0);
        vLidViewPosition = viewPosition.xyz;
        float eyeSide = vArt.x < 64.0/174.0 ? -1.0 : 1.0;
        vec3 headRight = normalize(mat3(modelViewMatrix)[0]);
        vLidFarSide = -eyeSide*dot(headRight,normalize(-viewPosition.xyz));
        gl_Position = projectionMatrix * viewPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D uArt;
      uniform vec4 uFaceState;
      uniform vec2 uGaze;
      uniform vec2 uEyeFocus;
      varying vec2 vArt;
      varying vec3 vLidViewPosition;
      varying float vLidFarSide;
      ${fishFacePaintSource}
      void main() {
        float coverage;
        FishPortraitFootprint footprint = fishPortraitFootprint(vArt);
        vec4 color = fishPaintFaceLids(uArt,vArt,uGaze,uEyeFocus,uFaceState,footprint,false,coverage);
        // Use the triangle normal after morphing, in view space. Its screen
        // derivatives point toward the viewer on either side of the mesh.
        vec3 areaNormal = cross(dFdx(vLidViewPosition),dFdy(vLidViewPosition));
        float invArea = inversesqrt(max(1.0e-20,dot(areaNormal,areaNormal)));
        float facing = dot(areaNormal*invArea,normalize(-vLidViewPosition));
        facing *= gl_FrontFacing ? 1.0 : -1.0;
        float farEyeFade = 1.0-smoothstep(0.52,0.76,vLidFarSide);
        coverage *= smoothstep(0.37,0.84,facing) * farEyeFade * color.a;
        gl_FragColor = vec4(color.rgb, coverage);
        #include <colorspace_fragment>
      }
    `,
    side: THREE.DoubleSide, transparent: true, forceSinglePass: true,
    depthTest: true, depthWrite: false, toneMapped: false,
  });
}

function createFishFaceRig(THREE, headBone, surface, material, lidGeometry) {
  const group=new THREE.Group();
  group.name='FishFaceRig';
  headBone.add(group);
  const headRest=surface.headRestPosition;
  const depthStride=417;
  const depthRowAtRest=(surface.pixelYAtZero-headRest.y/surface.pixelHeight-80)*16;
  const rowsPerMeter=16/surface.pixelHeight;

  function readEyeDepth(name) {
    const bytes=atob(fishEyeDepthSamples[name]);
    const out=new Uint16Array(bytes.length/2);
    for(let i=0;i<out.length;i++) out[i]=bytes.charCodeAt(2*i)|(bytes.charCodeAt(2*i+1)<<8);
    return out;
  }

  function sampleDepth(table,offset,row) {
    if (row<=0)return table[offset];
    if (row>=depthStride-1)return table[offset+depthStride-1];
    const index=row|0;
    const low=table[offset+index];
    return low+(table[offset+index+1]-low)*(row-index);
  }
  const blinkSteps=8;
  const cols=27, rows=6;
  const meshes={};
  const trackSize=2*(cols+1)*(rows+1)*3;
  let trackOffset=0;
  function takeTrack() {
    const track=lidGeometry.subarray(trackOffset,trackOffset+trackSize);
    trackOffset+=trackSize;
    return track;
  }

  for (const profile of fishEyeProfiles) {
    const positions=takeTrack();
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));
    geometry.morphTargetsRelative=true;
    const morphs=[];
    const track=Array.from({length:2},()=>new Int16Array(blinkSteps+1));
    track[0][0]=-1;
    for(let smile=0;smile<=1;smile++){
      for(let step=smile?0:1;step<=blinkSteps;step++){
        if(smile&&step===blinkSteps){
          track[smile][step]=track[0][step];
          continue;
        }
        track[smile][step]=morphs.length;
        const morph=new THREE.BufferAttribute(takeTrack(),3);
        morph.name=`eye${smile}_${step}`;
        morphs.push(morph);
      }
    }
    geometry.morphAttributes.position=morphs;
    const indices=[];
    const stride=rows+1;
    for(let lid=0;lid<2;lid++){
      const start=lid*(cols+1)*stride;
      for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
        const a=start+c*stride+r,b=a+stride;
        if(lid===0)indices.push(a,a+1,b,b,a+1,b+1);
        else indices.push(a,b,a+1,b,b+1,a+1);

    mesh.userData.eyeTargets=[];
    mesh.userData.eyeWeights=[];
    mesh.visible=false;
    group.add(mesh);
    meshes[profile.name]=mesh;
  }

  function set({blinkLeft=0,blinkRight=0,smile=0,eyeSmile=smile,eyeJoy=smile}={}) {
    const soft=THREE.MathUtils.clamp(eyeSmile,0,1);
    const joy=THREE.MathUtils.clamp(eyeJoy,0,soft);
    updateEye(meshes.left,blinkLeft,soft,joy);
    updateEye(meshes.right,blinkRight,soft,joy);
  }

  function updateEye(mesh,blink,smile,joy) {
    const b=THREE.MathUtils.clamp(blink,0,1);
    const progression=b*blinkSteps;
    const lower=Math.min(Math.floor(progression),blinkSteps-1);
    const amount=progression-lower;
    const weights=mesh.morphTargetInfluences;
    const track=mesh.userData.eyeMorphTrack;
    weights.fill(0);
    for(let s=0;s<=1;s++){
      const blend=s?smile:1-smile;
      const a=track[s][lower], b=track[s][lower+1];
      if(a>=0) weights[a]+=blend*(1-amount);
      weights[b]+=blend*amount;
    }
    mesh.visible=b>.002||smile>.002;
    if (joy>0 && b>0) deformJoy(mesh,b,smile,joy,weights);
    else if (mesh.userData.joyPose) {
      const position=mesh.geometry.attributes.position;
      position.array.set(mesh.userData.eyeNeutral);
      position.needsUpdate=true;
      mesh.userData.joyPose=null;
    }
  }

  function deformJoy(mesh,blink,soft,joy,weights) {
    const {eyeNeutral:neutral,eyeProfile:profile,eyeDepth,eyeTargets,eyeWeights,joyPose}=mesh.userData;
    if (joyPose && joyPose.blink===blink && joyPose.soft===soft && joyPose.joy===joy) return;
    mesh.userData.joyPose={blink,soft,joy};
    const position=mesh.geometry.attributes.position;
    const out=position.array;
    const morphs=mesh.geometry.morphAttributes.position;
    let activeCount=0;
    for(let i=0;i<weights.length;i++) {
      if(weights[i]===0)continue;

      eyeWeights[activeCount++]=weights[i];
    }
    const corrections=fishJoyClearance[profile.name];
    const liftWeight=fishJoyClearanceWeight(blink,joy);
    const stride=rows+1;
    const layer=(cols+1)*stride;
    for(let col=0;col<=cols;col++) {
      const u=col/cols;
      const base=fishEyeFrame(profile,u,blink,soft,0);
      const lifted=fishEyeFrame(profile,u,blink,soft,joy,base);
      const columnOffset=col*depthStride;
      const deltaUpperBorder=Math.min(lifted.top,lifted.seam)-Math.min(base.top,base.seam);
      const deltaLowerBorder=Math.max(lifted.bottom,lifted.seam)-Math.max(base.bottom,base.seam);
      for(let lid=0;lid<2;lid++) {
        const border=lid===0?deltaUpperBorder:deltaLowerBorder;
        const edge=lid===0?lifted.upper-base.upper:lifted.lower-base.lower;
        for(let row=0;row<=rows;row++) {
          const vertex=lid*layer+col*stride+row;
          const index=vertex*3;
          let y=neutral[index+1];
          for(let i=0;i<activeCount;i++)y+=eyeTargets[i][index+1]*eyeWeights[i];
          const pixelShift=border+(edge-border)*row/rows;
          const depthRow=depthRowAtRest-y*rowsPerMeter;
          const before=sampleDepth(eyeDepth,columnOffset,depthRow);
          const after=sampleDepth(eyeDepth,columnOffset,depthRow+pixelShift*16);
          out[index+1]=neutral[index+1]-surface.pixelHeight*pixelShift;
          // Carry the calibrated lid clearance along the cheek and brow
          // as the smiling contour rises in the existing morph pose.
          out[index+2]=neutral[index+2]+(after-before)*8e-6+(corrections[vertex]??0)*liftWeight*1e-6;
        }
      }
    }
    position.needsUpdate=true;
  }

  return {set,group,meshes};
}

function clearFishPaintedMouth(context, source) {
  // Solve the small missing skin patch with its original boundary colors fixed.
  // Read the pixels separately so the source can still shade the animated mouth.
  const x0 = 55, y0 = 103, width = 20, height = 15;
  const patch = context.getImageData(x0, y0, width, height);
  const values = new Float32Array(patch.data);
  for (let y = 1; y < height - 1; y++) {
    const row = y * width * 4;
    for (let x = 1; x < width - 1; x++) {
      const t = x / (width - 1);
      const index = row + x * 4;
      for (let c = 0; c < 3; c++) {
        values[index + c] = values[row + c] * (1 - t) + values[row + (width - 1) * 4 + c] * t;
      }
    }
  }
  const stride = width * 4;
  for (let sweep = 0; sweep < 96; sweep++) {
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        const i = (y * width + x) * 4;
        for (let c = i; c < i + 3; c++) {
          values[c] = (values[c - 4] + values[c + 4] + values[c - stride] + values[c + stride]) * 0.25;
        }
      }
    }
  }
  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const sourceIndex = ((y0 + y) * source.width + x0 + x) * 4;
      const green = source.data[sourceIndex + 1];
      const blue = source.data[sourceIndex + 2];
      // Preserve the original cheek at the corners, and clear all lip pixels.
      const pigment = Math.max(0, Math.min(1, (234 - green) / 15, (225 - blue) / 10));
      const i = (y * width + x) * 4;
      for (let c = 0; c < 3; c++) {
        patch.data[i + c] += (values[i + c] - patch.data[i + c]) * pigment;
      }
    }
  }
  context.putImageData(patch, x0, y0);
}

<script>
function createFishMouthRig(THREE, headBone, surface, referenceTexture, skinTexture) {
  const TEX_W = 174.0;
  const TEX_H = 244.0;

  const CX_NEUTRAL = 64.8;
  const CY_NEUTRAL = 110.5;

  const headOrigin = surface.headRestPosition;
  const depthAt = surface.prepareDepthPatch(55.4, 74.2, 104.8, 116.8);
  const socket = surface.point(CX_NEUTRAL, CY_NEUTRAL, 0, depthAt).sub(headOrigin);

  const COLS = 32; // spanning u in [-1, 1]
  const ROWS = 12;  // spanning v in [0, 1] (0 = top lip, 1 = bottom lip)
  const numVerts = (COLS + 1) * (ROWS + 1);
  const depthLift = new Float32Array(numVerts);
  for (let i=0; i<fishMouthClearance.length; i+=2) {
    depthLift[fishMouthClearance[i]]=fishMouthClearance[i+1]*1e-6;
  }

  // Geometry construction
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(numVerts * 3);
  const uvs = new Float32Array(numVerts * 2);
  const localUVs = new Float32Array(numVerts * 2);
  const indices = [];

  // Relative Morph Target arrays
  const morphClose = new Float32Array(numVerts * 3);
  const morphSmile = new Float32Array(numVerts * 3);
  const morphPurse = new Float32Array(numVerts * 3);
  const morphRest = new Float32Array(numVerts * 3);

  // Shape evaluators returning { px, py, zSculpt } for a grid column u in [-1, 1] and row v in [0, 1]
  // 1) Neutral: original art bounds [58.5..71.2], top flat ~107.0, bottom ~114.8, widest ~108.0
  function evalNeutral(u, v) {
    const halfW = 9.4;
    const px = CX_NEUTRAL + u * halfW;
    const cu = 1.0 - u * u; // profile taper curve
    const yTop = 104.8;
    const yBottom = 116.8 - 0.55 * u * u;
    const py = yTop + v * (yBottom - yTop);
    const zSculpt = 0.0009 + 0.0006 * cu * (1.0 - Math.abs(v - 0.5) * 1.5);
    return { px, py, zSculpt };
  }

  // 2) Close: 0.65px tall tapered line at y=110.0
  function evalClose(u, v) {
    const halfW = (71.2 - 58.5) * 0.5 * 0.96;
    const px = CX_NEUTRAL + u * halfW;
    const cu = Math.max(0.0, 1.0 - u * u);
    const h = 0.20 + 0.45 * cu; // 0.65px total max height
    const yMid = 110.0 + 0.15 * (1.0 - cu);
    const yTop = yMid - h * 0.5;
    const yBottom = yMid + h * 0.5;
    const py = yTop + v * (yBottom - yTop);
    const zSculpt = 0.0008 + 0.0003 * cu;
    return { px, py, zSculpt };
  }

  // 3) Smile: ~6px tall with visibly upturned narrow corners
  function evalSmile(u, v) {
    const halfW = 6.6;
    const px = CX_NEUTRAL + u * halfW;
    const u2 = u * u;
    const cu = Math.max(0.0, 1.0 - u2);
    // Upturn corners: negative y in texture space is up
    const cornerLift = -2.2 * Math.pow(Math.abs(u), 1.8);
    const centerDip = 0.8 * cu;
    const yTop = 108.5 + cornerLift - centerDip;
    const gap = 1.0 + 5.0 * Math.pow(cu, 0.85); // ~6px height at center
    const yBottom = yTop + gap;
    const py = yTop + v * (yBottom - yTop);
    const zSculpt = 0.00085 + 0.00065 * cu;
    return { px, py, zSculpt };
  }

  // 4) Purse: small O centered at (64.8, 110.5), ~5px wide x 3.3px tall with 3D protrusion
  function evalPurse(u, v) {
    const halfW = 2.5; // 5.0px total width
    const px = CX_NEUTRAL + u * halfW;
    const cu = Math.max(0.0, 1.0 - u * u);
    const rY = 1.65 * Math.sqrt(Math.max(0.001, cu)); // ~3.3px total height
    const yTop = CY_NEUTRAL - rY;
    const yBottom = CY_NEUTRAL + rY;
    const py = yTop + v * (yBottom - yTop);
    const zSculpt = 0.0012 + 0.0006 * cu; // pronounced protrusion
    return { px, py, zSculpt };
  }

  // The resting lips part slightly through the center. The shallow
  // asymmetry follows the portrait, while the swallow key seals the lips.
  function evalRest(u, v) {
    const cu = Math.max(0, 1-u*u);
    const px = CX_NEUTRAL + 6.0*u;
    const center = 110.50 - 0.78*Math.pow(Math.abs(u),1.65) + 0.14*u;
    const gap = 0.23 + 1.54*Math.pow(cu,0.88);
    return {px, py:center+(v-.5)*gap, zSculpt:0.0008+0.0004*cu};
  }

  // Populate vertex grid, morph deltas, and texture UVs sampled strictly from neutral 3D/px positions
  for (let r = 0; r <= ROWS; r++) {
    const v = r / ROWS;
    for (let c = 0; c <= COLS; c++) {
      const idx = r * (COLS + 1) + c;
      const u = (c / COLS) * 2.0 - 1.0; // [-1, 1]

      const nState = evalNeutral(u, v);
      const cState = evalClose(u, v);
      const sState = evalSmile(u, v);
      const pState = evalPurse(u, v);
      const rState = evalRest(u, v);

      // Project the morph vertices onto the bind pose before applying the depth correction
      const pN = surface.point(nState.px, nState.py, nState.zSculpt, depthAt).sub(headOrigin);
      const pC = surface.point(cState.px, cState.py, cState.zSculpt, depthAt).sub(headOrigin);
      const pS = surface.point(sState.px, sState.py, sState.zSculpt, depthAt).sub(headOrigin);
      const pP = surface.point(pState.px, pState.py, pState.zSculpt, depthAt).sub(headOrigin);
      const pR = surface.point(rState.px, rState.py, rState.zSculpt, depthAt).sub(headOrigin);

      // Neutral coordinates
      positions[idx * 3 + 0] = pN.x;
      positions[idx * 3 + 1] = pN.y;
      positions[idx * 3 + 2] = pN.z;

      // Sample untouched source texture in original coordinates from neutral
      uvs[idx * 2 + 0] = nState.px / TEX_W;
      uvs[idx * 2 + 1] = nState.py / TEX_H;

      // Parametric conformal local patch UVs for fragment AA coverage and rounded cutouts
      localUVs[idx * 2 + 0] = u;
      localUVs[idx * 2 + 1] = v * 2.0 - 1.0;

      // Relative morph targets (Delta = Target - Neutral)
      morphClose[idx * 3 + 0] = pC.x - pN.x;
      morphClose[idx * 3 + 1] = pC.y - pN.y;
      morphClose[idx * 3 + 2] = pC.z - pN.z;

      morphSmile[idx * 3 + 0] = pS.x - pN.x;
      morphSmile[idx * 3 + 1] = pS.y - pN.y;
      morphSmile[idx * 3 + 2] = pS.z - pN.z;

      morphPurse[idx * 3 + 0] = pP.x - pN.x;
      morphPurse[idx * 3 + 1] = pP.y - pN.y;
      morphPurse[idx * 3 + 2] = pP.z - pN.z;
      morphRest[idx * 3 + 0] = pR.x - pN.x;
      morphRest[idx * 3 + 1] = pR.y - pN.y;
      morphRest[idx * 3 + 2] = pR.z - pN.z;
    }
  }

  // Construct standard quad strip grid indices
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const a = r * (COLS + 1) + c;
      const b = (r + 1) * (COLS + 1) + c;
      const d = (r + 1) * (COLS + 1) + (c + 1);
      const e = r * (COLS + 1) + (c + 1);
      indices.push(a, b, d);
      indices.push(a, d, e);
    }
  }

  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geom.setAttribute('aLocalUV', new THREE.BufferAttribute(localUVs, 2));
  const depth = new THREE.BufferAttribute(new Float32Array(numVerts), 1).setUsage(THREE.DynamicDrawUsage);
  geom.setAttribute('aMouthDepth', depth);
  geom.setIndex(indices);

  // Set morph targets
  geom.morphAttributes.position = [
    new THREE.BufferAttribute(morphClose, 3),
    new THREE.BufferAttribute(morphSmile, 3),
    new THREE.BufferAttribute(morphPurse, 3),
    new THREE.BufferAttribute(morphRest, 3)
  ];
  geom.morphTargetsRelative = true;
  for (const [i, name] of ['close', 'smile', 'purse', 'rest'].entries()) {
    geom.morphAttributes.position[i].name = name;
  }

  // Custom ShaderMaterial integrating Three.js morph chunks and fragment AA edge cutout
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uOriginal: { value: referenceTexture },
      uSkin: { value: skinTexture },
      uMorphWeight: { value: new THREE.Vector4() },
      uRim: { value: new THREE.Color(0x925553) },
      uCavity: { value: new THREE.Color(0xab6962) },
      uTongue: { value: new THREE.Color(0xe8a69a) }
    },
    vertexShader: `
      #include <common>
      #include <morphtarget_pars_vertex>

      attribute vec2 aLocalUV;
      attribute float aMouthDepth;
      varying vec2 vUv;
      varying vec2 vLocalUV;

      void main() {
        vUv = uv;
        vLocalUV = aLocalUV;

        vec3 transformed = vec3(position);
        #include <morphtarget_vertex>
        transformed.z = aMouthDepth;

        vec4 mvPosition = modelViewMatrix * vec4(transformed, 1.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      #include <common>

      uniform sampler2D uOriginal;
      uniform sampler2D uSkin;
      uniform vec4 uMorphWeight;
      uniform vec3 uRim;
      uniform vec3 uCavity;
      uniform vec3 uTongue;
      varying vec2 vUv;
      varying vec2 vLocalUV;

      void main() {
        vec4 source = texture2D(uOriginal, vUv);
        vec3 skin = texture2D(uSkin, vUv).rgb;
        float artMask = smoothstep(0.025, 0.090, length(source.rgb - skin));
        vec2 p = vLocalUV;
        float close = uMorphWeight.x;
        float smile = uMorphWeight.y;
        float purse = uMorphWeight.z;
        float rest = uMorphWeight.w;
        float taper = abs(p.x);
        float height = p.y + 0.11 + 0.22*smile*taper*taper;
        float radiusY = mix(0.66,0.60,smoothstep(-0.14,0.27,-height));
        float radiusX = mix(0.80,0.91,smile) - 0.06*purse;
        float distanceToRim = length(vec2(p.x/radiusX,height/radiusY)) - 1.0;
        float aa = clamp(fwidth(distanceToRim)*0.62,0.018,0.55);
        float lipMask = 1.0 - smoothstep(-aa, aa, distanceToRim);
        float transition = smoothstep(0.035,0.67,close + 0.84*smile + purse + rest);
        float alpha = mix(artMask, lipMask, transition) * source.a;
        if (alpha <= 0.004) discard;

        float tongue = smoothstep(-0.24,0.57,p.y) * (1.0-smoothstep(0.36,0.78,taper))
          * (1.0-0.76*close) * (1.0-0.25*purse) * (1.0-0.94*rest);
        float cavity = 1.0 - smoothstep(-0.26,-0.072,distanceToRim);
        float shade = mix(0.57,1.04,smoothstep(-0.70,0.48,p.y));
        vec3 interior = mix(uCavity * shade,uTongue,tongue * 0.92);
        vec3 painted = mix(uRim,interior,cavity * (1.0-0.64*close-0.38*rest));
        vec3 pigment = mix(source.rgb*artMask,painted*lipMask,transition);
        vec3 color = pigment/max(0.0001, mix(artMask,lipMask,transition));
        gl_FragColor = vec4(color, alpha);
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    toneMapped: false
  });

  const mesh = new THREE.Mesh(geom, material);
  mesh.name = 'fish_mouth_mesh';
  headBone.add(mesh);

  const previous = new THREE.Vector4(-1, -1, -1, -1);
  function set({ lipClose = 0, lipSmile = 0, lipPurse = 0, lipRest = 0 } = {}) {
    const clamp = THREE.MathUtils.clamp;
    const close = clamp(lipClose,0,1);
    const smile = clamp(lipSmile,0,1);
    const purse = clamp(lipPurse,0,1);
    const rest = clamp(lipRest,0,1);
    const sum = Math.max(1, close + smile + purse + rest);
    const c = close / sum, s = smile / sum, p = purse / sum, r = rest / sum;
    if (previous.x === c && previous.y === s && previous.z === p && previous.w === r) return;
    previous.set(c, s, p, r);
    mesh.morphTargetInfluences[0] = c;
    mesh.morphTargetInfluences[1] = s;
    mesh.morphTargetInfluences[2] = p;
    mesh.morphTargetInfluences[3] = r;
    material.uniforms.uMorphWeight.value.copy(previous);
    for (let i = 0; i < numVerts; i++) {
      const j = i * 3;
      const x = positions[j] + c * morphClose[j] + s * morphSmile[j] + p * morphPurse[j] + r * morphRest[j];
      const y = positions[j+1] + c * morphClose[j+1] + s * morphSmile[j+1] + p * morphPurse[j+1] + r * morphRest[j+1];
      const sampled = depthAt(x + headOrigin.x, y + headOrigin.y) - headOrigin.z;
      const mixed = positions[j+2] + c * morphClose[j+2] + s * morphSmile[j+2] + p * morphPurse[j+2] + r * morphRest[j+2];
      const baseDepth = Number.isFinite(sampled) ? sampled + 0.0020 + p * 0.0006 : mixed;
      depth.setX(i,baseDepth+depthLift[i]);
    }
    depth.needsUpdate = true;
  }

  set();
  return {
    mesh,
    socket,
    set
  };
}

<script>
function createFishGaze(THREE) {
  const current = new THREE.Vector2();
  const target = new THREE.Vector2();
  const secondaryAim = new THREE.Vector2();
  const velocity = new THREE.Vector2();
  const maxSpeed = 3.60;
  const response = 17;
  const clamp = (n, low, high) => Math.min(high, Math.max(low, n));

  function softLimit(value, limit) {
    const unit = value / limit;
    return limit * unit / Math.sqrt(1 + unit * unit);
  }

  function followAxis(axis, dt, decay) {
    const value=current[axis], goal=target[axis], speed=velocity[axis];
    const error=value-goal;
    const travel=(speed+response*error)*dt;
    const next=goal+(error+travel)*decay;
    const bounded=clamp(next-value,-maxSpeed*dt,maxSpeed*dt);
    current[axis]=value+bounded;
    velocity[axis]=clamp((speed-response*travel)*decay,-maxSpeed,maxSpeed);
  }

  function projectAim(direction, out) {
    const horizontal = Math.hypot(direction.x, direction.z);
    const front = direction.z / Math.max(0.17, horizontal);
    const visibility = clamp((front + 0.42) / 1.0, 0, 1);
    const visible = visibility * visibility * (3 - 2 * visibility);
    const yaw = Math.asin(clamp(direction.x, -1, 1));
    const pitch = Math.atan2(direction.y, horizontal);
    // UV Y increases downward, while the rig's local Y points up.
    out.set(yaw * 1.38 * visible, -pitch * 1.58 * visible);
    return visible;
  }

  function update(direction, cameraAim, influence, offset, dt, out, relaxation = 0) {
    let visible = projectAim(direction, target);
    if (cameraAim) {
      // Apply each target's forward visibility before mixing eye-space aims.
      const cameraVisible = projectAim(cameraAim, secondaryAim);
      const cameraWeight = 1 - influence;
      target.lerp(secondaryAim, cameraWeight);
      visible += (cameraVisible - visible) * cameraWeight;
    } else if (influence < 1) {
      target.multiplyScalar(influence);
    }
    target.x = softLimit(target.x + offset.x * visible, 0.82);
    target.y = softLimit(target.y + offset.y * visible, 0.62);
    target.multiplyScalar(1 - relaxation);
    const step = Number.isFinite(dt) ? clamp(dt, 0, 0.1) : 0;
    const decay=Math.exp(-response*step);
    followAxis('x',step,decay);
    followAxis('y',step,decay);
    out.copy(current);
  }

  function reset() {
    current.set(0, 0);
    target.set(0, 0);
    velocity.set(0, 0);
  }

  return {update, reset, target};
}

<script>
function createFishRibbon(THREE, frontArt, sampleFront, roomLight) {
  const group = new THREE.Group();
  group.name = "FishRibbon";

  const positions = [];
  const uvs = [];
  const tangents = [];
  const partIds = []; // 0: wings, 1: tails, 2: center knot
  const indices = [];

  function addQuad(i0, i1, i2, i3) {
    indices.push(i0, i1, i2, i0, i2, i3);
  }

  // --- 1. Fabric Loop Wings (Left & Right asymmetric folded tube loops) ---
  function buildWing(side) {
    const isRight = side > 0;
    const uSegs = 16;
    const vSegs = 16;
    const baseIndex = positions.length / 3;

    const span = isRight ? 0.076 : 0.072;
    const height = isRight ? 0.034 : 0.032;
    const sweepY = isRight ? 0.005 : 0.002;
    const backAngle = isRight ? 0.22 : 0.18;

    for (let j = 0; j < vSegs; j++) {
      const v = j / vSegs;
      const ringPhi = v * Math.PI * 2.0;

      for (let i = 0; i <= uSegs; i++) {
        const u = i / uSegs; // 0: root knot, 1: outer fold tip
        const along = Math.sin(u * Math.PI * 0.5);

        // Centerline profile
        const cx = side * (0.008 + along * span);
        const cy = 0.002 + Math.sin(u * Math.PI) * height * 0.25 + (u * sweepY);
        const cz = Math.sin(u * Math.PI * 0.85) * 0.011 - along * Math.sin(backAngle) * 0.016;

        // Tube cross section profile (pinched at root, softly angular & inflated towards outer tip)
        const taper = 0.18 + 0.82 * Math.sin(Math.pow(u, 0.72) * Math.PI);
        const foldFlat = 1.0 - 0.48 * Math.pow(along, 1.4);
        const halfH = height * 0.61 * taper;
        const halfThick = (0.002 + 0.012 * along) * (0.28 + 0.72 * Math.sin(u * Math.PI));

        // Softly squarish cushion profile (superellipse approximation)
        const cosP = Math.cos(ringPhi);
        const sinP = Math.sin(ringPhi);
        const signC = Math.sign(cosP) || 1.0;
        const signS = Math.sign(sinP) || 1.0;
        const shapeY = signC * Math.pow(Math.abs(cosP), 0.82) * halfH;
        const seam=1-0.20*Math.exp(-Math.pow((u-0.24)/0.13,2))*Math.pow(Math.max(0,cosP),4);
        const shapeZ = signS * Math.pow(Math.abs(sinP), 0.88) * halfThick * foldFlat * seam;

        // Slight twist along fabric loop
        const twist = (u * 0.42 - 0.15) * side;
        const ry = shapeY * Math.cos(twist) - shapeZ * Math.sin(twist);
        const rz = shapeY * Math.sin(twist) + shapeZ * Math.cos(twist);

        const px = cx;
        const py = cy + ry;
        const pz = cz + rz;

        positions.push(px, py, pz);
        uvs.push(u, v);
        partIds.push(0.0);

        // Tangent along strip direction (for anisotropic silk highlights)
        const tx = side * Math.cos(twist);
        const ty = 0.25 * Math.sin(u * Math.PI) + Math.sin(twist);
        const tz = -Math.sin(backAngle) * 0.4;
        const tLen = Math.hypot(tx, ty, tz) || 1.0;
        tangents.push(tx / tLen, ty / tLen, tz / tLen, 1.0);
      }
    }

    const row = uSegs + 1;
    for (let j = 0; j < vSegs; j++) {
      const next = (j + 1) % vSegs;
      for (let i = 0; i < uSegs; i++) {
        const i0 = baseIndex + j * row + i;
        const i1 = i0 + 1;
        const i3 = baseIndex + next * row + i;
        const i2 = i3 + 1;
        if (side > 0) addQuad(i0, i3, i2, i1);
        else addQuad(i0, i1, i2, i3);
      }
    }
    for (const end of [0, uSegs]) {
      const middle = positions.length / 3;
      let x = 0, y = 0, z = 0;
      for (let j = 0; j < vSegs; j++) {
        const i = (baseIndex + j * row + end) * 3;
        x += positions[i]; y += positions[i+1]; z += positions[i+2];
      }
      positions.push(x / vSegs, y / vSegs, z / vSegs);
      uvs.push(end / uSegs, 0.5);
      partIds.push(0);
      tangents.push(0, 1, 0, 1);
      for (let j = 0; j < vSegs; j++) {
        const first = baseIndex + j * row + end;
        const next = baseIndex + ((j + 1) % vSegs) * row + end;
        if ((end === uSegs) === (side > 0)) indices.push(middle, first, next);
        else indices.push(middle, next, first);
      }
    }
  }

  // --- 2. Swallowtail Ribbons (Falling under knot, physically thin strip with notched tips) ---
  function buildTail(side) {
    const rows=11, columns=5, start=positions.length/3;
    const length=side>0 ? 0.036 : 0.031;
    const angle=side*(side>0 ? 0.48 : 0.38);
    const span=(rows+1)*(columns+1);
    for (const layer of [1,-1]) {
      for (let i=0;i<=rows;i++) {
        const u=i/rows;
        const cx=side*0.006+Math.sin(angle)*length*u;
        const cy=-0.007-Math.cos(angle)*length*u;
        const cz=0.002+0.006*Math.sin(u*2.6)+u*0.004;
        const width=0.020-u*0.007;
        for(let j=0;j<=columns;j++) {
          const t=j/columns, across=t-0.5;
          const notch=0.005*Math.max(0,(u-0.7)/0.3)*(1-Math.abs(across)*2);
          positions.push(cx+across*width,cy+across*width*Math.sin(angle)+notch,
            cz+0.002*Math.sin(t*Math.PI)*u+layer*0.0012);
          uvs.push(u,t);
          partIds.push(1);
          tangents.push(Math.sin(angle),-Math.cos(angle),0,1);
        }
      }
    }
    const stride=columns+1;
    for(let i=0;i<rows;i++)for(let j=0;j<columns;j++){
      const a=start+i*stride+j,b=a+stride;
      addQuad(a,b,b+1,a+1);
      addQuad(a+span,a+1+span,b+1+span,b+span);
    }
    for(let j=0;j<columns;j++){
      const head=start+j,tail=start+rows*stride+j;
      addQuad(head,head+1,head+1+span,head+span);
      addQuad(tail,tail+span,tail+1+span,tail+1);
    }
    for(let i=0;i<rows;i++){
      const left=start+i*stride,right=left+columns;
      addQuad(left,left+span,left+stride+span,left+stride);
      addQuad(right,right+stride,right+stride+span,right+span);
    }
  }

  function buildKnot() {
    const sphere=new THREE.SphereGeometry(1,16,10);
    const attr=sphere.attributes.position;
    const start=positions.length/3;
    for(let i=0;i<attr.count;i++){
      const x=attr.getX(i),y=attr.getY(i),z=attr.getZ(i);
      const squish=n=>Math.sign(n)*Math.pow(Math.abs(n),0.86);
      positions.push(0.011*squish(x)+0.0018*y,0.013*squish(y),0.011*z+0.007);
      uvs.push(sphere.attributes.uv.getX(i),sphere.attributes.uv.getY(i));
      partIds.push(2);
      tangents.push(0.3,0.95,0,1);
    }
    for(const i of sphere.index.array)indices.push(start+i);
    sphere.dispose();
  }

  // Construct all sub-parts into single indexed buffer
  buildWing(1.0);   // Right wing loop
  buildWing(-1.0);  // Left wing loop
  buildTail(1.0);   // Right tail
  buildTail(-1.0);  // Left tail
  buildKnot();       // Champagne center knot

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setAttribute("tangent", new THREE.Float32BufferAttribute(tangents, 4));
  geometry.setAttribute("partId", new THREE.Float32BufferAttribute(partIds, 1));
  const artUVs=[];
  const p=new THREE.Vector3();
  for(let i=0;i<positions.length;i+=3) {
    const uv=sampleFront(p.fromArray(positions,i));
    artUVs.push(uv.x,uv.y);
  }
  geometry.setAttribute('artUV',new THREE.Float32BufferAttribute(artUVs,2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const satinMaterial = new THREE.ShaderMaterial({
    side: THREE.FrontSide,
    toneMapped: false,
    uniforms: {
      uFrontArt: {value:frontArt},
      uBase: {value:new THREE.Color(0x4785c0)},
      uLit: {value:new THREE.Color(0x78b4d9)},
      uFold: {value:new THREE.Color(0x2b4676)},
      uKnot: {value:new THREE.Color(0xcba187)},
      ...roomLight,
    },
    vertexShader:`
      attribute vec4 tangent;
      attribute float partId;
      attribute vec2 artUV;
      varying vec3 vNormal, vView, vTangent;
      varying vec2 vFabric, vArt;
      varying float vPart;
      void main() {
        vNormal=normalize(normalMatrix*normal);
        vTangent=normalize(mat3(modelViewMatrix)*tangent.xyz);
        vFabric=uv;
        vArt=artUV;
        vPart=partId;
        vec4 view=modelViewMatrix*vec4(position,1.0);
        vView=-view.xyz;
        gl_Position=projectionMatrix*view;
      }
    `,
    fragmentShader:`
      uniform sampler2D uFrontArt;
      uniform vec3 uBase,uLit,uFold,uKnot;
      varying vec3 vNormal,vView,vTangent;
      varying vec2 vFabric,vArt;
      varying float vPart;
      ${fishRoomLightSource}
      void main() {
        vec3 N=normalize(vNormal), V=normalize(vView);
        vec3 key=fishLightDirection(uFishKeyWorld,-vView,N);
        vec3 fill=fishLightDirection(uFishFillWorld,-vView,N);
        float keyWrap=clamp((dot(N,key)+0.38)/1.38,0.0,1.0);
        float fillWrap=clamp((dot(N,fill)+0.38)/1.38,0.0,1.0);
        float wrap=0.18+0.82*mix(keyWrap,fillWrap,0.32);
        float folded=smoothstep(0.03,0.52,vFabric.x);
        float side=smoothstep(0.05,0.77,dot(N,V));
        vec3 strand=vTangent-N*dot(vTangent,N);
        float strandWeight=smoothstep(0.015,0.17,dot(strand,strand));
        vec3 tangent=fishSafeNormalize(strand,vec3(0.0));
        vec3 H=fishSafeNormalize(V+key,N);
        float fiber=dot(tangent,H);
        float sheen=pow(max(0.0,1.0-fiber*fiber),13.0)*keyWrap*side*strandWeight;
        float knot=step(1.5,vPart);
        vec3 cloth=mix(uFold,uBase,0.52*wrap+0.44*folded);
        cloth=mix(cloth,uLit,sheen*0.24);
        float t=vFabric.x*57.0+vFabric.y*11.0;
        cloth*=1.0+0.027*cos(t)/(1.0+fwidth(t)*2.0);
        vec3 finish=mix(cloth,uKnot*(0.68+0.39*wrap),knot);
        vec4 pigment=texture2D(uFrontArt,vArt);
        float cyan=smoothstep(0.048,0.17,pigment.g-pigment.r)*smoothstep(0.08,0.27,pigment.b);
        float sand=smoothstep(0.045,0.15,pigment.r-pigment.b);
        finish=mix(finish,pigment.rgb,pigment.a*mix(cyan,sand,knot)*0.26);
        gl_FragColor=vec4(finish,1.0);
        #include <colorspace_fragment>
      }
    `,
  });

  const mesh = new THREE.Mesh(geometry, satinMaterial);
  mesh.name = "FishRibbon_Mesh";
  group.add(mesh);

  return { group, mesh };
}

<script>
function attachFishRibbons(THREE, head, headRest, texture, min, max, calibration, roomLight) {
  const up=new THREE.Vector3(0,1,0);
  const surface=new THREE.Vector3();
  const uv=new THREE.Vector2();
  const mounts=[
    {name:'BowRight',point:[0.191,0.203,0.195],direction:[0.67,0.035,0.742],scale:[0.90,1.04,1]},
    {name:'BowLeft',point:[-0.281,0.228,0.086],direction:[-0.93,0.030,0.367],scale:[0.56,0.67,0.78]},
  ];
  return mounts.map(mount=>{
    const position=new THREE.Vector3().fromArray(mount.point);
    const normal=new THREE.Vector3().fromArray(mount.direction).normalize();
    const across=new THREE.Vector3().crossVectors(up,normal).normalize();
    const vertical=new THREE.Vector3().crossVectors(normal,across).normalize();
    const rotation=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(across,vertical,normal));
    const scale=new THREE.Vector3().fromArray(mount.scale);
    const sampleFront=p=>{
      surface.copy(p).multiply(scale).applyQuaternion(rotation).add(position);
      const u=(surface.x-min.x)/(max.x-min.x);
      const v=(max.y-surface.y)/(max.y-min.y);
      return uv.set((calibration.refX0+(calibration.refX1-calibration.refX0)*u)/174,
        (calibration.refY0+(calibration.refY1-calibration.refY0)*v)/244);
    };
    const {group,mesh}=createFishRibbon(THREE,texture,sampleFront,roomLight);
    group.name=mount.name;
    group.position.copy(position).sub(headRest);
    group.quaternion.copy(rotation);
    group.scale.copy(scale);
    head.add(group);
    return mesh;
  });
}

<script>
function clearFishPaintedRibbons(context) {
  const patches=[
    {x:110,y:61,width:29,height:25,knot:[126,71],ends:[[73,90,164],[53,69,133]]},
    {x:19,y:55,width:13,height:23,knot:[26,64],ends:[[59,71,127],[70,84,153]]},
  ];
  for(const patch of patches) {
    const {x,y,width,height,knot,ends}=patch;
    const pixels=context.getImageData(x,y,width,height);
    const data=pixels.data;
    const mask=new Uint8Array(width*height);
    for(let j=0;j<height;j++)for(let i=0;i<width;i++){
      const k=(j*width+i)*4,r=data[k],g=data[k+1],b=data[k+2];
      const nearKnot=Math.hypot(x+i-knot[0],y+j-knot[1])<4;
      const cyan=g-r>17 && b>100 && b>g+12;
      const warm=nearKnot && r-b>14 && g>75;
      if(data[k+3]>120 && (cyan||warm))mask[k/4]=1;
    }
    const weight=new Float32Array(width*height);
    const guide=new Float32Array(data.length);
    let values=new Float32Array(data), next=new Float32Array(data);
    for(let j=0;j<height;j++)for(let i=0;i<width;i++){
      const index=j*width+i, k=index*4;
      const t=i/(width-1), shade=1+0.028*(j/height-0.5);
      for(let c=0;c<3;c++)guide[k+c]=(ends[0][c]*(1-t)+ends[1][c]*t)*shade;
      if(data[k+3]<120||Math.min(data[k],data[k+1],data[k+2])>153)continue;
      let distance=Infinity;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        const row=j+dy,col=i+dx;
        if(row<0||row>=height||col<0||col>=width||!mask[row*width+col])continue;
        distance=Math.min(distance,Math.hypot(dx,dy));
      }
      weight[index]=distance<=1 ? 1 : Math.max(0,(2.25-distance)/1.25);
      if(!weight[index])continue;
      for(let c=0;c<3;c++)values[k+c]=guide[k+c];
    }
    next.set(values);
    const neighbors=[-1,1,-width,width];
    for(let pass=0;pass<42;pass++){
      for(let j=1;j<height-1;j++)for(let i=1;i<width-1;i++){
        const index=j*width+i, k=index*4;
        if(!weight[index])continue;
        for(let c=0;c<3;c++){
          let sum=guide[k+c]*0.55;
          for(const offset of neighbors){
            const neighbor=index+offset;
            const base=neighbor*4, q=base+c;
            const resemblesHair=Math.abs(data[base+2]-guide[base+2])<28
              && Math.abs(data[base]-guide[base])<28 && data[base+3]>120;
            sum+=weight[neighbor]>0 || resemblesHair ? values[q] : guide[q];
          }
          next[k+c]=sum/4.55;
        }
      }
      [values,next]=[next,values];
    }
    for(let i=0;i<weight.length;i++){
      const k=i*4;
      for(let c=0;c<3;c++)data[k+c]+=(values[k+c]-data[k+c])*weight[i];
    }
    context.putImageData(pixels,x,y);
  }
}

<script>
function buildFishHeadLaceGeometry(THREE, sample) {
  const segmentsU = 88;
  const segmentsV = 10;
  const numVerts = (segmentsU + 1) * (segmentsV + 1);

  const positions = new Float32Array(numVerts * 3);
  const uvs = new Float32Array(numVerts * 2);
  const indices = [];

  const tempNorm = new THREE.Vector3();
  const tempPos = new THREE.Vector3();

  // 13 rounded scallops across the band arch
  const scallopCount = 13.0;

  let vIndex = 0;
  for (let i = 0; i <= segmentsU; i++) {
    const u = i / segmentsU;

    // Ends taper smoothly into the hair
    const taper = Math.sin(u * Math.PI);
    const endTaper = 0.14 + 0.86 * Math.min(1.0, taper * 3.6);

    // Rounded periodic scalloped silhouette at outer crown edge
    const scallopWave = 0.5 + 0.5 * Math.cos(u * Math.PI * 2.0 * scallopCount);
    const scallopHeight = Math.pow(scallopWave, 0.6) * 0.29;

    for (let j = 0; j <= segmentsV; j++) {
      const vNorm = j / segmentsV; // 0.0 (inner bound seam) -> 1.0 (scalloped outer edge)

      // Map v from [-0.85, 0.75 + scallop] scaled by end taper into [-1, 1] range
      const vLocal = -0.92 + vNorm * (1.56 + scallopHeight);
      const vClamped = Math.max(-0.98, Math.min(0.98, vLocal * endTaper));

      const sampled = sample(u, vClamped);
      tempPos.copy(sampled.position);
      tempNorm.copy(sampled.normal).normalize();

      // Lift slightly off scalp to prevent z-fighting + organic shallow drape displacement
      const folds = Math.sin(u * Math.PI * scallopCount * 2.0) * (0.0013 + 0.0014 * vNorm);
      const lift = 0.0035 + 0.0039 * Math.sin(vNorm * Math.PI) + folds;

      tempPos.addScaledVector(tempNorm, lift);

      positions[vIndex * 3]     = tempPos.x;
      positions[vIndex * 3 + 1] = tempPos.y;
      positions[vIndex * 3 + 2] = tempPos.z;

      uvs[vIndex * 2]     = u;
      uvs[vIndex * 2 + 1] = vNorm;

      vIndex++;
    }
  }

  // Construct indexed quads
  for (let i = 0; i < segmentsU; i++) {
    for (let j = 0; j < segmentsV; j++) {
      const a = i * (segmentsV + 1) + j;
      const b = (i + 1) * (segmentsV + 1) + j;
      const c = (i + 1) * (segmentsV + 1) + (j + 1);
      const d = i * (segmentsV + 1) + (j + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  return geometry;
}

function createFishHeadLace(THREE, roomLight) {
  const {position,uv,index}=fishHeadLaceMesh;
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(position,3));
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geometry.setIndex(index);
  geometry.computeVertexNormals();
  const scallopCount=13;
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uScallopCount: { value: scallopCount },
      ...roomLight
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      #define HW_DIGITS 3.14159265359
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewPosition;

      uniform float uScallopCount;
      ${fishRoomLightSource}

      // Screen-space anti-aliased edge mask
      float aastep(float threshold, float value) {
        float afwidth = max(0.025, 0.58*fwidth(value));
        return smoothstep(threshold - afwidth, threshold + afwidth, value);
      }

      void main() {
        vec2 uv = vUv;

        // Normal perturbation for cloth micro-weave + braided seam + embossed scallop ribs
        vec3 N = normalize(vNormal) * (gl_FrontFacing ? 1.0 : -1.0);
        vec3 V = normalize(vViewPosition);
        vec3 key = fishLightDirection(uFishKeyWorld,-vViewPosition,N);
        vec3 fill = fishLightDirection(uFishFillWorld,-vViewPosition,N);

        // Raised braided seam near inner edge (v ~ 0.08)
        float seamDist = abs(uv.y - 0.08);
        float seamProfile = exp(-seamDist * seamDist * 1800.0);
        float braidPhase = uv.x * HW_DIGITS * 160.0;
        float braidPucker = sin(braidPhase) * seamProfile;
        float braidFilter = 1.0/(1.0+1.5*fwidth(braidPhase));

        // Embossed ribbing leading to each scallop peak
        float ribPhase = uv.x * HW_DIGITS * 2.0 * uScallopCount;
        float rib = cos(ribPhase);
        float ribFilter = 1.0/(1.0+1.5*fwidth(ribPhase));
        float ribDisplace = rib * smoothstep(0.2, 0.85, uv.y) * 0.45;

        // Tight cotton/linen weave microtexture
        vec2 weaveUV = uv * vec2(190.0, 75.0);
        float weave = sin(weaveUV.x) * sin(weaveUV.y);
        float weaveFilter = 1.0/(1.0+dot(fwidth(weaveUV),vec2(1.5)));

        // Eylet pin holes centered under each scallop peak
        float eyeletPhase = fract(uv.x * uScallopCount + 0.5) - 0.5;
        float eyeletDist = length(vec2(eyeletPhase * 2.4, (uv.y - 0.62) * 5.0));
        float eyeletHole = 1.0 - aastep(0.32, eyeletDist);

        // Recover the lace relief along the surface, including at a grazing angle.
        float holeRelief = 1.0-smoothstep(0.28,0.36,eyeletDist);
        float ringRelief = smoothstep(0.34,0.42,eyeletDist)-smoothstep(0.45,0.51,eyeletDist);
        vec4 relief = vec4(braidPucker*0.6,ribDisplace*0.3,weave*0.08,ringRelief*0.13-holeRelief*0.21);
        vec4 attenuation = vec4(braidFilter,ribFilter,weaveFilter,1.0/(1.0+2.0*fwidth(eyeletDist)));
        vec3 surfaceX = dFdx(-vViewPosition), surfaceY = dFdy(-vViewPosition);
        vec3 across = cross(surfaceY,N), along = cross(N,surfaceX);
        float determinant = dot(surfaceX,across);
        vec3 slope = across * dot(dFdx(relief),attenuation) + along * dot(dFdy(relief),attenuation);
        vec3 bump = slope * (0.00011 * sign(determinant) / max(1e-9,abs(determinant)));
        N = normalize(N - bump * min(1.0,0.11/max(0.001,length(bump))));

        // Warm ivory cloth base palette
        vec3 ivoryBase  = vec3(0.916, 0.846, 0.806);
        vec3 ivoryShadow = vec3(0.680, 0.607, 0.620);
        vec3 braidColor = vec3(0.937, 0.874, 0.832);

        // Dual-lobe soft diffuse for tight translucent textile (wrap lighting)
        float keyWrap = max(0.0,(dot(N,key)+0.35)/1.35);
        float fillWrap = max(0.0,(dot(N,fill)+0.35)/1.35);
        float wrapDiff = 0.15+0.85*mix(keyWrap,fillWrap,0.34);
        vec3 diffuse = mix(ivoryShadow, ivoryBase, wrapDiff);

        // Low-gloss micro-facet sheen (velvety / soft cotton cloth, no hard plastic shine)
        vec3 H = fishSafeNormalize(key+V,N);
        float NdotH = max(0.0, dot(N, H));
        float clothSheen = pow(1.0 - max(0.0, dot(N, V)), 3.2) * 0.028;
        float specular = pow(NdotH, 12.0) * 0.016;

        vec3 color = diffuse * (1.0 - eyeletHole * 0.22);
        color = mix(color, braidColor, seamProfile * 0.45);
        color += (clothSheen + specular) * vec3(1.0, 0.98, 0.95);

        // Inner bound seam shadow hem
        float innerHem = smoothstep(0.0, 0.045, uv.y);
        float foldShadow = smoothstep(0.12, 0.71, uv.y) * (1.0 - smoothstep(0.85, 1.0, uv.y));
        color *= (0.88 + 0.12 * innerHem) * (1.0 + 0.092 * rib * ribFilter * foldShadow);

        // Taper fade into hair at temples
        float edgeTaper = smoothstep(0.0, 0.05, uv.x) * (1.0 - smoothstep(0.95, 1.0, uv.x));
        color *= 0.75 + 0.25 * edgeTaper;

        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `,
    side: THREE.DoubleSide,
    toneMapped: false,
    depthWrite: true,
    depthTest: true
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = "FishHeadLace_ScallopedBand";

  return mesh;
}

const fishHeadLaceSkinSource = `
vec3 fishShadeEarFin(vec3 color, vec3 p, vec3 viewN, vec3 viewP) {
  // The scan's fins are asymmetric. Keep the bind-space masks local to
  // the projecting lobes, away from the neighboring hair and the bows.
  vec3 footprint = fwidth(p);
  bool left = p.x > 0.0;
  float outward = abs(p.x);
  if (left ? (outward<0.175 || p.y<0.073 || p.y>0.145 || p.z<0.097 || p.z>0.216)

  float u = left ? (outward-0.171)/0.126 : (outward-0.266)/0.123;
  float span = left ? smoothstep(0.175,0.205,outward) : smoothstep(0.272,0.313,outward);
  float depth = left ? smoothstep(0.097,0.119,p.z)*(1.0-smoothstep(0.193,0.216,p.z))
    : smoothstep(-0.065,-0.021,p.z)*(1.0-smoothstep(0.078,0.115,p.z));
  float bottom = left ? smoothstep(0.073,0.084,p.y) : smoothstep(0.111,0.133,p.y);
  float lengthwise = clamp(u,0.0,1.0);
  float back = left ? (0.194-p.z)/0.094 : (0.076-p.z)/0.102;
  float arc = clamp(left ? 0.83*lengthwise+0.69*back-0.12 : 0.64*lengthwise+0.52*back-0.08,0.0,1.0);
  float phase = 6.2831853*(3.6*arc+0.08);
  float wave = cos(phase);
  float seam = left ? 0.103+0.023*smoothstep(0.118,0.192,p.z)+0.004*lengthwise
    : 0.140+0.029*lengthwise+0.012*smoothstep(0.034,0.080,p.z);
  float edge = seam-p.y + (0.0011+0.0018*lengthwise)*wave;
  // Estimate coverage from the bind-position footprint, before any
  // per-fragment early exits can make screen derivatives undefined.
  float aa = clamp(0.70*(footprint.y+0.22*footprint.x+0.43*footprint.z),0.0011,0.0065);
  float ivory = smoothstep(-aa,aa,edge)*span*depth*bottom;
  if (ivory < 0.003) return color;

  vec3 key = fishLightDirection(uFishKeyWorld,viewP,viewN);
  vec3 fill = fishLightDirection(uFishFillWorld,viewP,viewN);
  float light = fishRoomDiffuse(viewN,key,0.52);
  float bounce = fishRoomDiffuse(viewN,fill,0.65);
  vec2 ribGradient = left ? vec2(0.83/0.126,0.69/0.094) : vec2(0.64/0.123,0.52/0.102);
  float rib = wave / (1.0+19.905*dot(footprint.xz,ribGradient));
  float lipDistance = (edge-0.005)/0.007;
  float lip = exp2(-1.8*lipDistance*lipDistance);
  vec3 fabric = mix(vec3(0.460,0.484,0.587),vec3(0.716,0.727,0.773),light);
  fabric *= 0.88+0.105*bounce+0.042*rib;
  fabric += vec3(0.043,0.049,0.068)*lip;
  return mix(color,fabric,ivory*1.000);
}

vec3 fishCleanHeadLacePigment(vec3 color, vec3 position, vec3 normal) {
  float aboveTemples = smoothstep(0.222, 0.257, position.y);
  float darkest = min(min(color.r, color.g), color.b);
  float lightest = max(max(color.r, color.g), color.b);
  float paleFabric = smoothstep(0.20, 0.47, darkest)
    * (1.0 - smoothstep(0.095, 0.28, lightest - darkest));
  float crownShade = 0.95 + 0.13 * smoothstep(0.04, 0.19, position.z);
  vec3 blueHair = vec3(0.080, 0.105, 0.246) * crownShade;
  vec3 cleaned = mix(color, blueHair, aboveTemples * paleFabric * 0.98);
  float sideCrown = smoothstep(0.085, 0.137, abs(position.x))
    * smoothstep(0.229, 0.274, position.y) * (1.0 - smoothstep(0.375, 0.422, position.y))
    * smoothstep(0.050, 0.087, position.z) * (1.0 - smoothstep(0.166, 0.205, position.z))
    * smoothstep(0.23, 0.60, abs(normal.x));
  float grayEdge = 1.0 - smoothstep(0.130, 0.255, cleaned.b - cleaned.g);
  float shade = clamp(cleaned.b / 0.32, 0.86, 1.12);
  return mix(cleaned, vec3(0.093, 0.132, 0.322) * shade, sideCrown * grayEdge * 0.92);
}

const fishGreetingSeconds = 2.28;
const fishViewerGestures = {

    [1.25,.10,.60,0,.85,0], [1.45,.05,.20,0,.40,0], [1.65,0,0,0,0,0]
  ],
  dance: [

    [.60,.005,-.09,.08,-.22,.85,.72], [.90,-.015,.11,-.10,.26,.95,.90],
    [1.20,.006,-.06,.05,-.18,1,.78], [1.50,-.012,.08,-.07,.20,.85,.88],
    [1.80,.004,-.04,.03,-.12,.65,.45], [2.10,-.006,.02,-.02,.06,.30,.15],
    [2.40,0,0,0,0,0,0]
  ]
};

function fishGreetingEase(value) {
  const t=Math.min(1,Math.max(0,value));
  return t*t*t*(10+t*(-15+6*t));
}

function sampleFishViewerGesture(keys,time,out) {
  const next=keys.findIndex(key=>key[0]>time);
  if(next<1) {
    out.fill(0);
    return;
  }
  const a=keys[next-1], b=keys[next];
  const blend=fishGreetingEase((time-a[0])/(b[0]-a[0]));
  for(let i=0;i<out.length;i++)out[i]=a[i+1]+(b[i+1]-a[i+1])*blend;
}

function evaluateFishGreeting(time, pose, face) {
  const rise=fishGreetingEase((time-.10)/.58);
  const lower=fishGreetingEase((time-1.60)/.62);
  const held=rise*(1-lower);
  const swingTime=Math.max(0,Math.min(1,time-.65));
  const swing=Math.sin(4*Math.PI*swingTime)*Math.sin(Math.PI*swingTime);
  const hello=fishGreetingEase((time-.28)/.56)*(1-fishGreetingEase((time-1.71)/.49));
  const shy=fishGreetingEase(time/.18)*(1-fishGreetingEase((time-.18)/.35));
  pose.greetingCover=fishGreetingEase((time-.015)/.125)*(1-fishGreetingEase((time-2.17)/.10));
  pose.greetingRise=held;
  pose.greetingSway=swing*held;
  pose.chestRoll+=-.042*held+.011*swing;
  pose.chestPitch+=.038*shy-.022*held;
  pose.headPitch+=.039*shy-.044*hello;
  pose.headRoll+=.119*hello+.010*swing;
  pose.headYaw+=.052*held;
  pose.hairLag-=.038*hello+.010*swing;
  pose.tailAngle+=.051*hello*Math.sin((time-.36)*5.1);
  face.smile+=.62*hello;
  function blink(at) {
    const close=fishGreetingEase((time-at)/.070);
    return close*(1-fishGreetingEase((time-at-.112)/.115));
  }
  face.blinkLeft=blink(1.345);
  face.blinkRight=blink(1.353);
}

function createFishGreeting(THREE,rig) {
  if(!rig?.cupArm)return null;
  const arm=rig.cupArm;
  const neutral=new THREE.Vector3(), lifted=new THREE.Vector3(), goal=new THREE.Vector3();
  const direction=new THREE.Vector3(), axis=arm.handOffset.clone().normalize();
  const goalQ=new THREE.Quaternion(), palmQ=new THREE.Quaternion(), twist=new THREE.Quaternion();
  const restNormal=new THREE.Vector3(0,0,1).addScaledVector(axis,-axis.z).normalize();
  const front=new THREE.Vector3(), turned=new THREE.Vector3(), cross=new THREE.Vector3();
  const actual=new THREE.Vector3();
  const kissTarget=new THREE.Vector3();
  const kissTip=new THREE.Vector3();
  const palmOffset=new THREE.Vector3();
  const status={active:false,rise:0,sway:0,palm:[0,0,0]};
  function apply(rise,sway,cover,kissReach,kissRelease,highWave) {
    const kiss=Math.max(kissReach,kissRelease);
    status.active=Math.max(rise,kiss)>0.0001;
    status.rise=rise;
    status.sway=sway;
    if(!status.active){
      rig.greetingSleeve?.setBlend(cover);
      return;
    }
    arm.palmRestModel(neutral);
    if(kiss>0 && rig.mouthSocket) {
      // Aim the fingertips in front of the posed lips, then extend them
      // outward. The IK limits the reach while keeping the elbow bent.
      const release=kissRelease;
      rig.head.localToWorld(kissTarget.copy(rig.mouthSocket));
      rig.body.parent.worldToLocal(kissTarget);
      lifted.copy(kissTarget);
      lifted.x+=.012+.138*release;
      lifted.y+=-.018+.064*release;
      lifted.z+=.058+.076*release;
      direction.set(-.68+.89*release,.66-.37*release,.33+.60*release).normalize();
    } else {
      lifted.set(.188+.018*sway+.018*highWave,-.025+.008*sway*sway+.086*highWave,.219+.026*highWave);
      direction.set(.33+(.19+.40*highWave)*sway,.88-.07*sway,.34).normalize();
    }
    goalQ.setFromUnitVectors(axis,direction);
    front.set(.10+.10*sway,0,1).projectOnPlane(direction).normalize();
    turned.copy(restNormal).applyQuaternion(goalQ);
    const roll=Math.atan2(cross.crossVectors(turned,front).dot(direction),turned.dot(front));
    goalQ.premultiply(twist.setFromAxisAngle(direction,roll));
    palmQ.identity().slerp(goalQ,Math.max(rise,kiss));
    if(kiss>0 && rig.greetingSleeve) {
      kissTip.copy(rig.greetingSleeve.contactTip).sub(arm.handOffset);
      lifted.sub(palmOffset.copy(kissTip).applyQuaternion(palmQ));
    }
    goal.lerpVectors(neutral,lifted,Math.max(rise,kiss));
    if(kiss===0)goal.z+=.031*Math.sin(Math.PI*rise);
    arm.setPalm(goal,palmQ);
    arm.palmModel(actual).toArray(status.palm);
    rig.greetingSleeve?.setBlend(cover);
  }
  return {apply,status};
}

<script>
function createFishCupHand(THREE,root,arm,material) {
  const sides=9, sections=13, parts=5;
  const stride=(sections+1)*sides+2;
  const position=new THREE.BufferAttribute(new Float32Array(parts*stride*3),3).setUsage(THREE.DynamicDrawUsage);
  const normal=new THREE.BufferAttribute(new Float32Array(parts*stride*3),3).setUsage(THREE.DynamicDrawUsage);
  const indices=[];
  for(let part=0;part<parts;part++){
    const first=part*stride;
    const beginCap=first+(sections+1)*sides, endCap=beginCap+1;
    const last=first+sections*sides;
    for(let j=0;j<sides;j++){
      const next=(j+1)%sides;
      indices.push(beginCap,first+next,first+j,endCap,last+j,last+next);
      for(let i=0;i<sections;i++){
        const a=first+i*sides+j,b=first+i*sides+next;
        indices.push(a,b,a+sides,b,b+sides,a+sides);
      }
    }
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',position);
  geometry.setAttribute('normal',normal);
  geometry.setIndex(indices);
  const mesh=new THREE.Mesh(geometry,material);
  mesh.name='cupGripHand';
  mesh.frustumCulled=false;
  mesh.visible=false;
  root.add(mesh);

  const wrist=new THREE.Vector3(),palm=new THREE.Vector3(),axis=new THREE.Vector3();
  const localPalm=new THREE.Vector3(), localAxis=new THREE.Vector3(), inverse=new THREE.Quaternion();
  const cupPoint=new THREE.Vector3(),delta=new THREE.Vector3();
  const direction=new THREE.Vector3(),side=new THREE.Vector3(),across=new THREE.Vector3();
  const point=new THREE.Vector3(),unit=new THREE.Vector3(),up=new THREE.Vector3(),nextUp=new THREE.Vector3();
  const centers=Array.from({length:sections+1},()=>new THREE.Vector3());
  const radii=new Float32Array(sections+1);
  const cos=Array.from({length:sides},(_,i)=>Math.cos(i*Math.PI*2/sides));
  const sin=Array.from({length:sides},(_,i)=>Math.sin(i*Math.PI*2/sides));
  const fingerData=[
    {height:-.0080,arc:.58,radius:.0040,length:.0185},
    {height:-.0023,arc:.73,radius:.0042,length:.0205},
    {height:.0035,arc:.63,radius:.0039,length:.0190},
    {height:.0106,arc:.38,radius:.0042,length:.0145},
  ];
  const metrics={contactGap:0,penetration:0,highestFinger:0};
  const lerp=THREE.MathUtils.lerp,clamp=THREE.MathUtils.clamp;
  const smooth=t=>t*t*(3-2*t);
  function outerRadius(height){
    if(height<=.009)return lerp(.017,.019,clamp((height-.002)/.007,0,1));
    if(height<=.026)return lerp(.019,.031,(height-.009)/.017);
    return lerp(.031,.0365,clamp((height-.026)/.022,0,1));
  }

  function setPose({base,rotation,curl,scale}) {
    root.worldToLocal(arm.bones[2].getWorldPosition(wrist));
    arm.palmModel(palm);
    axis.subVectors(palm,wrist).normalize();
    inverse.copy(rotation).invert();
    localPalm.copy(palm).sub(base).applyQuaternion(inverse);
    localAxis.copy(axis).applyQuaternion(inverse);
    up.set(0,1,0).applyQuaternion(rotation);
    const palmRadius=Math.hypot(localPalm.x,localPalm.z);
    const palmAngle=Math.atan2(localPalm.z,localPalm.x);
    metrics.contactGap=Infinity;
    metrics.penetration=0;
    metrics.highestFinger=-Infinity;

    for(let i=0;i<=sections;i++){
      const t=i/sections;
      centers[i].copy(wrist).lerp(palm,t).addScaledVector(axis,lerp(-.005,.006,t));
      radii[i]=lerp(.010,.013,t)*(1-.83*smooth(clamp((t-.76)/.24,0,1)));
    }
    tube(0,.80);

    for(let j=0;j<fingerData.length;j++){
      const digit=fingerData[j];
      for(let i=0;i<=sections;i++){
        const t=i/sections;
        const reach=smooth(t);
        const radius=digit.radius/scale*(1-.76*smooth(clamp((t-.76)/.24,0,1)));
        const height=localPalm.y+digit.height/scale*(.52+.48*reach);
        const bend=palmAngle+digit.arc*reach;
        const wall=outerRadius(height*scale)/scale;
        const near=lerp(palmRadius-.002/scale,wall+radius*1.12+.0006/scale,reach);
        cupPoint.set(Math.cos(bend)*near,height,Math.sin(bend)*near);
        delta.copy(localPalm).addScaledVector(localAxis,digit.length/scale*t);
        delta.y+=digit.height/scale*(.58+.42*t);
        delta.z+=.006*t/scale;
        delta.lerp(cupPoint,curl);
        centers[i].copy(delta).applyQuaternion(rotation).add(base);
        radii[i]=radius;
      }
      tube(j+1,.91);
    }
    if(!Number.isFinite(metrics.contactGap))metrics.contactGap=null;
    if(!Number.isFinite(metrics.highestFinger))metrics.highestFinger=null;
    position.needsUpdate=true;
    normal.needsUpdate=true;

    function write(index,value,n,isFinger) {
      cupPoint.copy(value).sub(base).applyQuaternion(inverse);
      const h=cupPoint.y*scale;
      if(h>=.002&&h<=.048){
        const radius=Math.hypot(cupPoint.x,cupPoint.z);
        const wall=outerRadius(h)/scale;
        if(radius<wall&&radius>1e-6){
          cupPoint.x*=wall/radius;
          cupPoint.z*=wall/radius;
          value.copy(cupPoint).applyQuaternion(rotation).add(base);
        }
        const gap=(Math.max(radius,wall)-wall)*scale;
        if(isFinger)metrics.contactGap=Math.min(metrics.contactGap,gap);
        metrics.penetration=Math.max(metrics.penetration,Math.max(0,wall-Math.hypot(cupPoint.x,cupPoint.z))*scale);
      }
      if(isFinger)metrics.highestFinger=Math.max(metrics.highestFinger,h);
      position.setXYZ(index,value.x,value.y,value.z);
      normal.setXYZ(index,n.x,n.y,n.z);
    }
    function tube(part,flatten) {
      const first=part*stride;
      nextUp.copy(up);
      for(let i=0;i<=sections;i++){
        direction.subVectors(centers[Math.min(sections,i+1)],centers[Math.max(0,i-1)]).normalize();
        side.crossVectors(nextUp,direction);
        if(side.lengthSq()<1e-7)side.crossVectors(delta.set(1,0,0),direction);
        if(side.lengthSq()<1e-7)side.crossVectors(delta.set(0,0,1),direction);
        side.normalize();
        across.crossVectors(direction,side).normalize();
        nextUp.copy(across);
        for(let j=0;j<sides;j++){
          point.copy(centers[i]).addScaledVector(side,radii[i]*cos[j]).addScaledVector(across,radii[i]*sin[j]*flatten);
          unit.copy(side).multiplyScalar(cos[j]).addScaledVector(across,sin[j]/flatten).normalize();
          write(first+i*sides+j,point,unit,part>0);
        }
        if(i===0||i===sections){
          point.copy(centers[i]);
          unit.copy(direction).multiplyScalar(i===0?-1:1);
          write(first+(sections+1)*sides+(i===0?0:1),point,unit,part>0);
        }
      }
    }
    return metrics;
  }
  return {mesh,setPose};
}
