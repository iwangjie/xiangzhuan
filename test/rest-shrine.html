<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>香篆 · 茶席静坐</title>
<style>
  @font-face {
    font-family: "Shrine Calligraphy";
    src: url("../assets/fonts/shrine-calligraphy.woff") format("woff");
  }

  :root {
    --c-paper: #e8e1d5;
    --c-muted: rgba(232, 225, 213, 0.58);
    --c-faint: rgba(232, 225, 213, 0.15);
    --c-seal: #9b291e;
    --c-gold: #c9a05b;
    --font-serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Kaiti SC", "STKaiti", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0b0907;
    color: var(--c-paper);
    font-family: var(--font-serif);
  }

  #webgl-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: grab;
  }
  #webgl-container:active {
    cursor: grabbing;
  }

  /* 电影级光学暗角与上下柔化衬底，确保宣纸墨色文字在亮窗背景下清晰可读 */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 52% 48%, rgba(10, 8, 6, 0) 46%, rgba(9, 7, 5, 0.38) 78%, rgba(5, 4, 3, 0.82) 100%),
      linear-gradient(to bottom, rgba(7, 6, 5, 0.65) 0%, rgba(7, 6, 5, 0.16) 15%, rgba(7, 6, 5, 0) 32%, rgba(7, 6, 5, 0) 72%, rgba(6, 5, 4, 0.82) 100%);
  }

  /* 微妙胶片颗粒质感层 */
  #film-grain {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.030;
    mix-blend-mode: overlay;
    background-size: 160px 160px;
  }

  /* 开场与收尾黑场过渡 */
  #curtain {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #080705;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #curtain.fade-out {
    opacity: 0;
  }

  /* 收尾：镜头没入茶汤，暗场像瞳孔一样自四周合拢（不是一团橙色光球） */
  #tea-wash {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 52%,
      rgba(9, 6, 3, 0) 0%,
      rgba(9, 6, 3, 0) 30%,
      rgba(26, 13, 6, 0.42) 48%,
      rgba(17, 9, 4, 0.86) 66%,
      rgba(8, 5, 3, 0.98) 84%,
      #050402 100%);
    transform: scale(1.75);
    will-change: transform, opacity;
  }
  #tea-wash .ring {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 52vmin;
    height: 52vmin;
    margin: -26vmin 0 0 -26vmin;
    border-radius: 50%;
    border: 1px solid rgba(226, 189, 142, 0.30);
    opacity: 0;
    transform: scale(0.12);
    will-change: transform, opacity;
  }
  #tea-wash .core {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 74vmin;
    height: 1px;
    margin: -0.5px 0 0 -37vmin;
    opacity: 0;
    background: linear-gradient(90deg,
      rgba(255, 236, 208, 0) 0%,
      rgba(255, 236, 208, 0.20) 34%,
      rgba(255, 246, 232, 0.34) 50%,
      rgba(255, 236, 208, 0.20) 66%,
      rgba(255, 236, 208, 0) 100%);
    filter: blur(0.6px);
    will-change: transform, opacity;
  }
  #tea-wash .dim {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: #050403;
  }

  /* 极简宣纸墨风 HUD */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    padding: 44px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 1.25s cubic-bezier(0.16, 1, 0.3, 1), transform 1.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #hud.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #hud.outro {
    opacity: 0;
    transform: translateY(10px);
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand-col {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 16px;
    padding: 10px 16px 14px 10px;
    border-radius: 2px;
    background: radial-gradient(ellipse at 20% 25%, rgba(12, 10, 8, 0.44) 0%, rgba(12, 10, 8, 0) 80%);
  }

  .seal {
    width: 24px;
    height: 24px;
    border: 1px solid rgba(186, 56, 42, 0.85);
    background: rgba(155, 41, 30, 0.25);
    color: #e66b5b;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 6px rgba(155, 41, 30, 0.35), 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .vertical-inscription {
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.34em;
    font-size: 12px;
    color: var(--c-muted);
    line-height: 2.05;
    height: 126px;
    border-left: 1px solid var(--c-faint);
    padding-left: 12px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }
  .vertical-inscription strong {
    color: var(--c-paper);
    font-weight: 400;
  }

  .view-btn, .action-link {
    pointer-events: auto;
  }

  .view-switcher {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 8px 18px;
    background: rgba(12, 10, 8, 0.38);
    border: 1px solid rgba(232, 225, 213, 0.08);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .view-switcher.hidden {
    display: none;
  }

  .view-label-prefix {
    color: rgba(232, 225, 213, 0.36);
    font-size: 11px;
    letter-spacing: 0.22em;
    margin-right: -6px;
  }

  .view-btn {
    background: none;
    border: none;
    color: var(--c-muted);
    font-family: var(--font-serif);
    font-size: 13px;
    letter-spacing: 0.26em;
    cursor: pointer;
    padding: 6px 0;
    position: relative;
    transition: color 0.35s ease;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
  }
  .view-btn:hover,
  .view-btn.active {
    color: var(--c-paper);
  }
  .view-btn::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0.26em;
    bottom: 0;
    height: 1.5px;
    background: var(--c-gold);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .view-btn.active::after {
    transform: scaleX(1);
  }

  .hud-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
  }

  .status-block {
    display: flex;
    flex-direction: column;
    gap: 11px;
    min-width: 268px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }

  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 18px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--c-muted);
  }

  #status-label {
    color: var(--c-paper);
  }

  #progress-num {
    font-family: var(--font-serif);
    font-size: 11px;
    letter-spacing: 0.16em;
    font-variant-numeric: tabular-nums;
    color: rgba(232, 225, 213, 0.54);
  }

  .incense-ruler {
    position: relative;
    width: 268px;
    height: 1px;
    background: rgba(232, 225, 213, 0.18);
  }
  .incense-ruler::before,
  .incense-ruler::after {
    content: "";
    position: absolute;
    top: -2px;
    width: 1px;
    height: 5px;
    background: rgba(232, 225, 213, 0.28);
  }
  .incense-ruler::before { left: 0; }
  .incense-ruler::after { right: 0; }

  #progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 1px;
    width: 0%;
    background: linear-gradient(90deg, rgba(232, 225, 213, 0.28) 0%, rgba(218, 132, 68, 0.92) 100%);
    transition: width 0.35s linear;
  }

  #progress-ember {
    position: absolute;
    top: -1.5px;
    left: 0%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ff692e;
    box-shadow: 0 0 8px 2px rgba(255, 94, 32, 0.88);
    transform: translateX(-50%);
    transition: left 0.35s linear;
  }

  .drag-hint {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: rgba(232, 225, 213, 0.36);
    margin-top: 2px;
  }
  .drag-hint.hidden {
    display: none;
  }

  .timer-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
  }

  .timer-caption {
    font-size: 11px;
    letter-spacing: 0.26em;
    color: var(--c-muted);
    margin-right: -0.26em;
  }

  #countdown {
    font-family: "Optima", "Baskerville", "Didot", "Songti SC", serif;
    font-weight: 300;
    font-size: clamp(48px, 5.2vw, 74px);
    line-height: 0.95;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    color: var(--c-paper);
    margin-right: -0.08em;
  }

  #display-name {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(232, 225, 213, 0.42);
    margin-top: -2px;
    min-height: 15px;
  }

  .actions-bar {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 10px;
    border-top: 1px solid var(--c-faint);
    transition: opacity 0.4s ease;
  }
  .actions-bar.hidden {
    display: none;
  }

  .action-link {
    background: none;
    border: none;
    color: var(--c-muted);
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 2px 0 4px 0;
    border-bottom: 1px solid rgba(232, 225, 213, 0.24);
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .action-link:hover {
    color: var(--c-paper);
    border-bottom-color: rgba(232, 225, 213, 0.82);
  }
  .action-link.hidden {
    display: none;
  }

  .esc-hint {
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(232, 225, 213, 0.34);
  }
  .esc-hint.hidden {
    display: none;
  }

  #forced-note {
    font-size: 12px;
    letter-spacing: 0.22em;
    color: rgba(232, 225, 213, 0.56);
    padding-top: 8px;
    border-top: 1px solid var(--c-faint);
    display: none;
  }
  #forced-note.visible {
    display: block;
  }

  @media (max-width: 820px) {
    #hud {
      padding: 26px 24px;
    }
    .vertical-inscription {
      height: 108px;
      font-size: 11px;
    }
    .incense-ruler {
      width: 190px;
    }
    .status-block {
      min-width: 190px;
    }
    .view-switcher {
      gap: 16px;
      padding: 6px 12px;
    }
  }
</style>
</head>
<body>

<div id="webgl-container"></div>
<div id="vignette"></div>
<div id="film-grain"></div>
<div id="curtain"></div>
<div id="tea-wash" aria-hidden="true">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="core"></div>
  <div class="dim"></div>
</div>

<div id="hud">
  <header class="hud-top">
    <div class="brand-col">
      <div class="seal">香</div>
      <div class="vertical-inscription">
        <strong>茶烟</strong><br>
        修身养性
      </div>
    </div>

    <nav class="view-switcher" aria-label="视角切换">
      <span class="view-label-prefix">观境</span>
      <button class="view-btn active" data-view="front" type="button">茶席</button>
      <button class="view-btn" data-view="close" type="button">香篆</button>
      <button class="view-btn" data-view="scroll" type="button">书画</button>
    </nav>
  </header>

  <footer class="hud-bottom">
    <div class="status-block">
      <div class="status-row">
        <span id="status-label">一炷香 · 静坐</span>
        <span id="progress-num">已燃 0% · 茶烟未散</span>
      </div>
      <div class="incense-ruler">
        <div id="progress-fill"></div>
        <div id="progress-ember"></div>
      </div>
      <div class="drag-hint" id="drag-hint">拖动环视 · 1/2/3 切换视角 · ESC 结束</div>
    </div>

    <div class="timer-cluster">
      <div class="timer-caption" id="timer-caption">清坐余晷</div>
      <div id="countdown">05:00</div>
      <div id="display-name">Built-in Retina Display</div>
      <div class="actions-bar" id="actions-bar">
        <button class="action-link" id="btn-postpone" type="button">延后五分</button>
        <button class="action-link" id="btn-skip" type="button">提前结束</button>
        <span class="esc-hint" id="esc-hint">ESC 结束</span>
      </div>
      <div id="forced-note">这炷香，要燃尽。</div>
    </div>
  </footer>
</div>

<script>
(function() {
  'use strict';

  // ============================================================================
  // 0. 宿主通信与全局状态契约（严格保留，display 为屏幕名称，倒计时由 remainingMs 计算）
  // ============================================================================
  function emitHost(msg) {
    if (window.nsh && typeof window.nsh.postMessage === 'function') {
      try {
        window.nsh.postMessage(msg);
      } catch (err) {
        console.log('[nsh]', msg);
      }
    } else {
      console.log('[nsh]', msg);
    }
  }

  const appState = {
    remainingMs: 300000,
    totalMs: 300000,
    progress: 0.0,
    targetProgress: 0.0,
    canPostpone: true,
    canSkip: true,
    forced: false,
    locked: false,
    label: '一炷香 · 静坐',
    display: '',
    hostControlled: false,
    visitSeed: null,
    active: false
  };

  const dom = {
    curtain: document.getElementById('curtain'),
    teaWash: document.getElementById('tea-wash'),
    teaWashDim: document.querySelector('#tea-wash .dim'),
    teaWashCore: document.querySelector('#tea-wash .core'),
    teaWashRings: document.querySelectorAll('#tea-wash .ring'),
    hud: document.getElementById('hud'),
    filmGrain: document.getElementById('film-grain'),
    statusLabel: document.getElementById('status-label'),
    progressNum: document.getElementById('progress-num'),
    progressFill: document.getElementById('progress-fill'),
    progressEmber: document.getElementById('progress-ember'),
    countdown: document.getElementById('countdown'),
    displayName: document.getElementById('display-name'),
    timerCaption: document.getElementById('timer-caption'),
    actionsBar: document.getElementById('actions-bar'),
    btnPostpone: document.getElementById('btn-postpone'),
    btnSkip: document.getElementById('btn-skip'),
    escHint: document.getElementById('esc-hint'),
    dragHint: document.getElementById('drag-hint'),
    viewSwitcher: document.querySelector('.view-switcher'),
    forcedNote: document.getElementById('forced-note'),
    viewBtns: Array.from(document.querySelectorAll('.view-btn'))
  };

  function formatMMSS(ms) {
    const totalSec = Math.max(0, Math.ceil((Number(ms) || 0) / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderHUD() {
    const pct = Math.max(0, Math.min(1, appState.targetProgress));
    const pctInt = Math.round(pct * 100);

    dom.statusLabel.textContent = appState.label || '一炷香 · 静坐';
    dom.progressNum.textContent = '已燃 ' + pctInt + '% · ' + (pctInt >= 99 ? '香尽茶温' : '茶烟未散');
    dom.progressFill.style.width = (pct * 100).toFixed(2) + '%';
    dom.progressEmber.style.left = (pct * 100).toFixed(2) + '%';

    dom.countdown.textContent = formatMMSS(appState.remainingMs);
    dom.displayName.textContent = appState.display ? appState.display : '';
    dom.displayName.style.display = appState.display ? 'block' : 'none';

    const locked = !!appState.locked;
    const showPostpone = !locked && !appState.forced && appState.canPostpone !== false;
    const showSkip = !locked && !appState.forced && appState.canSkip !== false;

    dom.btnPostpone.classList.toggle('hidden', !showPostpone);
    dom.btnSkip.classList.toggle('hidden', !showSkip);
    dom.escHint.classList.toggle('hidden', !showSkip);
    dom.actionsBar.classList.toggle('hidden', locked || appState.forced || (!showPostpone && !showSkip));
    dom.forcedNote.classList.toggle('visible', !!appState.forced || locked);
    dom.viewSwitcher.classList.toggle('hidden', locked);
    dom.dragHint.classList.toggle('hidden', locked);
    if (!locked) {
      dom.dragHint.textContent = showSkip
        ? '拖动环视 · 1/2/3 切换视角 · ESC 结束'
        : '拖动环视 · 1/2/3 切换视角';
    }
  }

  let restStarted = false;
  let outroStarted = false;
  let burnTarget = 1.0;
  let burnCurrent = 1.0;

  window.shrineState = function(s) {
    if (!s || typeof s !== 'object') return;
    const wasActive = appState.active;
    appState.hostControlled = true;

    if (typeof s.active === 'boolean') appState.active = s.active;

    if (typeof s.totalMs === 'number' && s.totalMs > 0) {
      appState.totalMs = s.totalMs;
    }
    if (typeof s.remainingMs === 'number') {
      appState.remainingMs = Math.max(0, s.remainingMs);
    }

    if (typeof s.progress === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, s.progress));
    } else if (appState.totalMs > 0 && typeof s.remainingMs === 'number') {
      appState.targetProgress = Math.max(0, Math.min(1, 1 - appState.remainingMs / appState.totalMs));
    }

    if (appState.totalMs > 0) {
      burnTarget = Math.max(0, Math.min(1, appState.remainingMs / appState.totalMs));
    }

    if (typeof s.canPostpone === 'boolean') appState.canPostpone = s.canPostpone;
    if (typeof s.canSkip === 'boolean') appState.canSkip = s.canSkip;
    if (typeof s.forced === 'boolean') appState.forced = s.forced;
    if (typeof s.locked === 'boolean') appState.locked = s.locked;
    if (typeof s.label === 'string' && s.label.trim()) appState.label = s.label.trim();
    if (typeof s.display === 'string') appState.display = s.display.trim();

    if (!appState.active) {
      restStarted = false;
      if (wasActive) fishVisitor?.stop();
    }
    if (appState.active && !wasActive) {
      appState.visitSeed = Number.isFinite(s.visitSeed) ? s.visitSeed : null;
      beginSession();
    }
    // 宿主在休息时间归零的瞬间显式发这一位，页面就不会因为错过 0 ms 的
    // state 或首帧迟到而根本不播收尾。
    if (s.outro === true && !outroStarted) {
      if (!restStarted) beginSession();
      startOutro();
    }
    if (appState.active && restStarted && appState.remainingMs <= 0 && !outroStarted) startOutro();

    renderHUD();
  };

  window.addEventListener('message', function(e) {
    try {
      const payload = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (!payload || typeof payload !== 'object') return;
      if (payload.type === 'state' && payload.state) {
        window.shrineState(payload.state);
      } else if (payload.type === 'view' && payload.view) {
        window.shrineView(payload.view, true);
      } else {
        if ('remainingMs' in payload || 'progress' in payload || 'forced' in payload || 'locked' in payload || 'outro' in payload || 'display' in payload || 'active' in payload) {
          window.shrineState(payload);
        }
        if (typeof payload.view === 'string') {
          window.shrineView(payload.view, true);
        }
      }
    } catch (_) {}
  });

  // 胶片噪点层
  (function initFilmGrain() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.floor(Math.random() * 255);
      img.data[i] = v;
      img.data[i + 1] = v;
      img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    dom.filmGrain.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

  const SCROLL_TITLE_FONT = '174px "Shrine Calligraphy"';
  // 每次休息随机选一幅挂轴。新增题字时同步更新 shrine-calligraphy.woff 的字形子集。
  const SCROLL_LINES = [
    ['心安即归处', '焚香默坐', '清心'],

  // ============================================================================
  // 1. WebGLRenderer、Scene、Camera 与物理级环境反射贴图 (PMREM)
  // ============================================================================
  const container = document.getElementById('webgl-container');
  const lowEnd = (navigator.hardwareConcurrency || 8) <= 4;
  const maxPixelRatio = lowEnd ? 1.0 : 1.5;

  const renderer = new THREE.WebGLRenderer({
    antialias: !lowEnd,
    powerPreference: 'high-performance',
    alpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxPixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = lowEnd ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.36;
  if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) {
    renderer.outputColorSpace = THREE.SRGBColorSpace;
  } else if ('outputEncoding' in renderer && THREE.sRGBEncoding) {
    renderer.outputEncoding = THREE.sRGBEncoding;
  }
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x120f0c);
  scene.fog = new THREE.FogExp2(0x14110d, 0.038);

  const camera = new THREE.PerspectiveCamera(31, window.innerWidth / window.innerHeight, 0.04, 32);
  const maxAniso = Math.min(lowEnd ? 2 : 8, renderer.capabilities.getMaxAnisotropy());

  function createSeededRandom(seed) {
    let s = seed % 2147483647;
    if (s <= 0) s += 2147483646;
    return function() {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function makeCanvasTexture(w, h, drawFn, opts) {
    const options = opts || {};
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    drawFn(ctx, w, h);
    const tex = new THREE.CanvasTexture(c);
    if (options.repeatX || options.repeatY) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(options.repeatX || 1, options.repeatY || 1);
    }
    if (options.srgb) {
      if ('colorSpace' in tex && THREE.SRGBColorSpace) {
        tex.colorSpace = THREE.SRGBColorSpace;
      } else if ('encoding' in tex && THREE.sRGBEncoding) {
        tex.encoding = THREE.sRGBEncoding;
      }
    }
    tex.anisotropy = maxAniso;
    tex.needsUpdate = true;
    return tex;
  }

  // 构建具有真实窗格亮带与暖色室内漫反射的 HDR 感全景环境贴图，赋予白瓷、茶汤、紫砂、古铜逼真高光眼神光
  function buildStudioEnvironment() {
    const envTex = makeCanvasTexture(1024, 512, (ctx, w, h) => {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0.0, '#16120e');
      bg.addColorStop(0.45, '#2e251d');
      bg.addColorStop(0.55, '#221a14');
      bg.addColorStop(1.0, '#0d0907');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // 左侧障子窗大面积柔和晨光（带真实窗棂暗格，反射在白瓷杯和茶汤表面）
      const winX = w * 0.15;
      const winY = h * 0.18;
      const winW = w * 0.24;
      const winH = h * 0.48;

      const winGlow = ctx.createRadialGradient(
        winX + winW * 0.5, winY + winH * 0.5, 12,
        winX + winW * 0.5, winY + winH * 0.5, winW * 1.05
      );
      winGlow.addColorStop(0.0, 'rgba(242, 248, 255, 0.98)');
      winGlow.addColorStop(0.48, 'rgba(195, 216, 236, 0.62)');
      winGlow.addColorStop(1.0, 'rgba(55, 70, 88, 0.0)');
      ctx.fillStyle = winGlow;
      ctx.fillRect(0, 0, w * 0.55, h);

      ctx.fillStyle = '#edf4fc';
      ctx.fillRect(winX, winY, winW, winH);

      // 窗格木条在环境反射中的真实投影
      ctx.fillStyle = '#2d2118';
      for (let i = 0; i <= 5; i++) {
        ctx.fillRect(winX + (winW / 5) * i - 2, winY, 4, winH);
      }
      for (let j = 0; j <= 6; j++) {
        ctx.fillRect(winX, winY + (winH / 6) * j - 2, winW, 4);
      }

      // 顶部柔光漫反射带（让茶汤液面与紫砂壶肩有温润天光）
      const topSoft = ctx.createRadialGradient(w * 0.42, h * 0.12, 8, w * 0.42, h * 0.12, w * 0.30);
      topSoft.addColorStop(0.0, 'rgba(235, 226, 210, 0.48)');
      topSoft.addColorStop(1.0, 'rgba(30, 24, 18, 0.0)');
      ctx.fillStyle = topSoft;
      ctx.fillRect(0, 0, w, h * 0.45);

      // 右侧室内暖色漫反射柔光
      const warmBounce = ctx.createRadialGradient(w * 0.74, h * 0.46, 10, w * 0.74, h * 0.46, w * 0.28);
      warmBounce.addColorStop(0.0, 'rgba(255, 198, 138, 0.68)');
      warmBounce.addColorStop(0.5, 'rgba(196, 136, 82, 0.26)');
      warmBounce.addColorStop(1.0, 'rgba(40, 28, 18, 0.0)');
      ctx.fillStyle = warmBounce;
      ctx.fillRect(w * 0.4, 0, w * 0.6, h);
    }, { srgb: true });

    envTex.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envRT = pmrem.fromEquirectangular(envTex);
    scene.environment = envRT.texture;
    envTex.dispose();
    pmrem.dispose();
  }

  buildStudioEnvironment();

  // ============================================================================
  // 2. 照片级程序化材质贴图库（老胡桃木、聚乐土墙、宜兴原矿紫砂、羊脂白瓷、熟普茶汤、宣德铜炉、草木香灰）

  const textures = {};

  function buildProceduralTextures() {
    const rand = createSeededRandom(202608);
    const texSize = lowEnd ? 512 : 1024;

    // 2.1 胡桃老木茶桌贴图（色彩 + 凹凸粗糙度）
    const woodBumpCanvas = document.createElement('canvas');
    woodBumpCanvas.width = texSize;
    woodBumpCanvas.height = texSize;
    const wbCtx = woodBumpCanvas.getContext('2d');

    textures.walnutColor = makeCanvasTexture(texSize, texSize, (ctx, w, h) => {
      ctx.fillStyle = '#26170f';
      ctx.fillRect(0, 0, w, h);
      wbCtx.fillStyle = '#787878';
      wbCtx.fillRect(0, 0, w, h);

      for (let y = 0; y < h; y++) {
        const n1 = Math.sin(y * 0.022) * 18 + Math.cos(y * 0.075) * 6;
        const grain = Math.sin((y + n1) * 0.14) * 0.5 + 0.5;
        const r = Math.floor(32 + grain * 24);
        const g = Math.floor(19 + grain * 15);
        const b = Math.floor(12 + grain * 10);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, y, w, 1);

        const bv = Math.floor(104 + grain * 38);
        wbCtx.fillStyle = `rgb(${bv},${bv},${bv})`;
        wbCtx.fillRect(0, y, w, 1);
      }

      const poreCount = lowEnd ? 2200 : 4200;
      for (let i = 0; i < poreCount; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const len = 16 + rand() * 88;
        const dark = rand() > 0.35;
        ctx.fillStyle = dark ? 'rgba(10, 6, 3, 0.24)' : 'rgba(84, 54, 35, 0.13)';
        ctx.fillRect(x, y, len, 1 + rand() * 1.6);

        wbCtx.fillStyle = dark ? 'rgba(52,52,52,0.36)' : 'rgba(158,158,158,0.22)';

    textures.walnutBump = new THREE.CanvasTexture(woodBumpCanvas);
    textures.walnutBump.wrapS = THREE.RepeatWrapping;
    textures.walnutBump.wrapT = THREE.RepeatWrapping;
    textures.walnutBump.repeat.set(2, 1);
    textures.walnutBump.anisotropy = maxAniso;

    // 2.2 京都聚乐土墙（暖灰黄泥 + 细小稻草纤维与矿物颗粒）
    const wallBumpCanvas = document.createElement('canvas');
    wallBumpCanvas.width = texSize;
    wallBumpCanvas.height = texSize;
    const wlmCtx = wallBumpCanvas.getContext('2d');

    textures.plasterWall = makeCanvasTexture(texSize, texSize, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0.0, '#695c4d');
      g.addColorStop(0.5, '#5f5243');
      g.addColorStop(1.0, '#504437');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      wlmCtx.fillStyle = '#808080';
      wlmCtx.fillRect(0, 0, w, h);

      for (let i = 0; i < 280; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const rad = 28 + rand() * 85;

        const tint = rand() > 0.5 ? 'rgba(122, 108, 90, 0.06)' : 'rgba(56, 46, 36, 0.06)';
        rg.addColorStop(0, tint);
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);

      const gritCount = lowEnd ? 4500 : 8500;

    textures.tatami = makeCanvasTexture(512, 512, (ctx, w, h) => {

    textures.bronzeColor = makeCanvasTexture(texSize, texSize, (ctx, w, h) => {

        } else {
          const dark = rand() > 0.5;
          ctx.fillStyle = dark ? 'rgba(46, 22, 15, 0.36)' : 'rgba(110, 65, 48, 0.30)';
          zbCtx.fillStyle = dark ? '#666666' : '#969696';

    textures.zishaBump = new THREE.CanvasTexture(zishaBumpCanvas);
    textures.zishaBump.anisotropy = maxAniso;

    // 2.8 粗陶茶盘/壶承（铁胎柴烧感粗陶颗粒纹理）
    const clayBumpCanvas = document.createElement('canvas');
    clayBumpCanvas.width = 512;
    clayBumpCanvas.height = 512;
    const cbCtx = clayBumpCanvas.getContext('2d');

    textures.terracotta = makeCanvasTexture(512, 512, (ctx, w, h) => {
      const rg = ctx.createRadialGradient(w * 0.5, h * 0.5, 10, w * 0.5, h * 0.5, w * 0.55);
      rg.addColorStop(0.0, '#3a2d26');
      rg.addColorStop(0.7, '#30241e');
      rg.addColorStop(1.0, '#231a15');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, w, h);

      cbCtx.fillStyle = '#7c7c7c';
      cbCtx.fillRect(0, 0, w, h);

      // 陶轮拉坯同心旋纹
      ctx.strokeStyle = 'rgba(20, 14, 10, 0.22)';

  function paintHangingScroll(ctx, w, h) {
    const rand = createSeededRandom((Math.random() * 2147483647) | 0);

    ctx.fillStyle = '#8b7e6a';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(62, 54, 42, 0.16)';
    ctx.lineWidth = 1;
    for (let y = 0; y < h; y += 8) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    const padX = 86;
    const padTop = 230;
    const padBot = 190;
    const innerW = w - padX * 2;
    const innerH = h - padTop - padBot;

    ctx.fillStyle = '#4a3d2f';
    ctx.fillRect(padX - 8, padTop - 8, innerW + 16, innerH + 16);

    const paperGrad = ctx.createLinearGradient(0, padTop, 0, padTop + innerH);
    paperGrad.addColorStop(0.0, '#dfd5c3');
    paperGrad.addColorStop(0.5, '#d8ccb8');
    paperGrad.addColorStop(1.0, '#cfc2ac');
    ctx.fillStyle = paperGrad;
    ctx.fillRect(padX, padTop, innerW, innerH);

    for (let i = 0; i < 2000; i++) {
      ctx.fillStyle = rand() > 0.5 ? 'rgba(255,250,240,0.12)' : 'rgba(150,132,106,0.08)';
      ctx.fillRect(padX + rand() * innerW, padTop + rand() * innerH, 2 + rand() * 14, 1.5);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(padX, padTop, innerW, innerH);
    ctx.clip();

    const drawMistyMountain = (baseY, peakH, alpha, seedOffset) => {
      const mGrad = ctx.createLinearGradient(0, baseY - peakH, 0, baseY + 120);
      mGrad.addColorStop(0.0, `rgba(38, 36, 33, ${alpha})`);
      mGrad.addColorStop(0.65, `rgba(52, 49, 44, ${alpha * 0.45})`);
      mGrad.addColorStop(1.0, 'rgba(216, 204, 184, 0.0)');
      ctx.fillStyle = mGrad;
      ctx.beginPath();
      ctx.moveTo(padX, baseY + 120);
      for (let x = padX; x <= padX + innerW; x += 16) {
        const nx = (x - padX) / innerW;
        const hCurve = Math.sin(nx * Math.PI) * peakH * (0.6 + 0.4 * Math.sin(nx * 5.5 + seedOffset))
          + Math.cos(nx * 13.0 + seedOffset) * 18;
        ctx.lineTo(x, baseY - Math.max(0, hCurve));
      }
      ctx.lineTo(padX + innerW, baseY + 120);
      ctx.closePath();
      ctx.fill();
    };

    drawMistyMountain(padTop + innerH * 0.72, 240, 0.22, 1.1 + rand() * 2.0);
    drawMistyMountain(padTop + innerH * 0.82, 190, 0.34, 3.4 + rand() * 2.0);

    const drawBambooStalk = (x0, y0, angle, segLen, segs, startW) => {
      let cx = x0;
      let cy = y0;
      for (let s = 0; s < segs; s++) {
        const nx = cx + Math.sin(angle) * segLen;
        const ny = cy - Math.cos(angle) * segLen;
        ctx.strokeStyle = `rgba(28, 26, 24, ${0.72 - s * 0.06})`;
        ctx.lineWidth = Math.max(2.5, startW - s * 1.1);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(18, 16, 15, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(nx - 7, ny);
        ctx.lineTo(nx + 7, ny);
        ctx.stroke();

        cx = nx + Math.sin(angle) * 4;
        cy = ny - Math.cos(angle) * 4;
        angle += 0.035;
      }
    };

    drawBambooStalk(padX + 140, padTop + innerH - 30, 0.22, 128, 6, 9.5);
    drawBambooStalk(padX + 95, padTop + innerH - 10, 0.34, 105, 5, 6.5);

    const drawInkLeaf = (lx, ly, ang, len, wid, opacity) => {
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(ang);
      ctx.fillStyle = `rgba(24, 22, 20, ${opacity})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
      ctx.quadraticCurveTo(len * 0.45, wid * 0.65, 0, 0);
      ctx.fill();
      ctx.restore();
    };

    const leafNodes = [
      [padX + 260, padTop + innerH - 420, 0.82],
      [padX + 310, padTop + innerH - 560, 0.68],
      [padX + 355, padTop + innerH - 680, 0.78],
      [padX + 220, padTop + innerH - 310, 0.55]
    ];
    leafNodes.forEach(([nx, ny, op]) => {
      drawInkLeaf(nx, ny, 0.35, 92, 13, op);
      drawInkLeaf(nx, ny, 0.68, 108, 14, op * 0.9);
      drawInkLeaf(nx, ny, 1.05, 78, 11, op * 0.75);
      drawInkLeaf(nx - 14, ny + 12, -2.35, 74, 10, op * 0.6);
    });

    ctx.fillStyle = '#1d1b18';
    ctx.font = `${SCROLL_TITLE_FONT}, "Kaiti SC", "STKaiti", "Songti SC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const chars = scrollChars;
    const charX = padX + innerW * 0.64;
    const charStartY = padTop + 210;
    const charGap = 183;

    chars.forEach((ch, idx) => {
      ctx.save();
      ctx.translate(charX + (idx % 2 === 0 ? -3 : 4), charStartY + idx * charGap);
      ctx.rotate((idx - 1.5) * 0.015);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    });

    const textBottom = charStartY + (chars.length - 1) * charGap;

    ctx.fillStyle = 'rgba(36, 33, 29, 0.78)';
    ctx.font = '32px "Kaiti SC", "STKaiti", "Songti SC", serif';
    const insc = scrollInscription;
    for (let i = 0; i < insc.length; i++) {
      ctx.fillText(insc[i], padX + innerW * 0.50, textBottom + 80 + i * 44);
    }

    const sealX = padX + innerW * 0.50 - 22;
    const sealY1 = textBottom + 120 + insc.length * 44;
    ctx.fillStyle = '#9e281d';
    ctx.fillRect(sealX, sealY1, 44, 44);
    ctx.fillStyle = '#dfd5c3';
    ctx.font = '22px "Songti SC", serif';
    ctx.fillText(scrollSealChars[0] || '清', sealX + 22, sealY1 + 14);
    ctx.fillText(scrollSealChars[1] || '心', sealX + 22, sealY1 + 33);

    const sealY2 = sealY1 + 58;
    ctx.strokeStyle = '#9e281d';
    ctx.lineWidth = 3;
    ctx.strokeRect(sealX + 2, sealY2, 40, 40);
    ctx.fillStyle = '#9e281d';
    ctx.font = '20px "Songti SC", serif';
    ctx.fillText(scrollSealChars[0] || '清', sealX + 22, sealY2 + 21);

    ctx.restore();
  }

  function repaintHangingScroll() {
    const texture = textures.hangingScroll;
    const canvas = texture.image;
    paintHangingScroll(canvas.getContext('2d'), canvas.width, canvas.height);
    texture.needsUpdate = true;
  }

  function rollScroll() {
    const pick = SCROLL_LINES[(Math.random() * SCROLL_LINES.length) | 0];
    scrollChars = Array.from(pick[0]);
    scrollInscription = pick[1];
    scrollSealChars = Array.from(pick[2]);
    scrollHangX = -0.32 + Math.random() * 0.72;
    scrollHangY = 1.38 + Math.random() * 0.14;
    scrollHangTilt = (Math.random() - 0.5) * 0.018;

    repaintHangingScroll();
    if (typeof scrollGroup !== 'undefined' && scrollGroup) {
      scrollGroup.position.set(scrollHangX, scrollHangY, -2.20);
      scrollGroup.rotation.z = scrollHangTilt;
    }
    if (typeof VIEWS !== 'undefined' && VIEWS && VIEWS.scroll) {
      VIEWS.scroll.pos.set(scrollHangX, scrollHangY, 1.02);
      VIEWS.scroll.target.set(scrollHangX, scrollHangY, -2.20);
    }
  }

  buildProceduralTextures();
  // Canvas 上的文字不会随字体加载自动更新，需要重画挂轴纹理。
  document.fonts.load(SCROLL_TITLE_FONT, scrollChars.join(''))
    .then(repaintHangingScroll)
    .catch(error => console.warn('无法加载挂轴行书字体', error));

  function addContactShadow(parent, x, y, z, scaleX, scaleZ, opacity) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({
        map: textures.contactShadow,
        transparent: true,
        opacity: opacity !== undefined ? opacity : 0.72,
        depthWrite: false
      })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y, z);
    m.scale.set(scaleX, scaleZ, 1);
    parent.add(m);
    return m;
  }

  // ============================================================================

  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(9.0, 6.5), wallMat);

  leftWallBack.position.set(-2.38, 2.2, 0.5);
  leftWallBack.receiveShadow = true;
  roomGroup.add(leftWallBack);

  const shojiGroup = new THREE.Group();
  shojiGroup.position.set(-2.33, 1.62, -0.32);
  shojiGroup.rotation.y = Math.PI / 2;
  roomGroup.add(shojiGroup);

  const shojiW = 2.65;
  const shojiH = 2.35;

  const shojiPaperMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(shojiW, shojiH),
    new THREE.MeshStandardMaterial({
      map: textures.shojiPaper,
      roughness: 0.85,
      metalness: 0.0,
      emissive: new THREE.Color(0xb8cee3),
      emissiveMap: textures.shojiPaper,
      emissiveIntensity: 0.92
    })

  shojiGroup.add(shojiPaperMesh);

  const hinokiMat = new THREE.MeshStandardMaterial({
    map: textures.walnutColor,
    color: 0x6e4f36,
    roughness: 0.58,
    metalness: 0.04
  });

  const frameThick = 0.055;
  const frameDepth = 0.06;
  const topFrame = new THREE.Mesh(new THREE.BoxGeometry(shojiW + frameThick * 2, frameThick, frameDepth), hinokiMat);
  topFrame.position.set(0, shojiH * 0.5 + frameThick * 0.5, 0.02);

  botFrame.position.set(0, -shojiH * 0.5 - frameThick * 0.5, 0.02);

    const sideF = new THREE.Mesh(new THREE.BoxGeometry(frameThick, shojiH, frameDepth), hinokiMat);
    sideF.position.set(dir * (shojiW * 0.5 + frameThick * 0.5), 0, 0.02);

  const vCols = 6;

    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(isCenterMullion ? 0.032 : 0.014, shojiH, isCenterMullion ? 0.04 : 0.022),

  const streamGeo = (() => {

    const cols = streamSegsR + 1;

    const positions = new Float32Array(vCount * 3);
    const uvs = new Float32Array(vCount * 2);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        uvs[i * 2] = x / streamSegsR;
        uvs[i * 2 + 1] = y / streamSegsY;
      }
    }
    const index = [];
    for (let y = 0; y < streamSegsY; y++) {
      for (let x = 0; x < streamSegsR; x++) {
        const a = y * cols + x;
        const b = a + 1;
        const c = a + cols;
        const d = c + 1;
        index.push(a, c, b, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(index);
    geo.computeVertexNormals();
    return geo;

        float rise = life * 0.095;
        float driftX = sin(uTime * 0.35 + aSeed.y * 6.283) * 0.004 * life + life * 0.010;
        float driftZ = cos(uTime * 0.28 + aSeed.y * 6.283) * 0.003 * life + life * 0.006;
        vec3 p = uOrigin + vec3(driftX, rise, driftZ);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (10.0 + life * 22.0) * (1.0 / -mv.z);
        vAlpha = uActive * sin(life * 3.14159) * 0.13;
      }

    fragmentShader: `

      }
    `,

  const streamTanTmp = new THREE.Vector3();

  // 真实抛体：出流只有水平初速，之后只受重力。落点由飞行时间反推，
  // 横向匀速、竖直二次下落；截面按连续方程 A·v=常数 随下落变细。
  function updateTeaStreamGeometry(spoutPos, hitPos, elapsedT, flowStrength, head01, tail01) {
    const posAttr = streamGeo.attributes.position;
    const drop = Math.max(0.004, spoutPos.y - hitPos.y);
    const tEnd = Math.sqrt((2 * drop) / STREAM_G);
    const vx = (hitPos.x - spoutPos.x) / tEnd;
    const vz = (hitPos.z - spoutPos.z) / tEnd;
    const v0 = Math.max(0.02, Math.hypot(vx, vz));
    const head = Math.max(0, Math.min(1, head01));
    const tail = Math.max(0, Math.min(1, tail01));

    let idx = 0;
    for (let yIdx = 0; yIdx <= streamSegsY; yIdx++) {
      const u = yIdx / streamSegsY;
      const s = head + (tail - head) * u;
      const t = s * tEnd;
      const cx = spoutPos.x + vx * t;
      const cy = spoutPos.y - 0.5 * STREAM_G * t * t;
      const cz = spoutPos.z + vz * t;

      // 截面垂直于流向：切线 (vx, -g t, vz)
      streamTanTmp.set(vx, -STREAM_G * t, vz).normalize();
      streamUTmp.set(-streamTanTmp.z, 0, streamTanTmp.x);
      if (streamUTmp.lengthSq() < 1e-8) streamUTmp.set(1, 0, 0);
      streamUTmp.normalize();
      streamVTmp.crossVectors(streamTanTmp, streamUTmp);

      const speed = Math.hypot(v0, STREAM_G * t);
      const flutter = 1.0 + 0.05 * Math.sin(s * 22.0 - elapsedT * 34.0);
      const radius = 0.0023 * Math.sqrt(v0 / Math.max(v0 * 0.3, speed))
        * flutter * Math.max(0.3, flowStrength);

      for (let rIdx = 0; rIdx <= streamSegsR; rIdx++) {
        const a = (rIdx / streamSegsR) * Math.PI * 2;
        const ux = Math.cos(a);
        const uz = Math.sin(a);
        posAttr.setXYZ(
          idx++,
          cx + (streamUTmp.x * ux + streamVTmp.x * uz) * radius,
          cy + (streamUTmp.y * ux + streamVTmp.y * uz) * radius,
          cz + (streamUTmp.z * ux + streamVTmp.z * uz) * radius
        );
      }
    }
    posAttr.needsUpdate = true;
    streamGeo.computeVertexNormals();
  }
