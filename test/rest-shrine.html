    const touchVisit=createFishSmallScrollVisit(smallScroll,stageX,stageZ,stageYaw);
    const tableEdgeZ=tableSlab.position.z+tableSlab.geometry.parameters.depth/2;
    const steps=createFishTableSteps(THREE,scene,tableWoodMat,floorY,tableSurfaceY,tableEdgeZ);
    const stage={x:stageX,z:stageZ,y:floorY,yaw:stageYaw};
    const table={x:steps[0].x,y:tableSurfaceY,z:tableEdgeZ-.21,yaw:Math.PI};
    const tableVisit=createFishTableVisit(stage,steps,table);
    const tableAct={phase:'table',seconds:tableVisit.reduce((sum,leg)=>sum+leg.seconds,0)};
    const tablePose={}, tablePoint={}, stairGait={};
    const tableFocus=new THREE.Vector3();
    const dash=createFishFloorDash(stageX,stageZ,stageYaw);
    const dashAct={phase:'dash',seconds:dash.reduce((sum,leg)=>sum+leg.pace.seconds,0)};
    let tableSegment=null;
    const touchPose={};
    let touch=null,touchResult=null,touchSegment=null;
    const touchAct={phase:'touch',seconds:fishSmallScrollVisitSeconds};
    const stepToTea = 0.233, stepSeconds = 1.16, sipSeconds = 4.13;
    const teaPose = {};
    const cupRimFocus = new THREE.Vector3();
    const scrollPose = {};
    const scrollTarget = new THREE.Vector3(), pathTarget = new THREE.Vector3();
    const scrollFocus = new THREE.Vector3(), scrollHeadPoint = new THREE.Vector3();
    const gazeLocation={}, gazePace={};
    const scrollTurnTime = 1.55, scrollHoldTime = 1.55;
    let scrollTurn, scrollReturn, scrollYaw;
    let feetScale, feetRest;
    let attention = 'camera';
    let focus = null, focusWeight = 1;
    const dx = Math.sin(stageYaw), dz = Math.cos(stageYaw);
    const teaForward = {length:stepToTea,sample(d,out) {
      out.x=stageX+dx*d;out.z=stageZ+dz*d;out.yaw=stageYaw;return out;
    }};
    const teaBack = {length:stepToTea,sample(d,out) {
      return teaForward.sample(stepToTea-d,out);
    }};
    const smallStep=[[0,0],[0.24,1],[0.76,1],[1,0]];
    motions.teaForward={route:teaForward,pace:createFishPace(teaForward,stepSeconds,smallStep),stepDistance:0.052};
    motions.teaBack={route:teaBack,pace:createFishPace(teaBack,stepSeconds,smallStep),stepDistance:0.052};
    const exitFrustum = new THREE.Frustum();
    const exitView = new THREE.Matrix4();
    const exitBounds = new THREE.Sphere(new THREE.Vector3(),0.46);
    const acts = [
      {phase:'tilt', name:'headTilt', seconds:1.75},
      {phase:'glance', name:'glance', seconds:1.55},
      {phase:'tea', seconds:stepSeconds*2+sipSeconds},
      {phase:'art', seconds:scrollTurnTime*2+scrollHoldTime},
      {phase:'bow', name:'bow', seconds:1.95},
      {phase:'jump', name:'tailJump', seconds:1.35},
      {phase:'wag', name:'wag', seconds:1.65}
    ];
    const shyAct={phase:'shy',name:'shySway',seconds:2.07};
    const stretchAct={phase:'stretch',name:'stretch',seconds:fishStretchSeconds+0.16};
    const greetings = [
      {phase:'wave',name:'wave',seconds:fishGreetingSeconds+0.56,viewer:true},
      {phase:'jumpWave',name:'jumpWave',seconds:1.76,viewer:true},
      {phase:'airKiss',name:'airKiss',seconds:2.24,viewer:true},
      {phase:'dance',name:'dance',seconds:2.98,viewer:true}
    ];
    const pleasedAct={phase:'pleased',name:'pleased',seconds:2.08};
    const chaseTail=createFishPivot(stageX,stageZ,stageYaw,-2*Math.PI,2.55);
    const curiousAct={phase:'tailCuriosity',name:'tailCuriosity',seconds:chaseTail.pace.seconds};
    const lookUpAct={phase:'lookUp',name:'lookUp',seconds:1.98};
    const visitActs=[...acts,pleasedAct,curiousAct,lookUpAct,dashAct];
    const briefActs = visitActs.filter(action => action.phase !== 'art');
    const anchor = new THREE.Group();
    anchor.userData.fishDynamic = 'fish';
    scene.add(anchor);
    const shadow = addContactShadow(scene,stageX,floorY+0.002,stageZ,0.55,0.55,0.38);
    const shadowSize = shadow.scale.clone();
    const shadowOpacity = shadow.material.opacity;
    shadow.userData.fishDynamic = 'contact';

    function setFishVisible(visible) {
      anchor.visible = visible;
      shadow.visible = visible;
      // Skip the whole rig in scene.updateMatrixWorld while it is offstage.
      anchor.matrixWorldAutoUpdate = visible;
      shadow.matrixWorldAutoUpdate = visible;
    }
    setFishVisible(false);
    VIEWS.fishVisit = {pos:camPos.clone(),target:camTarget.clone(),fov:camFov};
    VIEWS.fishSmallScroll=smallScroll.view;
    VIEWS.fishTable={pos:new THREE.Vector3(2.72,1.53,3.55),target:new THREE.Vector3(.86,.33,.93),fov:44};

    let model = null, gesture = null, failure = null, loading = false, sip = null, teaResult = null;
    let actorRig;
    const kissHeart=document.getElementById('fish-kiss-heart');
    const kissOrigin=new THREE.Vector3(), kissPoint=new THREE.Vector3();
    let active = false, scheduled = null, actionOrder = acts;
    let actionLimit = acts.length, wallSecondsPerMotion = 1;
    let elapsed = 0, phase = 'away', previousPhase = null, returnView = 'front';
    let speed = 0, locomotion = false;

    let modelPreparation;
    function loadModel() {
      if (model || loading) return modelPreparation;
      loading = true;
      failure = null;
      modelPreparation = startupPaint().then(() => window.loadApprovedFishModel(renderer, {
        lowEnd, keyWorld: windowFill.position, fillWorld: warmBounce.position, yieldPaint: startupPaint
      })).then(async asset=>{
        // Prepare the shared textures in small batches while programs compile.
        const textures = new Set();
        asset.root.traverse(mesh => {
          if (!mesh.isMesh) return;
          for (const uniform of Object.values(mesh.material.uniforms ?? {})) {
            if (uniform.value?.isTexture) textures.add(uniform.value);
          }
        });
        await Promise.all([
          compilePreviewPrograms(asset.root,camera,scene),
          warmPreviewTextures(renderer,textures,startupPaint,6)
        ]);
        try {
          await warmFishDraw(THREE,renderer,asset,shadow,scene,camera,startupPaint,canvasFormat);
        } catch (error) {
          console.warn('角色绘制预热失败，继续加载',error);
        }
        const scale=0.74/asset.height;
        model=asset.root;
        actorRig=asset.bodyRig;
        gesture=asset.gesture;
        model.scale.setScalar(scale);
        model.position.y=-asset.soleY*scale;
        feetScale=scale;
        feetRest=asset.feetRest;
        for(const motion of Object.values(motions)) bindGait(motion);
        for(const leg of touchVisit)if(leg.motion)bindGait(leg.motion);
        for(const leg of tableVisit)if(leg.motion)bindGait(leg.motion);
        for(const motion of dash)bindGait(motion);
        bindGait(chaseTail);
        anchor.add(model);
        sip=createFishSip(THREE,model,asset.bodyRig,teaSet.restPosition);
        touch=createFishScrollTouch(THREE,model,asset.bodyRig,smallScroll);
      }).catch(error=>{failure=error;}).finally(()=>{loading=false;});
      return modelPreparation;
    }

    function bindGait(motion) {
      motion.gait=createFishGait(motion.route,{scale:feetScale,feet:feetRest,stepDistance:motion.stepDistance,pivot:motion.pivot,corridor:motion.corridor});
    }

    function canFrameVisit() {
      return automaticView && userCameraVersion===visitViewVersion && !dragging;
    }

    function leaveInteractionView() {
      if (activeView.name!=='fishSmallScroll' && activeView.name!=='fishTable') return;
      const orbitYaw=yaw, orbitPitch=pitch;
      setView('fishVisit',true);
      yaw=orbitYaw;
      pitch=orbitPitch;
      if (canFrameVisit() && yaw===0 && pitch===0 && !outroStarted) {
        setCameraFov();
        beginVisitCamera();
      }
    }

    function prepareArrival(dt) {
      if (!entryPending) return true;
      if (visitCamera && canFrameVisit()) return false;
      waitForEdge+=dt;
      const shouldFrame = activeView.name==='fishVisit' && canFrameVisit() && waitForEdge<=2.8;
      const view=VIEWS.fishVisit;
      if (shouldFrame && (camera.position.distanceToSquared(view.pos)>0.00020 ||
        lookAtPoint.distanceToSquared(view.target)>0.00024 || Math.abs(camera.fov-view.fov)>0.14)) return false;
      entryPending=false;
      const route=motions.arrival.route;
      if (wantsPeek && shouldFrame) {
        edgeCamera.copy(camera);
        edgeCamera.updateMatrixWorld(true);
        edgeEntry=planFishPeek(THREE,route,edgeCamera,floorY);
      }
      if (!edgeEntry) {
        const first=route.sample(0,location);
        approachCorridor=intersectsView(first.x,first.z);
        return true;
      }
      const approach=sliceFishRoute(route,0,edgeEntry.distance);
      const arrival=sliceFishRoute(route,edgeEntry.distance,route.length);
      edgeApproach={route:approach,pace:createFishPace(approach,0.37+approach.length/0.62,smallStep),stepDistance:0.087};
      const pace=[[0,0],[0.13,0.58],[0.40,1.42],[0.67,1.18],[0.87,0.56],[1,0]];
      edgeArrival={route:arrival,pace:createFishPace(arrival,0.65+arrival.length/0.49,pace)};
      bindGait(edgeApproach);
      bindGait(edgeArrival);
      // The next frame starts the path. The planning frame keeps the actor
      // out of view and can complete before the first visible draw.
      return false;
    }

    function prepareScrollTurn() {
      scrollGroup.getWorldPosition(scrollTarget);
      const bearing=Math.atan2(scrollTarget.x-stageX,scrollTarget.z-stageZ);
      const delta=bearing-stageYaw;
      const turn=Math.atan2(Math.sin(delta),Math.cos(delta));
      scrollYaw=stageYaw+turn;
      scrollTurn=createFishPivot(stageX,stageZ,stageYaw,turn,scrollTurnTime);
      scrollReturn=createFishPivot(stageX,stageZ,scrollYaw,-turn,scrollTurnTime);
      bindGait(scrollTurn);
      bindGait(scrollReturn);
    }

    function focusOn(point, weight, name) {
      focus=point;
      focusWeight=weight;
      attention=name;
    }

    function inspectScroll(time) {
      const hold=time-scrollTurnTime;
      if (time < scrollTurnTime) walk(scrollTurn,time);
      else if (hold >= scrollHoldTime) walk(scrollReturn,hold-scrollHoldTime);
      else place({x:stageX,z:stageZ,yaw:scrollYaw});
      const scan=smoother01(hold,.10,.92);
      const headScan=smoother01(hold,.36,1.18);
      scrollGroup.localToWorld(scrollTarget.set(.075-.15*scan,-.47+.51*scan,.018));
      scrollGroup.localToWorld(scrollHeadPoint.set(.075-.15*headScan,-.47+.51*headScan,.018));

      // Keep a look-ahead target inside the eye's forward range until
      // the scroll comes into view. Both targets are at comparable depth.
      const yaw=anchor.rotation.y;
      const acquire=hold>=0 ? 1 : 1-smoother01(Math.abs(scrollYaw-yaw),.28,1.23);
      const leave=smoother01(hold,scrollHoldTime-.20,scrollHoldTime+.14);
      const reading=acquire*(1-leave);
      const direction=leave>0 ? scrollReturn.turnDirection : scrollTurn.turnDirection;
      const guide=yaw+.34*direction;
      const distance=Math.hypot(scrollTarget.x-stageX,scrollTarget.z-stageZ);
      scrollFocus.set(stageX+Math.sin(guide)*distance,floorY+.53,stageZ+Math.cos(guide)*distance);
      scrollFocus.lerp(scrollTarget,reading);
      const entry=smoother01(time,0,.16);
      const release=1-smoother01(hold,scrollHoldTime+.64,scrollHoldTime+scrollTurnTime-.12);
      focusOn(scrollFocus,entry*release,'scroll');

      // The neck follows the scan after the eyes have moved.
      const elevation=Math.atan2(scrollHeadPoint.y-(floorY+.52),distance);
      scrollPose.headPitch=-Math.min(.34,Math.max(0,elevation*.69))*reading;
      scrollPose.headYaw=.076*direction*(1-reading)*smoother01(time,.08,.30)*release;
      scrollPose.headRoll=.065*reading*(.5+.5*headScan);
      scrollPose.keepEyesOnFocus=hold>=-.16 && hold<=.96;
      scrollPose.chestPitch=scrollPose.headPitch*0.22;
      scrollPose.hairLag=scrollPose.headPitch*-0.18;
      gesture.setInteraction(scrollPose,null);
    }

    function setCameraFov() {
      const aspect = camera.aspect;
      const fitted = 2*Math.atan(Math.tan(camFov*Math.PI/360)*(16/9)/aspect)*180/Math.PI;
      const fov = aspect >= 1 ? Math.min(camFov,fitted) : fitted;
      const wide = smooth01(aspect,2.0,3.45);
      VIEWS.fishVisit.fov=fov;
      VIEWS.fishVisit.target.y=camTarget.y-wide*0.34;
      if(activeView.name==='fishVisit') {
        goal.fov=fov;
        goal.target.y=VIEWS.fishVisit.target.y;
      } else if(activeView.name==='fishSmallScroll') {
        const portrait=2*Math.atan(Math.tan(43*Math.PI/360)*1.23/aspect)*180/Math.PI;
        goal.fov=aspect<1.23 ? Math.min(84,portrait) : 43;
      } else if(activeView.name==='fishTable') {
        const portrait=2*Math.atan(Math.tan(44*Math.PI/360)*1.45/aspect)*180/Math.PI;
        goal.fov=aspect<1.45 ? Math.min(84,portrait) : 44;
      }
    }

    function place(sample, y=floorY) {
      anchor.position.set(sample.x,y,sample.z);
      anchor.rotation.y=sample.yaw;
    }

    function start(order, withPeek=false, forceFrame=false, compact=false) {
      actionOrder=order;
      actionLimit=order.length;
      wallSecondsPerMotion=1;
      compactVisit=compact;
      edgeEntry=edgeApproach=edgeArrival=null;
      entryPending=true;
      wantsPeek=withPeek;
      approachCorridor=false;
      leaveCorridor=null;
      settleEnd=null;
      visitViewVersion=userCameraVersion;
      automaticView=forceFrame || userCameraVersion===sessionViewVersion;
      waitForEdge=peekWeight=0;
      edgeHold=false;
      elapsed=0;
      active=true;
      phase='lead';
      previousPhase=null;
      speed=0;
      locomotion=false;
      place(motions.arrival.route.sample(0,location));
      setFishVisible(false);
      gesture?.reset();
      sip?.clear();
      touch?.clear();
      touchResult=null;
      touchSegment=null;
      teaSet.rest();
      teaResult=null;
      if (canFrameVisit()) {
        if(!['fishVisit','fishSmallScroll','fishTable'].includes(activeView.name)) returnView=activeView.name;
        setCameraFov();
        window.shrineView('fishVisit',true);
        beginVisitCamera();
      }
      loadModel();
    }

    function replay(showNewMoves=false) {
      scheduled=null;
      if (showNewMoves) {
        start([dashAct,curiousAct,lookUpAct,tableAct],true,true);
        return;
      }
      start([...acts.slice(0,4),touchAct,acts[4],greetings[0],shyAct,stretchAct,
        ...acts.slice(5),greetings[1],greetings[2],greetings[3],pleasedAct],true,true);
    }

    function stop() {
      active=false;
      scheduled=null;
      speed=0;
      locomotion=false;
      setFishVisible(false);
      kissHeart.hidden=true;
      gesture?.reset();
      sip?.clear();
      touch?.clear();
      touchResult=null;
      touchSegment=null;
      leaveInteractionView();
      if (teaResult?.held) teaSet.rest();
      teaResult=null;
      phase='away';
    }

    function beginOutro() {
      scheduled=null;
      automaticView=false;
      if (!anchor.visible) stop();
    }

    function begin(totalMs, seed) {
      stop();
      sessionViewVersion=userCameraVersion;
      if (!appState.hostControlled) seed=Math.floor(Math.random()*0x100000000);
      const pool=totalMs>=47000 ? visitActs : briefActs;
      const allowPeek=totalMs>=52000;
      const allowTouch=totalMs>=63000;
      scheduled=planFishVisit(totalMs,seed,pool.length,allowTouch ? 59000 : allowPeek ? 50000 : pool===visitActs ? 45000 : 39000);
      if (scheduled) {
        scheduled.order=scheduled.order.map(i=>{
          const action=pool[i];
          if (scheduled.shy && action.phase==='tilt') return shyAct;
          if (scheduled.stretch && action.phase==='glance') return stretchAct;
          return action;
        });
        if (totalMs<63000) {
          const firstShort=scheduled.order.findIndex(action=>action.seconds<3.5);
          if (firstShort>0) scheduled.order.unshift(...scheduled.order.splice(firstShort,1));
        }
        if(scheduled.tableVisit) scheduled.order.splice(scheduled.order.length>1 ? scheduled.greeting%2 : 0,0,tableAct);
        if(scheduled.waveIndex!==null)scheduled.order.splice(scheduled.waveIndex,0,greetings[scheduled.greeting]);
        const artIndex=scheduled.order.findIndex(act=>act.phase==='art');
        scheduled.touchArt=allowTouch&&scheduled.touchArt&&artIndex>=0;
        if(scheduled.touchArt)scheduled.order.splice(artIndex+1,0,touchAct);
        scheduled.peek=allowPeek && scheduled.peek;
        phase='waiting';
        failure=null;
      }
    }

    function upcomingBearing(motion,distance,speed) {
      const ahead=.12+Math.min(.21,.19*speed);
      return motion.route.sample(Math.min(motion.route.length,distance+ahead),gazeLocation).yaw;
    }

    function focusAlong(bearing,weight) {
      if(weight<=0.001)return;
      pathTarget.set(anchor.position.x+Math.sin(bearing),floorY+0.46,anchor.position.z+Math.cos(bearing));
      focusOn(pathTarget,weight,'path');
    }

    function turnAttention(motion,time,leaving) {
      const entry=smooth01(time,-turnPreparation,-.14);
      if (entry<=0) return 0;
      const duration=motion.pace.seconds;
      motion.pace.sample(time+0.16,gazePace);
      const ahead=motion.route.sample(gazePace.distance,gazeLocation).yaw;
      const yaw=anchor.rotation.y;
      // The eyes find the turn while both feet are still planted.
      // Hand over to the moving route preview as the body gathers speed.
      const anticipation=1-smoother01(time,.13,.44);
      const delta=THREE.MathUtils.lerp(ahead-yaw,.32*motion.turnDirection,anticipation);
      let bearing=yaw+THREE.MathUtils.clamp(delta,-.37,.37);
      if(leaving) {
        const next=upcomingBearing(motions.departure,0,0)-bearing;
        const blend=smooth01(time,duration-.32,duration);
        bearing+=Math.atan2(Math.sin(next),Math.cos(next))*blend;
      }
      const release=1-smooth01(time,duration-(leaving?.25:.69),duration);
      focusAlong(bearing,.82*entry*(leaving?1:release));
      const neckEntry=smooth01(time,-.27,-.035);
      return .78*neckEntry*release;
    }

    function walk(motion,t,gazeWeight=.82) {
      motion.pace.sample(t,travel);
      speed=travel.speed;
      locomotion=true;
      place(motion.route.sample(travel.distance,location));
      gesture.setLocomotion(motion.gait.sample(travel.distance,speed,movement),location.yaw,motion.pivot ? 0 : speed);
      if (!motion.pivot) focusAlong(upcomingBearing(motion,travel.distance,speed),gazeWeight);
    }

    function intersectsView(x,z) {
      camera.updateMatrixWorld();
      exitView.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
      exitFrustum.setFromProjectionMatrix(exitView);
      exitBounds.center.set(x,floorY+0.35,z);
      return exitFrustum.intersectsSphere(exitBounds);
    }

    function finishVisit() {
      stop();
      if (canFrameVisit()&&activeView.name==='fishVisit') window.shrineView(returnView,true);
    }

    function updateKissHeart(time) {
      const age=time-.85;
      const show=age>=0 && age<.66 && !outroStarted;
      if (!show) {
        kissHeart.hidden=true;
        return;
      }
      actorRig.head.localToWorld(kissOrigin.copy(actorRig.mouthSocket));
      kissPoint.copy(kissOrigin).lerp(camera.position,.075+.13*age);
      kissPoint.y+=.065+.19*age;
      kissPoint.x+=.11+.16*age;
      kissPoint.project(camera);
      const inView=kissPoint.z>=-1 && kissPoint.z<=1 && Math.abs(kissPoint.x)<1 && Math.abs(kissPoint.y)<1;
      kissHeart.hidden=!inView;
      if (!inView) return;
      const x=(kissPoint.x*.5+.5)*lastW, y=(.5-kissPoint.y*.5)*lastH;
      const opacity=smooth01(age,0,.10)*(1-smooth01(age,.35,.66));
      kissHeart.style.opacity=opacity.toFixed(3);
      kissHeart.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${.57+age*.62})`;
    }

    function departureReserve() {
      const needsCorridor = activeView.name==='fishSmallScroll' || activeView.name==='fishTable' ||
        intersectsView(exitPoint.x,exitPoint.z);
      return directExitSeconds + (needsCorridor ? motions.corridorOut.pace.seconds : 0);
    }

    function update(dt, remainingMs, frameTimestamp, wallDelta=dt) {
      // Give the room its first frame. Only this round's visitors then
      // prepare the rig; an unready fish stays offstage.
      if (scheduled && !firstFrame) {
        if (remainingMs<scheduled.reserveMs) {
          scheduled=null;
          phase='away';
          return;
        }
        if (!model && !loading && !failure) loadModel();
        if (!model || remainingMs>scheduled.triggerMs) return;
        const {order,peek,compact}=scheduled;
        scheduled=null;
        start(order,peek,false,compact);
      }
      if (!active) return;
      if (outroStarted && previousPhase!=='tea' && previousPhase!=='touch' && previousPhase!=='table' &&
          !intersectsView(anchor.position.x,anchor.position.z)) {
        stop();
        return;
      }
      setCameraFov();
      if(!model || !gesture || !prepareArrival(dt)) return;
      if (dt>0) {
        const observed=Math.min(2.75,Math.max(1,wallDelta/dt));
        wallSecondsPerMotion+=(observed-wallSecondsPerMotion)*-Math.expm1(-4*dt);
      }
      elapsed+=Math.max(0,dt);
      setFishVisible(true);
      speed=0;
      locomotion=false;
      gesture.setLocomotion(null);
      gesture.setInteraction(null,null);
      focusOn(null,1,'camera');
      peekWeight=0;
      edgeHold=false;
      let sipTime=-1,touchTime=-1,kissTime=-1,headAttention=0,viewerAttention=0;
      touchSegment=null;
      tableSegment=null;

      const corridorEnd=approachCorridor ? motions.corridorIn.pace.seconds : 0;
      const approachEnd=corridorEnd+(edgeApproach?.pace.seconds ?? 0);
      const peekEnd=edgeEntry ? approachEnd+peek.seconds : 0;
      const arrival=edgeArrival ?? motions.arrival;
      const arrivalStart=edgeEntry ? approachEnd+peek.stepAt : corridorEnd;
      const arriveEnd=arrivalStart+arrival.pace.seconds;
      const turnStart=arriveEnd+0.70;
      const turnEnd=turnStart+(compactVisit ? 0 : motions.turning.pace.seconds);
      if (elapsed<corridorEnd) {
        walk(motions.corridorIn,elapsed);
        phase='corridorIn';
      } else if (elapsed<approachEnd) {
        walk(edgeApproach,elapsed-corridorEnd);
        phase='edgeApproach';
      } else if (elapsed<peekEnd) {
        edgeHold=elapsed<arrivalStart;
        const peekTime = elapsed - approachEnd;
        if (edgeHold) place(motions.arrival.route.sample(edgeEntry.distance,location));
        else walk(arrival,elapsed-arrivalStart,.82*smooth01(peekTime,1.26,1.87));
        peek.sample(peekTime,peekPose);
        peekWeight=peekPose.focus;
        if (edgeHold && peekPose.roomLook > 0) {
          focusOn(teaSet.restPosition,peekPose.roomLook,'peekTea');
        }
        gesture.setInteraction(peekPose,null);
        phase='peek';
      } else if (elapsed<arriveEnd) {
        const settleLook=1-smooth01(elapsed,arriveEnd-.48,arriveEnd);
        walk(arrival,elapsed-arrivalStart,.82*settleLook);
        const peekTime = elapsed - approachEnd;
        if (edgeEntry && peekTime < peek.recognitionEnd) {
          gesture.setInteraction(peek.sampleRecognition(peekTime,peekFace),null);
        }
        phase=speed>0.66?'trotIn':'walkIn';
      } else if (elapsed<turnStart) {
        place({x:stageX,z:stageZ,yaw:stageYaw});
        phase='lead';
        headAttention=.38;
        if (!compactVisit) {
          const time=elapsed-turnStart;
          headAttention*=1-smooth01(time,-turnPreparation,-.22);
          headAttention+=turnAttention(motions.turning,time,false);
        }
      } else if (elapsed<turnEnd) {
        const turnTime=elapsed-turnStart;
        walk(motions.turning,turnTime);
        headAttention=turnAttention(motions.turning,turnTime,false);
        phase='turn';
      } else {
        place({x:stageX,z:stageZ,yaw:stageYaw});
        let cue=turnEnd;
        let action=null;
        for (let index=0;index<actionLimit;index++) {
          const item=actionOrder[index];
          const end=cue+item.seconds;
          if (elapsed<end) {
            // Commit to the whole action once it starts, including contact and release.
            if (previousPhase===item.phase) action=item;
            else {
              const required=(end-elapsed+departureReserve()+minimumSettle)*wallSecondsPerMotion*1000;
              const freshBudget=remainingMs-(appState.hostControlled?hostStateIntervalMs:0);
              if (!outroStarted && freshBudget>=required) action=item;
              else actionLimit=index;
            }
            break;
          }
          cue=end;
        }
        if (action) {
          phase=action.phase;
          if (phase==='art') {
            if (previousPhase!==phase) prepareScrollTurn();
            inspectScroll(elapsed-cue);
          } else if (phase==='touch') {
            if(previousPhase!=='touch'&&activeView.name==='fishVisit'&&canFrameVisit()) {
              setView('fishSmallScroll',true);
              setCameraFov();
              beginVisitCamera();
            }
            let time=elapsed-cue;
            for(const leg of touchVisit){
              if(time>=leg.seconds){time-=leg.seconds;continue;}
              touchSegment=leg.label;
              if (leg.label==='walkBack') leaveInteractionView();
              if(leg.motion)walk(leg.motion,time);
              else {
                place({x:smallScroll.footPoint.x,z:smallScroll.footPoint.z,yaw:smallScroll.facing});
                touchTime=time;
                gesture.setInteraction(touch.poseAt(time,touchPose),null);
                focusOn(smallScroll.tipWorld(scrollTarget),.97,'smallScroll');
              }
              if(leg.label==='walkToPaper')focusOn(smallScroll.boardView,.82,'smallScroll');
              break;
            }
          } else if (phase==='table') {
            if (previousPhase!=='table' && activeView.name==='fishVisit' && canFrameVisit()) {
              setView('fishTable',true);
              setCameraFov();
              beginVisitCamera();
            }
            let time=elapsed-cue;
            for (const leg of tableVisit) {
              if (time>=leg.seconds) { time-=leg.seconds; continue; }
              tableSegment=leg.name;
              if (leg.motion) {
                walk(leg.motion,time);
                anchor.position.y=leg.y;
              } else if (leg.from) {
                sampleFishStair(time,leg,feetScale,tablePoint,stairGait,tablePose);
                place(tablePoint,tablePoint.y);
                gesture.setLocomotion(stairGait,tablePoint.yaw,0);
                gesture.setInteraction(tablePose,null);
                const forward=leg.name==='descend' ? 1 : -1;
                tableFocus.set(leg.to.x,leg.to.y+.23,leg.to.z+.30*forward);
                focusOn(tableFocus,.63,'steps');
              } else {
                place(leg.point,leg.point.y);
                if (previousPhase!==phase || time<dt) gesture.play('lookUp');
                viewerAttention=.28;
              }
              break;
            }
          } else if (phase==='dash') {
            let time=elapsed-cue;
            for (const motion of dash) {
              if (time>=motion.pace.seconds) { time-=motion.pace.seconds; continue; }
              walk(motion,time);
              break;
            }
          } else if (phase==='tailCuriosity') {
            if (previousPhase!==phase) gesture.play(action.name);
            walk(chaseTail,elapsed-cue,0);
          } else if (phase==='tea') {
            const time=elapsed-cue;
            if(time<stepSeconds) walk(motions.teaForward,time);
            else if(time>=stepSeconds+sipSeconds) walk(motions.teaBack,time-stepSeconds-sipSeconds);
            else {
              place(teaForward.sample(stepToTea,location));
              sipTime=time-stepSeconds;
              gesture.setInteraction(sip.poseAt(sipTime,teaPose),null);
              cupRimFocus.set(0,0.048,0).applyMatrix4(teaSet.cup.matrixWorld);
              focusOn(cupRimFocus,teaPose.cupAttention,'cup');
            }
          } else if(action.viewer) {
            const time=elapsed-cue;
            viewerAttention=smoother01(time,0,.32)*(1-smoother01(time,action.seconds-.28,action.seconds));
            focusOn(null,1,'viewer');
            if(time>=.32 && (time-dt<.32 || previousPhase!==phase))gesture.play(action.name);
            if(phase==='airKiss')kissTime=time-.32;
          } else if(previousPhase!==phase) gesture.play(action.name);
        } else {
          const turnTime=exitTurnSeconds;
          if (settleEnd===null) {
            const freshBudget=remainingMs-(appState.hostControlled?hostStateIntervalMs:0);
            const available=freshBudget/(1000*wallSecondsPerMotion)-departureReserve();
            const linger=Math.min(4.8,Math.max(minimumSettle,available));
            settleEnd=cue+linger;
          }
          const awayTime=elapsed-settleEnd;
          if (awayTime<0) {
            phase='settled';
            const time=elapsed-cue;
            const duration=settleEnd-cue;
            if(duration>=3.70){
              if(previousPhase!=='settled')gesture.play('content');
              const notice=smooth01(time,.08,.53)*(1-smooth01(time,1.01,1.50));
              if(notice>0.002)focusOn(teaSet.restPosition,notice*.86,'restCup');
            }
            headAttention=.88*smooth01(time,0,.26)*(1-smooth01(time,duration-.58,duration-.19));
            headAttention*=1-smooth01(awayTime,-turnPreparation,-.22);
            headAttention+=turnAttention(motions.exitTurn,awayTime,true);
          } else if (awayTime<turnTime) {
            walk(motions.exitTurn,awayTime);
            headAttention=turnAttention(motions.exitTurn,awayTime,true);
            phase='turnOut';
          } else if(awayTime-turnTime<motions.departure.pace.seconds) {
            walk(motions.departure,awayTime-turnTime);
            phase=speed>0.66?'trotOut':'walkOut';
          } else {
            const extraTime=awayTime-turnTime-motions.departure.pace.seconds;
            if (leaveCorridor===null) {
              const endpoint=motions.departure.route.sample(motions.departure.route.length,location);
              leaveCorridor=intersectsView(endpoint.x,endpoint.z);
            }
            if (!leaveCorridor || extraTime>=motions.corridorOut.pace.seconds) {
              if (leaveCorridor) place(motions.corridorOut.route.sample(motions.corridorOut.route.length,location));
              else place(motions.departure.route.sample(motions.departure.route.length,location));
              if (!intersectsView(location.x,location.z)) finishVisit();
              return;
            }
            walk(motions.corridorOut,extraTime);
            phase='corridorOut';
          }
        }
      }
      if ((previousPhase==='touch' || previousPhase==='table') && phase!==previousPhase) leaveInteractionView();
      previousPhase=phase;
      if(sipTime<0)sip.clear();
      if(touchTime<0&&touchResult){touch.clear();touchResult=null;}
      // The motion phase can change the camera goal. Sample that view
      // before solving the gaze for the pose that this frame will draw.
      updateCamera(dt);
      gesture.setAttention(focus,focusWeight,headAttention,viewerAttention);
      gesture.update(frameTimestamp,camera);
      if(kissTime>=0 || !kissHeart.hidden) {
        camera.updateMatrixWorld();
        updateKissHeart(kissTime);
      }
      if(sipTime>=0) {
        teaResult=sip.sample(sipTime);
        teaSet.place(teaResult);
      }
      if(touchTime>=0)touchResult=touch.sample(touchTime);
      shadow.position.x=anchor.position.x;
      shadow.position.z=anchor.position.z;
      const x=anchor.position.x,z=anchor.position.z;
      const tableClearance=Math.min(tableSlab.geometry.parameters.width/2-Math.abs(x-tableSlab.position.x),
        tableSlab.geometry.parameters.depth/2-Math.abs(z-tableSlab.position.z));
      let surfaceY=floorY, supportRadius=Infinity;
      if (tableSegment) {
        for (const step of steps) {
          const clearance=Math.min(step.width/2-Math.abs(x-step.x),step.depth/2-Math.abs(z-step.z));
          if (clearance>0 && anchor.position.y>=step.y) {
            surfaceY=step.y;
            supportRadius=clearance;
          }
        }
        if (tableClearance>0 && anchor.position.y>=tableSurfaceY) {
          surfaceY=tableSurfaceY;
          supportRadius=tableClearance;
        }
      }
      shadow.position.y=surfaceY+.002;
      const rise=Math.min(1,(anchor.position.y-surfaceY+model.getSoleLift()*model.scale.y)/.16);
      shadow.material.opacity=shadowOpacity*(1-0.45*rise);
      shadow.scale.copy(shadowSize).multiplyScalar(Math.min(1-.20*rise, 2*supportRadius/shadowSize.x));
      return true;
    }

    function status() {
      const {x,y,z}=anchor.position;
      const lift=model ? model.getSoleLift()*model.scale.y : 0;
      return {
        active,isLoaded:!!model,isLoading:loading,hasError:!!failure,error:failure?.message ?? null,
        elapsed,phase,view:activeView.name,position:{x,y,z},yaw:anchor.rotation.y,speed,
        worldSole:{x,y:y+lift,z},hasShadow:true,visible:anchor.visible,
        planted:locomotion ? {left:movement.leftPlanted,right:movement.rightPlanted} : null,
        cup:teaResult ? {phase:teaResult.phase,held:teaResult.held,gripError:teaResult.gripError,
          rimError:teaResult.rimError,fill:teaResult.fill,fingerCurl:teaResult.fingerCurl,fingers:teaResult.fingers?{...teaResult.fingers}:null,position:teaSet.cup.position.toArray()} : null,
        touch:phase==='touch' ? {segment:touchSegment,...touchResult} : null,
        table:tableSegment,
        plannedTable:scheduled?.tableVisit ?? false,
        plannedTouch:scheduled ? scheduled.touchArt : null,
        greeting:greetings.some(action=>action.phase===phase) ? gesture?.status().greeting ?? null : null,
        plannedWave:scheduled ? scheduled.waveIndex!==null : null,
        expression:gesture ? { ...gesture.expression } : null,
        attention:anchor.visible ? {subject:attention,weight:focusWeight,point:focus?.toArray() ?? null,gaze:gesture.status().gaze} : null,
        edge:edgeEntry ? { ...edgeEntry, weight:peekWeight, holding:edgeHold } : null,
        plannedPeek:scheduled?.peek ?? null,
        scheduled:scheduled?.triggerMs ?? null
      };
    }

    return {begin,beginOutro,stop,update,replay,status,anchor,setScrollTexture:smallScroll.setTexture};
  }

  const fishVisitor = createFishPreviewVisitor();
  batchTeaRoomMeshes(THREE, [
    [roomGroup, [archWoodMat, borderMat]],
    [shojiGroup, [hinokiMat]],
    [scrollGroup, [knobMat, cordMat]],
    [tableGroup, [tableWoodMat]],
    [vaseGroup, [branchMat, leafMat]],
    [censerGroup, [bronzeMat, fallenAshMat]],
  ], false);
  function freezeFixedRoomMatrices(scene, roots, movingSubtrees) {
    const moving = new Set(movingSubtrees);
    scene.updateMatrixWorld(true);

    function visit(object) {
      if (moving.has(object)) return true;
      let hasMovingChild = false;
      for (const child of object.children) {
        if (visit(child)) hasMovingChild = true;
      }
      object.matrixAutoUpdate = false;
      // Three r160 skips this entire subtree from its parent when false.
      object.matrixWorldAutoUpdate = hasMovingChild;
      return hasMovingChild;
    }

    for (const root of roots) visit(root);
    // The scene stays in world coordinates. Re-composing its identity matrix
    // would force every child to update, even on a fully static branch.
    scene.matrixAutoUpdate = false;
  }

  freezeFixedRoomMatrices(scene, [roomGroup, tableGroup], [
    scrollGroup, teapotGroup, teapotShadowMesh, cupLiquids[0], rippleGroup, dipRippleGroup,
  ]);
  const dynamic = [incenseAnchor, smokeMesh, wisps, ashFlakePoints, dust, cupSteam, streamMesh,
    ...scene.children.filter(object => object.userData.fishDynamic)];
  const staticRoom = scene.children.filter(object => !object.isLight && !dynamic.includes(object));
  // Project the ribbon a height band at a time. Each band covers the
  // maximum displacement of the shader over the entire animation.
  const smokeBands = [0,.20,.40,.60,.80,1].slice(1).map((top,index)=>{
    const bottom=index*.20;
    const laminar=smooth01(top,.008,.18);
    const curl=smooth01(top,.05,.28)*smooth01(top,.06,.92);
    const spread=.022*smooth01(top,.18,.85);
    const width=(.0028+(.092-.0028)*top**1.38)*1.18;
    const swingX=.052*top**1.75+.058*top**1.22+.0085*laminar+.124*curl+spread+width;
    const swingZ=.036*top**1.28+.0065*laminar+.109*curl+spread+width;
    return [
      .095*bottom**1.50-swingX,bottom*1.28,-.048*top**1.55-swingZ,
      .095*top**1.50+swingX,top*1.28,-.048*bottom**1.55+swingZ
    ];
  });
  const depthCoverage = renderer.capabilities.isWebGL2 ? createRoomDepthCoverage(THREE,mark=>{
    const t=smokeUniforms.uTime.value;
    const tip=smokeUniforms.uOrigin.value;
    const ash=incenseAnchor.position;
    mark(ash.x-.04,ash.y-.02,ash.z-.04,ash.x+.04,tip.y+.025,ash.z+.04,5);
    if (smokeMesh.visible) {
      for (const [x0,y0,z0,x1,y1,z1] of smokeBands) {
        mark(tip.x+x0,tip.y+y0,tip.z+z0,tip.x+x1,tip.y+y1,tip.z+z1);
      }
    }
    if (wisps.visible) {
      function markWisp(seed,life) {
        const h=.34+life*.80;
        const x=tip.x+h**1.50*.16+Math.sin(t*.2+seed*6.283)*(.02+life*.06);
        const y=tip.y+h*1.28;
        const z=tip.z-h**1.55*.065+Math.cos(t*.18+seed*6.283)*(.015+life*.045);
        mark(x,y,z,x,y,z,30+life*92);
      }
      for (let i=0;i<wispSeed.length;i+=2) {
        const step=wispSeed[i]+t*.042,life=step-Math.floor(step);
        const seed=wispSeed[i+1];
        markWisp(seed,life);
        // CPU and shader arithmetic can wrap the particle on opposite sides
        // of a life-cycle boundary by a fraction of a frame.
        if (life < .0001) markWisp(seed,1);
        else if (life > .9999) markWisp(seed,0);
      }
    }
    if (streamMesh.visible || cupSteam.visible) return false;
    if (dust.visible) {
      for (let i=0;i<dustSeed.length;i++) {
        const seed=dustSeed[i], offset=i*3;
        const x=dustPos[offset]+Math.sin(t*.11+seed*9)*.10;
        const y=dustPos[offset+1]+Math.sin(t*.07+seed*13)*.07;
        const z=dustPos[offset+2]+Math.cos(t*.09+seed*7)*.08;
        mark(x,y,z,x,y,z,37);
      }
    }
    for (const object of dynamic) {
      if (!object.visible) continue;
      const {x,y,z}=object.position;
      switch (object.userData.fishDynamic) {
        case 'fish':
          // Enclose the authored walk, gestures, and the fully extended tail.
          mark(x-.56,y-.12,z-.56,x+.56,y+1.04,z+.56);
          break;
        case 'contact':
          mark(x-object.scale.x/2,y,z-object.scale.y/2,
            x+object.scale.x/2,y,z+object.scale.y/2);
          break;
        case 'cup':
          mark(x-.075,y-.075,z-.075,x+.075,y+.075,z+.075);
          break;
        case 'paper':
          mark(x-.18,y+.12,z-.18,x+.18,y+.58,z+.18);
          break;
        default:
          if (object!==incenseAnchor && object!==smokeMesh && object!==wisps &&
              object!==ashFlakePoints && object!==dust) return false;
      }
    }
    return true;
  }) : null;
  const roomCache = createTeaRoomCache(THREE, renderer, scene, staticRoom, dynamic, lowEnd ? 0 : 4, depthCoverage);
  function canCacheRoom() {
    return !outroStarted && !dragging && (activeView.name === 'fishVisit' || activeView.name === 'fishSmallScroll')
      && Math.abs(fishVisitor.anchor.position.x - tableSlab.position.x) > tableSlab.geometry.parameters.width / 2 + 0.34;
  }
  const replayButton = dom.replayButton;
  const replayHome = replayButton.parentElement;

  function restoreReplayControl() {
    if (replayButton.parentElement === replayHome) return;
    replayButton.classList.remove('replay-on-end');
    replayHome.append(replayButton);
  }

  function replayFishPreview(showNewMoves=false) {
    if (!sceneBooted) return;
    if (!appState.hostControlled) {
      resetSceneClock();
      appState.active = true;
      appState.remainingMs = appState.totalMs;
      appState.targetProgress = 0;
      restStarted = false;
      beginSession();
      renderHUD();
    } else if (!appState.active || outroStarted) return;
    fishVisitor.replay(showNewMoves);
  }
  replayButton.addEventListener('click', () => replayFishPreview());
  window.__teaFishPreviewStatus = () => fishVisitor.status();
  window.__teaFishPreviewReplay = replayFishPreview;
  window.__teaFishRenderInfo = () => ({calls: firstFrame ? 0 : renderer.info.render.calls, triangles: renderer.info.render.triangles,
    geometries: renderer.info.memory.geometries, pixelRatio: renderer.getPixelRatio(), cache: roomCache.info()});

  function disposeScene() {
    pauseSceneFrame();
    scene.traverse(obj => {
      if (obj.geometry && typeof obj.geometry.dispose === 'function') {
        obj.geometry.dispose();
      }
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => { if (m && typeof m.dispose === 'function') m.dispose(); });
      }
    });
    Object.keys(textures).forEach(k => {
      const t = textures[k];
      if (t && typeof t.dispose === 'function') t.dispose();
    });
    if (envRenderTarget) {
      envRenderTarget.dispose();
      envRenderTarget = null;
    }
    renderer.dispose();
  }

  window.addEventListener('pagehide', disposeScene);

  camera.position.copy(VIEWS.front.pos);
  camera.lookAt(VIEWS.front.target);
  renderHUD();
  resizeRenderer();
  const scrollStage = createScrollStage();
  await startupPaint();
  try {
    releaseStartupPrograms = await warmTeaRoomPrograms(THREE, renderer, scene, camera, windowLight.shadow.camera, compilePreviewPrograms);
    await warmPreviewTextures(renderer, [scene.environment,...Object.values(textures)], startupPaint);
  } catch (error) {
    console.warn('茶室预载失败，继续正常绘制', error);
  }
  roomCache.prepare(camera, canvasFormat);
  sceneBooted = true;
  if (pendingHostState) window.shrineState(pendingHostState);
  if (pendingHostView) window.shrineView(pendingHostView, true);
  pendingHostState = pendingHostView = undefined;
  scheduleSceneFrame();
})();
</script>
</body>
</html>
