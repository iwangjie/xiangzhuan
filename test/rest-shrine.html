  const ashRadius = 0.0695;
  const ashBedGeo = new THREE.RingGeometry(0.0001, ashRadius, 64, 18);
  ashBedGeo.rotateX(-Math.PI / 2);
  const ashPos = ashBedGeo.attributes.position;
  for (let i = 0; i < ashPos.count; i++) {
    const vx = ashPos.getX(i);
    const vz = ashPos.getZ(i);
    const dist = Math.sqrt(vx * vx + vz * vz);
    const normR = dist / ashRadius;
    const dome = Math.cos(normR * Math.PI * 0.5) * 0.0055;
    const ripples = Math.sin(dist * 210.0) * 0.00045 + Math.sin(vx * 95.0 + vz * 110.0) * 0.0006;
    const rootIndent = -Math.exp(-dist * dist * 18000.0) * 0.0018;
    ashPos.setY(i, dome + ripples + rootIndent);
  }
  ashBedGeo.computeVertexNormals();

  const ashBedMesh = new THREE.Mesh(
    ashBedGeo,
    new THREE.MeshStandardMaterial({
      map: textures.incenseAsh,
      bumpMap: textures.ashBump,
      bumpScale: 0.0035,
      color: 0xa6a096,
      roughness: 0.96,
      metalness: 0.01
    })
  );
  ashBedMesh.position.y = 0.104;
  ashBedMesh.receiveShadow = true;
  censerGroup.add(ashBedMesh);

  // 落在炉灰表面的几小段断落灰白香灰
  const fallenAshMat = new THREE.MeshStandardMaterial({
    map: textures.incenseAsh,
    color: 0xbcb6ac,
    roughness: 0.95
  });
  const fallenPieces = [
    { x: 0.012, z: 0.008, rotY: 0.4, len: 0.009 },
    { x: -0.015, z: 0.011, rotY: 1.9, len: 0.007 },
    { x: 0.006, z: -0.016, rotY: 2.6, len: 0.011 },
    { x: -0.009, z: -0.007, rotY: 0.9, len: 0.006 }
  ];
  fallenPieces.forEach(fp => {
    const piece = new THREE.Mesh(new THREE.CylinderGeometry(0.0011, 0.0012, fp.len, 10), fallenAshMat);
    piece.position.set(fp.x, 0.109, fp.z);
    piece.rotation.set(Math.PI * 0.49, fp.rotY, 0.08);
    piece.castShadow = true;
    censerGroup.add(piece);
  });

  // --- 5.1 照片级真实线香（直径 2.5mm、沉檀木粉颗粒质感、自然插香倾角、顶端炭化火头+微卷白灰） ---
  const incenseAnchor = new THREE.Group();
  incenseAnchor.position.set(sceneRefs.censerX, sceneRefs.ashSurfaceY, sceneRefs.censerZ);
  incenseAnchor.rotation.z = -0.042;
  incenseAnchor.rotation.x = 0.024;
  scene.add(incenseAnchor);

  const rootMound = new THREE.Mesh(
    new THREE.ConeGeometry(0.0038, 0.0032, 16),
    ashBedMesh.material
  );
  rootMound.position.y = 0.0012;
  incenseAnchor.add(rootMound);

  // 保持单位圆柱顶面圆心严格在 (0, 1, 0)，确保 burningTipGroup 与缩放后的香体顶端严丝合缝对齐
  const stickRadius = 0.00125;
  const stickGeo = new THREE.CylinderGeometry(stickRadius * 0.96, stickRadius, 1.0, 20, 32);
  stickGeo.translate(0, 0.5, 0);
  const stPos = stickGeo.attributes.position;
  for (let i = 0; i < stPos.count; i++) {
    const py = stPos.getY(i); // 0 .. 1
    const arch = Math.sin(py * Math.PI); // 0 与 1 两端严格为 0，中段微弯
    stPos.setX(i, stPos.getX(i) + arch * 0.00085);
    stPos.setZ(i, stPos.getZ(i) + arch * 0.00045);
  }
  stickGeo.computeVertexNormals();

  const stickMat = new THREE.MeshStandardMaterial({
    map: textures.incenseStick,
    bumpMap: textures.stickBump,
    bumpScale: 0.0012,
    roughness: 0.92,
    metalness: 0.0
  });

  const incenseStickMesh = new THREE.Mesh(stickGeo, stickMat);
  incenseStickMesh.castShadow = true;
  incenseStickMesh.receiveShadow = true;
  incenseStickMesh.scale.y = sceneRefs.stickFullLen;
  incenseAnchor.add(incenseStickMesh);

  // 顶端燃烧结构（紧随香体顶端下降）
  const burningTipGroup = new THREE.Group();
  burningTipGroup.position.y = sceneRefs.stickFullLen;
  incenseAnchor.add(burningTipGroup);

  const emberTipUniforms = {
    uTime: { value: 0 },
    uPulse: { value: 1.0 }
  };

  const emberTipGeo = new THREE.CylinderGeometry(stickRadius * 0.88, stickRadius * 0.97, 0.0058, 24, 16);
  emberTipGeo.translate(0, 0.0029, 0);

  const emberTipMat = new THREE.ShaderMaterial({
    uniforms: emberTipUniforms,
    vertexShader: `
      varying vec3 vPos;
      varying vec3 vNormal;
      void main() {
        vPos = position;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uPulse;
      varying vec3 vPos;
      varying vec3 vNormal;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        float h = clamp(vPos.y / 0.0058, 0.0, 1.0);
        float angle = atan(vPos.z, vPos.x);
        float grain = hash(vec2(floor(angle * 18.0), floor(h * 32.0)));
        float wave = sin(angle * 5.0 + uTime * 1.8) * 0.03;

        vec3 rawWood = vec3(0.42, 0.32, 0.22);
        vec3 blackChar = vec3(0.06, 0.05, 0.045);
        vec3 darkCrimson = vec3(0.48, 0.05, 0.01);
        vec3 glowingEmber = vec3(1.85, 0.44, 0.06) * uPulse;
        vec3 hotCore = vec3(2.60, 1.05, 0.30) * uPulse;

        float charMask = smoothstep(0.0, 0.16, h);
        float redRingMask = smoothstep(0.36 + wave, 0.56 + wave, h);
        float hotZoneMask = smoothstep(0.54 + wave, 0.82 + wave, h) * (1.0 - smoothstep(0.90, 1.0, h));

        vec3 col = mix(rawWood, blackChar, charMask);
        col = mix(col, darkCrimson, redRingMask);
        col = mix(col, glowingEmber, hotZoneMask * (0.82 + 0.18 * grain));
        col = mix(col, hotCore, pow(hotZoneMask, 2.6) * (0.65 + 0.35 * grain));

        float ashFleck = smoothstep(0.74, 0.92, grain) * smoothstep(0.60, 0.85, h);
        col = mix(col, vec3(0.35, 0.32, 0.30), ashFleck * 0.55);

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const emberTipMesh = new THREE.Mesh(emberTipGeo, emberTipMat);
  burningTipGroup.add(emberTipMesh);

  // 火头最顶端轻微卷曲的灰白余灰帽（约 2.8mm 高）
  const ashCapGeo = new THREE.CylinderGeometry(stickRadius * 0.68, stickRadius * 0.86, 0.0028, 20, 10);
  ashCapGeo.translate(0, 0.0014, 0);
  const acPos = ashCapGeo.attributes.position;
  for (let i = 0; i < acPos.count; i++) {
    const py = acPos.getY(i);
    const ratio = py / 0.0028;
    const curlX = ratio * ratio * 0.00052;
    const curlZ = ratio * ratio * -0.00024;
    acPos.setX(i, acPos.getX(i) + curlX);
    acPos.setZ(i, acPos.getZ(i) + curlZ);
  }
  ashCapGeo.computeVertexNormals();

  const ashCapMesh = new THREE.Mesh(
    ashCapGeo,
    new THREE.MeshStandardMaterial({
      map: textures.incenseAsh,
      bumpMap: textures.ashBump,
      bumpScale: 0.0008,
      color: 0xd4cfc7,
      roughness: 0.95,
      emissive: new THREE.Color(0x4a1203),
      emissiveIntensity: 0.45
    })
  );
  ashCapMesh.position.y = 0.0056;
  burningTipGroup.add(ashCapMesh);

  // 青烟与掉灰的精确发射原点（绑定在火头与灰帽交界处）
  const smokeEmitSocket = new THREE.Object3D();
  smokeEmitSocket.position.set(0, 0.0062, 0);
  burningTipGroup.add(smokeEmitSocket);

  const emberMicroGlow = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: textures.radialGlow,
      color: 0xff5418,
      transparent: true,
      opacity: 0.68,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  emberMicroGlow.position.set(0, 0.0044, 0);
  emberMicroGlow.scale.set(0.019, 0.019, 1);
  burningTipGroup.add(emberMicroGlow);

  const emberPointLight = new THREE.PointLight(0xff6a2a, 0.22, 0.26, 2.0);
  emberPointLight.position.set(0, 0.005, 0);
  scene.add(emberPointLight);

  incenseAnchor.updateMatrixWorld(true);
  const stickTipWorld = new THREE.Vector3();
  smokeEmitSocket.getWorldPosition(stickTipWorld);

  // ============================================================================
  // 6. 照片级冷灰白线香青烟（香头极细处升起 -> 底部层流 -> 向上丝缕断裂与缓慢湍流，绝非直线）
  // ============================================================================
  const smokeUniforms = {
    uTime: { value: 0 },
    uOrigin: { value: stickTipWorld.clone() },
    uEmberPulse: { value: 1.0 },
    uOpacityScale: { value: 1.0 }
  };

  const smokeVertexShader = `
    uniform float uTime;
    uniform vec3 uOrigin;
    attribute float aLayer;

    varying vec2 vUv;
    varying float vHeight;
    varying float vLayer;

    float hash11(float p) {
      p = fract(p * 0.1031);
      p *= p + 33.33;
      p *= p + p;
      return fract(p);
    }

    float noise2D(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float n = i.x + i.y * 57.0;
      return mix(
        mix(hash11(n + 0.0), hash11(n + 1.0), f.x),
        mix(hash11(n + 57.0), hash11(n + 58.0), f.x),
        f.y
      );
    }

    void main() {
      vUv = uv;
      vLayer = aLayer;

      float h = uv.y; // 0(香头火头) -> 1(高处消散)
      vHeight = h;

      float plumeHeight = 1.28;
      float yOffset = h * plumeHeight;

      // 底部 0~0.16 为纤细层流（但带柔和呼吸曲率，绝不死板笔直），向上逐渐进入缓慢涡旋湍流
      float laminarBendX = sin(h * 4.2 - uTime * 0.55) * 0.0085 * smoothstep(0.008, 0.18, h);
      float laminarBendZ = cos(h * 3.8 - uTime * 0.48) * 0.0065 * smoothstep(0.008, 0.18, h);

      float curlStart = smoothstep(0.05, 0.28, h);
      float curlAmp = smoothstep(0.06, 0.92, h);
      float t = uTime * 0.34 + aLayer * 1.047;

      // 受左侧窗户微弱冷空气对流影响，整柱缓慢蜿蜒摆荡并向右后方漂移
      float swayX = sin(uTime * 0.46 + h * 3.2) * pow(h, 1.22) * 0.058;
      float swayZ = cos(uTime * 0.39 + h * 2.5) * pow(h, 1.28) * 0.036;
      float driftX = pow(h, 1.50) * 0.095 + sin(uTime * 0.18) * pow(h, 1.75) * 0.052 + swayX + laminarBendX;
      float driftZ = pow(h, 1.55) * -0.048 + swayZ + laminarBendZ;

      float n1 = noise2D(vec2(h * 4.5 - uTime * 0.40, aLayer * 2.1 + uTime * 0.09)) * 2.0 - 1.0;
      float n2 = noise2D(vec2(h * 9.8 - uTime * 0.68, aLayer * 4.7 - uTime * 0.15)) * 2.0 - 1.0;

      // 不同丝带层在中高段轻微分离交织，形成立体体积云缕
      float layerSpread = smoothstep(0.18, 0.85, h) * 0.022;
      float spreadX = sin(aLayer * 2.094 + h * 5.2 - uTime * 0.42) * layerSpread;
      float spreadZ = cos(aLayer * 2.094 + h * 4.8 - uTime * 0.38) * layerSpread;

      float swirlX = (sin(h * 8.2 - t * 2.0) * 0.048 + sin(h * 16.5 - t * 3.2 + aLayer) * 0.022 + n1 * 0.054) * curlStart * curlAmp + spreadX;
      float swirlZ = (cos(h * 7.5 - t * 1.85 + aLayer) * 0.042 + cos(h * 15.0 - t * 2.9) * 0.019 + n2 * 0.048) * curlStart * curlAmp + spreadZ;

      // 宽度包络：火头起始处极细（半径仅约 1.5mm），向上自然扩散成轻柔云缕
      float halfWidth = mix(0.0028, 0.092, pow(h, 1.38)) * (1.0 + 0.18 * sin(h * 10.5 - uTime * 0.82 + aLayer));

      float angle = aLayer * 0.785398 + h * 2.5 + sin(uTime * 0.22 + h * 3.4) * 0.42;
      vec3 sideVec = vec3(cos(angle), 0.0, sin(angle));

      float centeredX = (uv.x - 0.5) * 2.0;
      vec3 spinePos = uOrigin + vec3(driftX + swirlX, yOffset, driftZ + swirlZ);
      vec3 worldPos = spinePos + sideVec * (centeredX * halfWidth);

      gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
    }
  `;

  const smokeFragmentShader = `
    uniform float uTime;
    uniform float uEmberPulse;
    uniform float uOpacityScale;

    varying vec2 vUv;
    varying float vHeight;
    varying float vLayer;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float amp = 0.5;
      mat2 rot = mat2(0.8, -0.6, 0.6, 0.8);
      for (int i = 0; i < 4; i++) {
        v += amp * vnoise(p);
        p = rot * p * 2.02;
        amp *= 0.5;
      }
      return v;
    }

    void main() {
      float h = vHeight;
      float x = vUv.x;
      float fadeIn = smoothstep(0.0, 0.004, h);
      float fadeOut = pow(1.0 - smoothstep(0.20, 0.98, h), 1.58);
      float baseDensity = mix(0.88, 0.30, smoothstep(0.0, 0.85, h));
      float density = fadeIn * fadeOut * baseDensity * uOpacityScale;

      // The two strands sum to at most 1.12, and breakup only lowers alpha.
      if (density < 0.0017) discard;
      vec2 flowUv = vec2(x * 3.2 + vLayer * 1.71, h * 6.2 - uTime * 0.36);
      float nA = fbm(flowUv);

      // 丝缕内部扭曲轴线：底部极其凝聚纤细，向上分裂为双股交织与断裂云雾
      float warpCenter = 0.5 + (nA - 0.5) * 0.52 * smoothstep(0.02, 0.34, h);
      float dist = abs(x - warpCenter);
      float edgeMask = 1.0 - smoothstep(0.03, 0.49, dist);
      float split = smoothstep(0.07, 0.30, h);
      float strandGate = smoothstep(0.09, 0.36, h);

      float laminarCore = exp(-pow((x - warpCenter) / mix(0.082, 0.28, smoothstep(0.0, 0.32, h)), 2.0));
      float structureLimit = mix(laminarCore, max(laminarCore * 0.58 + strandGate * 0.54, edgeMask), split);
      if (structureLimit * density < 0.00198) discard;

      float nB = fbm(vec2(x * 6.8 - nA * 1.50 + vLayer * 3.1, h * 12.5 - uTime * 0.58));
      float secondaryStrand = exp(-pow((x - (0.5 - (nB - 0.5) * 0.44)) / 0.15, 2.0)) * strandGate;
      float wispyVeil = smoothstep(0.24, 0.82, nB * 0.62 + nA * 0.38) * edgeMask;
      float structure = mix(laminarCore, max(laminarCore * 0.58 + secondaryStrand * 0.54, wispyVeil), split);
      if (structure * density < 0.00198) discard;

      // Below the breakup range the blend weight is exactly zero.
      float breakupMask = 1.0;
      if (h > 0.18) {
        float breakupField = fbm(vec2(h * 7.8 - uTime * 0.32, vLayer * 2.3 + x * 2.2));
        breakupMask = mix(1.0, smoothstep(0.06, 0.52, breakupField + (1.0 - h) * 0.26), smoothstep(0.18, 0.62, h));
      }

      float alpha = structure * fadeIn * fadeOut * baseDensity * breakupMask * uOpacityScale;
      if (alpha < 0.002) discard;

      // 冷灰白丁达尔散射色调：根部极微弱受火头暖光映照，主体为清冷灰白青烟
      vec3 emberColor = vec3(1.18, 0.44, 0.14) * uEmberPulse;
      vec3 lowerAshWhite = vec3(0.50, 0.505, 0.52);
      vec3 upperCoolMist = vec3(0.40, 0.44, 0.50);
      float coolMix = smoothstep(0.04, 0.55, h);
      float emberFade = exp(-h * 26.0);
      vec3 smokeColor = mix(lowerAshWhite, upperCoolMist, coolMix);
      smokeColor = mix(smokeColor, emberColor, emberFade * 0.65);
      smokeColor += vec3(0.04, 0.045, 0.055) * pow(nB, 2.0);

      gl_FragColor = vec4(smokeColor, clamp(alpha, 0.0, 0.30));
    }
  `;

  function createRibbonGeometry(ribbonCount, segX, segY) {
    const base = new THREE.PlaneGeometry(1, 1, segX, segY);
    const vCount = base.attributes.position.count;
    const iCount = base.index.count;
    const positions = new Float32Array(vCount * 3 * ribbonCount);
    const uvs = new Float32Array(vCount * 2 * ribbonCount);
    const layers = new Float32Array(vCount * ribbonCount);
    const IndexArray = vCount * ribbonCount <= 65536 ? Uint16Array : Uint32Array;
    const indices = new IndexArray(iCount * ribbonCount);
    const srcPos = base.attributes.position.array;
    const srcUv = base.attributes.uv.array;
    const srcIdx = base.index.array;
    for (let r = 0; r < ribbonCount; r++) {
      positions.set(srcPos, r * vCount * 3);
      uvs.set(srcUv, r * vCount * 2);
      for (let v = 0; v < vCount; v++) layers[r * vCount + v] = r;
      const off = r * vCount;
      for (let k = 0; k < iCount; k++) indices[r * iCount + k] = srcIdx[k] + off;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setAttribute('aLayer', new THREE.BufferAttribute(layers, 1));
    geo.setIndex(new THREE.BufferAttribute(indices, 1));
    return geo;
  }

  const smokeMaterial = new THREE.ShaderMaterial({
    uniforms: smokeUniforms,
    vertexShader: smokeVertexShader,
    fragmentShader: smokeFragmentShader,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  // The vertex shader bends each height slice; its width is linear in UV.x.
  const smokeGeometry = createRibbonGeometry(4, 1, lowEnd ? 96 : 140);
  const smokeMesh = new THREE.Mesh(smokeGeometry, smokeMaterial);
  smokeMesh.frustumCulled = false;
  smokeMesh.renderOrder = 8;
  scene.add(smokeMesh);

  // 高处极淡的散佚冷灰白烟气
  const wispCount = lowEnd ? 24 : 40;
  const wispGeo = new THREE.BufferGeometry();
  const wispPos = new Float32Array(wispCount * 3);
  const wispSeed = new Float32Array(wispCount * 2);
  for (let i = 0; i < wispCount; i++) {
    wispPos[i * 3] = stickTipWorld.x;
    wispPos[i * 3 + 1] = stickTipWorld.y;
    wispPos[i * 3 + 2] = stickTipWorld.z;
    wispSeed[i * 2] = i / wispCount;
    wispSeed[i * 2 + 1] = (i * 1.6180339) % 1;
  }
  wispGeo.setAttribute('position', new THREE.BufferAttribute(wispPos, 3));
  wispGeo.setAttribute('aSeed', new THREE.BufferAttribute(wispSeed, 2));
  const wispMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: smokeUniforms.uTime,
      uOrigin: smokeUniforms.uOrigin,
      uOpacityScale: smokeUniforms.uOpacityScale,
      uTex: { value: textures.radialGlow }
    },
    vertexShader: `
      uniform float uTime;
      uniform vec3 uOrigin;
      uniform float uOpacityScale;
      attribute vec2 aSeed;
      varying float vAlpha;
      void main() {
        float life = fract(aSeed.x + uTime * 0.042);
        float h = 0.34 + life * 0.80;
        float y = h * 1.28;
        float driftX = pow(h, 1.50) * 0.16 + sin(uTime * 0.2 + aSeed.y * 6.283) * (0.02 + life * 0.06);
        float driftZ = pow(h, 1.55) * -0.065 + cos(uTime * 0.18 + aSeed.y * 6.283) * (0.015 + life * 0.045);
        vec3 p = uOrigin + vec3(driftX, y, driftZ);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (30.0 + life * 92.0) * (1.0 / -mv.z);
        vAlpha = sin(life * 3.1415926) * 0.052 * uOpacityScale;
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vAlpha;
      void main() {
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(0.62, 0.66, 0.72), t.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const wisps = new THREE.Points(wispGeo, wispMat);
  wisps.frustumCulled = false;
  wisps.renderOrder = 7;
  scene.add(wisps);

  // --- 6.1 香头掉灰：真实的香灰是烧透的纸灰，成片卷曲、偶尔剥落；
  // 极稀疏、匀速终端速度下落、带空气飘移与翻滚，落到炉口灰面后淡出。 ---
  const ashFlakeCount = lowEnd ? 4 : 6;
  const ashFlakeGeo = new THREE.BufferGeometry();
  const ashFlakeSeed = new Float32Array(ashFlakeCount * 2);
  const ashFlakeRest = new Float32Array(ashFlakeCount * 3);
  for (let i = 0; i < ashFlakeCount; i++) {
    ashFlakeSeed[i * 2] = i / ashFlakeCount;
    ashFlakeSeed[i * 2 + 1] = ((i * 0.6180339887) % 1);
  }
  ashFlakeGeo.setAttribute('position', new THREE.BufferAttribute(ashFlakeRest, 3));
  ashFlakeGeo.setAttribute('aSeed', new THREE.BufferAttribute(ashFlakeSeed, 2));

  const ashUniforms = {
    uTime: smokeUniforms.uTime,
    uTip: { value: stickTipWorld.clone() },
    uBed: { value: sceneRefs.ashSurfaceY },
    uActive: { value: 1 },
    uTex: { value: textures.ashFlake }
  };

  // 每粒灰屑周期约 16~21 秒，仅 24% 时间可见：多数时候只有一粒在落，
  // 4~6 粒轮流剥落，绝不会像灰尘一样密集喷洒。
  const ashFlakeMat = new THREE.ShaderMaterial({
    uniforms: ashUniforms,
    vertexShader: `
      uniform float uTime;
      uniform vec3 uTip;
      uniform float uBed;
      uniform float uActive;
      attribute vec2 aSeed;
      varying float vAlpha;
      varying float vRot;
      void main() {
        float cycleRate = 0.0115 + aSeed.y * 0.0055;
        float cycle = fract(uTime * cycleRate + aSeed.x);
        float activeWindow = 0.105;

        if (cycle > activeWindow || uActive < 0.01) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          gl_PointSize = 0.0;
          vAlpha = 0.0;
          vRot = 0.0;
          return;
        }

        float localT = cycle / activeWindow;
        float wait = 0.10;
        float fallT = clamp((localT - wait) / (1.0 - wait), 0.0, 1.0);
        float drop = max(0.006, uTip.y - (uBed + 0.0012));

        // 香灰极轻，离开火头后很快到达终端速度：匀速下落而非加速坠落
        vec3 p = uTip;
        float ang = aSeed.x * 6.28318 + aSeed.y * 9.7;
        float sway = sin(fallT * 4.2 + aSeed.y * 12.0) * 0.0022 * fallT;
        float r = 0.0004 + 0.0021 * fallT;
        p.x += cos(ang) * (r + sway);
        p.z += sin(ang) * (r * 0.8 + sway * 0.6);
        p.y -= drop * fallT;
        p.y = max(p.y, uBed + 0.0012);

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (2.15 + aSeed.y * 1.1) * (1.0 / -mv.z) * 1.35;

        vAlpha = uActive * smoothstep(0.0, 0.05, localT) * (1.0 - smoothstep(0.90, 1.0, localT)) * 0.96;
        vRot = aSeed.y * 6.28318 + fallT * 2.2;
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vAlpha;
      varying float vRot;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float c = cos(vRot);
        float s = sin(vRot);
        uv = mat2(c, -s, s, c) * uv + 0.5;
        vec4 t = texture2D(uTex, uv);
        if (t.a * vAlpha < 0.015) discard;
        gl_FragColor = vec4(vec3(0.86, 0.84, 0.80), t.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false
  });
  const ashFlakePoints = new THREE.Points(ashFlakeGeo, ashFlakeMat);
  ashFlakePoints.frustumCulled = false;
  ashFlakePoints.renderOrder = 9;
  scene.add(ashFlakePoints);

  // ============================================================================
  // 7. 灯光与丁达尔窗光微尘
  // ============================================================================
  const hemiLight = new THREE.HemisphereLight(0xdce8f4, 0x24170f, 0.72);
  scene.add(hemiLight);

  const windowLight = new THREE.SpotLight(0xd9e8f7, 2.2, 0, 1.15, 0.85, 1.1);
  windowLight.position.set(-2.05, 2.75, -0.30);
  windowLight.target.position.set(0.1, 0.55, 0.12);
  windowLight.castShadow = true;
  windowLight.shadow.mapSize.set(lowEnd ? 1024 : 2048, lowEnd ? 1024 : 2048);
  windowLight.shadow.camera.near = 0.3;
  windowLight.shadow.camera.far = 9;
  windowLight.shadow.bias = -0.0006;
  windowLight.shadow.normalBias = 0.018;
  scene.add(windowLight);
  scene.add(windowLight.target);

  const windowFill = new THREE.PointLight(0xe7eef7, 3.2, 7.5, 2.0);
  windowFill.position.set(-2.0, 1.9, -0.25);
  scene.add(windowFill);

  const warmBounce = new THREE.PointLight(0xffd2a0, 4.2, 6.5, 2.0);
  warmBounce.position.set(1.2, 1.65, 1.15);
  scene.add(warmBounce);

  const warmRim = new THREE.PointLight(0xffb374, 1.1, 4.0, 2.0);
  warmRim.position.set(1.8, 2.1, -1.15);
  scene.add(warmRim);

  const ambientLight = new THREE.AmbientLight(0x6a5a4a, 0.40);
  scene.add(ambientLight);

  const dustCount = lowEnd ? 56 : 110;
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(dustCount * 3);
  const dustSeed = new Float32Array(dustCount);
  for (let i = 0; i < dustCount; i++) {
    dustPos[i * 3] = -2.1 + Math.random() * 2.6;
    dustPos[i * 3 + 1] = 0.3 + Math.random() * 2.4;
    dustPos[i * 3 + 2] = -1.9 + Math.random() * 2.5;
    dustSeed[i] = Math.random();
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed, 1));
  const dustMat = new THREE.ShaderMaterial({
    uniforms: { uTime: smokeUniforms.uTime, uTex: { value: textures.radialGlow } },
    vertexShader: `
      uniform float uTime;
      attribute float aSeed;
      varying float vAlpha;
      void main() {
        vec3 p = position;
        p.x += sin(uTime * 0.11 + aSeed * 9.0) * 0.10;
        p.y += sin(uTime * 0.07 + aSeed * 13.0) * 0.07;
        p.z += cos(uTime * 0.09 + aSeed * 7.0) * 0.08;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.5 + fract(aSeed * 7.0) * 2.6) * (1.0 / -mv.z) * 9.0;
        vAlpha = 0.06 + 0.08 * fract(aSeed * 5.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying float vAlpha;
      void main() {
        vec4 t = texture2D(uTex, gl_PointCoord);
        gl_FragColor = vec4(vec3(0.86, 0.90, 0.96), t.a * vAlpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);

  // ============================================================================
  // 8. 摄影机机位与开场/收尾电影运镜（整间茶室停 3 秒 -> 用 3 秒缓推到香；燃尽 6-7 秒提壶斟茶收尾）
  // ============================================================================
  const VIEWS = {
    front:  { pos: new THREE.Vector3(0.92, 1.46, 2.24), target: new THREE.Vector3(-0.10, 0.86, -0.46), fov: 42 },
    close:  { pos: new THREE.Vector3(0.56, 1.12, 1.42), target: new THREE.Vector3(0.26, 0.70, 0.17), fov: 31 },
    scroll: { pos: new THREE.Vector3(scrollHangX, scrollHangY, 1.02), target: new THREE.Vector3(scrollHangX, scrollHangY, -2.20), fov: 33 },
    pour:   { pos: new THREE.Vector3(0.26, 0.72, 0.80), target: new THREE.Vector3(-0.16, 0.45, 0.10), fov: 36 },
    cup:    { pos: new THREE.Vector3(-0.030, 0.6800, 0.4300), target: new THREE.Vector3(-0.100, 0.4600, 0.1650), fov: 31 }
  };

  const activeView = {
    name: 'front',
    pos: VIEWS.front.pos.clone(),
    target: VIEWS.front.target.clone(),
    fov: VIEWS.front.fov
  };
  const goal = {
    pos: VIEWS.front.pos.clone(),
    target: VIEWS.front.target.clone(),
    fov: VIEWS.front.fov
  };
  const lookAtPoint = new THREE.Vector3().copy(activeView.target);
  let userCameraVersion = 0;
  let visitCamera = null;
  let yaw = 0;
  let pitch = 0;

  // 开场 3s 全景停驻 + 精确 3s 缓推至香篆特写
  let introPhase = 0; // 0: 未激活/已结束, 1: 停驻3秒, 2: 3秒推进中
  let introTimer = 0;
  const INTRO_HOLD_SEC = 3.0;
  const INTRO_PUSH_SEC = 3.0;

  function cancelIntro() {
    if (introPhase !== 0) {
      introPhase = 0;
      introTimer = 0;
    }
  }

  function setView(name, silent) {
    const v = VIEWS[name];
    if (!v) return;
    if (!silent) userCameraVersion++;
    visitCamera = null;
    goal.pos.copy(v.pos);
    goal.target.copy(v.target);
    goal.fov = v.fov;
    activeView.name = name;
    yaw = 0;
    pitch = 0;
    dom.viewBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.view === name));
    if (!silent) emitHost('view:' + name);
  }

  window.shrineView = function(name, silent) {
    if (!sceneBooted) {
      pendingHostView = name;
      return;
    }
    cancelIntro();
    setView(name, !!silent);
  };

  const teaWashOpaqueAt = 6.92;
  let outroElapsed = 0;
  let outroDonePosted = false;
  let diving = false;

  function smooth01(t, a, b) {
    const k = Math.max(0, Math.min(1, (t - a) / Math.max(0.0001, b - a)));
    return k * k * (3 - 2 * k);
  }

  function smoother01(t, a, b) {
    const x = Math.max(0, Math.min(1, (t - a) / Math.max(0.0001, b - a)));
    return x * x * x * (x * (x * 6 - 15) + 10);
  }

  function beginSession() {
    if (restStarted) return;
    restStarted = true;
    const generation = ++sessionGeneration;
    missedMotionTime = 0;
    fastCadenceFrames = 0;
    outroStarted = false;
    outroElapsed = 0;
    outroDonePosted = false;
    diving = false;
    restoreReplayControl();
    scheduleSceneFrame();

    if (initialScrollPrepared) initialScrollPrepared = false;
    else rollScroll();
    renderer.shadowMap.needsUpdate = true;
    roomCache.invalidate();

    burnTarget = appState.totalMs > 0 ? Math.max(0, Math.min(1, appState.remainingMs / appState.totalMs)) : 1.0;
    burnCurrent = burnTarget;
    const initLen = Math.max(sceneRefs.stickMinLen, sceneRefs.stickFullLen * burnCurrent);
    incenseStickMesh.scale.y = initLen;
    burningTipGroup.position.y = initLen;

    teapotGroup.position.copy(teapotHomePos);
    teapotGroup.rotation.set(0, teapotHomeRotY, 0);
    teapotShadowMesh.position.set(teapotHomePos.x, tableSurfaceY + 0.0135, teapotHomePos.z);
    teapotShadowMesh.material.opacity = 0.78;
    streamMesh.visible = false;
    streamMat.opacity = 0;
    rippleGroup.visible = false;
    cupSteamUniforms.uActive.value = 0;
    if (cupLiquids[0]) setCupLiquidLevel(cupLiquids[0], cupPositions[0].initialFill);

    dom.hud.classList.remove('outro', 'visible');
    dom.hud.style.opacity = '';
    dom.curtain.style.opacity = '';
    const curtain = dom.curtain.classList;
    const resetCurtain = curtain.contains('fade-out') || curtain.contains('session-reset');
    curtain.remove('fade-out');
    curtain.toggle('session-reset', resetCurtain);
    renderer.toneMappingExposure = 1.36;
    dom.teaWash.style.opacity = '0';
    dom.teaWashDim.style.opacity = '0';
    dom.teaWashCore.style.opacity = '0';
    dipRippleGroup.visible = false;

    setView('front', true);
    goal.pos.copy(VIEWS.front.pos);
    goal.target.copy(VIEWS.front.target);
    goal.fov = VIEWS.front.fov;
    activeView.pos.copy(VIEWS.front.pos);
    activeView.target.copy(VIEWS.front.target);
    activeView.fov = VIEWS.front.fov;
    camera.position.copy(VIEWS.front.pos);
    camera.lookAt(VIEWS.front.target);
    camera.fov = VIEWS.front.fov;
    camera.updateProjectionMatrix();
    lookAtPoint.copy(VIEWS.front.target);

    introPhase = 1;
    introTimer = 0;
    fishVisitor?.begin(appState.totalMs, appState.visitSeed);

    function reveal() {
      if (generation !== sessionGeneration || !appState.active) return;
      curtain.remove('session-reset');
      curtain.add('fade-out');
      setTimeout(() => {
        if (generation === sessionGeneration && appState.active && !outroStarted) {
          dom.hud.classList.add('visible');
        }
      }, 1100);
    }
    // Let the opaque curtain paint over the camera reset before fading it.
    if (resetCurtain) requestAnimationFrame(() => requestAnimationFrame(reveal));
    else requestAnimationFrame(reveal);
  }

  function startOutro() {
    if (outroStarted) return;
    outroStarted = true;
    document.getElementById('fish-kiss-heart').hidden=true;
    fishVisitor?.beginOutro();
    outroElapsed = 0;
    cancelIntro();
    dom.hud.classList.add('outro');
    setView('pour', true);
  }

  const cupHitWorldTmp = new THREE.Vector3();

  function updateOutro(t) {
    // 收尾分三幕，一镜到底不切：
    // 1) 0.0–1.6s 镜头从香头缓缓移到茶席，提壶（壶底只离桌 1.2cm）；
    // 2) 1.45–3.95s 倾壶，一线茶汤入白瓷杯，杯内液面上升、起细涟漪、冒热气；
    // 3) 3.35–5.35s 镜头继续慢推到「一杯茶」特写并停留，随后黑场。
    const arrive = smoother01(t, 0.45, 1.6);
    const leave = smoother01(t, 3.35, 4.20);
    const atPour = arrive * (1 - leave);

    const liftArc = Math.sin(Math.min(1, arrive) * Math.PI) * 0.004 * (1 - leave);
    const potX = teapotHomePos.x + (pourTeapot.x - teapotHomePos.x) * atPour;
    const potY = teapotHomePos.y + (pourTeapot.y - teapotHomePos.y) * atPour + liftArc;
    const potZ = teapotHomePos.z + (pourTeapot.z - teapotHomePos.z) * atPour;
    const potYaw = teapotHomeRotY * (1 - atPour);
    const tilt = smoother01(t, 1.45, 2.3) * (1 - smoother01(t, 3.30, 3.95));
    const potRoll = -0.5 * tilt;
    const potPosition = teapotGroup.position;
    const potRotation = teapotGroup.rotation;
    if (potPosition.x !== potX || potPosition.y !== potY || potPosition.z !== potZ ||
        potRotation.y !== potYaw || potRotation.z !== potRoll) {
      potPosition.set(potX,potY,potZ);
      potRotation.set(0,potYaw,potRoll);
      renderer.shadowMap.needsUpdate = true;
    }

    teapotShadowMesh.position.x = teapotGroup.position.x;
    teapotShadowMesh.position.z = teapotGroup.position.z;
    teapotShadowMesh.material.opacity = 0.78 * (1.0 - 0.5 * atPour);

    const fill = smooth01(t, 1.95, 3.45);
    if (cupLiquids[0]) {
      setCupLiquidLevel(
        cupLiquids[0],
        cupPositions[0].initialFill + (0.88 - cupPositions[0].initialFill) * fill
      );
    }
    cupSteamUniforms.uActive.value = smooth01(t, 2.2, 3.2);

    const pouring = t > 1.80 && t < 3.58;
    streamMesh.visible = pouring;
    rippleGroup.visible = pouring;

    if (pouring) {
      const flowIn = smooth01(t, 1.80, 2.10);
      const flowOut = 1.0 - smooth01(t, 3.38, 3.58);
      const flowStrength = flowIn * flowOut;
      streamMat.opacity = 0.92 * Math.min(1, flowStrength * 1.2);

      teapotGroup.updateMatrixWorld(true);
      spoutMouthAnchor.getWorldPosition(spoutWorldTmp);

      const liquidWorldY = pourCup.yBase + 0.003 + (cupLiquids[0] ? cupLiquids[0].position.y : 0.025);
      cupHitWorldTmp.set(pourCup.x - 0.003, liquidWorldY, pourCup.z);

      // 起流：水头从壶嘴往下走；收流：水尾继续下落，整段掉进杯里
      const streamHead = 1.0 - flowOut;
      const streamTail = Math.min(1.0, flowIn * 1.35);
      updateTeaStreamGeometry(
        spoutWorldTmp, cupHitWorldTmp, elapsed, flowStrength, streamHead, streamTail
      );

      rippleGroup.position.set(cupHitWorldTmp.x, liquidWorldY + 0.0004, cupHitWorldTmp.z);
      const w1 = (elapsed * 2.6) % 1.0;
      const w2 = (elapsed * 2.6 + 0.5) % 1.0;
      rippleRing1.scale.setScalar(0.6 + w1 * 2.4);
      rippleRing1.material.opacity = Math.sin(w1 * Math.PI) * 0.42 * flowStrength;
      rippleRing2.scale.setScalar(0.6 + w2 * 2.4);
      rippleRing2.material.opacity = Math.sin(w2 * Math.PI) * 0.32 * flowStrength;
    }

    // ===== 第三幕：一镜俯身入茶，以茶汤波纹收束这一炷香 =====
    // 3.30–4.35 从斟茶机位滑到杯口上方，3.30 起壶已归位，桌面始终在画内
    const toCup = smoother01(t, 3.30, 4.35);
    if (toCup > 0 && !diving) {
      activeView.name = 'cup';
    }
    if (toCup > 0) {
      goal.pos.copy(VIEWS.pour.pos).lerp(VIEWS.cup.pos, toCup);
      goal.target.copy(VIEWS.pour.target).lerp(teaSurfaceWorld, toCup);
      goal.fov = VIEWS.pour.fov + (VIEWS.cup.fov - VIEWS.pour.fov) * toCup;
    }

    // 4.60–5.90 缓缓俯身，停在「一杯茶」中景；随后整场光缓缓退去
    const dipApproach = smoother01(t, 4.60, 5.90);
    if (dipApproach > 0) {
      diving = true;
      activeView.name = 'cup';
      goal.pos.copy(VIEWS.cup.pos).lerp(diveNearPos, dipApproach);
      goal.target.copy(teaSurfaceWorld);
      goal.fov = VIEWS.cup.fov + (29 - VIEWS.cup.fov) * dipApproach;
    }

    // 收尾不靠一团光，而是整场光缓慢退去，像香燃尽后屋里暗下来
    const dusk = smooth01(t, 5.35, 6.55);
    renderer.toneMappingExposure = 1.36 * (1.0 - 0.985 * dusk);

    // 液面细波纹：贴杯口随俯身放大，破水前急促扩散
    const dipActive = smooth01(t, 4.35, 4.85) * (1 - smooth01(t, 6.55, 6.95));
    dipRippleGroup.visible = dipActive > 0.001;
    if (dipActive > 0.001) {
      const burst = smooth01(t, 5.55, 6.30);
      for (let i = 0; i < dipRippleGroup.children.length; i++) {
        const ring = dipRippleGroup.children[i];
        const ph = (elapsed * (0.40 + burst * 0.55) + i / 3) % 1;
        ring.scale.setScalar(0.45 + ph * (2.05 + burst * 1.15));
        ring.material.opacity = Math.sin(ph * Math.PI) * 0.30 * dipActive;
      }
    }

    // 入汤：不糊一团橙色光球，改成瞳孔式收拢 + 一线水面反光扫过，随即交还宿主
    const washIn = smooth01(t, 6.42, 6.78);
    if (washIn > 0) {
      dom.hud.style.opacity = '0';
      dom.teaWash.style.opacity = washIn.toFixed(3);
      dom.teaWashDim.style.opacity = smooth01(t, 6.60, teaWashOpaqueAt).toFixed(3);
    }

    if (t > 7.05 && !outroDonePosted) {
      outroDonePosted = true;
      fishVisitor?.stop();
      if (!appState.hostControlled) {
        replayButton.classList.add('replay-on-end');
        document.body.append(replayButton);
        // Paint and upload the next scroll while the standalone scene is idle.
        stageNextScroll();
      }
      emitHost('done');
    }
  }

  dom.viewBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (appState.locked) return;
      window.shrineView(btn.dataset.view, false);
    });
  });

  // 拖动环视
  let dragging = false;
  let lastPointerX = 0;
  let lastPointerY = 0;
  const canvasEl = renderer.domElement;
  canvasEl.style.touchAction = 'none';
  canvasEl.addEventListener('pointerdown', e => {
    if (appState.locked) return;
    cancelIntro();
    userCameraVersion++;
    dragging = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvasEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw = Math.max(-0.24, Math.min(0.24, yaw + (e.clientX - lastPointerX) * 0.0016));
    pitch = Math.max(-0.12, Math.min(0.12, pitch + (e.clientY - lastPointerY) * 0.0011));
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  });
  const endDrag = () => { dragging = false; };
  canvasEl.addEventListener('pointerup', endDrag);
  canvasEl.addEventListener('pointercancel', endDrag);
  canvasEl.addEventListener('pointerleave', endDrag);

  // 封闭展示：严禁右键菜单与刷新
  window.addEventListener('contextmenu', e => {
    e.preventDefault();
    return false;
  }, true);

  window.addEventListener('keydown', e => {
    if (appState.locked) return;
    const key = String(e.key).toLowerCase();
    if ((e.metaKey || e.ctrlKey) && key === 'r') {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (key === 'f5') {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if (e.key === 'Escape') {
      if (!appState.forced && appState.canSkip) emitHost('skip');
      return;
    }
    if (e.key === '1') window.shrineView('front', false);
    if (e.key === '2') window.shrineView('close', false);
    if (e.key === '3') window.shrineView('scroll', false);
    if (e.key === 'ArrowRight') {
      const order = ['front', 'close', 'scroll'];
      window.shrineView(order[(order.indexOf(activeView.name) + 1) % order.length], false);
    }
    if (e.key === 'ArrowLeft') {
      const order = ['front', 'close', 'scroll'];
      window.shrineView(order[(order.indexOf(activeView.name) + 2) % order.length], false);
    }
  });

  dom.btnSkip.addEventListener('click', () => {
    if (appState.locked) return;
    if (!appState.forced && appState.canSkip) emitHost('skip');
  });
  dom.btnPostpone.addEventListener('click', () => {
    if (appState.locked) return;
    if (!appState.forced && appState.canPostpone) emitHost('postpone');
  });

  let lastW = 0;
  let lastH = 0;
  let lastDpr = 0;
  let viewportDirty = true;
  let lastShadowLen = -1;
  window.addEventListener('resize', () => { viewportDirty = true; });

  function resizeRenderer() {
    // Monitor-only scale changes can arrive without a window resize event.
    const pixelRatio = Math.min(window.devicePixelRatio || 1, maxPixelRatio);
    if (!viewportDirty && pixelRatio === lastDpr) return;
    viewportDirty = false;
    const w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    if (w === lastW && h === lastH && pixelRatio === lastDpr) return;
    lastW = w;
    lastH = h;
    lastDpr = pixelRatio;
    renderer.setDrawingBufferSize(w, h, pixelRatio);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  // ============================================================================
  // 9. 主渲染循环（线香燃烧缩短、掉灰、青烟、开场3s停+3s推近、收尾斟茶、首帧预热）
  // ============================================================================
  let elapsed = 0;
  let firstFrame = true;
  let hudSecond = -1;
  const tipWorld = new THREE.Vector3();

  let releaseStartupPrograms;

  function beginVisitCamera() {
    const travel = camera.position.distanceTo(goal.pos);
    const aim = lookAtPoint.distanceTo(goal.target);
    if(camera.near!==0.04){
      camera.near=0.04;
      camera.updateProjectionMatrix();
    }
    visitCamera = {
      view:activeView.name, position:camera.position.clone(), target:lookAtPoint.clone(), fov:camera.fov,
      duration: THREE.MathUtils.clamp(0.85 + 0.27*travel + 0.15*aim, 1.08, 1.82),
      elapsed: 0, userVersion: userCameraVersion
    };
  }

  function updateCamera(dt) {
    if (visitCamera && (activeView.name!==visitCamera.view || outroStarted ||
        dragging || visitCamera.userVersion!==userCameraVersion)) visitCamera=null;
    if (visitCamera) {
      const entry=visitCamera;
      entry.elapsed+=dt;
      const t=smoother01(entry.elapsed,0,entry.duration);
      if(t===1) {
        activeView.pos.copy(goal.pos);
        activeView.target.copy(goal.target);
        activeView.fov=goal.fov;
        visitCamera=null;
      } else {
        activeView.pos.lerpVectors(entry.position,goal.pos,t);
        activeView.target.lerpVectors(entry.target,goal.target,t);
        activeView.fov=THREE.MathUtils.lerp(entry.fov,goal.fov,t);
      }
      camera.position.copy(activeView.pos);
      lookAtPoint.copy(activeView.target);
      camera.lookAt(lookAtPoint);
      if (camera.fov!==activeView.fov) {
        camera.fov=activeView.fov;
        camera.updateProjectionMatrix();
      }
      return;
    }
    if (introPhase === 1) {
      // 阶段 1：整间茶室全景停驻 3.0 秒
      introTimer += dt;
      activeView.pos.copy(VIEWS.front.pos);
      activeView.target.copy(VIEWS.front.target);
      activeView.fov = VIEWS.front.fov;
      if (introTimer >= INTRO_HOLD_SEC) {
        introPhase = 2;
        introTimer = 0;
        activeView.name = 'close';
        goal.pos.copy(VIEWS.close.pos);
        goal.target.copy(VIEWS.close.target);
        goal.fov = VIEWS.close.fov;
        dom.viewBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.view === 'close'));
        emitHost('view:close');
      }
    } else if (introPhase === 2) {
      // 阶段 2：精确用 3.0 秒平滑推近到香篆特写
      introTimer += dt;
      const u = smoother01(introTimer, 0.0, INTRO_PUSH_SEC);
      activeView.pos.lerpVectors(VIEWS.front.pos, VIEWS.close.pos, u);
      activeView.target.lerpVectors(VIEWS.front.target, VIEWS.close.target, u);
      activeView.fov = VIEWS.front.fov + (VIEWS.close.fov - VIEWS.front.fov) * u;
      if (introTimer >= INTRO_PUSH_SEC) {
        introPhase = 0;
      }
    } else {
      const k = 1 - Math.exp(-dt * (diving ? 7.5 : 2.8));
      activeView.pos.lerp(goal.pos, k);
      activeView.target.lerp(goal.target, k);
      activeView.fov += (goal.fov - activeView.fov) * k;
    }

    const staged = (activeView.name === 'fishVisit' || activeView.name === 'fishSmallScroll' ||
      activeView.name === 'fishTable') && !outroStarted;
    if (staged) {
      if (activeView.pos.distanceToSquared(goal.pos) < 0.00000004) activeView.pos.copy(goal.pos);
      if (activeView.target.distanceToSquared(goal.target) < 0.00000004) activeView.target.copy(goal.target);
      if (Math.abs(activeView.fov - goal.fov) < 0.001) activeView.fov = goal.fov;
    }
    let base;
    if (diving) {
      // 入茶：脱离轨道夹持（否则最近只能到 32cm，永远推不到杯口）
      base = activeView.pos.clone();
      base.x += Math.sin(elapsed * 0.9) * 0.0007;
      base.y += Math.sin(elapsed * 0.7 + 1.1) * 0.0005;
    } else if (staged && yaw===0 && pitch===0 &&
        activeView.pos.equals(goal.pos) && activeView.target.equals(goal.target)) {
      base=activeView.pos;
    } else {
      const offset = activeView.pos.clone().sub(activeView.target);
      const radius = Math.max(0.32, offset.length());
      const theta = Math.atan2(offset.x, offset.z) + yaw;
      const phi = Math.max(0.18, Math.min(Math.PI * 0.49, Math.acos(offset.y / radius) + pitch));
      base = new THREE.Vector3(
        activeView.target.x + radius * Math.sin(phi) * Math.sin(theta),
        activeView.target.y + radius * Math.cos(phi),
        activeView.target.z + radius * Math.sin(phi) * Math.cos(theta)
      );
      if (!staged) {
        base.x += Math.sin(elapsed * 0.21) * 0.005;
        base.y += Math.sin(elapsed * 0.16 + 1.1) * 0.0035;
      }
    }

    const camLerp = diving ? (1 - Math.exp(-dt * 9.0))
      : (introPhase === 2 ? (1 - Math.exp(-dt * 10.0)) : (1 - Math.exp(-dt * 4.5)));
    camera.position.lerp(base, camLerp);
    lookAtPoint.lerp(activeView.target, camLerp);
    if (staged) {
      if (camera.position.distanceToSquared(base) < 0.00000004) camera.position.copy(base);
      if (lookAtPoint.distanceToSquared(activeView.target) < 0.00000004) lookAtPoint.copy(activeView.target);
    }
    camera.lookAt(lookAtPoint);

    const nearPlane = diving ? 0.004 : 0.04;
    if (camera.near !== nearPlane) {
      camera.near = nearPlane;
      camera.updateProjectionMatrix();
    }
    if (Math.abs(camera.fov - activeView.fov) > 0.01) {
      camera.fov = activeView.fov;
      camera.updateProjectionMatrix();
    }
  }

  let sceneFrame = null;
  let previousFrameTimestamp;
  let missedMotionTime = 0;
  let fastCadenceFrames = 0;

  function resetSceneClock() {
    previousFrameTimestamp = undefined;
    missedMotionTime = 0;
    fastCadenceFrames = 0;
  }

  function presentationStep(frameTime) {
    // Keep the tea outro within the host's completion window.
    if (outroStarted) return Math.min(0.05, frameTime);
    // A normally paced 30 Hz frame can use its full interval. An
    // isolated miss after a run of fast frames should not double the
    // pose step. Recover that time gradually when regular frames return.
    const missedFastFrame = fastCadenceFrames >= 5 && frameTime >= 1 / 37;
    const fast = frameTime > 0 && frameTime <= 1 / 45;
    fastCadenceFrames = fast ? Math.min(5, fastCadenceFrames + 1) : 0;
    const limit = frameTime >= 1 / 15 || missedFastFrame ? 1 / 45 : 1 / 30;
    const regularStep = Math.min(limit, frameTime);
    missedMotionTime = Math.min(0.080, missedMotionTime + (frameTime - regularStep));
    const recovered = Math.min(missedMotionTime, regularStep * 0.12, limit - regularStep);
    missedMotionTime -= recovered;
    return regularStep + recovered;
  }
  // A background tab does not need animation updates or 3D draws.
  document.addEventListener('visibilitychange', () => {
    if (sceneBooted && !appState.hostControlled) scheduleSceneFrame();
  });

  async function compilePreviewPrograms(object, camera, lightingScene = null) {
    const gl = renderer.getContext();
    if (gl.isContextLost()) return;
    const epoch = contextEpoch;
    const materials = renderer.compile(object, camera, lightingScene);
    if (!gl.getExtension('KHR_parallel_shader_compile')) return;
    // Hold the program instances from this context. Three resets its
    // material properties on restoration while the compiler may be polling.
    const programs = new Set();
    for (const material of materials) {
      const program = renderer.properties.get(material).currentProgram;
      if (program) programs.add(program);
    }
    while (programs.size && epoch === contextEpoch && !gl.isContextLost()) {
      for (const program of programs) if (program.isReady()) programs.delete(program);
      if (programs.size) await new Promise(resolve => setTimeout(resolve, 10));
    }
  }

  function needsSceneFrame() {
    if (sceneContextLost) return false;
    const playing = appState.hostControlled ? appState.active : !document.hidden;
    return firstFrame || (playing && !outroDonePosted);
  }

  function pauseSceneFrame() {
    if (sceneFrame !== null) cancelAnimationFrame(sceneFrame);
    sceneFrame = null;
    resetSceneClock();
  }

  function scheduleSceneFrame() {
    if (!needsSceneFrame()) {
      pauseSceneFrame();
      // A paused tab still needs a fresh draw before removing the curtain.
      if (revealAfterRestore && !sceneContextLost && (appState.hostControlled || outroDonePosted)) {
        revealAfterRestore = false;
        dom.curtain.classList.remove('context-recovery');
      }
    } else if (sceneFrame === null) {
      sceneFrame = requestAnimationFrame(animate);
    }
  }

  function animate(frameTimestamp) {
    sceneFrame = null;
    if (!needsSceneFrame()) {
      resetSceneClock();
      return;
    }
    const frameTime = previousFrameTimestamp === undefined
      ? 0 : Math.max(0,(frameTimestamp-previousFrameTimestamp)*0.001);
    previousFrameTimestamp = frameTimestamp;
    const dt = presentationStep(frameTime);
    elapsed += dt;

    // 独立浏览器预览模式（仅无宿主时自动推进演示）
    if (!isHosted && !appState.hostControlled) {
      if (!restStarted) {
        appState.active = true;
        beginSession();
      }
      if (appState.remainingMs > 0) {
        // Keep the countdown on wall time while camera and character stay step-limited.
        appState.remainingMs = Math.max(0, appState.remainingMs - frameTime * 1000);
        appState.targetProgress = 1.0 - appState.remainingMs / appState.totalMs;
        burnTarget = appState.remainingMs / appState.totalMs;
        const seconds = Math.ceil(appState.remainingMs / 1000);
        if (seconds !== hudSecond) {
          hudSecond = seconds;
          renderHUD();
        }
      }
      if (appState.remainingMs === 0 && !outroStarted) startOutro();
    }

    if (outroStarted) {
      outroElapsed += dt;
      updateOutro(outroElapsed);
      if (outroElapsed >= teaWashOpaqueAt && !firstFrame && !revealAfterRestore) {
        // The opaque DOM wash covers the canvas until the next session.
        scheduleSceneFrame();
        return;
      }
    }

    // 1. 线香随 appState.remainingMs / appState.totalMs 真实缩短，炭化火头、白灰帽与青烟根部同步下降
    burnCurrent += (burnTarget - burnCurrent) * (1 - Math.exp(-dt * 6.0));
    if (Math.abs(burnTarget - burnCurrent) < 0.0002) burnCurrent = burnTarget;

    const stickLen = Math.max(sceneRefs.stickMinLen, sceneRefs.stickFullLen * burnCurrent);
    incenseStickMesh.scale.y = stickLen;
    burningTipGroup.position.y = stickLen;

    // 特写机位目标随香头緩慢下移，始终保持火头处于微距黄金构图点
    VIEWS.close.target.y = 0.56 + 0.14 * burnCurrent;
    if (activeView.name === 'close' && introPhase === 0) {
      goal.target.y = VIEWS.close.target.y;
    }

    incenseAnchor.updateMatrixWorld(true);
    smokeEmitSocket.getWorldPosition(tipWorld);
    emberPointLight.position.copy(tipWorld);
    emberPointLight.position.y += 0.005;

    smokeUniforms.uOrigin.value.copy(tipWorld);
    ashUniforms.uTip.value.copy(tipWorld);

    // 燃尽收尾阶段火头与青烟自然熄灭消散
    const emberFadeOut = outroStarted ? Math.max(0, 1.0 - outroElapsed * 0.45) : 1.0;
    smokeUniforms.uOpacityScale.value = emberFadeOut;
    ashUniforms.uActive.value = (burnCurrent > 0.008 && !outroStarted) ? 1.0 : 0.0;
    smokeMesh.visible = wisps.visible = emberMicroGlow.visible = emberFadeOut > 0;
    ashFlakePoints.visible = ashUniforms.uActive.value > 0;
    cupSteam.visible = cupSteamUniforms.uActive.value > 0;

    smokeUniforms.uTime.value = elapsed;
    cupSteamUniforms.uTime.value = elapsed;
    const pulse = (0.84 + 0.11 * Math.sin(elapsed * 5.8) + 0.05 * Math.sin(elapsed * 14.3)) * emberFadeOut;
    smokeUniforms.uEmberPulse.value = pulse;
    emberTipUniforms.uTime.value = elapsed;
    emberTipUniforms.uPulse.value = pulse;
    emberPointLight.intensity = (0.16 + 0.16 * pulse) * emberFadeOut;
    emberMicroGlow.material.opacity = (0.24 + 0.16 * pulse) * emberFadeOut;
    windowFill.intensity = (activeView.name === 'fishVisit' || activeView.name === 'fishSmallScroll') && !outroStarted
      ? 3.15 : 3.15 + 0.10 * Math.sin(elapsed * 0.5);

    // Share one presentation clock between the moving camera and the actor.
    // The rest countdown still uses host state or the uncapped wall interval.
    resizeRenderer();
    if (!fishVisitor?.update(dt, appState.remainingMs, elapsed * 1000, frameTime)) {
      updateCamera(dt);
    }
    const cacheRoom = canCacheRoom();
    // The stick's moving shadow is below a visible pixel in the settled
    // character views. Keep the full shadow update for a moving or user-
    // positioned camera and for every close-up of the tea room.
    const settledCharacterView = cacheRoom && yaw === 0 && pitch === 0 &&
      camera.position.distanceToSquared(goal.pos) < 0.000001 &&
      lookAtPoint.distanceToSquared(goal.target) < 0.000001;
    if (!settledCharacterView && Math.abs(stickLen - lastShadowLen) > 0.004) {
      renderer.shadowMap.needsUpdate = true;
    }
    if (renderer.shadowMap.needsUpdate) lastShadowLen = stickLen;
    roomCache.render(camera, cacheRoom, frameTimestamp);
    if (revealAfterRestore && !renderer.getContext().isContextLost()) {
      revealAfterRestore = false;
      dom.curtain.classList.remove('context-recovery');
    }

    if (firstFrame) {
      firstFrame = false;
      releaseStartupPrograms?.();
      releaseStartupPrograms = undefined;
      emitHost('ready');
    }
    scheduleSceneFrame();
  }

  function createFishCupLiquid(THREE, cupProfile, material) {
    const sectors=48;
    const integrationSectors=16;
    const wallInset=.00020;
    const profile=cupProfile.slice(5).reverse();
    let bottomIntegral=0;
    const wall=profile.slice(0,-1).map((point,i)=>{
      const next=profile[i+1];
      const slope=(next.y-point.y)/(next.x-point.x);
      const intercept=point.y-slope*point.x;
      const area0=point.x*point.x*.5;
      const third0=point.x*point.x*point.x/3;
      const offset=bottomIntegral-intercept*area0-slope*third0;
      bottomIntegral=offset+intercept*next.x*next.x*.5+slope*next.x*next.x*next.x/3;
      return {slope,intercept,offset};
    });
    const knee=profile[2];
    function segment(level,slope) {
      return level+slope*knee.x>knee.y ? wall[2] : wall[1];
    }

    // Integrate the column height above the piecewise-linear inner wall.
    // The derivative with respect to center height is the wetted area.
    const volumeCos=Array.from({length:integrationSectors},(_,i)=>Math.cos(i*2*Math.PI/integrationSectors));
    function levelForVolume(level,tiltSlope) {
      if(tiltSlope<1e-6)return level;
      const flat=segment(level,0);
      const radius=(level-flat.intercept)/flat.slope;
      const targetVolume=(level-flat.intercept)*radius*radius*.5-flat.slope*radius*radius*radius/3-flat.offset;
      let adjusted=level;
      for(let pass=0;pass<2;pass++) {
        let volume=0,area=0;
        for(const cos of volumeCos) {
          const slope=tiltSlope*cos;
          const band=segment(adjusted,slope);
          const radius=(adjusted-band.intercept)/(band.slope-slope);
          const rayArea=radius*radius*.5;
          volume+=(adjusted-band.intercept)*rayArea+(slope-band.slope)*radius*radius*radius/3-band.offset;
          area+=rayArea;
        }
        adjusted+=(targetVolume*integrationSectors-volume)/area;
      }
      return adjusted;
    }

    const geometry=new THREE.BufferGeometry();
    const position=new THREE.BufferAttribute(new Float32Array((sectors+1)*3),3).setUsage(THREE.DynamicDrawUsage);
    const normals=new THREE.BufferAttribute(new Float32Array((sectors+1)*3),3).setUsage(THREE.DynamicDrawUsage);
    const uv=new Float32Array((sectors+1)*2);
    const sine=new Float64Array(sectors),cosine=new Float64Array(sectors);
    const indices=[];
    uv[0]=uv[1]=.5;
    for(let i=0;i<sectors;i++) {
      const angle=i*2*Math.PI/sectors;
      sine[i]=Math.sin(angle);
      cosine[i]=Math.cos(angle);
      uv[2+2*i]=.5+.5*sine[i];
      uv[3+2*i]=.5-.5*cosine[i];
      indices.push(0,i+1,(i+1)%sectors+1);
    }
    geometry.setAttribute('position',position);
    geometry.setAttribute('normal',normals);
    geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    geometry.setIndex(indices);
    geometry.boundingSphere=new THREE.Sphere(new THREE.Vector3(0,.025,0),.045);
    const mesh=new THREE.Mesh(geometry,material);
    const inverse=new THREE.Quaternion(),normal=new THREE.Vector3(),lastNormal=new THREE.Vector3();
    let lastAmount;

    function set(amount,rotation) {
      inverse.copy(rotation).invert();
      normal.set(0,1,0).applyQuaternion(inverse);
      if(amount===lastAmount && normal.equals(lastNormal))return;
      lastAmount=amount;
      lastNormal.copy(normal);
      const nx=-normal.x/normal.y, nz=-normal.z/normal.y;
      const level=levelForVolume(.016+.010*amount,Math.hypot(nx,nz));
      position.setXYZ(0,0,level,0);
      normals.setXYZ(0,normal.x,normal.y,normal.z);
      for(let i=0;i<sectors;i++) {
        const slope=nx*sine[i]+nz*cosine[i];
        const band=segment(level,slope);
        const radius=(level-band.intercept)/(band.slope-slope)-wallInset;
        position.setXYZ(i+1,radius*sine[i],level+slope*radius,radius*cosine[i]);
        normals.setXYZ(i+1,normal.x,normal.y,normal.z);
      }
      position.needsUpdate=true;
      normals.needsUpdate=true;
    }
    return {mesh,set};
  }

  function createFishTeaSet(stageX, stageZ, yaw) {
    const height=0.288, forward=0.472, across=0.089;
    const c=Math.cos(yaw),s=Math.sin(yaw);
    const x=stageX+across*c+forward*s, z=stageZ-across*s+forward*c;
    const stand=new THREE.Group();
    stand.position.set(x,floorY,z);
    const standShape=new THREE.LatheGeometry([
      [0,0],[0.052,0],[0.052,0.009],[0.046,0.017],[0.023,0.023],
      [0.022,0.034],[0.021,height-0.030],[0.026,height-0.021],
      [0.049,height-0.016],[0.053,height-0.009],[0.052,height],[0,height]
    ].map(([r,y])=>new THREE.Vector2(r,y)),32);
    const standWood=tableWoodMat.clone();
    standWood.color.setHex(0x6e4e36);
    const wood=new THREE.Mesh(standShape,standWood);
    wood.castShadow=true;
    wood.receiveShadow=true;
    stand.add(wood);
    const tray=new THREE.Mesh(saucerGeo,terracottaMat);
    tray.position.y=height;
    tray.receiveShadow=true;
    stand.add(tray);
    addContactShadow(stand,0,0.001,0,0.135,0.135,0.62);
    scene.add(stand);

    const cup=new THREE.Group();
    cup.userData.fishDynamic = 'cup';
    cup.matrixAutoUpdate=false;
    cup.matrixWorldAutoUpdate=false;
    const porcelain=new THREE.Mesh(cupGeo,whitePorcelainMat);
    porcelain.receiveShadow=true;
    cup.add(porcelain);
    const liquid=createFishCupLiquid(THREE,cupProfile,teaLiquorMat);
    cup.add(liquid.mesh);
    const restPosition=new THREE.Vector3(x,floorY+height+0.001,z);
    const restRotation=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),yaw);
    scene.add(cup);

    function setCupPose(position, rotation) {
      if (cup.position.equals(position) && cup.quaternion.equals(rotation)) return;
      cup.position.copy(position);
      cup.quaternion.copy(rotation);
      cup.updateMatrix();
      cup.updateMatrixWorld(true);
    }
    function rest() {
      setCupPose(restPosition, restRotation);
      liquid.set(1,cup.quaternion);
    }
    function place(result) {
      setCupPose(result.cupPosition, result.cupQuaternion);
      liquid.set(result.fill,cup.quaternion);
    }
    rest();
    return {restPosition,rest,place,cup,stand};
  }

  function createFishPreviewVisitor() {
    const stageX = 1.21, stageZ = 0.12;
    const camPos = new THREE.Vector3(0.75, 1.23, 3.03);

    const minimumSettle = 0.55;

    const movement = {}, location = {}, travel = {};
    const peek = createFishPeek();
