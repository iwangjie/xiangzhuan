name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CGO_ENABLED: "0"

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release builds these same targets: this is its rehearsal.
          - { name: macOS, os: macos-15, platforms: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: windows-latest, platforms: "windows/amd64" }
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # Formatting is platform-independent, and Git for Windows checks the
      # sources out with CRLF, which gofmt reports for every file.
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify native app packaging
        run: go tool mygo build -platform "${{ matrix.platforms }}"
