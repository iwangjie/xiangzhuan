name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh-install/nightly/nsh/bin" >> "$GITHUB_PATH"
      - name: Check
        run: nsh check
      - name: Test
        run: nsh test
      - name: Package
        run: nsh package App.tsx --target macos
