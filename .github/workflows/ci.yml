name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Check
        run: nsh check
      - name: Test
        run: |
          set -o pipefail
          nsh test 2>&1 | tee /tmp/nsh-test.log
      - name: Report test failure
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::error title=nsh test::$line"
          done < /tmp/nsh-test.log
      - name: Package
        run: nsh package App.tsx --target macos
      - name: Install native helpers
        run: sh scripts/install-dock-hide.sh .nsh/out/香篆.app
