name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            suffix: aarch64
            label: arm64
          - arch: x86_64
            runner: macos-15-intel
            suffix: x86_64
            label: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          out="$RUNNER_TEMP/app"
          nsh package App.tsx --target macos --arch ${{ matrix.arch }} -o "$out"
          sh scripts/install-dock-hide.sh "$out/香篆.app"
          version=$(jq -r .version nsh.json)
          mkdir -p dist
          # The updater's archive: ASCII name in the <name>-<version>-<os>-<arch>
          # form `nsh update-manifest` reads, and the injected dylib travels
          # inside it (nsh package wrote its own archive before the injection).
          tar -czf "dist/xiangzhuan-${version}-macos-${{ matrix.suffix }}.tar.gz" -C "$out" "香篆.app"
          dmg="$RUNNER_TEMP/dmg"
          mkdir -p "$dmg"
          cp -R "$out/香篆.app" "$dmg/"
          ln -s /Applications "$dmg/Applications"
          hdiutil create -volname "香篆" -srcfolder "$dmg" -ov -format UDZO \
            "dist/xiangzhuan-${version}-macos-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: xiangzhuan-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The update channel is decided from the diff against the previous
          # tag, so the release job needs the tags and the history.
          fetch-depth: 0
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Choose the update channel
        id: channel
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          shell=false
          if [ -z "$previous" ]; then
            shell=true
          else
            # Host-side code: the native dylib, its installer script and the
            # app icon cannot travel inside an .nshpkg.
            if git diff --name-only "$previous" "$GITHUB_REF_NAME" -- \
                 native scripts/install-dock-hide.sh assets/icon.png | grep -q .; then
              shell=true
            fi
            # Any nsh.json change except the release counters changes the
            # packaged host (capabilities, Info.plist, window, updater).
            if git diff -U0 "$previous" "$GITHUB_REF_NAME" -- nsh.json \
               | grep -E '^[+-][^+-]' \
               | grep -vE '^[+-][[:space:]]*"(version|build)"[[:space:]]*:' \
               | grep -q .; then
              shell=true
            fi
          fi
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "previous tag: ${previous:-none}; channel: $([ "$shell" = true ] && echo shell || echo package)"
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the keys
        env:
          RELEASE_KEY: ${{ secrets.NSH_RELEASE_KEY }}
          RELEASE_CERT: ${{ secrets.NSH_RELEASE_CERT }}
          UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/keys/release.secret"
          printf '%s\n' "$RELEASE_CERT" > "$RUNNER_TEMP/keys/release.cert"
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/keys/update.secret"
          jq -r '.updater.packages.roots[0]' nsh.json > "$RUNNER_TEMP/keys/root.pub"
      - name: Publish the OTA package and the manifest
        env:
          # A GitHub mirror that serves release assets, without the trailing
          # tag (`https://gh-proxy.com/https://github.com/o/r/releases/download`).
          # The manifest still comes from GitHub; only the archives and the
          # package download through it.
          MIRROR_PREFIX: ${{ vars.MIRROR_PREFIX }}
        run: |
          build=$(jq -r .build nsh.json)
          package="dist/com.iwangjie.xiangzhuan-${build}.nshpkg"
          # The apps in the field were built with runtime 0.5.0; publishing
          # with a newer CLI must not lift that floor.
          nsh publish \
            --key "$RUNNER_TEMP/keys/release.secret" \
            --cert "$RUNNER_TEMP/keys/release.cert" \
            --min-runtime 0.5.0 \
            -o "$package"
          nsh verify "$package" --root "$RUNNER_TEMP/keys/root.pub"
          git log -1 --format=%B > NOTES.md
          base=()
          if [ -n "$MIRROR_PREFIX" ]; then
            base=(--base-url "$MIRROR_PREFIX/$GITHUB_REF_NAME")
          fi
          if [ "${{ steps.channel.outputs.shell }}" = "true" ]; then
            # A shell release carries the app itself; a package in the same
            # manifest would make clients install code first and the shell
            # second, with two restarts.
            nsh update-manifest dist/*.tar.gz \
              --notes NOTES.md \
              "${base[@]}" \
              --key "$RUNNER_TEMP/keys/update.secret" \
              -o dist
            jq -e \
              '(.platforms | keys | sort) == ["macos-aarch64","macos-x86_64"]
               and .package == null' dist/latest.json
            rm -f "$package"
          else
            # A code-only release: the manifest has no platform archives, so
            # a client never replaces its shell for a JS change.
            nsh update-manifest \
              --package "$package" \
              --notes NOTES.md \
              "${base[@]}" \
              --key "$RUNNER_TEMP/keys/update.secret" \
              -o dist
            jq -e '(.platforms | length) == 0 and .package.build != null' dist/latest.json
          fi
          if [ -n "$MIRROR_PREFIX" ]; then
            jq -e --arg p "$MIRROR_PREFIX/$GITHUB_REF_NAME/" \
              '([.platforms[].url, (.package.url // empty)] | map(startswith($p)) | all)' dist/latest.json
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the release so a re-tagged build never leaves the previous
          # asset alongside the new one.
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md
