name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Check tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version mygo.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match mygo.json version $version"
            exit 1
          fi

      - name: Build app and DMG
        run: go tool mygo build

      - name: Stage release assets
        run: |
          version="$(jq -r .version mygo.json)"
          mkdir -p dist
          cp "build/darwin-arm64/香篆 ${version}.dmg" "dist/xiangzhuan-${version}-macos-arm64.dmg"
          ditto -c -k --keepParent "build/darwin-arm64/香篆.app" "dist/xiangzhuan-${version}-macos-arm64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: 香篆 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
