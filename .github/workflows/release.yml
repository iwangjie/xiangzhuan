name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds without publishing, to rehearse a release: the log shows what was
  # staged, and whether NSIS installs for the Windows installer.
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - name: Check tag matches version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version mygo.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match mygo.json version $version"
            exit 1
          fi

      # The Windows app is built here too, not on a Windows runner: its
      # NSIS installer is a script mygo writes in UTF-8, and makensis on
      # Windows reads scripts in the ANSI codepage unless they start with a
      # BOM, so it cannot find this app's 香篆.exe.
      #
      # NSIS itself comes from brew; its bottles lag macOS releases, where
      # brew builds it from source instead. Without it mygo build skips the
      # installer, and the release ships the portable .exe alone.
      - name: Install NSIS, for the Windows installer
        continue-on-error: true
        run: brew install makensis

      - name: Build the app for macOS (arm64, Intel) and Windows
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64,windows/amd64

      # GitHub strips the CJK from download file names, and the macOS app is
      # a directory: stage the assets under ASCII names, zipped where needed.
      - name: Stage release assets
        run: |
          version="$(jq -r .version mygo.json)"
          mkdir -p dist
          for arch in arm64 amd64; do
            cp "build/darwin-${arch}/香篆 ${version}.dmg" "dist/xiangzhuan-${version}-macos-${arch}.dmg"
            ditto -c -k --keepParent "build/darwin-${arch}/香篆.app" "dist/xiangzhuan-${version}-macos-${arch}.zip"
          done
          cp "build/windows-amd64/香篆.exe" "dist/xiangzhuan-${version}-windows-amd64.exe"
          setup="build/windows-amd64/香篆 Setup ${version}.exe"
          if [ -f "$setup" ]; then
            cp "$setup" "dist/xiangzhuan-${version}-windows-amd64-setup.exe"
          else
            echo "::warning::no Windows installer: NSIS (makensis) is not installed"
          fi
          find build -type f \( -name 'app-*.tar.gz' -o -name 'update-*.json' -o -name '*.delta' \) -exec cp {} dist/ \;
          for target in darwin-arm64 darwin-amd64 windows-amd64; do
            test -f "dist/update-${target}.json"
          done
          ls -l dist

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: 香篆 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
