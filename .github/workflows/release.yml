name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - name: Package
        run: nsh package App.tsx --target macos
      - name: Install native helpers
        run: sh scripts/install-dock-hide.sh .nsh/out/香篆.app
      - name: Make DMG
        run: |
          # An ASCII asset name: GitHub drops non-ASCII characters, which
          # turned "香篆-macos.dmg" into "-macos.dmg" on the release page.
          version="${GITHUB_REF_NAME#v}"
          dmg=".nsh/out/xiangzhuan-${version}-macos-arm64.dmg"
          mkdir -p .nsh/out/dmg
          cp -R .nsh/out/香篆.app .nsh/out/dmg/
          ln -s /Applications .nsh/out/dmg/Applications
          hdiutil create -volname "香篆" -srcfolder .nsh/out/dmg -ov -format UDZO "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace the release so a re-tagged build never leaves the previous
          # asset alongside the new one.
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          gh release create "$GITHUB_REF_NAME" "$DMG" --title "$GITHUB_REF_NAME" --generate-notes
