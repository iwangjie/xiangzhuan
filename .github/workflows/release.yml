name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh-install/nightly/nsh/bin" >> "$GITHUB_PATH"
      - name: Package
        run: nsh package App.tsx --target macos
      - name: Install native helpers
        run: sh scripts/install-dock-hide.sh .nsh/out/香篆.app
      - name: Make DMG
        run: |
          mkdir -p .nsh/out/dmg
          cp -R .nsh/out/香篆.app .nsh/out/dmg/
          ln -s /Applications .nsh/out/dmg/Applications
          hdiutil create -volname "香篆" -srcfolder .nsh/out/dmg -ov -format UDZO .nsh/out/香篆-macos.dmg
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: .nsh/out/香篆-macos.dmg
