name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh-install/nightly/nsh/bin" >> "$GITHUB_PATH"
      - name: Package
        run: nsh package App.tsx --target macos
      - name: Zip app
        run: ditto -c -k --keepParent .nsh/out/香篆.app .nsh/out/香篆-macos.zip
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: .nsh/out/香篆-macos.zip
